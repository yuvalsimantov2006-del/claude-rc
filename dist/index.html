  if(start<0)throw new Error('לא זיהינו בקובץ עמודות של תאריך וסכום. ודא שזה פירוט עסקאות מהבנק או מחברת האשראי.');
  if(map.date==null)map.date=map.chargeDate;
  if(map.amount==null&&map.debit==null&&map.credit==null)map.amount=map.originalAmount;
  const items=[],skipped=[],signed=[];
  for(const row of clean.slice(start+1)){
    const description=String(row[map.description??-1]||row[map.action??-1]||'').replace(/\s+/g,' ').trim(),date=parseDate(row[map.date]);
    if(/סה"כ|סה״כ|total|יתרה|^סך /i.test(description)||!row.some(c=>c!==''&&c!=null)){continue;}
    let amount=null,sign=0;
    if(map.debit!=null||map.credit!=null){const debit=parseNumber(row[map.debit??-1]),credit=parseNumber(row[map.credit??-1]);if(debit){amount=Math.abs(debit);sign=-1;}else if(credit){amount=Math.abs(credit);sign=1;}}
    else{const value=parseNumber(row[map.amount]);if(value!=null&&value!==0){amount=Math.abs(value);sign=Math.sign(value);signed.push(sign);}}
    if(!date||!amount){if(description||amount)skipped.push({description,reason:!date?'תאריך חסר':'סכום חסר'});continue;}
    if(date>shiftDate(now,1)){skipped.push({description,reason:'תאריך עתידי'});continue;}
    items.push({date,description:description||'ללא תיאור',amount:Math.round(amount*100)/100,sign,currency:String(row[map.currency??-1]??'').trim(),issuerCategory:String(row[map.category??-1]??'').trim(),notes:String(row[map.notes??-1]??'').trim()});
  }
  // Card statements list charges as positive numbers; bank statements show expenses as negative ones.
  const debitColumns=map.debit!=null||map.credit!=null,mostlyPositive=signed.filter(s=>s>0).length>=signed.filter(s=>s<0).length;
  const kind=debitColumns?'bank':mostlyPositive?'card':'bank';
  for(const item of items){item.type=debitColumns?(item.sign<0?'expense':'income'):(mostlyPositive?(item.sign>0?'expense':'income'):(item.sign<0?'expense':'income'));if(kind==='card'&&item.type==='income')item.refund=true;delete item.sign;}
  return {items,skipped,columns:map,kind};
}

const ISSUER_CATEGORIES=[[/מסעד|קפה|ברים|מזון מהיר|food|restaurant|cafe/i,'מסעדות'],[/סופר|מזון ומשקאות|מכולת|grocer|supermarket/i,'קניות בסופר'],[/דלק|תחנות|fuel|gas station/i,'דלק'],[/רכב|תחבורה|חניה|מוסך|car|parking|transport/i,'רכב'],[/תקשורת|סלולר|אינטרנט|חשמל|מים|גז|עירי|ארנונה|ביטוח|utilities|insurance|telecom/i,'חשבונות'],[/רפוא|בריאות|מרקחת|פארם|health|pharm|medical/i,'בריאות'],[/ספורט|כושר|gym|fitness/i,'כושר'],[/פנאי|בידור|תרבות|קולנוע|entertainment|leisure/i,'בילויים'],[/אופנה|הלבשה|ביגוד|הנעלה|קניות|fashion|clothing|shopping|אלקטרוניקה|מחשבים|עיצוב הבית|ריהוט|home/i,'קניות'],[/תיירות|טיסות|מלונות|travel|airline|hotel/i,'נסיעות'],[/חינוך|לימוד|ספרים|education/i,'לימודים'],[/תרומ|donat|charity/i,'תרומות'],[/מתנ|gift/i,'מתנות']];
const normalize=s=>String(s||'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').replace(/\b\d+\b/g,' ').replace(/\s+/g,' ').trim();

// Exact history first (what you chose before for this merchant), then the card company's category,
// then keywords and partial history.
function captureCategory(d,item){
  // A refund on a card offsets an expense, so it takes an expense category.
  if(item.type==='income'&&(item.refund||/החזר|זיכוי|refund|ביטול עסקה/i.test(`${item.description} ${item.notes||''}`)))return captureCategory(d,{...item,type:'expense',refund:false});
  const key=normalize(item.description),counts=new Map();
  if(key)for(const t of d.transactions)if(t.type===item.type&&normalize(t.description)===key)counts.set(t.category,(counts.get(t.category)||0)+1);
  const best=[...counts].sort((a,b)=>b[1]-a[1])[0];
  if(best)return best[0];
  for(const [re,category] of ISSUER_CATEGORIES)if(re.test(item.issuerCategory||'')&&d.categories.includes(category))return category;
  return suggestCategory(d,item.description,item.type)||(item.type==='income'?(d.categories.includes('משכורת')?'משכורת':d.categories[0]):d.categories.includes('קניות')?'קניות':d.categories[0]);
}

const daysApart=(a,b)=>Math.abs(new Date(a+'T12:00:00Z')-new Date(b+'T12:00:00Z'))/86400000;
const similar=(a,b)=>{const x=normalize(a),y=normalize(b);if(!x||!y)return false;if(x.includes(y)||y.includes(x))return true;const words=x.split(' ').filter(w=>w.length>2);return words.some(w=>y.split(' ').includes(w));};
// Flags each item: 'duplicate' (already recorded), 'possible' (same amount around the same date) or 'new'.
function markDuplicates(d,items){
  const seen=[];
  return items.map(item=>{
    const candidates=d.transactions.filter(t=>t.type===item.type&&Math.abs(toILS(t.amount,t.currency||'ILS',t.fx||d.fx)-item.amount)<.01&&daysApart(t.date,item.date)<=3);
    const match=candidates.find(t=>similar(t.description,item.description)||similar(t.category,item.description));
    let status=match?'duplicate':candidates.length?'possible':'new',matched=match||candidates[0]||null;
    if(status==='new'&&seen.some(x=>x.date===item.date&&x.amount===item.amount&&normalize(x.description)===normalize(item.description)))status='repeat';
    seen.push(item);
    return {...item,status,matchedId:matched?.id||null,matchedLabel:matched?`${matched.description||matched.category} · ${matched.date}`:''};
  });
}

function prepareCapture(d,items){
  return markDuplicates(d,items).map((item,i)=>({...item,key:`c${i}`,category:item.category&&d.categories.includes(item.category)?item.category:captureCategory(d,item),include:item.status!=='duplicate'}));
}

// Encryption, local version history and end-to-end encrypted sync through the user's own GitHub
// account (a secret gist). The passphrase never leaves the device; GitHub only stores ciphertext,
// and the gist's revision history doubles as cloud version history.

let utf8Encoder=null,utf8Decoder2=null;
const encodeUtf8=text=>(utf8Encoder ||=new TextEncoder()).encode(text);
const decodeUtf8Text=bytes=>(utf8Decoder2 ||=new TextDecoder()).decode(bytes);
function toBase64(bytes){let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(s);}
function fromBase64(text){const s=atob(text),out=new Uint8Array(s.length);for(let i=0;i<s.length;i++)out[i]=s.charCodeAt(i);return out;}
async function pipe(bytes,stream){return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer());}

// Short fingerprint of a JSON string, used to tell whether data changed since the last sync.
function fingerprint(text){let h=0x811c9dc5;for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,0x01000193);}return `${(h>>>0).toString(16)}-${text.length}`;}

const KDF_ITERATIONS=310000;
async function deriveKey(passphrase,salt,iterations=KDF_ITERATIONS){
  const base=await crypto.subtle.importKey('raw',encodeUtf8(passphrase),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['encrypt','decrypt']);
}
const exportKey=key=>crypto.subtle.exportKey('jwk',key);
const importKey=jwk=>crypto.subtle.importKey('jwk',jwk,{name:'AES-GCM'},true,['encrypt','decrypt']);
const newSalt=()=>crypto.getRandomValues(new Uint8Array(16));

async function encryptJSON(value,key,salt,iterations=KDF_ITERATIONS){
  const iv=crypto.getRandomValues(new Uint8Array(12)),plain=await pipe(encodeUtf8(JSON.stringify(value)),new CompressionStream('gzip'));
  const data=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,plain));
  return {format:'ofek-encrypted',version:1,kdf:'PBKDF2-SHA256',iterations,compression:'gzip',salt:toBase64(salt),iv:toBase64(iv),data:toBase64(data)};
}
async function decryptJSON(payload,keyOrPassphrase){
  if(payload?.format!=='ofek-encrypted')throw new Error('הקובץ אינו גיבוי מוצפן של אופק.');
  const key=typeof keyOrPassphrase==='string'?await deriveKey(keyOrPassphrase,fromBase64(payload.salt),payload.iterations):keyOrPassphrase;
  let plain;
  try{plain=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:fromBase64(payload.iv)},key,fromBase64(payload.data)));}
  catch{throw new Error('הסיסמה שגויה, או שהקובץ פגום.');}
  if(payload.compression==='gzip')plain=await pipe(plain,new DecompressionStream('gzip'));
  return JSON.parse(decodeUtf8Text(plain));
}
async function encryptWithPassphrase(value,passphrase){const salt=newSalt();return encryptJSON(value,await deriveKey(passphrase,salt),salt);}

// ---------- Local version history (IndexedDB, with a small localStorage fallback) ----------
const VERSION_DB='ofek-versions',VERSION_STORE='versions',FALLBACK_KEY='ofek-versions-fallback',MAX_VERSIONS=40;
function openVersions(){
  return new Promise((resolve,reject)=>{
    if(!globalThis.indexedDB)return reject(new Error('no indexedDB'));
    const request=indexedDB.open(VERSION_DB,1);
    request.onupgradeneeded=()=>request.result.createObjectStore(VERSION_STORE,{keyPath:'id'});
    request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);
  });
}
const tx=(db,mode,fn)=>new Promise((resolve,reject)=>{const t=db.transaction(VERSION_STORE,mode),store=t.objectStore(VERSION_STORE),result=fn(store);t.oncomplete=()=>resolve(result?.result??result);t.onerror=()=>reject(t.error);});
function versionSummary(d){return {transactions:d.transactions.length,assets:d.assets.length,goals:d.goals.length,snapshots:d.snapshots.length,accounts:d.accounts.length};}
async function saveVersion(d,reason,at=new Date().toISOString()){
  const json=JSON.stringify(d),version={id:`${at.replace(/[^0-9]/g,"")}-${Math.random().toString(36).slice(2,7)}`,at,reason,size:json.length,fingerprint:fingerprint(json),summary:versionSummary(d),json};
  try{
    const db=await openVersions();
    const all=await tx(db,'readonly',store=>store.getAll());
    if(all.length&&all.sort((a,b)=>b.at.localeCompare(a.at))[0].fingerprint===version.fingerprint)return null;
    await tx(db,'readwrite',store=>{store.put(version);for(const old of all.slice(MAX_VERSIONS-1))store.delete(old.id);});
  }catch{
    let list=[];try{list=JSON.parse(localStorage.getItem(FALLBACK_KEY)||'[]');}catch{}
    if(list[0]?.fingerprint===version.fingerprint)return null;
    list=[version,...list].slice(0,5);
    for(;list.length;list.pop()){try{localStorage.setItem(FALLBACK_KEY,JSON.stringify(list));break;}catch{}}
  }
  return version;
}
async function listVersions(){
  try{const db=await openVersions();return (await tx(db,'readonly',store=>store.getAll())).map(({json,...v})=>v).sort((a,b)=>b.at.localeCompare(a.at));}
  catch{try{return JSON.parse(localStorage.getItem(FALLBACK_KEY)||'[]').map(({json,...v})=>v);}catch{return [];}}
}
async function readVersion(id){
  let version=null;
  try{const db=await openVersions();version=await tx(db,'readonly',store=>store.get(id));}
  catch{try{version=JSON.parse(localStorage.getItem(FALLBACK_KEY)||'[]').find(v=>v.id===id);}catch{}}
  if(!version)throw new Error('הגרסה לא נמצאה.');
  return JSON.parse(version.json);
}

// ---------- GitHub gist storage ----------
const SYNC_FILE='ofek-sync.json',SYNC_DESCRIPTION='Ofek — encrypted sync (do not edit)';
class SyncError extends Error{constructor(message,status){super(message);this.status=status;}}
function syncMessage(status,raw){
  if(status===401)return 'הטוקן של GitHub אינו תקין או שפג תוקפו.';
  if(status===403||status===429)return raw&&/rate limit/i.test(raw)?'GitHub הגביל זמנית את מספר הבקשות. נסה שוב בעוד כמה דקות.':'לטוקן אין הרשאת gist. צור טוקן עם הרשאת gist בלבד.';
  if(status===404)return 'קובץ הסנכרון לא נמצא בחשבון GitHub.';
  if(!status)return 'אין חיבור ל־GitHub. הסנכרון ינסה שוב כשתחזור הרשת.';
  return `שגיאה מ־GitHub (${status}).`;
}
function gistClient(token,fetchImpl=globalThis.fetch){
  const call=async(path,{method='GET',body}={})=>{
    let res;
    try{res=await fetchImpl(`https://api.github.com${path}`,{method,cache:'no-store',headers:{'Accept':'application/vnd.github+json','Authorization':`Bearer ${token}`,'X-GitHub-Api-Version':'2022-11-28',...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});}
    catch{throw new SyncError(syncMessage(0),0);}
    if(!res.ok){let raw='';try{raw=(await res.json()).message||'';}catch{}throw new SyncError(syncMessage(res.status,raw),res.status);}
    return res.status===204?null:res.json();
  };
  const content=async gist=>{const file=gist.files?.[SYNC_FILE];if(!file)throw new SyncError(syncMessage(404),404);if(file.truncated&&file.raw_url){const res=await fetchImpl(file.raw_url,{cache:'no-store'});return JSON.parse(await res.text());}return JSON.parse(file.content);};
  return {
    user:()=>call('/user'),
    async find(){for(let page=1;page<=5;page++){const list=await call(`/gists?per_page=100&page=${page}`);const hit=list.find(g=>g.files?.[SYNC_FILE]);if(hit)return hit.id;if(list.length<100)break;}return null;},
    async create(payload){return (await call('/gists',{method:'POST',body:{description:SYNC_DESCRIPTION,public:false,files:{[SYNC_FILE]:{content:JSON.stringify(payload)}}}})).id;},
    async read(id){const gist=await call(`/gists/${id}`);return {payload:await content(gist),history:(gist.history||[]).map(h=>({sha:h.version,at:h.committed_at}))};},
    async write(id,payload){await call(`/gists/${id}`,{method:'PATCH',body:{files:{[SYNC_FILE]:{content:JSON.stringify(payload)}}}});},
    async revision(id,sha){return content(await call(`/gists/${id}/${sha}`));}
  };
}

// What to do on sync, given what changed since the last successful sync. Every push carries a
// revision number and a random nonce: a nonce we did not write means another device wrote (even in
// the same revision, when two devices pushed at once), and an older revision is a stale read.
const newNonce=()=>toBase64(crypto.getRandomValues(new Uint8Array(9)));
function syncDecision({localFingerprint,lastFingerprint,remote,lastRev=0,lastNonce=null,localChangedAt}){
  if(!remote?.nonce)return 'push';
  const localChanged=localFingerprint!==lastFingerprint,remoteChanged=remote.nonce!==lastNonce&&(remote.rev||0)>=lastRev;
  if(localChanged&&remoteChanged)return (localChangedAt||'')>(remote.updatedAt||'')?'push-conflict':'pull-conflict';
  if(remoteChanged)return 'pull';
  if(localChanged)return 'push';
  return 'none';
}

// Automatic USD→ILS exchange rate from free public sources that need no key and allow browser
// requests. Sources are tried in order and every value is sanity-checked, so one source changing or
// going away does not break the app. Rates for past dates are cached forever (they do not change).

const FX_SOURCES=[
  {id:'frankfurter',label:'Frankfurter',latest:'https://api.frankfurter.dev/v2/rate/USD/ILS',on:date=>`https://api.frankfurter.dev/v2/rate/USD/ILS?date=${date}`,parse:j=>({rate:j?.rate,date:j?.date})},
  {id:'frankfurter-ecb',label:'Frankfurter (ECB)',latest:'https://api.frankfurter.dev/v1/latest?base=USD&symbols=ILS',on:date=>`https://api.frankfurter.dev/v1/${date}?base=USD&symbols=ILS`,parse:j=>({rate:j?.rates?.ILS,date:j?.date})},
  {id:'currency-api',label:'Currency API',latest:'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.min.json',on:date=>`https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${date}/v1/currencies/usd.min.json`,parse:j=>({rate:j?.usd?.ils,date:j?.date})},
  {id:'er-api',label:'ExchangeRate-API',latest:'https://open.er-api.com/v6/latest/USD',on:null,parse:j=>({rate:j?.rates?.ILS,date:j?.time_last_update_unix?new Date(j.time_last_update_unix*1000).toISOString().slice(0,10):null})}
];

// A dollar has been worth between 2.5 and 5.5 shekels for decades; anything far outside is a bad response.
const plausibleRate=rate=>Number.isFinite(rate)&&rate>1.5&&rate<8;
const roundRate=rate=>Math.round(rate*10000)/10000;
const isoDate=value=>typeof value==='string'&&/^\d{4}-\d{2}-\d{2}/.test(value)?value.slice(0,10):null;

async function fetchUsdIls({date=null,fetchImpl=globalThis.fetch,timeout=7000,sources=FX_SOURCES}={}){
  const errors=[];
  for(const source of sources){
    const url=date?source.on?.(date):source.latest;
    if(!url)continue;
    let timer=null;
    try{
      const controller=typeof AbortController==='function'?new AbortController():null;
      if(controller)timer=setTimeout(()=>controller.abort(),timeout);
      const res=await fetchImpl(url,{cache:'no-store',signal:controller?.signal});
      if(!res.ok)throw Error(`HTTP ${res.status}`);
      const parsed=source.parse(await res.json()),rate=Number(parsed.rate);
      if(!plausibleRate(rate))throw Error('implausible rate');
      const rateDate=isoDate(parsed.date)||date;
      // A historical answer must not come from a later day than asked (a source ignoring the date).
      if(date&&rateDate&&rateDate>date)throw Error('date mismatch');
      return {rate:roundRate(rate),date:rateDate,source:source.label};
    }catch(err){errors.push(`${source.id}: ${err.name==='AbortError'?'timeout':err.message}`);}
    finally{if(timer)clearTimeout(timer);}
  }
  throw Object.assign(new Error('לא הצלחנו לקבל את שער הדולר כרגע. נסה שוב כשיש חיבור לאינטרנט.'),{errors});
}

// Cache: {latest:{rate,date,source,at}, days:{'YYYY-MM-DD':{rate,date,source}}}
function cachedRate(cache,date){return cache?.days?.[date]||null;}
function rememberRate(cache,date,result,max=400){
  const next={latest:cache?.latest||null,days:{...(cache?.days||{})}};
  if(date)next.days[date]={rate:result.rate,date:result.date||date,source:result.source};
  else next.latest={...result,at:new Date().toISOString()};
  const keys=Object.keys(next.days).sort();
  for(const key of keys.slice(0,Math.max(0,keys.length-max)))delete next.days[key];
  return next;
}




// Money toolkit: Israeli payroll, loans, debt payoff, pension fees, maaser, shared expenses,
// bills & cash-flow and purchase decisions. Pure functions over the data object, no DOM.

const sumBy=(list,fn)=>list.reduce((s,x)=>s+fn(x),0);
const round2=n=>Math.round(n*100)/100;
const txAmount=(d,t)=>toILS(t.amount,t.currency||'ILS',t.fx||d.fx);

// ---------- Israeli net salary ----------
// Monthly payroll parameters for 2026 (₪): income-tax brackets incl. the 3% surtax band,
// credit point value, National Insurance + health tax for employees, and the pension tax credit.
const IL_TAX_2026={
  year:2026,
  brackets:[[7010,.10],[10060,.14],[19000,.20],[25100,.31],[46690,.35],[60130,.47],[Infinity,.50]],
  creditPoint:242,
  insurance:{threshold:7703,max:51910,niLow:.0104,niHigh:.07,healthLow:.0323,healthHigh:.0517},
  pension:{creditRate:.35,maxRate:.07,salaryCap:9700},
  hoursPerMonth:182
};

function incomeTax(taxable,brackets=IL_TAX_2026.brackets){
  let tax=0,prev=0;
  for(const [top,rate] of brackets){if(taxable<=prev)break;tax+=(Math.min(taxable,top)-prev)*rate;prev=top;}
  return tax;
}
const marginalRate=(income,brackets=IL_TAX_2026.brackets)=>(brackets.find(([top])=>income<=top)||brackets.at(-1))[1];

function netSalary({gross,creditPoints=2.25,pensionRate=.06,studyFundRate=0},p=IL_TAX_2026){
  gross=Number(gross);creditPoints=Number(creditPoints);pensionRate=Number(pensionRate);studyFundRate=Number(studyFundRate);
  if(!Number.isFinite(gross)||gross<0)throw new Error('יש להזין שכר ברוטו שאינו שלילי.');
  if(!(creditPoints>=0&&creditPoints<=20)||!(pensionRate>=0&&pensionRate<=.2)||!(studyFundRate>=0&&studyFundRate<=.1))throw new Error('נקודות הזיכוי או שיעורי ההפרשה אינם תקינים.');
  const before=incomeTax(gross,p.brackets),credits=creditPoints*p.creditPoint,pension=gross*pensionRate;
  const pensionCredit=Math.min(pension,Math.min(gross,p.pension.salaryCap)*p.pension.maxRate)*p.pension.creditRate;
  const tax=Math.max(0,before-credits-pensionCredit);
  const insured=Math.min(gross,p.insurance.max),low=Math.min(insured,p.insurance.threshold),high=insured-low;
  const ni=low*p.insurance.niLow+high*p.insurance.niHigh,health=low*p.insurance.healthLow+high*p.insurance.healthHigh;
  const studyFund=gross*studyFundRate,net=gross-tax-ni-health-pension-studyFund;
  return {gross,net,tax,taxBeforeCredits:before,credits,pensionCredit,ni,health,pension,studyFund,mandatory:tax+ni+health,effectiveRate:gross?(tax+ni+health)/gross:0,marginal:marginalRate(gross,p.brackets),hourly:net/p.hoursPerMonth};
}

// Gross salary needed for a target take-home pay (net grows monotonically with gross).
function grossForNet(target,options={},p=IL_TAX_2026){
  target=Number(target);
  if(!(target>0))throw new Error('יש להזין שכר נטו חיובי.');
  let lo=0,hi=target*3+5000;
  for(let i=0;i<90;i++){const mid=(lo+hi)/2;if(netSalary({...options,gross:mid},p).net<target)lo=mid;else hi=mid;}
  return Math.ceil(hi);
}

// ---------- Loans & mortgages ----------
// Spitzer (equal payments) or equal-principal schedules; CPI-linked loans index the balance monthly.
// Extra monthly payments go to principal and shorten the loan.
function loanSchedule({principal,annualRate,years,extraMonthly=0,method='shpitzer',cpiLinked=false,inflation=2.5}){
  principal=+principal;annualRate=+annualRate;years=+years;extraMonthly=+extraMonthly||0;inflation=+inflation||0;
  if(!(principal>0))throw new Error('יש להזין סכום הלוואה חיובי.');
  if(!(annualRate>=0&&annualRate<50))throw new Error('הריבית השנתית צריכה להיות בין 0% ל־50%.');
  if(!(years>0&&years<=40))throw new Error('תקופת ההלוואה צריכה להיות עד 40 שנה.');
  if(extraMonthly<0||!(inflation>-10&&inflation<30))throw new Error('ההפקדה הנוספת או האינפלציה אינן תקינות.');
  const n=Math.round(years*12),r=annualRate/1200,idx=cpiLinked?Math.pow(1+inflation/100,1/12):1;
  const basePayment=r?principal*r/(1-Math.pow(1+r,-n)):principal/n,rows=[];
  let balance=principal,index=1;
  for(let m=1;m<=n&&balance>.005;m++){
    index*=idx;const indexation=balance*(idx-1);balance+=indexation;
    const interest=balance*r;
    const scheduled=method==='equal'?principal*index/n:basePayment*index-interest;
    const principalPart=Math.min(Math.max(0,scheduled),balance),extra=Math.min(extraMonthly,balance-principalPart);
    balance-=principalPart+extra;
    rows.push({month:m,payment:principalPart+interest,extra,interest,principal:principalPart+extra,indexation,balance:Math.max(0,balance)});
  }
  return {firstPayment:rows[0]?.payment||0,maxPayment:Math.max(0,...rows.map(x=>x.payment)),lastPayment:rows.at(-1)?.payment||0,months:rows.length,totalInterest:sumBy(rows,x=>x.interest),totalIndexation:sumBy(rows,x=>x.indexation),totalPaid:sumBy(rows,x=>x.payment+x.extra),rows};
}

function loanByYear(rows){
  const years=[];
  for(const row of rows){const y=Math.ceil(row.month/12);years[y-1] ||={year:y,interest:0,principal:0,indexation:0,balance:0};const v=years[y-1];v.interest+=row.interest;v.principal+=row.principal;v.indexation+=row.indexation;v.balance=row.balance;}
  return years;
}

// ---------- Debt payoff: avalanche (highest rate first) vs snowball (smallest balance first) ----------
function debtPayoff(debts,{extra=0,strategy='avalanche'}={}){
  const list=debts.map((x,i)=>({id:x.id??String(i),name:x.name||`חוב ${i+1}`,balance:Number(x.balance)||0,rate:Number(x.rate)||0,payment:Number(x.payment)||0})).filter(x=>x.balance>0);
  if(list.some(x=>x.rate<0||x.payment<0||!Number.isFinite(x.balance)))throw new Error('נתוני החובות אינם תקינים.');
  const budget=sumBy(list,x=>x.payment)+Math.max(0,Number(extra)||0),series=[{month:0,balance:sumBy(list,x=>x.balance)}],order=[];
  let month=0,totalInterest=0;
  while(list.some(x=>x.balance>.005)&&month<600){
    month++;let available=budget;
    for(const x of list)if(x.balance>.005){const i=x.balance*x.rate/1200;x.balance+=i;totalInterest+=i;}
    for(const x of list)if(x.balance>.005){const pay=Math.min(x.payment,x.balance,available);x.balance-=pay;available-=pay;}
    const targets=list.filter(x=>x.balance>.005).sort(strategy==='snowball'?(a,b)=>a.balance-b.balance:(a,b)=>b.rate-a.rate||a.balance-b.balance);
    for(const x of targets){if(available<=0)break;const pay=Math.min(available,x.balance);x.balance-=pay;available-=pay;}
    for(const x of list)if(x.balance<=.005&&!order.some(o=>o.id===x.id)){x.balance=0;order.push({id:x.id,name:x.name,month});}
    series.push({month,balance:sumBy(list,x=>x.balance)});
    if(month===12&&series[12].balance>=series[0].balance)break;
  }
  const feasible=!list.some(x=>x.balance>.005);
  return {feasible,months:feasible?month:null,totalInterest:feasible?totalInterest:null,order,series,budget,strategy};
}

// ---------- Pension / savings management fees ----------
// Percent inputs (5 = 5%). Accumulation fee is charged on the balance, deposit fee on each deposit.
function feeImpact({balance=0,monthly=0,years=30,annualReturn=5,accumulationFee=.5,depositFee=2,compareAccumulation=.15,compareDeposit=1}){
  const nums=[balance,monthly,years,annualReturn,accumulationFee,depositFee,compareAccumulation,compareDeposit].map(Number);
  if(nums.some(n=>!Number.isFinite(n))||nums[0]<0||nums[1]<0||!(nums[2]>0&&nums[2]<=60)||nums.slice(4).some(n=>n<0||n>10))throw new Error('יש להזין ערכים תקינים: שנים עד 60 ודמי ניהול בין 0% ל־10%.');
  [balance,monthly,years,annualReturn,accumulationFee,depositFee,compareAccumulation,compareDeposit]=nums;
  const run=(acc,dep)=>{
    const growth=Math.pow(1+annualReturn/100,1/12),keep=Math.pow(1-acc/100,1/12),points=[{year:0,value:balance}];
    let value=balance,fees=0;
    for(let m=1;m<=years*12;m++){const grown=value*growth;fees+=grown*(1-keep)+monthly*dep/100;value=grown*keep+monthly*(1-dep/100);if(m%12===0)points.push({year:m/12,value});}
    return {final:value,fees,points};
  };
  const yours=run(accumulationFee,depositFee),better=run(compareAccumulation,compareDeposit);
  return {yours,better,difference:better.final-yours.final,contributed:balance+monthly*years*12};
}

// ---------- Maaser (giving 10% / 20% of income) ----------
function maaserSummary(d,{year=today().slice(0,4),rate=.1,categories=['תרומות']}={}){
  const inYear=t=>t.date.startsWith(String(year));
  const income=sumBy(d.transactions.filter(t=>t.type==='income'&&inYear(t)),t=>txAmount(d,t));
  const donated=sumBy(d.transactions.filter(t=>t.type==='expense'&&inYear(t)&&categories.includes(t.category)),t=>txAmount(d,t));
  const due=income*rate;
  return {year:String(year),rate,income,due,donated,remaining:due-donated,progress:due>0?donated/due:0,taxCredit:donated*.35};
}

// ---------- Shared expenses ----------
function expenseShares(group,x){
  if(x.split==='exact'&&x.shares)return Object.fromEntries(Object.entries(x.shares).map(([id,v])=>[id,Number(v)]));
  const people=x.participants?.length?x.participants:group.members.map(m=>m.id),each=x.amount/people.length;
  return Object.fromEntries(people.map(id=>[id,each]));
}
// Positive = the group owes this member; negative = this member owes the group.
function groupBalances(group){
  const net=Object.fromEntries(group.members.map(m=>[m.id,0]));
  for(const x of group.expenses||[]){net[x.paidBy]+=x.amount;for(const [id,share] of Object.entries(expenseShares(group,x)))net[id]-=share;}
  for(const s of group.settlements||[]){net[s.from]+=s.amount;net[s.to]-=s.amount;}
  return net;
}
// Greedy matching of the largest debtor with the largest creditor: at most n-1 transfers.
function settleUp(net){
  const creditors=Object.entries(net).filter(([,v])=>v>.009).map(([id,v])=>({id,v})).sort((a,b)=>b.v-a.v);
  const debtors=Object.entries(net).filter(([,v])=>v<-.009).map(([id,v])=>({id,v:-v})).sort((a,b)=>b.v-a.v);
  const transfers=[];let i=0,j=0;
  while(i<debtors.length&&j<creditors.length){
    const amount=Math.min(debtors[i].v,creditors[j].v);
    if(amount>=.01)transfers.push({from:debtors[i].id,to:creditors[j].id,amount:round2(amount)});
    debtors[i].v-=amount;creditors[j].v-=amount;
    if(debtors[i].v<.01)i++;
    if(creditors[j].v<.01)j++;
  }
  return transfers;
}
function groupSummary(group){
  const net=groupBalances(group),me=group.members.find(m=>m.me)?.id||null;
  const myShare=me?sumBy(group.expenses||[],x=>expenseShares(group,x)[me]||0):0;
  return {total:sumBy(group.expenses||[],x=>x.amount),net,transfers:settleUp(net),me,myBalance:me?net[me]:0,myShare};
}
function splitTotals(d){
  let owedToMe=0,iOwe=0;
  for(const g of d.groups||[]){const s=groupSummary(g);if(s.myBalance>.009)owedToMe+=s.myBalance;else if(s.myBalance<-.009)iOwe-=s.myBalance;}
  return {owedToMe,iOwe,groups:(d.groups||[]).length};
}

// ---------- Bills, recurring items & cash-flow ----------
const BILL_STEPS={monthly:1,bimonthly:2,quarterly:3,yearly:12};
const monthsBetween=(a,b)=>(+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5,7)-+a.slice(5,7));
const onDay=(month,day)=>`${month}-${String(Math.min(day,daysInMonth(month))).padStart(2,'0')}`;

function billOccurrences(bill,from,to){
  const step=BILL_STEPS[bill.frequency]||1,anchor=bill.startMonth||from.slice(0,7),out=[];
  const gap=monthsBetween(anchor,from.slice(0,7));
  let month=gap>0?monthOffset(anchor,Math.floor(gap/step)*step):anchor;
  for(let i=0;i<60;i++){const date=onDay(month,bill.day);if(date>to)break;if(date>=from)out.push(date);month=monthOffset(month,step);}
  return out;
}
const billMonthly=(d,b)=>toILS(b.amount,b.currency||'ILS',d.fx)/(BILL_STEPS[b.frequency]||1);

// Bills and recurring transactions that fall between two dates (inclusive).
function scheduledItems(d,from,to){
  const items=[];
  for(const b of d.bills||[]){
    if(b.active===false)continue;
    for(const date of billOccurrences(b,from,to))items.push({key:`${b.id}@${date}`,date,name:b.name,amount:toILS(b.amount,b.currency||'ILS',d.fx),type:b.type||'expense',category:b.category||'',source:'bill',billId:b.id,autopay:!!b.autopay,paid:(b.paid||[]).includes(date),accountId:b.accountId||''});
  }
  for(const t of d.transactions.filter(t=>t.recurring&&!t.recurringParent)){
    const day=Number(t.date.slice(8,10));
    for(let month=from.slice(0,7),guard=0;month<=to.slice(0,7)&&guard<24;month=monthOffset(month,1),guard++){
      const date=onDay(month,day);
      if(date<from||date>to||month<=t.date.slice(0,7))continue;
      if(d.transactions.some(x=>x.recurringParent===t.id&&x.date.slice(0,7)===month))continue;
      items.push({key:`${t.id}@${date}`,date,name:t.description||t.category,amount:txAmount(d,t),type:t.type,category:t.category,source:'recurring',autopay:true,paid:false,accountId:t.accountId});
    }
  }
  return items.sort((a,b)=>a.date.localeCompare(b.date)||b.amount-a.amount);
}

// Monthly cost of fixed expenses: bills (monthly equivalent) + recurring expense transactions.
function monthlyFixed(d){
  return sumBy((d.bills||[]).filter(b=>b.active!==false&&(b.type||'expense')==='expense'),b=>billMonthly(d,b))+sumBy(d.transactions.filter(t=>t.recurring&&!t.recurringParent&&t.type==='expense'),t=>txAmount(d,t));
}

// Salary-like incomes seen in at least two of the last three months, projected forward.
function estimatedIncome(d,from,to,now=today()){
  const current=now.slice(0,7),window=[current,monthOffset(current,-1),monthOffset(current,-2),monthOffset(current,-3)],groups=new Map();
  for(const t of d.transactions)if(t.type==='income'&&window.includes(t.date.slice(0,7))){const key=(t.description||t.category).trim();if(!groups.has(key))groups.set(key,[]);groups.get(key).push(t);}
  const items=[];
  for(const [name,list] of groups){
    const months=new Set(list.map(t=>t.date.slice(0,7)));
    if(months.size<2)continue;
    const last=[...list].sort((a,b)=>b.date.localeCompare(a.date))[0],amount=sumBy(list,t=>txAmount(d,t))/months.size,day=Number(last.date.slice(8,10));
    for(let month=from.slice(0,7),guard=0;month<=to.slice(0,7)&&guard<24;month=monthOffset(month,1),guard++){
      const date=onDay(month,day);
      if(date<from||date>to||months.has(month))continue;
      items.push({key:`est-${name}@${date}`,date,name,amount,type:'income',category:last.category,source:'estimate',autopay:true,paid:false});
    }
  }
  return items;
}

// Planned monthly deposits to savings goals that move money out of the bank (to a savings or
// investment account, or set aside by hand). Goals funded inside a bank or cash account are skipped:
// that money never leaves the account. Deposits stop once a goal reaches its target.
function goalDepositItems(d,from,to,now=today()){
  const items=[];
  for(const g of d.goals||[]){
    const account=d.accounts.find(a=>a.id===g.accountId);
    if(!(g.monthly>0)||!(g.date>now)||(account&&['bank','cash'].includes(account.kind)))continue;
    let saved=effectiveGoalSavings(d,g);
    for(let k=1;k<=600;k++){
      const date=savingsDepositDate(now,k);
      if(date>to||date>g.date)break;
      if(g.target>0&&saved>=g.target)break;
      saved+=g.monthly;
      if(date>=from)items.push({key:`goal-${g.id}@${date}`,date,name:`הפקדה ל${g.name}`,amount:g.monthly,type:'transfer',category:'חיסכון',source:'goal',goalId:g.id,autopay:false,paid:false});
    }
  }
  return items;
}

// Day-by-day projection of bank + cash: fixed payments and incomes, recurring transactions,
// planned goal deposits and average variable spending, with a summary for every month.
function cashflowForecast(d,{days=60,now=today(),includeGoals=true,includeVariable=true}={}){
  days=Math.max(7,Math.min(400,Math.round(days)));
  const start=sumBy(d.accounts.filter(a=>['bank','cash'].includes(a.kind)),a=>toILS(a.balance,a.currency,d.fx));
  const from=shiftDate(now,1),end=shiftDate(now,days);
  let items=scheduledItems(d,from,end).filter(x=>!x.paid);
  const hasIncome=items.some(x=>x.type==='income')||(d.bills||[]).some(b=>b.type==='income'&&b.active!==false)||d.transactions.some(t=>t.recurring&&!t.recurringParent&&t.type==='income');
  const estimated=hasIncome?[]:estimatedIncome(d,from,end,now);
  items=[...items,...estimated,...(includeGoals?goalDepositItems(d,from,end,now):[])].sort((a,b)=>a.date.localeCompare(b.date));
  const avg=averageMonth(d,now.slice(0,7),3),fixed=monthlyFixed(d),variableDaily=includeVariable?Math.max(0,avg.expenses-fixed)/30.4:0;
  const byDate=new Map();for(const x of items){if(!byDate.has(x.date))byDate.set(x.date,[]);byDate.get(x.date).push(x);}
  let balance=start,lowest={date:now,balance:start},overdraft=null;
  const points=[{date:now,balance,events:[]}],months=new Map();
  for(let i=1;i<=days;i++){
    const date=shiftDate(now,i),events=byDate.get(date)||[],month=date.slice(0,7);
    if(!months.has(month))months.set(month,{month,start:balance,income:0,fixed:0,deposits:0,variable:0,end:balance,lowest:{date,balance},days:0});
    const m=months.get(month);
    balance-=variableDaily;m.variable+=variableDaily;m.days++;
    for(const x of events){
      if(x.type==='income'){balance+=x.amount;m.income+=x.amount;}
      else if(x.type==='transfer'){balance-=x.amount;m.deposits+=x.amount;}
      else{balance-=x.amount;m.fixed+=x.amount;}
    }
    m.end=balance;if(balance<m.lowest.balance)m.lowest={date,balance};
    points.push({date,balance,events});
    if(balance<lowest.balance)lowest={date,balance};
    if(balance<0&&!overdraft)overdraft=date;
  }
  return {start,end:balance,points,lowest,overdraft,items,variableDaily,fixed,estimatedIncome:estimated.length>0,days,months:[...months.values()],deposits:sumBy(items.filter(x=>x.type==='transfer'),x=>x.amount)};
}

// How much can be spent per day for the rest of the month without breaking the monthly target.
function safeToSpend(d,now=today()){
  const month=now.slice(0,7),spent=monthlySummary(d,month).expenses,days=daysInMonth(month),daysLeft=days-Number(now.slice(8,10))+1;
  const upcoming=scheduledItems(d,now,`${month}-${String(days).padStart(2,'0')}`).filter(x=>!x.paid&&x.type==='expense');
  const upcomingFixed=sumBy(upcoming,x=>x.amount),available=d.overallBudget-spent-upcomingFixed;
  return {perDay:Math.max(0,available)/daysLeft,available,spent,upcomingFixed,daysLeft,budget:d.overallBudget,upcoming};
}

// ---------- Purchase decisions & wishlist ----------
function purchaseCheck(d,{price,installments=1,now=today()}){
  price=Number(price);installments=Math.max(1,Math.min(36,Math.round(Number(installments)||1)));
  if(!(price>0)||!Number.isFinite(price))throw new Error('יש להזין מחיר חיובי.');
  const month=now.slice(0,7),avg=averageMonth(d,month,3),cur=monthlySummary(d,month);
  const income=avg.months?avg.income:cur.income,expenses=avg.months?avg.expenses:cur.expenses;
  const hourly=income>0?income/IL_TAX_2026.hoursPerMonth:null,s=safeToSpend(d,now),monthlyCost=price/installments;
  const b=balances(d),liquid=b.cash+b.savings,coverAfter=expenses>0?(liquid-price)/expenses:null;
  const goal=[...(d.goals||[])].filter(g=>g.monthly>0&&g.date>now).sort((a,b)=>a.date.localeCompare(b.date))[0];
  const room=Math.max(0,s.available);
  const verdict=monthlyCost>room||(coverAfter!=null&&coverAfter<1)?'red':monthlyCost<=room*.35&&(coverAfter==null||coverAfter>=3)?'green':'yellow';
  return {price,installments,monthlyCost,hourly,hours:hourly?price/hourly:null,available:s.available,shareOfAvailable:room>0?monthlyCost/room:null,coverAfter,liquid,opportunity10:price*Math.pow(1.05,10),opportunity20:price*Math.pow(1.05,20),goal:goal?{name:goal.name,delayMonths:price/goal.monthly}:null,verdict};
}

const COOLING_DAYS=30;
function wishStatus(item,now=today()){
  const total=item.coolDays??COOLING_DAYS,ready=shiftDate(item.added,total),left=Math.max(0,Math.round((new Date(ready+'T12:00:00Z')-new Date(now+'T12:00:00Z'))/86400000));
  return {ready,left,total,progress:total?Math.min(1,(total-left)/total):1,isReady:left===0};
}
function wishlistSummary(d){
  const list=d.wishlist||[],sum=status=>sumBy(list.filter(x=>x.status===status),x=>x.price);
  return {waiting:sum('waiting'),skipped:sum('skipped'),bought:sum('bought'),count:list.filter(x=>x.status==='waiting').length,ready:list.filter(x=>x.status==='waiting'&&wishStatus(x).isReady).length};
}




// "What if" simulator: month by month, compares the current plan with a plan that includes events
// such as a car purchase, a discharge grant or a change in the monthly deposit.
//
// Period m = 1 is next month. Each period: the usual monthly surplus (average income − expenses)
// lands in free money, planned goal deposits move from free money to their goals until each goal
// reaches its target or date, investments grow, and debts are paid down.
const EVENT_TYPES={
  deposit:'שינוי בהפקדה החודשית',
  purchase:'רכישה גדולה',
  grant:'מענק או הכנסה חד־פעמית',
  income:'שינוי בהכנסה החודשית',
  expense:'הוצאה חודשית חדשה'
};

function loanPayment(principal,annualRate,years){
  const n=Math.max(1,Math.round(years*12)),r=annualRate/1200;
  return r?principal*r/(1-Math.pow(1+r,-n)):principal/n;
}

function simulatePlan(d,events=[],{horizon=36,annualReturn=5,now=today()}={}){
  horizon=Math.max(6,Math.min(120,Math.round(horizon)));
  const nowMonth=now.slice(0,7),avg=averageMonth(d,nowMonth,3),cur=monthlySummary(d,nowMonth);
  const surplus=avg.months?avg.income-avg.expenses:cur.income-cur.expenses;
  const b=balances(d),growth=Math.pow(1+annualReturn/100,1/12);
  const goals=d.goals.map(g=>({id:g.id,name:g.name,target:Number(g.target)>0?Number(g.target):null,saved:effectiveGoalSavings(d,g),monthly:Math.max(0,Number(g.monthly)||0),end:g.date.slice(0,7),achieved:null}));
  for(const g of goals)if(g.target&&g.saved>=g.target)g.achieved=0;
  const debts=d.accounts.filter(a=>a.kind==='debt'&&a.balance>0).map(a=>({balance:toILS(a.balance,a.currency,d.fx),rate:Number(a.interest)||0,payment:toILS(a.payment||0,a.currency,d.fx)}));
  let free=freeMoney(d).total,investments=b.investments;
  const loans=[],points=[{month:0,label:'היום',free,goals:goals.reduce((s,g)=>s+g.saved,0),investments,debt:debts.reduce((s,x)=>s+x.balance,0)}];
  let lowest={month:0,free},negative=null;
  const at=(e,m)=>Math.max(1,Math.round(Number(e.month)||1))===m;
  const active=(e,m)=>{const start=Math.max(1,Math.round(Number(e.month)||1)),duration=Math.round(Number(e.duration)||0);return m>=start&&(!duration||m<start+duration);};
  const goalById=id=>goals.find(g=>g.id===id);
  for(let m=1;m<=horizon;m++){
    const month=monthOffset(nowMonth,m);
    let net=surplus;
    for(const e of events){
      const amount=Number(e.amount)||0;
      if(e.type==='income'&&active(e,m))net+=amount;
      if(e.type==='expense'&&active(e,m))net-=amount;
      if(e.type==='purchase'&&Number(e.monthlyCost)>0&&m>Math.max(1,Math.round(Number(e.month)||1)))net-=Number(e.monthlyCost);
    }
    for(const loan of loans)if(loan.left>0&&m>loan.start){const interest=loan.balance*loan.rate/1200,pay=Math.min(loan.payment,loan.balance+interest);loan.balance=Math.max(0,loan.balance+interest-pay);loan.left--;net-=pay;}
    for(const x of debts)if(x.balance>0){const interest=x.balance*x.rate/1200;x.balance=Math.max(0,x.balance+interest-x.payment);}
    // One-time events of this month.
    for(const e of events.filter(e=>at(e,m))){
      const amount=Math.max(0,Number(e.amount)||0),target=String(e.target||e.funding||'free');
      if(e.type==='grant'){
        if(target.startsWith('goal:')&&goalById(target.slice(5)))goalById(target.slice(5)).saved+=amount;
        else if(target==='invest')investments+=amount;
        else free+=amount;
      }
      if(e.type==='purchase'){
        if(target==='loan'){loans.push({balance:amount,rate:Number(e.loanRate)||0,payment:loanPayment(amount,Number(e.loanRate)||0,Number(e.loanYears)||5),left:Math.round((Number(e.loanYears)||5)*12),start:m});}
        else if(target.startsWith('goal:')&&goalById(target.slice(5))){const g=goalById(target.slice(5)),take=Math.min(g.saved,amount);g.saved-=take;free-=amount-take;}
        else free-=amount;
      }
    }
    // Planned goal deposits (with deposit-change events) until each goal is reached or due.
    const extra=new Map(),shareAll=events.filter(e=>e.type==='deposit'&&active(e,m)&&(!e.goal||e.goal==='all')).reduce((s,e)=>s+(Number(e.amount)||0),0);
    for(const e of events)if(e.type==='deposit'&&active(e,m)&&e.goal&&e.goal!=='all')extra.set(e.goal,(extra.get(e.goal)||0)+(Number(e.amount)||0));
    const open=goals.filter(g=>month<=g.end&&!(g.target&&g.saved>=g.target)),base=open.reduce((s,g)=>s+g.monthly,0);
    for(const g of open){
      const share=shareAll?(base>0?g.monthly/base:1/open.length)*shareAll:0;
      let deposit=Math.max(0,g.monthly+(extra.get(g.id)||0)+share);
      if(g.target)deposit=Math.min(deposit,g.target-g.saved);
      g.saved+=deposit;free-=deposit;
      if(g.target&&g.achieved==null&&g.saved>=g.target-.005)g.achieved=m;
    }
    for(const g of goals)if(g.target&&g.achieved==null&&g.saved>=g.target-.005)g.achieved=m;
    free+=net;investments*=growth;
    const debt=debts.reduce((s,x)=>s+x.balance,0)+loans.reduce((s,x)=>s+x.balance,0),goalsTotal=goals.reduce((s,g)=>s+g.saved,0);
    points.push({month:m,label:new Date(month+'-01T12:00:00').toLocaleDateString('he-IL',{month:'short',year:'2-digit'}),free,goals:goalsTotal,investments,debt,netWorth:free+goalsTotal+investments-debt});
    if(free<lowest.free)lowest={month:m,free};
    if(free<0&&negative==null)negative=m;
  }
  points[0].netWorth=points[0].free+points[0].goals+points[0].investments-points[0].debt;
  return {surplus,points,final:points.at(-1),lowest,negative,goals:goals.map(g=>({id:g.id,name:g.name,target:g.target,saved:g.saved,achieved:g.achieved,achievedMonth:g.achieved!=null?monthOffset(nowMonth,g.achieved):null,end:g.end,missedDeadline:g.achieved==null&&g.end<=monthOffset(nowMonth,horizon)})),horizon,nowMonth};
}

function compareScenario(d,events,options={}){
  const baseline=simulatePlan(d,[],options),scenario=simulatePlan(d,events,options);
  const goals=baseline.goals.map((g,i)=>{const s=scenario.goals[i];return {...g,baseline:g.achieved,scenario:s.achieved,scenarioMissed:s.missedDeadline,baselineMonth:g.achievedMonth,scenarioMonth:s.achievedMonth,delta:g.achieved!=null&&s.achieved!=null?s.achieved-g.achieved:null,savedAtEnd:{baseline:g.saved,scenario:s.saved}};});
  return {baseline,scenario,goals,freeDelta:scenario.final.free-baseline.final.free,netWorthDelta:scenario.final.netWorth-baseline.final.netWorth};
}

const AI_SYSTEM=`You are "אופק AI" — the personal financial copilot built into Ofek (אופק), a Hebrew, right-to-left personal finance app. The user's data lives only on their device; you see it through the context block in their messages and through your tools.

How to work:
- Always answer in natural, warm, concise Hebrew. Currency is the Israeli shekel (₪) unless an amount is in dollars.
- Ground every number in the user's real data. Call the read tools whenever the context block is not enough — never invent transactions, balances or returns.
- Be specific and actionable: name categories, amounts and dates; compare to the user's own history; end with one or two concrete next steps when it helps.
- You can draw charts inside the chat with render_chart. Use one when a trend, comparison or breakdown is clearer visually (keep labels short, Hebrew, at most 12 points).
- To change data you must use a propose_* tool. The user sees a confirmation card and decides; never claim something was saved until the tool result says it was approved.
- When the user attaches a receipt, invoice, bank or credit-card statement (image, PDF or CSV): read it carefully, extract every transaction (date, amount, merchant/description, a category from the user's category list) and call propose_transactions once with all of them. Skip lines that are totals, balances or duplicates of transactions already in the data. If the year is missing, infer it from context and never use a future date.
- Ofek also runs a bills calendar with a cash-flow forecast, shared-expense groups (trips, roommates) and a wishlist with a 30-day cooling-off period. Use get_cashflow_forecast for questions like "will I be overdrawn?" or "how much can I spend?", get_split_groups for who owes whom, and money_calculator for Israeli net salary (2026 brackets, credit points, National Insurance), mortgages and loans (incl. CPI-linked), debt payoff strategies, pension-fee impact and "should I buy it?" checks.
- When the user shares a broker screenshot or holdings report, read every holding's price or value (and the USD/ILS rate if shown) and call propose_investment_update once; the user reviews it in the monthly update before saving.
- When the user wants to split a shared receipt, call propose_split_expense; when you discover a fixed payment, offer propose_bill; when the user hesitates about a purchase, suggest propose_wishlist_item instead of buying now.
- You are not a licensed investment advisor. For investment questions, explain principles, risks and the user's own numbers; avoid recommending a specific security, and mention this briefly only when relevant.
- Formatting: short paragraphs, **bold** for key figures, "-" bullets, numbered steps, "###" small headings and simple Markdown tables. No HTML.`;

const sumILS=(d,list)=>list.reduce((s,t)=>s+toILS(t.amount,t.currency||'ILS',t.fx||d.fx),0);
const accountName=(d,id)=>d.accounts.find(a=>a.id===id)?.name||'—';
function resolveAccount(d,ref){
  const usable=d.accounts.filter(a=>!['investment','debt'].includes(a.kind));
  if(ref){const r=String(ref).trim();const hit=usable.find(a=>a.id===r||a.name===r)||usable.find(a=>a.name.includes(r)||r.includes(a.name));if(hit)return hit;if(/מזומן|cash/i.test(r))return usable.find(a=>a.kind==='cash')||null;}
  return usable.find(a=>a.kind==='bank')||usable[0]||null;
}

// Validates a proposed transaction and returns a normalized draft or an error string.
function normalizeProposedTransaction(d,raw,now=today()){
  const amount=Number(raw?.amount),date=String(raw?.date||''),type=raw?.type==='income'?'income':raw?.type==='expense'?'expense':null;
  if(!type)return {error:'type must be expense or income'};
  if(!(amount>0)||!Number.isFinite(amount))return {error:'amount must be positive'};
  if(!validDate(date))return {error:`invalid date "${date}"`};
  if(date>now)return {error:`date ${date} is in the future`};
  const account=resolveAccount(d,raw.account);
  if(!account)return {error:'no bank, cash or savings account exists'};
  const category=String(raw.category||'').trim()||'קניות';
  return {draft:{type,amount,currency:raw.currency==='USD'?'USD':account.currency,date,category,description:String(raw.description||'').trim().slice(0,120),accountId:account.id,subcategory:'',tags:['AI'],recurring:false}};
}

async function executeAiTool(name,input,ctx){
  const d=ctx.data,month=ctx.month||today().slice(0,7),now=ctx.now||today();input=input||{};

  }

    const list=d.transactions.filter(t=>(!input.from||t.date>=input.from)&&(!input.to||t.date<=input.to)&&(!input.type||t.type===input.type)&&(!input.category||t.category===input.category)&&(!q||[t.description,t.category,t.subcategory,...(t.tags||[])].join(' ').includes(q))&&(input.min_amount==null||t.amount>=input.min_amount)&&(input.max_amount==null||t.amount<=input.max_amount)).sort((a,b)=>b.date.localeCompare(a.date));
    return {count:list.length,total_income:round(sumILS(d,list.filter(t=>t.type==='income'))),total_expense:round(sumILS(d,list.filter(t=>t.type==='expense'))),shown:Math.min(limit,list.length),transactions:list.slice(0,limit).map(t=>({date:t.date,type:t.type,amount:t.amount,currency:t.currency||'ILS',category:t.category,description:t.description,account:accountName(d,t.accountId)}))};
  }
  if(name==='spending_breakdown'){
    if(!validDate(input.from)||!validDate(input.to))throw new Error('from and to must be YYYY-MM-DD');
    const type=input.type||'expense',list=d.transactions.filter(t=>t.type===type&&t.date>=input.from&&t.date<=input.to),groups=new Map();
    for(const t of list){const key=input.group_by==='month'?t.date.slice(0,7):input.group_by==='account'?accountName(d,t.accountId):t.category;groups.set(key,(groups.get(key)||0)+toILS(t.amount,t.currency||'ILS',t.fx||d.fx));}
    const rows=[...groups.entries()].map(([key,total])=>({key,total:round(total)}));
    rows.sort(input.group_by==='month'?(a,b)=>a.key.localeCompare(b.key):(a,b)=>b.total-a.total);
    return {type,from:input.from,to:input.to,total:round(sumILS(d,list)),rows};

// ---------- Streaming client ----------
class AiError extends Error{constructor(message,status){super(message);this.status=status;}}

function friendlyError(status,body){
  const raw=body?.error?.message||'';
  if(status===401)return 'מפתח ה־API אינו תקין. אפשר לעדכן אותו בהגדרות ה־AI.';
  if(status===403)return 'למפתח אין הרשאה לפעולה הזו. '+raw;
  if(status===404)return 'המודל שנבחר אינו זמין לחשבון שלך. נסה מודל אחר בהגדרות.';
  if(status===413)return 'הבקשה גדולה מדי. נסה קובץ קטן יותר.';
  if(status===429)return 'הגעת למגבלת הקצב או התקציב של ה־API. נסה שוב בעוד רגע.';
  if(status===529||status===503)return 'השירות של Claude עמוס כרגע. נסה שוב בעוד רגע.';
  if(status>=500)return 'שגיאה זמנית בשירות של Claude. נסה שוב.';
  return raw||'הבקשה ל־Claude נכשלה ('+status+').';
}

async function* sseEvents(body){
  const reader=body.getReader(),decoder=new TextDecoder();let buffer='';
  for(;;){
    const {value,done}=await reader.read();
    buffer+=decoder.decode(value||new Uint8Array(),{stream:!done});
    let index;
    while((index=buffer.search(/\r?\n\r?\n/))>=0){
      const chunk=buffer.slice(0,index);buffer=buffer.slice(index).replace(/^\r?\n\r?\n/,'');
      let event='message',data='';
      for(const line of chunk.split(/\r?\n/)){if(line.startsWith('event:'))event=line.slice(6).trim();else if(line.startsWith('data:'))data+=line.slice(5).trim();}
      if(data)yield {event,data:JSON.parse(data)};
    }
    if(done)return;
  }
}

function buildRequest(settings,{system,messages,tools,maxTokens=32000}){
  // Top-level automatic prompt caching: the static system prompt, tools and history prefix are reused across turns.
  const body={model:settings.model,max_tokens:maxTokens,stream:true,cache_control:{type:'ephemeral'},system,messages};
  if(tools?.length)body.tools=tools;
  const headers={'content-type':'application/json','x-api-key':settings.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
  if(supportsAdaptive(settings.model)){
    body.thinking={type:'adaptive',display:'summarized'};
    body.output_config={effort:settings.effort||'medium'};
    // Route safety-classifier declines to Anthropic's recommended fallback model server-side.
    body.fallbacks='default';
    headers['anthropic-beta']='server-side-fallback-2026-07-01';
  }
  return {url:settings.baseUrl.replace(/\/$/,'')+'/v1/messages',headers,body};
}

// Streams one assistant message and rebuilds its content blocks exactly as sent.
async function streamMessage(settings,request,{onEvent=()=>{},signal,fetchImpl=globalThis.fetch}={}){
  const {url,headers,body}=buildRequest(settings,request);
  let response;
  try{response=await fetchImpl(url,{method:'POST',headers,body:JSON.stringify(body),signal});}
  catch(err){if(err?.name==='AbortError')throw err;throw new AiError('אין חיבור לשירות של Claude. בדוק את החיבור לאינטרנט.',0);}
  if(!response.ok){let parsed=null;try{parsed=await response.json();}catch{}throw new AiError(friendlyError(response.status,parsed),response.status);}
  const message={content:[],stop_reason:null,usage:{}},json=new Map();
  for await (const {event,data} of sseEvents(response.body)){
    if(event==='error'||data.type==='error')throw new AiError(friendlyError(data.error?.type==='overloaded_error'?529:500,data),500);
    if(data.type==='message_start'){message.id=data.message.id;message.model=data.message.model;message.usage={...data.message.usage};}
    else if(data.type==='content_block_start'){
      const block=structuredClone(data.content_block);
      if(block.type==='tool_use'){block.input={};json.set(data.index,'');}
      message.content[data.index]=block;onEvent({type:'block_start',block,index:data.index});
    }
    else if(data.type==='content_block_delta'){
      const block=message.content[data.index],delta=data.delta;
      if(delta.type==='text_delta'){block.text=(block.text||'')+delta.text;onEvent({type:'text',text:delta.text,index:data.index});}
      else if(delta.type==='thinking_delta'){block.thinking=(block.thinking||'')+delta.thinking;onEvent({type:'thinking',text:delta.thinking});}
      else if(delta.type==='signature_delta')block.signature=(block.signature||'')+delta.signature;
      else if(delta.type==='input_json_delta'){json.set(data.index,json.get(data.index)+delta.partial_json);onEvent({type:'tool_input',index:data.index,name:block.name});}
      else if(delta.type==='citations_delta'){block.citations=[...(block.citations||[]),delta.citation];}
    }
    else if(data.type==='content_block_stop'){
      const block=message.content[data.index];
      if(block?.type==='tool_use'){
        const raw=json.get(data.index)||'';
        try{block.input=raw?JSON.parse(raw):{};}catch{block.input={};block.invalidInput=true;}
      }
      onEvent({type:'block_stop',block,index:data.index});
    }
    else if(data.type==='message_delta'){message.stop_reason=data.delta?.stop_reason??message.stop_reason;message.stop_details=data.delta?.stop_details;Object.assign(message.usage,data.usage||{});}
  }
  message.content=message.content.filter(Boolean);
  return message;
}

// Strips client-only markers so blocks go back to the API byte-for-byte as received.
const cleanBlock=b=>{if(b.type!=='tool_use'||!('invalidInput' in b))return b;const {invalidInput,...rest}=b;return rest;};

// Agent loop: stream, run requested tools, send all results back in one user message, repeat.
async function runAgent({settings,messages,system=AI_SYSTEM,tools=AI_TOOLS,ctx,onEvent=()=>{},signal,maxTurns=14,fetchImpl}){
  for(let turn=0;turn<maxTurns;turn++){
    const message=await streamMessage(settings,{system,messages,tools},{onEvent,signal,fetchImpl});
    addUsage(message.usage,settings.model);
    if(message.stop_reason==='refusal')throw new AiError('Claude לא יכול לעזור בבקשה הזו. אפשר לנסח אותה אחרת.',200);
    const toolUses=message.content.filter(b=>b.type==='tool_use');
    if(message.stop_reason==='max_tokens'&&toolUses.length)throw new AiError('התשובה נקטעה לפני שהסתיימה. נסה בקשה ממוקדת יותר.',200);
    messages.push({role:'assistant',content:message.content.map(cleanBlock)});
    onEvent({type:'assistant_message',message});
    if(message.stop_reason==='pause_turn')continue;
    if(message.stop_reason!=='tool_use'||!toolUses.length)return {message,messages,stop:message.stop_reason};
    const results=await Promise.all(toolUses.map(async block=>{
      if(block.invalidInput)return {type:'tool_result',tool_use_id:block.id,is_error:true,content:'INVALID_JSON: the tool input could not be parsed. Please call the tool again with valid JSON.'};
      onEvent({type:'tool_run',block});
      try{
        const result=await executeAiTool(block.name,block.input,{...ctx,toolUseId:block.id});
        onEvent({type:'tool_done',block,result});
        return {type:'tool_result',tool_use_id:block.id,content:JSON.stringify(result)};
      }catch(err){
        if(err?.name==='AbortError')throw err;
        onEvent({type:'tool_done',block,error:err.message});
        return {type:'tool_result',tool_use_id:block.id,is_error:true,content:String(err.message||err)};
      }
    }));
    messages.push({role:'user',content:results});
  }
  throw new AiError('Claude ביצע יותר מדי צעדים בתשובה אחת. נסה לפצל את הבקשה.',200);
}

// ---------- Attachments ----------
const ATTACHMENT_LIMIT=8*1024*1024;
function attachmentBlock(file){
  if(file.kind==='image')return {type:'image',source:{type:'base64',media_type:file.mediaType,data:file.data}};
  if(file.kind==='pdf')return {type:'document',source:{type:'base64',media_type:'application/pdf',data:file.data},title:file.name};
  return {type:'document',source:{type:'text',media_type:'text/plain',data:file.text},title:file.name};
}

// Persisted copy: attachment payloads become placeholders and thinking blocks are dropped,
// so a restored conversation never replays a thinking block whose prefix changed.
function storableConversation(messages){
  return messages.map(m=>{
    if(typeof m.content==='string')return m;
    const content=m.content.filter(b=>!(m.role==='assistant'&&(b.type==='thinking'||b.type==='redacted_thinking'))).map(b=>b.type==='image'||b.type==='document'?{type:'text',text:`[קובץ מצורף${b.title?': '+b.title:''} — התוכן אינו נשמר במכשיר]`}:b);
    return {...m,content:content.length?content:[{type:'text',text:'…'}]};
  });
}

// ---------- Safe Markdown subset for assistant replies ----------
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g,'$1<i>$2</i>').replace(/`([^`]+)`/g,'<code>$1</code>');
function markdownLite(text){
  const lines=String(text||'').replace(/\r/g,'').split('\n'),out=[];let list=null,para=[];
  const flush=()=>{if(para.length){out.push(`<p>${para.map(inline).join('<br>')}</p>`);para=[];}if(list){out.push(`</${list}>`);list=null;}};
  for(let i=0;i<lines.length;i++){
    const line=lines[i],trim=line.trim();
    if(!trim){flush();continue;}
    if(/^\|.*\|$/.test(trim)&&/^\|?\s*:?-{2,}/.test((lines[i+1]||'').trim())){
      flush();const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const header=cells(trim);i++;const rows=[];
      while(i+1<lines.length&&/^\|.*\|$/.test(lines[i+1].trim())){rows.push(cells(lines[++i]));}
      out.push(`<div class="table-wrap ai-table"><table><thead><tr>${header.map(c=>`<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);continue;
    }
    const h=trim.match(/^(#{1,4})\s+(.*)$/);
    if(h){flush();out.push(`<h4>${inline(h[2])}</h4>`);continue;}
    const bullet=trim.match(/^[-*•]\s+(.*)$/),ordered=trim.match(/^\d+[.)]\s+(.*)$/);
    if(bullet||ordered){
      if(para.length){out.push(`<p>${para.map(inline).join('<br>')}</p>`);para=[];}
      const tag=bullet?'ul':'ol';if(list!==tag){if(list)out.push(`</${list}>`);out.push(`<${tag}>`);list=tag;}
      out.push(`<li>${inline((bullet||ordered)[1])}</li>`);continue;
    }
    if(list){out.push(`</${list}>`);list=null;}
    para.push(trim);
  }
  flush();
  return out.join('');
}

function copilotMessages(){

  let list=[];try{list=JSON.parse(localStorage.getItem(AI_CHAT_KEY)||'[]');}catch{}

  while(list.length&&!(list.at(-1).role==='assistant'&&!(list.at(-1).content||[]).some(b=>b.type==='tool_use')))list.pop();

function saveConversation(){

  for(const m of messages){
    if(m.role==='user'){const bubble=userBubble(m);if(bubble){flush();html+=bubble;}}

let liveFrame=0;
function scheduleLive(){
  if(liveFrame)return;
  liveFrame=requestAnimationFrame(()=>{liveFrame=0;const el=document.querySelector('#ai-live'),log=document.querySelector('#ai-log');if(!el||!log)return;const near=log.scrollHeight-log.scrollTop-log.clientHeight<160;el.innerHTML=liveHTML();if(near)log.scrollTop=log.scrollHeight;});
}

// ---------- Talking to Claude ----------
function copilotEvent(ev){
  if(!copilot.live)return;
  if(ev.type==='block_start'){copilot.live.blocks[ev.index]=ev.block;if(ev.block.type==='tool_use')copilot.status=toolLabels[ev.block.name]||'עובד…';scheduleLive();}
  else if(['text','thinking','tool_input','block_stop'].includes(ev.type))scheduleLive();
  else if(ev.type==='assistant_message'){copilot.live={blocks:[]};copilot.status='Claude ממשיך…';refreshCopilot();}
  else if(ev.type==='tool_run'){copilot.status=toolLabels[ev.block.name]||'עובד…';refreshCopilot();}
  else if(ev.type==='tool_done')refreshCopilot();
}
async function sendCopilot(text,files=copilot.attachments){
  text=String(text||'').trim();
  if(copilot.busy){toast('Claude עדיין עונה. אפשר לעצור את התשובה הנוכחית.',true);return;}
  if(!aiReady()){navigate('copilot');toast('כדי לשאול את Claude יש לחבר מפתח API.',true);return;}
  if(!text&&!files.length)return;
  const messages=copilotMessages(),base=messages.length,context=financialContext(data,ui.month),content=[];
  if(context!==copilot.lastContext)content.push({type:'text',text:context});
  for(const f of files)content.push(attachmentBlock(f));
  content.push({type:'text',text:text||'צירפתי מסמך. חלץ ממנו את התנועות והצע להוסיף אותן.'});
  messages.push({role:'user',content});
  Object.assign(copilot,{attachments:[],draft:'',error:null,busy:true,live:{blocks:[]},status:'Claude חושב…',abort:new AbortController()});
  const box=document.querySelector('#ai-input');if(box){box.value='';autosize(box);}
  if(ui.page!=='copilot')navigate('copilot');else refreshCopilot(true);
  try{
    await runAgent({settings:aiSettings(),messages,signal:copilot.abort.signal,onEvent:copilotEvent,ctx:{get data(){return data;},month:ui.month,approve:req=>new Promise(resolve=>{copilot.pending.set(req.id,{request:req,resolve});refreshCopilot();})}});
    copilot.lastContext=context;
  }catch(err){
    messages.splice(base);
    copilot.error=err?.name==='AbortError'?{text:'התשובה נעצרה. השאלה לא נשלחה להמשך.',prompt:text,files,soft:true}:{text:err?.message||'משהו השתבש. נסה שוב.',prompt:text,files};
  }finally{
    for(const p of copilot.pending.values())p.resolve({approved:false});
    copilot.pending.clear();
    Object.assign(copilot,{busy:false,live:null,abort:null,status:''});
    saveConversation();refreshCopilot(true);
    if(ui.page!=='copilot'&&!copilot.error)toast('Claude סיים לענות — התשובה מחכה לך במסך אופק AI');
  }
}
function resolveProposal(id,approved){
  const p=copilot.pending.get(id);if(!p)return;
  if(approved){
    const rows=[...document.querySelectorAll(`[data-ai-row="${CSS.escape(id)}"]`)],selected=rows.length?rows.filter(r=>r.checked).map(r=>+r.value):null;
    const saved=applyProposal(p.request,selected);
    copilot.pending.delete(id);p.resolve({approved:true,saved});
  }else{copilot.pending.delete(id);p.resolve({approved:false});}
  refreshCopilot();
}
function applyProposal(req,selected){
  const next=structuredClone(data);
  if(req.kind==='transactions'){
    const items=req.items.filter((_,i)=>!selected||selected.includes(i));
    if(!items.length)throw Error('לא נבחרו תנועות לשמירה. אפשר לסמן שורות או ללחוץ ״לא תודה״.');
    for(const t of items){if(!next.categories.includes(t.category))next.categories.push(t.category);const tx={...t,id:uid(),fx:next.fx};applyTransaction(next,tx);next.transactions.push(tx);}
    commit(next,`${items.length} תנועות נוספו בעזרת Claude`);return items.length;
  }
  if(req.kind==='budget'){
    if(!next.categories.includes(req.category))next.categories.push(req.category);
    const existing=next.budgets.find(b=>b.category===req.category);
    if(existing)existing.limit=req.limit;else next.budgets.push({id:uid(),category:req.category,limit:req.limit});
    commit(next,`התקציב ל${req.category} נשמר`);return 1;
  }
  if(req.kind==='holdings'){const chosen=req.items.filter((_,i)=>!selected||selected.includes(i));if(ui.page==='monthly')captureMonthly();initMonthly();for(const x of chosen)ui.monthly.values[x.assetId]=x.next;if(req.fx)ui.monthly.fx=req.fx;if(req.date)ui.monthly.date=req.date;ui.monthly.imported=chosen.map(x=>x.assetId);toast(`${chosen.length} נכסים הועברו לעדכון החודשי — בדוק ושמור תמונת מצב`);return chosen.length;}
  if(req.kind==='split'){const g=(next.groups||[]).find(x=>x.id===req.groupId);if(!g)throw Error('הקבוצה כבר לא קיימת.');g.expenses.push({id:uid(),...req.expense});commit(next,`ההוצאה נוספה לקבוצה ״${g.name}״`);return 1;}
  if(req.kind==='bill'){next.bills=[...(next.bills||[]),{id:uid(),...req.bill}];commit(next,`״${req.bill.name}״ נוסף ללוח התשלומים`);return 1;}
  if(req.kind==='wish'){next.wishlist=[...(next.wishlist||[]),{id:uid(),...req.item,added:today(),status:'waiting'}];commit(next,`״${req.item.name}״ נוסף לרשימת המשאלות`);return 1;}
  next.goals.push({id:uid(),...req.goal});commit(next,`תוכנית החיסכון ״${req.goal.name}״ נוספה`);return 1;
}

// ---------- Attachments & voice ----------
const fileToBase64=blob=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=()=>reject(Error('קריאת הקובץ נכשלה.'));r.readAsDataURL(blob);});
async function imagePayload(file){
  const supported=['image/jpeg','image/png','image/webp','image/gif'];
  try{
    const bitmap=await createImageBitmap(file),scale=Math.min(1,1568/Math.max(bitmap.width,bitmap.height));
    if(scale<1||!supported.includes(file.type)){
      const canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);
      canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);
      const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.88));
      return {mediaType:'image/jpeg',data:await fileToBase64(blob)};
    }
  }catch{if(!supported.includes(file.type))throw Error('לא ניתן לקרוא את התמונה. נסה JPG או PNG.');}
  return {mediaType:file.type,data:await fileToBase64(file)};
}
async function readAttachment(file){
  const name=file.name||'קובץ',type=file.type||'';
  if(file.size>ATTACHMENT_LIMIT)throw Error(`הקובץ ${name} גדול מ־8MB.`);
  if(type.startsWith('image/'))return {kind:'image',name,...await imagePayload(file)};
  if(type==='application/pdf'||/\.pdf$/i.test(name))return {kind:'pdf',name,data:await fileToBase64(file)};
  if(type.startsWith('text/')||/\.(csv|tsv|txt|json)$/i.test(name)){const text=await file.text();if(text.length>400000)throw Error(`הקובץ ${name} ארוך מדי. אפשר לפצל אותו לכמה קבצים.`);return {kind:'text',name,text};}
  throw Error(`סוג הקובץ ${name} אינו נתמך. אפשר לצרף תמונה, PDF, CSV או טקסט.`);
}
async function addAttachments(list){
  const files=[...list];
  if(copilot.attachments.length+files.length>5)toast('אפשר לצרף עד 5 קבצים להודעה.',true);
  for(const file of files.slice(0,5-copilot.attachments.length)){try{copilot.attachments.push(await readAttachment(file));}catch(err){toast(err.message,true);}}
  const el=document.querySelector('#ai-attachments');if(el)el.innerHTML=attachmentsHTML();
  document.querySelector('#ai-input')?.focus();
}
let voice=null;
function toggleVoice(targetId,button){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('הדפדפן הזה אינו תומך בהקלטה קולית.',true);return;}
  if(voice){voice.stop();return;}
  const el=document.getElementById(targetId);if(!el)return;
  const base=el.value?el.value.trim()+' ':'';
  voice=new SR();voice.lang='he-IL';voice.interimResults=true;voice.continuous=false;
  voice.onresult=ev=>{el.value=base+[...ev.results].map(r=>r[0].transcript).join('');el.dispatchEvent(new Event('input',{bubbles:true}));};
  voice.onerror=ev=>{if(!['aborted','no-speech'].includes(ev.error))toast('ההקלטה נכשלה. בדוק הרשאת מיקרופון.',true);};
  voice.onend=()=>{voice=null;document.querySelectorAll('.listening').forEach(b=>b.classList.remove('listening'));};
  voice.start();button?.classList.add('listening');
}
function autosize(el){el.style.height='auto';el.style.height=Math.min(180,el.scrollHeight)+'px';}

async function writeLetter(){
  if(letterState.busy)return;
  const month=ui.month;Object.assign(letterState,{month,text:'',busy:true,error:null,abort:new AbortController()});render();
  const update=()=>{const el=document.querySelector('#ai-letter');if(el&&ui.month===month)el.innerHTML=letterBody();};
  const messages=[{role:'user',content:[{type:'text',text:financialContext(data,month)},{type:'text',text:`כתוב לי "מכתב חודשי" אישי על ${monthLabel(month)} (${month}). קודם בדוק בעזרת הכלים: השוואה לחודשים קודמים, תקציבים, חיובים חוזרים, חריגות, התקדמות ביעדים ובהשקעות. מבנה: שורת פתיחה חמה ואישית, ### מה הלך טוב, ### למה כדאי לשים לב, ### שלושה צעדים לחודש הבא (ממוספרים, עם סכומים). עד 260 מילים, בלי גרפים ובלי הקדמות על הבדיקות שעשית.`}]}];
  try{
    const r=await runAgent({settings:aiSettings(),messages,tools:AI_TOOLS.filter(t=>!t.name.startsWith('propose_')&&t.name!=='render_chart'),signal:letterState.abort.signal,ctx:{get data(){return data;},month,approve:async()=>({approved:false})},onEvent:ev=>{if(ev.type==='block_start'&&ev.block.type==='text'&&letterState.text)letterState.text+='\n\n';if(ev.type==='text'){letterState.text+=ev.text;update();}if(ev.type==='assistant_message'&&ev.message.stop_reason==='tool_use'){letterState.text='';update();}}});
    const text=r.message.content.filter(b=>b.type==='text').map(b=>b.text).join('\n\n').trim();
    if(!text)throw Error('Claude לא החזיר מכתב. נסה שוב.');
    const all=storedLetters();all[month]={text,date:new Date().toISOString()};try{localStorage.setItem(AI_LETTERS_KEY,JSON.stringify(all));}catch{}
  }catch(err){letterState.error=err?.name==='AbortError'?'הכתיבה נעצרה.':err.message;}
  finally{letterState.busy=false;letterState.abort=null;render();}
}

});

function saveSplitExpense(form){
  const g=currentGroup();if(!g)throw Error('הקבוצה לא נמצאה.');
  const f=new FormData(form),id=form.dataset.id,amount=Math.round(Number(f.get('amount'))*100)/100,description=String(f.get('description')||'').trim(),date=String(f.get('date')||''),paidBy=String(f.get('paidBy')||'');
  if(!description)throw Error('יש לתאר את ההוצאה.');
  if(!(amount>0))throw Error('יש להזין סכום חיובי.');
  if(!validDate(date)||date>today())throw Error('יש לבחור תאריך שאינו בעתיד.');
  const chosen=g.members.filter(m=>f.get('p_'+m.id)==='on').map(m=>m.id);
  if(!chosen.length)throw Error('יש לבחור לפחות משתתף אחד.');
  const typed=chosen.map(mid=>String(f.get('s_'+mid)||'').trim());
  let expense={id:id||uid(),description,amount,paidBy,date};
  if(typed.some(Boolean)){
    if(typed.some(v=>v===''))throw Error('בחלוקה מדויקת יש למלא סכום לכל משתתף מסומן.');
    const shares=Object.fromEntries(chosen.map((mid,i)=>[mid,Math.round(Number(typed[i])*100)/100]));
    if(Object.values(shares).some(v=>!(v>=0)))throw Error('סכומי החלוקה צריכים להיות חיוביים.');
    const total=Object.values(shares).reduce((s,v)=>s+v,0);
    if(Math.abs(total-amount)>.01)throw Error(`סכומי החלוקה (${money(total,'ILS',2)}) צריכים להסתכם ב־${money(amount,'ILS',2)}.`);
    expense={...expense,split:'exact',shares};
  }else if(chosen.length<g.members.length)expense.participants=chosen;
  const me=g.members.find(m=>m.me),record=f.get('record')==='on'&&me&&chosen.includes(me.id);
  mutate(next=>{
    const group=next.groups.find(x=>x.id===g.id),i=group.expenses.findIndex(v=>v.id===expense.id);
    if(i>=0)group.expenses[i]=expense;else group.expenses.push(expense);
    if(record){
      const accountId=String(f.get('accountId')||''),share=Math.round(expenseShares(group,expense)[me.id]*100)/100,category=String(f.get('category')||'בילויים');
      if(!accountId)throw Error('יש לבחור חשבון.');
      if(share>0){const t={id:uid(),type:'expense',amount:share,currency:'ILS',fx:next.fx,date,category,subcategory:'',accountId,description:`${description} · ${group.name}`,tags:['חלוקת הוצאות'],recurring:false};applyTransaction(next,t);next.transactions.push(t);}
    }
  },id?'ההוצאה עודכנה':record?'ההוצאה נוספה, והחלק שלך נרשם בתנועות':'ההוצאה נוספה לקבוצה');
  closeDialog();
}
function splitShareText(g){
  const s=groupSummary(g),name=id=>{const m=g.members.find(x=>x.id===id);return m?.me?(data.profile||'אני'):m?.name||'';};
  return [`${g.name} — סיכום הוצאות`,`סה״כ ${money(s.total)}`,'',...[...g.expenses].sort((a,b)=>a.date.localeCompare(b.date)).slice(-25).map(x=>`• ${x.description}: ${exact(x.amount)} (שילם/ה ${name(x.paidBy)})`),'',s.transfers.length?'כדי לסגור חשבון:':'הכול מאוזן 🎉',...s.transfers.map(t=>`${name(t.from)} מעביר/ה ל${name(t.to)} ${exact(t.amount)}`),'','נשלח מאופק'].join('\n');
}
function openShareDialog(g){
  const text=splitShareText(g);
  showDialog('שיתוף סיכום הקבוצה',`<textarea id="share-text" class="share-text" rows="10" readonly>${e(text)}</textarea><div class="form-actions">${btn('העתקה','share-copy','Download','primary')}<a class="button" href="https://wa.me/?text=${encodeURIComponent(text)}" target="_blank" rel="noopener noreferrer">${icon('Send',17)}<span>שליחה בוואטסאפ</span></a>${btn('סגירה','dialog-close')}</div>`);
}

function saveWishForm(form){
  const f=new FormData(form),name=String(f.get('name')||'').trim(),price=Number(f.get('price')),coolDays=Math.round(Number(f.get('coolDays'))),url=String(f.get('url')||'').trim();

  if(!(coolDays>=0&&coolDays<=365))throw Error('ימי הצינון צריכים להיות בין 0 ל־365.');
  if(url&&!/^https?:\/\//i.test(url))throw Error('הקישור צריך להתחיל ב־https://');

}

// Splitting account balances between savings goals ("envelopes") and the free-money view.

function allocationAccounts(){

}
function allocationCard(){

  }).join('');

function allocSummary(balance,total){
  const free=balance-total,over=free<-.005;
  return `<div class="row-between"><span>הוקצה ליעדים</span><b dir="ltr">${money(total)}</b></div><div class="row-between"><span>${over?'חריגה מהיתרה':'נשאר כסף פנוי'}</span><b dir="ltr" class="${over?'negative':'positive'}">${money(Math.abs(free))}</b></div>${progress(balance?Math.min(100,total/balance*100):0,over?'red':'')}`;

function openAllocation(accountId){
  const info=accountAllocations(data,accountId);if(!info)return;
  if(!data.goals.length){toast('אין עדיין יעדים לחלוקה. צור תוכנית חיסכון קודם.',true);return;}
  const rows=data.goals.map(g=>({g,value:g.accountId===accountId?Math.round((info.shares.get(g.id)||0)*100)/100:'',other:g.accountId&&g.accountId!==accountId?data.accounts.find(a=>a.id===g.accountId)?.name||'':''}));
  const total=rows.reduce((s,r)=>s+(Number(r.value)||0),0);
  showDialog(`חלוקת ״${info.account.name}״ בין היעדים`,`<form id="alloc-form" data-account="${e(accountId)}" data-balance="${info.balance}"><div class="form-error"></div><p class="confirm-text">יתרה של <b dir="ltr">${money(info.balance)}</b>. קבע כמה מתוכה שייך לכל יעד — מה שלא יוקצה יישאר כסף פנוי.</p><div class="alloc-inputs">${rows.map(({g,value,other})=>`<label class="alloc-input"><i style="background:${goalColor(g)}"></i><span><b>${e(g.name)}</b><small>${other?`כרגע מקושר ל״${e(other)}״ — הקצאה כאן תעביר אותו`:g.target?`סכום היעד: ${money(g.target)}`:'ללא סכום יעד'}</small></span><input type="number" min="0" step="any" name="g_${e(g.id)}" value="${e(value)}" placeholder="0" data-alloc aria-label="הקצאה ל${e(g.name)}"></label>`).join('')}</div><div id="alloc-summary" class="alloc-summary">${allocSummary(info.balance,total)}</div><div class="form-actions">${submit('שמירת החלוקה')}${btn('חלוקה אוטומטית','alloc-auto','Sparkles')}${btn('ביטול','dialog-close')}</div></form>`,true);
}
function refreshAllocSummary(form){
  const total=[...form.querySelectorAll('[data-alloc]')].reduce((s,el)=>s+(Number(el.value)||0),0),box=form.querySelector('#alloc-summary');
  if(box)box.innerHTML=allocSummary(Number(form.dataset.balance),total);
}
// Emergency fund first, then the nearest goals, each up to its target.
function autoAllocate(form){
  let left=Number(form.dataset.balance);
  const order=[...data.goals].sort((a,b)=>(b.type==='קרן חירום')-(a.type==='קרן חירום')||a.date.localeCompare(b.date));
  for(const g of order){
    const box=form.querySelector(`[name="g_${CSS.escape(g.id)}"]`);if(!box)continue;
    const want=Number(g.target)>0?Number(g.target):0,give=Math.max(0,Math.min(want,left));
    box.value=give?Math.round(give*100)/100:'';left-=give;
  }
  refreshAllocSummary(form);
}
function saveAllocation(form){
  const accountId=form.dataset.account,info=accountAllocations(data,accountId),values=new Map();
  for(const g of data.goals){const raw=String(new FormData(form).get('g_'+g.id)||'').trim();const v=raw===''?0:Number(raw);if(!(v>=0))throw Error(`הסכום ל״${g.name}״ אינו תקין.`);values.set(g.id,Math.round(v*100)/100);}
  const total=[...values.values()].reduce((s,v)=>s+v,0);
  if(total>info.balance+.005)throw Error(`הקצית ${money(total)}, אבל ביתרה יש ${money(info.balance)}. הקטן את אחד הסכומים.`);
  mutate(next=>{
    for(const g of next.goals){
      const v=values.get(g.id)||0;
      if(v>0){g.accountId=accountId;g.allocation=v;}
      else if(g.accountId===accountId){g.saved=Math.round((info.shares.get(g.id)||0)*100)/100;g.accountId='';g.allocation=null;}
    }
  },`החלוקה של ״${info.account.name}״ נשמרה`);
  closeDialog();
}
function goalAllocationHint(v){
  const others={...data,goals:data.goals.filter(g=>g.id!==v.id)},info=accountAllocations(others,v.accountId);
  return info?`יתרת החשבון ${money(info.balance)} · ${money(Math.max(0,info.balance-info.requested))} עדיין לא הוקצו ליעדים אחרים`:'';
}

document.addEventListener('click',event=>{
  const button=event.target.closest('[data-action]');if(!button)return;
  const [action,a]=button.dataset.action.split(':');
  try{
    if(action==='alloc')openAllocation(a);
    else if(action==='alloc-auto'){const form=document.querySelector('#alloc-form');if(form)autoAllocate(form);}

async function decodeText(bytes){
  const utf8=new TextDecoder('utf-8').decode(bytes);
  if(!utf8.includes('�'))return utf8;
  try{return new TextDecoder('windows-1255').decode(bytes);}catch{return utf8;}
}
async function handleCaptureFile(file){
  const st=captureState();st.error=null;
  try{
    const name=file.name||'קובץ',type=file.type||'';

}
