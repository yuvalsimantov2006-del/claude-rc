  letter-spacing: var(--tracking-tight); font-variant-numeric: tabular-nums; color: var(--text);
}
html.privacy main .big-number, html.privacy main .wish-price, html.privacy main .plan-number { filter: blur(7px); transition: filter var(--dur-fast) var(--ease-out); }
html.privacy main :is(.scn-results td small, .split-card .badge) { filter: blur(6px); }
html.privacy main :is(.scn-results td small, .split-card .badge):hover { filter: none; }
html.privacy main .big-number:hover, html.privacy main .wish-price:hover, html.privacy main .plan-number:hover { filter: none; }

/* ============================================================
   Future lab — what-if simulator
   ============================================================ */
.scn-layout { display: grid; grid-template-columns: minmax(360px, 420px) minmax(0, 1fr); gap: var(--gap-grid); align-items: start; }
.scn-side { min-width: 0; display: flex; flex-direction: column; gap: var(--gap-grid); }
.scn-card { display: flex; flex-direction: column; gap: var(--sp-4); }
.scn-card > .section-head { margin-block-end: 0; }
.scn-card > .button { align-self: stretch; }
.scn-presets { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.scn-events { display: flex; flex-direction: column; gap: var(--sp-3); }
.scn-events:empty { display: none; }
.scn-event {
  display: flex; flex-direction: column; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4) var(--sp-4);
  border-radius: var(--r-md); background: var(--surface-2);
  border: 1px solid var(--border);
}
.scn-event > .row-between { gap: var(--sp-2); }
.scn-event input.scn-name {
  flex: 1 1 auto; min-height: 38px; padding-inline: var(--sp-3);
  font-weight: var(--fw-bold); background-color: var(--surface);
}
.scn-type {
  flex: none; padding: 3px var(--sp-2); border-radius: var(--r-pill);
  background: var(--accent-2-soft); color: var(--accent-2);
  font-size: var(--fs-micro); font-weight: var(--fw-bold); white-space: nowrap;
}
.scn-event .icon-button { flex: none; width: 36px; height: 36px; }
.scn-event .icon-button:hover { color: var(--negative); background: var(--negative-soft); }
.scn-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-3); }
.scn-fields .field > span { font-size: var(--fs-micro); }
.scn-fields input, .scn-fields select { background-color: var(--surface); }
.scn-settings { padding-block-start: var(--sp-4); border-block-start: 1px solid var(--border); gap: var(--sp-3); align-items: end; }
.scn-results { display: flex; flex-direction: column; gap: var(--gap-grid); min-width: 0; }
.scn-results td small, .scn-results td b { display: block; }
.scn-results td small { margin-block-start: 2px; }
.scn-results .metric-detail .positive, .scn-results .metric-detail .negative { font-weight: var(--fw-bold); }

/* ============================================================
   Future lab — market simulation
   ============================================================ */
.lab-intro {
  position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-6);
  padding: var(--sp-6) var(--sp-8); border-radius: var(--r-xl);
  border: 1px solid var(--border);
  background:
    radial-gradient(70% 140% at 100% 0%, var(--accent-soft), transparent 70%),
    radial-gradient(60% 140% at 0% 100%, var(--accent-2-soft), transparent 70%),
    var(--card-bg);
  box-shadow: var(--shadow-2), var(--inner-highlight);
}
.lab-intro > div { min-width: 0; max-width: 720px; }
.lab-intro h2 { margin-block: var(--sp-2) var(--sp-1); font-size: 24px; font-weight: var(--fw-black); line-height: 1.25; letter-spacing: var(--tracking-tight); }
.lab-intro p { font-size: var(--fs-body); color: var(--text-muted); }
.lab-intro > .button { flex: none; }
.lab-layout { display: grid; grid-template-columns: minmax(300px, 360px) minmax(0, 1fr); gap: var(--gap-grid); align-items: start; }
.lab-controls { display: flex; flex-direction: column; gap: var(--sp-4); }
.lab-controls > .lab-slider:first-of-type { padding-block-start: var(--sp-4); border-block-start: 1px solid var(--border); }
.lab-controls-card > .section-head { margin-block-end: var(--sp-4); }
.fan-chart .chart-goal { font-weight: var(--fw-bold); }
.lab-results { display: flex; flex-direction: column; gap: var(--gap-grid); min-width: 0; }
.lab-chart .chart { margin-block-start: var(--sp-2); }
.lab-chart .chart-footer { justify-content: flex-start; }
.fire { margin-block-end: var(--sp-3); }
.fire + .progress { height: 10px; }
.fire ~ .actions { margin-block-start: var(--sp-4); }
#lab-whatif { margin-block-start: var(--sp-4); }
.whatif-result {
  padding: var(--sp-1) var(--sp-4); border-radius: var(--r-md);
  background: var(--surface-2); border: 1px solid var(--border);
}
.whatif-result + p { margin-block-start: var(--sp-2); }
.form-grid:has(> .lab-slider) > .field { grid-column: 1 / -1; }
.form-grid > .lab-slider { align-self: end; }

/* ============================================================
   Smart purchase + wishlist
   ============================================================ */
.buy-layout { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(260px, 1fr); gap: var(--gap-grid); align-items: start; }
.buy-card { display: flex; flex-direction: column; gap: var(--sp-4); }
.buy-card > .section-head { margin-block-end: 0; }
.buy-form { display: flex; flex-direction: column; gap: var(--sp-4); }
.buy-form .field input[name="price"] { font-family: var(--font-num); font-weight: var(--fw-bold); }
#buy-result { display: flex; flex-direction: column; gap: var(--sp-4); }
.buy-placeholder {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-4) var(--sp-5); border-radius: var(--r-md);
  border: 1.5px dashed var(--border-strong); background: var(--surface-2);
  color: var(--text-muted); font-size: var(--fs-small); line-height: 1.55;
}
.buy-placeholder > svg { flex: none; color: var(--accent-text); }
.verdict {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-4); border-radius: var(--r-md); border: 1px solid transparent;
}
.verdict > .asset-icon { flex: none; width: 44px; height: 44px; border-radius: var(--r-md); background: var(--surface); }
.verdict > div { min-width: 0; }
.verdict b { display: block; font-size: 17px; font-weight: var(--fw-black); }
.verdict small { display: block; margin-block-start: 2px; font-size: var(--fs-small); line-height: 1.55; color: var(--text-muted); }
.verdict.green  { background: var(--positive-soft); border-color: color-mix(in srgb, var(--positive) 22%, transparent); }
.verdict.green b { color: var(--positive); }
.verdict.yellow { background: var(--warning-soft);  border-color: color-mix(in srgb, var(--warning) 24%, transparent); }
.verdict.yellow b { color: var(--warning); }
.verdict.red    { background: var(--negative-soft); border-color: color-mix(in srgb, var(--negative) 22%, transparent); }
.verdict.red b { color: var(--negative); }
.buy-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-3); }
.buy-facts > div {
  display: flex; flex-direction: column; gap: 2px; min-width: 0;
  padding: var(--sp-3); border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--border);
}
.buy-facts span { font-size: var(--fs-micro); font-weight: var(--fw-semibold); color: var(--text-muted); }
.buy-facts b { font-family: var(--font-num); font-size: var(--fs-num-md); font-weight: var(--fw-black); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.buy-facts small { font-size: var(--fs-micro); line-height: 1.4; color: var(--text-subtle); }
#buy-result > .actions { margin-block-start: 0; }

.wish-stats { display: flex; flex-direction: column; gap: var(--gap-grid); min-width: 0; }
.wish-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--gap-grid); }
.wish-card { display: flex; flex-direction: column; gap: var(--sp-2); }
.wish-card > .row-between { margin-block-end: var(--sp-1); }
.wish-card h3 { font-size: 16px; font-weight: var(--fw-bold); line-height: 1.35; overflow-wrap: anywhere; }
.wish-price {
  width: fit-content; font-family: var(--font-num); font-size: 26px; font-weight: var(--fw-black);
  letter-spacing: var(--tracking-tight); font-variant-numeric: tabular-nums; line-height: 1.2;
}
.wish-card > p { overflow-wrap: anywhere; }
.wish-card > .text-button { align-self: flex-start; }
.cooling { display: flex; flex-direction: column; gap: 6px; margin-block-start: var(--sp-1); }
.cooling small { font-size: var(--fs-micro); color: var(--text-muted); line-height: 1.45; }
.wish-actions {
  display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-2);
  margin-block-start: auto; padding-block-start: var(--sp-3); border-block-start: 1px solid var(--border);
}
.wish-actions .button { min-height: 36px; padding-inline: var(--sp-3); }
.wish-actions .icon-button { width: 36px; height: 36px; }
.wish-actions .icon-button:first-of-type { margin-inline-start: auto; }
.wish-actions .icon-button:last-child:hover { color: var(--negative); background: var(--negative-soft); }
.wish-card.waiting .wish-price { color: var(--text); }
.wish-card.skipped, .wish-card.bought { background: var(--surface-2); box-shadow: none; }
.wish-card.skipped h3, .wish-card.bought h3, .wish-card.bought .wish-price { color: var(--text-muted); }
.wish-card.skipped .wish-price { color: var(--positive); }

/* ============================================================
   Split expenses — groups list
   ============================================================ */
.split-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: var(--gap-grid); }
.split-card {
  display: flex; flex-direction: column; gap: var(--sp-3); width: 100%;
  text-align: start; font: inherit; color: inherit; cursor: pointer;
  transition: transform var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
}
.split-card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 40%, var(--border)); box-shadow: var(--shadow-3); }
.split-card:active { transform: none; }
.split-card:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.split-card h3 { font-size: 17px; font-weight: var(--fw-bold); line-height: 1.35; overflow-wrap: anywhere; }
.group-avatar {
  --tone: var(--chart-1); --tone-soft: var(--chart-1-soft);
  display: grid; place-items: center; flex: none; width: 44px; height: 44px; border-radius: var(--r-md);
  background: var(--tone-soft);
  /* a touch of text colour keeps the lighter hues (sky, amber) readable on their soft tint in both themes */
  color: color-mix(in srgb, var(--tone) 72%, var(--text));
  font-size: 19px; font-weight: var(--fw-black); line-height: 1;
}
/* data-tone is stable per group (1-6 → chart tokens) */
.group-avatar[data-tone="2"] { --tone: var(--chart-2); --tone-soft: var(--chart-2-soft); }
.group-avatar[data-tone="3"] { --tone: var(--chart-3); --tone-soft: var(--chart-3-soft); }
.group-avatar[data-tone="4"] { --tone: var(--chart-4); --tone-soft: var(--chart-4-soft); }
.group-avatar[data-tone="5"] { --tone: var(--chart-5); --tone-soft: var(--chart-5-soft); }
.group-avatar[data-tone="6"] { --tone: var(--chart-6); --tone-soft: var(--chart-6-soft); }
.member-row { display: flex; align-items: center; padding-inline-start: 6px; }
.member-dot {
  display: grid; place-items: center; flex: none; width: 32px; height: 32px; margin-inline-start: -6px;
  border-radius: 50%; border: 2px solid var(--surface);
  background: var(--surface-3); color: var(--text-muted);
  font-size: var(--fs-micro); font-weight: var(--fw-bold);
}
.split-card-foot {
  display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-3);
  margin-block-start: auto; padding-block-start: var(--sp-3); border-block-start: 1px solid var(--border);
  font-size: var(--fs-small); color: var(--text-muted);
}
.split-card-foot b { font-size: var(--fs-num-md); font-weight: var(--fw-black); color: var(--text); }

/* ---------- Group detail ---------- */
.group-head { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-3) var(--sp-4); }
.group-head .back { order: -1; flex: 0 0 100%; justify-content: flex-start; min-height: 32px; }
.group-head .back svg { order: -1; }
.group-title { display: flex; align-items: center; gap: var(--sp-3); flex: 1 1 260px; min-width: 0; }
.group-title .group-avatar { width: 52px; height: 52px; border-radius: 16px; font-size: 22px; background: var(--brand-gradient); color: var(--on-hero); box-shadow: var(--shadow-1); }
.group-title > div { min-width: 0; }
.group-title h2 { font-size: var(--fs-h1); font-weight: var(--fw-black); line-height: 1.2; letter-spacing: var(--tracking-tight); overflow-wrap: anywhere; }
.group-title p { margin-block-start: 2px; font-size: var(--fs-small); }
.group-head > .actions { flex: none; }
.split-layout { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr); gap: var(--gap-grid); align-items: start; }
.split-side { display: flex; flex-direction: column; gap: var(--gap-grid); min-width: 0; }
.split-expenses td b, .split-expenses td small { display: block; }
.split-expenses td small { margin-block-start: 2px; font-size: var(--fs-micro); }
.split-expenses td:nth-child(3) { white-space: normal; min-width: 90px; }
/* Edit / delete: quiet round icon buttons; delete turns red on hover */
.split-expenses .table-actions { gap: 2px; }
.split-expenses .table-actions .icon-button {
  width: 36px; height: 36px; min-height: 0; padding: 0; border-radius: var(--r-pill); color: var(--text-muted);
}
.split-expenses .table-actions .icon-button svg { width: 17px; height: 17px; }
.split-expenses .table-actions .icon-button:hover { background: var(--hover); color: var(--accent-text); }
.split-expenses .table-actions .icon-button:last-child:hover { background: var(--negative-soft); color: var(--negative); }
.balances { display: flex; flex-direction: column; gap: var(--sp-3); }
.balance-row {
  display: grid; grid-template-columns: minmax(56px, 84px) minmax(0, 1fr) auto; align-items: center; gap: var(--sp-3);
  font-size: var(--fs-small);
}
.balance-row > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: var(--fw-semibold); }
.balance-row > b { justify-self: end; min-width: 76px; text-align: end; font-weight: var(--fw-bold); }
.balance-bar { position: relative; height: 10px; border-radius: var(--r-pill); background: var(--track); }
.balance-bar::after {
  content: ""; position: absolute; inset-inline-start: 50%; inset-block: -4px; width: 2px; margin-inline-start: -1px;
  border-radius: 1px; background: var(--chart-zero);
}
.balance-bar > span { position: absolute; inset-block: 0; min-width: 0; }
.balance-bar > .pos { inset-inline-start: 50%; border-start-end-radius: var(--r-pill); border-end-end-radius: var(--r-pill); background: var(--positive-vivid); }
.balance-bar > .neg { inset-inline-end: 50%; border-start-start-radius: var(--r-pill); border-end-start-radius: var(--r-pill); background: var(--negative-vivid); }
.transfers { display: flex; flex-direction: column; gap: var(--sp-2); }
.transfer {
  display: flex; align-items: center; flex-wrap: wrap; gap: 6px var(--sp-2);
  padding: var(--sp-3); border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--border);
  font-size: var(--fs-small);
}
.transfer > svg { flex: none; color: var(--accent-text); }
.transfer > b:nth-of-type(2) { margin-inline-end: auto; }
.transfer > span { font-size: var(--fs-num-sm); font-weight: var(--fw-black); }
.transfer .pay-button { flex: none; }
.settled { margin-block-start: var(--sp-4); padding-block-start: var(--sp-3); border-block-start: 1px solid var(--border); font-size: var(--fs-small); color: var(--text-muted); }
.settled summary { cursor: pointer; min-height: 32px; display: flex; align-items: center; font-weight: var(--fw-semibold); color: var(--accent-text); }
.settled > div { display: flex; align-items: baseline; gap: var(--sp-3); padding-block: 6px; }
.settled > div + div { border-block-start: 1px dashed var(--border); }
.settled > div span { flex: 1; min-width: 0; }
.settled > div b { color: var(--text); }
.settled > div small { font-size: var(--fs-micro); color: var(--text-subtle); }
.danger-zone { display: flex; justify-content: flex-start; padding-block-start: var(--sp-2); }

/* ---------- Split dialogs ---------- */
.share-rows { display: flex; flex-direction: column; gap: var(--sp-2); }
.share-row {
  display: grid; grid-template-columns: auto minmax(0, 1fr) 140px; align-items: center; gap: var(--sp-3);
  padding: 6px var(--sp-3); border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--border);
  font-size: var(--fs-small); font-weight: var(--fw-semibold); cursor: pointer;
}
.share-row > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.share-row input[type="number"] { min-height: 38px; background-color: var(--surface); }
.member-chips { display: flex; flex-wrap: wrap; gap: 6px; }
textarea.share-text { min-height: 220px; font-size: var(--fs-small); line-height: 1.7; background-color: var(--surface-2); }

/* ============================================================
   Calculators
   ============================================================ */
.tool-layout { display: grid; grid-template-columns: minmax(400px, 460px) minmax(0, 1fr); gap: var(--gap-grid); align-items: start; }
.tool-inputs { min-width: 0; }
.tool-inputs .section-head > .actions { flex-wrap: wrap; }
.tool-inputs .section-head .button { min-height: 34px; padding-inline: var(--sp-3); font-size: var(--fs-micro); }
.tool-fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-4) var(--sp-3); align-items: start; }
.tool-fields > .check-field { align-self: start; min-height: var(--control-h); margin-block-start: 25px; }
.tool-fields > .field:has(.cat-checks) { grid-column: 1 / -1; }
.tool-output { display: flex; flex-direction: column; gap: var(--gap-grid); min-width: 0; }
.tool-output > .notice.error { padding: var(--sp-4); }
.tool-output > .two-columns:has(.goal-details) { grid-template-columns: minmax(0, 1fr); }
.tool-output .goal-details { grid-template-columns: repeat(auto-fill, minmax(min(100%, 140px), 1fr)); }
:is(.scn-results, .lab-results, .tool-output) .three-metrics .metric-value { font-size: 24px; white-space: nowrap; }

/* Salary */
.salary-result { display: flex; flex-direction: column; gap: var(--sp-2); }
.salary-result > .eyebrow { margin-block-end: 0; }
.salary-result > p { font-size: var(--fs-small); }
.stack-bar {
  display: flex; gap: 2px; height: 16px; margin-block: var(--sp-3) var(--sp-2);
  border-radius: var(--r-pill); overflow: hidden; background: var(--track);
}
.stack-bar > span { height: 100%; min-width: 3px; }
.breakdown { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-2); }
.breakdown > div {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: baseline; gap: 2px var(--sp-2);
  padding: var(--sp-2) var(--sp-3); border-radius: var(--r-sm); background: var(--surface-2);
  font-size: var(--fs-small);
}
.breakdown span { display: inline-flex; align-items: center; gap: 6px; min-width: 0; color: var(--text-muted); font-weight: var(--fw-semibold); }
.breakdown i { flex: none; display: inline-block; width: 10px; height: 10px; border-radius: 3px; }
.breakdown b { font-weight: var(--fw-bold); }
.breakdown small { grid-column: 1 / -1; font-size: var(--fs-micro); color: var(--text-subtle); font-variant-numeric: tabular-nums; }
.tool-output .goal-details b { width: fit-content; max-width: 100%; font-variant-numeric: tabular-nums; }
/* Table amounts: the ltr cell's end edge lines up with the start-aligned header */
:is(.tool-output, .scn-results, .split-layout) td[dir="ltr"],
.page-content:has(> .insights-intro) > section.card td[dir="ltr"] { text-align: end; font-variant-numeric: tabular-nums; }
:is(.tool-output, .scn-results, .split-layout) td > :is(b, span)[dir="ltr"] { display: block; width: fit-content; }
.tool-output .large-number { width: fit-content; color: var(--accent-text); }
.tool-output .large-number + p { margin-block-start: var(--sp-2); font-size: var(--fs-small); }

/* Debts */
.debt-rows { display: flex; flex-direction: column; gap: var(--sp-2); margin-block-end: var(--sp-4); }
.debt-row {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; align-items: end; gap: var(--sp-2);
  padding: var(--sp-3); border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--border);
}
.debt-row > input[type="text"] { grid-column: 1 / -1; min-height: 38px; font-weight: var(--fw-bold); background-color: var(--surface); }
.debt-row > label { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.debt-row > label > span { font-size: var(--fs-micro); font-weight: var(--fw-semibold); color: var(--text-muted); }
.debt-row > label > input { min-height: 38px; padding-inline: var(--sp-2); background-color: var(--surface); }
.debt-row > .icon-button { width: 38px; height: 38px; }
.debt-row > .icon-button:hover { color: var(--negative); background: var(--negative-soft); }
.plan-card { display: flex; flex-direction: column; gap: var(--sp-2); }
.plan-card > .row-between > b { font-size: var(--fs-h3); font-weight: var(--fw-bold); }
.plan-number {
  margin-block-start: var(--sp-1); font-family: var(--font-num); font-size: 34px; font-weight: var(--fw-black);
  line-height: 1.1; letter-spacing: var(--tracking-tight); font-variant-numeric: tabular-nums;
}
.plan-card > small { font-size: var(--fs-small); }
.payoff-order {
  display: flex; flex-direction: column; gap: 0; margin: var(--sp-2) 0 0; padding: 0; list-style: none; counter-reset: payoff;
  border-block-start: 1px solid var(--border);
}
.payoff-order li {
  counter-increment: payoff; display: flex; align-items: center; gap: var(--sp-2);
  padding-block: var(--sp-2); font-size: var(--fs-small); font-weight: var(--fw-semibold);
}
.payoff-order li + li { border-block-start: 1px dashed var(--border); }
.payoff-order li::before {
  content: counter(payoff); display: grid; place-items: center; flex: none; width: 22px; height: 22px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent-text); font-family: var(--font-num); font-size: var(--fs-micro); font-weight: var(--fw-black);
}
.payoff-order li span { flex: 1; min-width: 0; }
.payoff-order li small { flex: none; font-size: var(--fs-micro); color: var(--text-muted); font-variant-numeric: tabular-nums; }

/* Fees */
.fee-pair {
  grid-column: 1 / -1;
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-3);
  padding: var(--sp-3); border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--border);
}
.fee-pair > span { grid-column: 1 / -1; font-size: var(--fs-small); font-weight: var(--fw-bold); color: var(--text); }
.fee-pair + .fee-pair > span { color: var(--positive); }
.fee-pair input { background-color: var(--surface); }

/* Maaser */
.cat-checks { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.cat-checks > label {
  display: inline-flex; align-items: center; gap: var(--sp-2); min-height: 36px; padding: 0 var(--sp-3) 0 var(--sp-2);
  border-radius: var(--r-pill); border: 1px solid var(--border-strong); background: var(--surface);
  font-size: var(--fs-small); font-weight: var(--fw-medium); color: var(--text); cursor: pointer;
}
.cat-checks > label > input { width: 18px; height: 18px; border-radius: 50%; }
.cat-checks > label > input:checked::after { inset-block-start: 1.5px; inset-inline-start: 5px; width: 4px; height: 9px; }
.cat-checks > label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-text); font-weight: var(--fw-bold); }
.maaser-status { display: flex; flex-direction: column; gap: var(--sp-3); }
.maaser-status .eyebrow { margin-block-end: 0; }
.maaser-status > div:first-child > p { font-size: var(--fs-small); }
.maaser-status > .progress { height: 10px; }
.maaser-status > .row-between { flex-wrap: wrap; }

/* ============================================================
   Insights
   ============================================================ */
.health-card > .section-head { margin-block-end: var(--sp-5); }
.health { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: var(--sp-8); align-items: center; }
.health-ring { display: flex; flex-direction: column; align-items: center; gap: var(--sp-3); }
.health-ring > b {
  padding: 4px var(--sp-3); border-radius: var(--r-pill); background: var(--accent-soft); color: var(--accent-text);
  font-size: var(--fs-small); font-weight: var(--fw-bold); text-align: center;
}
.health-ring .score-ring b { font-size: 38px; }
.health-factors { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-5) var(--sp-8); }
.health-factor { display: flex; flex-direction: column; gap: var(--sp-2); min-width: 0; }
.health-factor > .row-between span { font-size: var(--fs-small); font-weight: var(--fw-semibold); }
.health-factor > .row-between b { font-family: var(--font-num); font-size: var(--fs-num-sm); font-weight: var(--fw-black); font-variant-numeric: tabular-nums; }
.health-factor small { font-size: var(--fs-micro); line-height: 1.5; color: var(--text-muted); }

.ai-letter-card { overflow: hidden; }
.ai-letter-card::before {
  content: ""; position: absolute; inset-block-start: 0; inset-inline: 0; height: 3px; background: var(--brand-gradient);
}
.ai-letter { display: flex; flex-direction: column; max-width: 860px; font-size: var(--fs-body); line-height: 1.8; }
.ai-letter > p { margin-block-end: var(--sp-2); }
.ai-letter h3, .ai-letter h4 { margin-block: var(--sp-4) var(--sp-1); font-size: var(--fs-h3); font-weight: var(--fw-bold); color: var(--accent-text); }
.ai-letter ol, .ai-letter ul { margin-block: var(--sp-1) var(--sp-2); padding-inline-start: 22px; }
.ai-letter li + li { margin-block-start: 4px; }
.ai-letter li::marker { color: var(--accent-text); font-weight: var(--fw-bold); }
.ai-letter .letter-date { margin-block-start: var(--sp-3); font-size: var(--fs-micro); }

.anomalies { display: flex; flex-direction: column; }
.anomalies > div { display: flex; align-items: center; gap: var(--sp-3); padding-block: var(--sp-3); }
.anomalies > div + div { border-block-start: 1px solid var(--border); }
.anomalies > div:first-child { padding-block-start: 0; }
.anomalies > div > .asset-icon { flex: none; }
.anomalies > div > div { flex: 1; min-width: 0; }
.anomalies > div > div b { display: block; font-size: var(--fs-small); font-weight: var(--fw-bold); }
.anomalies > div > div small { display: block; margin-block-start: 2px; font-size: var(--fs-micro); color: var(--text-muted); line-height: 1.5; }
.anomalies > div > b.negative {
  flex: none; padding: 3px var(--sp-2); border-radius: var(--r-pill); background: var(--negative-soft);
  font-size: var(--fs-small); font-weight: var(--fw-black);
}

.insights-intro {
  display: flex; align-items: center; gap: var(--sp-4);
  padding: var(--sp-5) var(--sp-6); margin-block-start: var(--sp-2); border-radius: var(--r-lg);
  border: 1px solid var(--border);
  background: radial-gradient(80% 160% at 100% 0%, var(--accent-soft), transparent 70%), var(--card-bg);
}
.insights-intro .insight-icon {
  display: grid; place-items: center; flex: none; width: 56px; height: 56px; border-radius: 18px;
  background: var(--brand-gradient); color: var(--on-hero); box-shadow: var(--shadow-1);
}
.insights-intro .insight-icon svg { width: 26px; height: 26px; }
.insights-intro > div { min-width: 0; }
.insights-intro h2 { font-size: 22px; font-weight: var(--fw-black); letter-spacing: var(--tracking-tight); line-height: 1.25; }
.insights-intro p { margin-block-start: 2px; font-size: var(--fs-small); color: var(--text-muted); }
.insight-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: var(--gap-grid); }
.insight-card { display: flex; flex-direction: column; gap: var(--sp-2); }
.insight-card > .asset-icon { width: 44px; height: 44px; border-radius: var(--r-md); margin-block-end: var(--sp-1); }
.insight-card > .asset-icon svg { width: 22px; height: 22px; }
.insight-card h2 { font-size: var(--fs-h3); font-weight: var(--fw-bold); line-height: 1.4; }
.insight-card p { font-size: var(--fs-small); line-height: 1.6; color: var(--text-muted); }

/* ============================================================
   Entrance (navigation only)
   ============================================================ */
.page-content.enter .scn-event, .page-content.enter .wish-card, .page-content.enter .split-card, .page-content.enter .insight-card {
  animation: plan-rise var(--dur-slow) var(--ease-out) both;
}
@keyframes plan-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width: 1250px) {
  .tool-layout { grid-template-columns: minmax(0, 1fr); }
  .tool-fields { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
  .fee-pair { grid-column: 1 / -1; }
  .debt-rows { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
}
@media (max-width: 1180px) {
  .scn-layout { grid-template-columns: minmax(0, 1fr); }
  .scn-events { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .scn-events:empty { display: none; }
}
@media (max-width: 1100px) {
  .lab-layout { grid-template-columns: minmax(0, 1fr); }
  .lab-controls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-4) var(--sp-5); }
  .lab-controls > .lab-slider:first-of-type { padding-block-start: 0; border-block-start: 0; }
  .health { grid-template-columns: 170px minmax(0, 1fr); gap: var(--sp-6); }
}
@media (max-width: 980px) {
  .split-layout, .buy-layout { grid-template-columns: minmax(0, 1fr); }
  .wish-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .health-factors { grid-template-columns: minmax(0, 1fr); gap: var(--sp-4); }
}

@media (max-width: 760px) {
  /* tabs: full-width track; tools scroll with a fade at the inline end */
  .lab-tabs { width: 100%; }
  .lab-tabs > button { flex: 1 1 0; min-height: 40px; }
  /* all five calculators stay visible: wrapping chips (no hidden active tab) */
  .tool-tabs {
    width: 100%; flex-wrap: wrap; gap: var(--sp-2); padding: 0; overflow: visible;
    border-radius: 0; background: transparent; border: 0;
  }
  .tool-tabs > button { flex: 1 1 auto; min-height: var(--touch); padding-inline: var(--sp-3); background: var(--surface); border: 1px solid var(--border-strong); }
  .tool-tabs > button svg { display: none; }
  .tool-tabs > button.active { background: var(--accent); border-color: transparent; color: var(--accent-contrast); box-shadow: var(--shadow-1); }

  .lab-intro { flex-direction: column; align-items: stretch; gap: var(--sp-4); padding: var(--sp-5); border-radius: var(--r-lg); }
  .lab-intro h2 { font-size: 20px; }
  .lab-intro p { font-size: var(--fs-small); }
  .lab-controls { display: flex; }
  .scn-events { display: flex; }
  .scn-event { padding: var(--sp-3); }
  .scn-event > .row-between { display: grid; grid-template-columns: minmax(0, 1fr) auto; row-gap: var(--sp-2); }
  .scn-event input.scn-name { grid-column: 1; grid-row: 1; }
  .scn-event > .row-between > .icon-button { grid-column: 2; grid-row: 1; width: var(--touch); height: var(--touch); }
  .scn-event .scn-type { grid-column: 1 / -1; grid-row: 2; justify-self: start; }
  .scn-settings { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  /* goals table → stacked rows: goal, then "now ← scenario" and the change */
  .scn-results .table-wrap table, .scn-results .table-wrap tbody { display: block; white-space: normal; }
  .scn-results .table-wrap thead { display: none; }
  .scn-results .table-wrap tr {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px var(--sp-2);
    padding-block: var(--sp-3); border-block-end: 1px solid var(--border);
  }
  .scn-results .table-wrap tr:last-child { border-block-end: 0; }
  .scn-results .table-wrap td { padding: 0; border: 0; background: none; font-size: var(--fs-small); }
  .scn-results .table-wrap td:nth-child(1) { flex: 1 1 100%; display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-3); margin-block-end: 2px; }
  .scn-results .table-wrap td:nth-child(1) small { margin: 0; }
  .scn-results .table-wrap td:nth-child(2) { color: var(--text-muted); }
  .scn-results .table-wrap td:nth-child(3)::before { content: "←"; margin-inline-end: var(--sp-2); color: var(--text-subtle); font-weight: var(--fw-regular); }
  .scn-results .table-wrap td:nth-child(3) b { display: inline; }
  .scn-results .table-wrap td:nth-child(4) { margin-inline-start: auto; font-size: var(--fs-micro); }
  :is(.scn-results, .lab-results, .tool-output, .wish-stats) .three-metrics .metric-value,
  .wish-stats .metric-value { font-size: 20px; white-space: nowrap; }
  .scn-presets .ai-chip { min-height: var(--touch); }

  .tool-fields { grid-template-columns: minmax(0, 1fr); }
  .tool-fields > .check-field { margin-block-start: 0; }
  .fee-pair { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .debt-rows { display: flex; }
  .big-number { font-size: 38px; }
  .breakdown { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .breakdown > div { grid-template-columns: minmax(0, 1fr) 64px 92px; gap: var(--sp-3); padding: 10px 0; border-radius: 0; background: none; }
  .breakdown > div + div { border-block-start: 1px solid var(--border); }
  .breakdown span { grid-column: 1; grid-row: 1; }
  .breakdown small { grid-column: 2; grid-row: 1; min-width: 52px; text-align: end; }
  .breakdown b { grid-column: 3; grid-row: 1; justify-self: end; }
  .plan-number { font-size: 30px; }

  .buy-facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .buy-facts b { font-size: var(--fs-num-sm); }
  .buy-form .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-3); }
  .wish-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-3); }
  .wish-stats .metric-top { flex-direction: column-reverse; align-items: flex-start; gap: var(--sp-2); }
  .wish-stats .metric-icon { width: 32px; height: 32px; border-radius: 10px; }
  .wish-stats .metric-icon svg { width: 16px; height: 16px; }
  .wish-stats .metric-detail { font-size: var(--fs-micro); }
  .wish-grid, .split-grid, .insight-grid { grid-template-columns: minmax(0, 1fr); }
  .wish-actions .button { min-height: var(--touch); flex: 1 1 auto; }
  .wish-actions .icon-button { width: var(--touch); height: var(--touch); }
  .wish-actions .icon-button:first-of-type { margin-inline-start: 0; }
  .wish-card:is(.skipped, .bought) .wish-actions .button { flex: 0 0 auto; }

  .group-title h2 { font-size: 22px; }
  .group-head > .actions { flex: 1 1 100%; }
  .group-head > .actions .button { flex: 1 1 auto; }
  /* expenses table → stacked rows (data-label): name + amount, then date · payer, then who shares it; actions at the end */
  .split-expenses table, .split-expenses tbody { display: block; white-space: normal; }
  .split-expenses thead { display: none; }
  .split-expenses tr {
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: baseline; gap: 2px var(--sp-2);
    padding-block: var(--sp-3);
  }
  .split-expenses tr + tr { border-block-start: 1px solid var(--border); }
  .split-expenses td { padding: 0; border: 0; background: none; min-width: 0; }
  .split-expenses td:nth-child(1) { display: contents; }
  .split-expenses td:nth-child(1) > b { grid-column: 1 / 3; grid-row: 1; font-size: var(--fs-body); }
  .split-expenses td:nth-child(1) > small { grid-column: 1; grid-row: 2; margin: 0; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .split-expenses td:nth-child(1) > small::after { content: "·"; margin-inline-start: var(--sp-2); color: var(--text-subtle); }
  .split-expenses td:nth-child(2), .split-expenses td:nth-child(3) {
    font-size: var(--fs-micro); line-height: 1.45; color: var(--text-muted); white-space: normal;
  }
  .split-expenses td:nth-child(2) { grid-column: 2; grid-row: 2; color: var(--text); font-weight: var(--fw-semibold); }
  .split-expenses td:nth-child(3) { grid-column: 1 / 3; grid-row: 3; }
  .split-expenses td:is(:nth-child(2), :nth-child(3))::before {
    content: attr(data-label) ": "; color: var(--text-subtle); font-weight: var(--fw-regular);
  }
  .split-expenses td:nth-child(4) { grid-column: 3; grid-row: 1; justify-self: end; }
  .split-expenses td:nth-child(4) b { font-size: var(--fs-num-sm); }
  .split-expenses td:nth-child(5) { grid-column: 3; grid-row: 2 / span 2; justify-self: end; align-self: center; }
  .split-expenses .table-actions { margin-inline-end: calc(-1 * var(--sp-2)); }
  .split-expenses .table-actions .icon-button { width: var(--touch); height: var(--touch); }
  .transfer { padding: var(--sp-3); }
  .transfer .pay-button { min-height: var(--touch); flex-basis: 100%; justify-content: center; }
  .group-head .back, .settled summary { min-height: var(--touch); }
  .debt-row > label > input, .debt-row > input[type="text"] { min-height: var(--touch); }
  .debt-row > .icon-button { width: var(--touch); height: var(--touch); }
  .share-row input[type="number"] { min-height: var(--touch); }
  .share-row { grid-template-columns: auto minmax(0, 1fr) 110px; }
  .danger-zone .button { width: 100%; }

  /* Detected recurring payments (insights): stacked rows, the monthly amount always in view; the yearly column is ×12 and drops */
  .page-content:has(> .insights-intro) > section.card .table-wrap > table:not([class]),
  .page-content:has(> .insights-intro) > section.card .table-wrap > table:not([class]) > tbody { display: block; white-space: normal; }
  .page-content:has(> .insights-intro) > section.card .table-wrap > table:not([class]) > thead { display: none; }
  .page-content:has(> .insights-intro) > section.card .table-wrap > table:not([class]) tr {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: var(--sp-1) var(--sp-3);
    padding-block: var(--sp-3); border-block-end: 1px solid var(--border);
  }
  .page-content:has(> .insights-intro) > section.card .table-wrap > table:not([class]) tr:last-child { border-block-end: 0; }
  .page-content:has(> .insights-intro) > section.card .table-wrap > table:not([class]) td { padding: 0; border: 0; background: none; min-width: 0; }
  .page-content:has(> .insights-intro) > section.card .table-wrap > table:not([class]) td:nth-child(1) { grid-column: 1; grid-row: 1; }
  .page-content:has(> .insights-intro) > section.card .table-wrap > table:not([class]) td:nth-child(3) { grid-column: 2; grid-row: 1; justify-self: end; }
  /* the pill sits under the name, past the 36px icon */
  .page-content:has(> .insights-intro) > section.card .table-wrap > table:not([class]) td:nth-child(2) { grid-column: 1; grid-row: 2; padding-inline-start: calc(36px + var(--sp-3)); }
  .page-content:has(> .insights-intro) > section.card .table-wrap > table:not([class]) td:nth-child(4) { display: none; }
  .page-content:has(> .insights-intro) > section.card .table-wrap > table:not([class]) td:nth-child(5) { grid-column: 2; grid-row: 2; justify-self: end; font-size: var(--fs-micro); font-variant-numeric: tabular-nums; }
  .page-content:has(> .insights-intro) > section.card .table-wrap > table:not([class]) tbody tr:hover td { background: none; }

  .health { grid-template-columns: minmax(0, 1fr); justify-items: center; gap: var(--sp-5); }
  .health-factors { width: 100%; }
  .insights-intro { padding: var(--sp-4); }
  .insight-card { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: var(--sp-3); row-gap: 2px; align-items: start; }
  .insight-card > .asset-icon { grid-row: 1 / span 2; margin: 0; width: 40px; height: 40px; }
  .insight-card > .asset-icon svg { width: 20px; height: 20px; }
  .insights-intro .insight-icon { width: 48px; height: 48px; border-radius: var(--r-md); }
  .insights-intro h2 { font-size: 19px; }
  .ai-letter { font-size: var(--fs-small); line-height: 1.75; }
}
@media (max-width: 360px) {
  .scn-fields, .scn-settings, .buy-form .form-grid { grid-template-columns: minmax(0, 1fr); }
  .buy-facts { grid-template-columns: minmax(0, 1fr); }
  .breakdown { grid-template-columns: minmax(0, 1fr); }
}

@media (prefers-reduced-motion: reduce) {
  .page-content.enter .scn-event, .page-content.enter .wish-card, .page-content.enter .split-card, .page-content.enter .insight-card { animation: none; }
  .split-card, .split-card:hover { transition: none; transform: none; }
}

/* ============================================================
   Ofek 4.0 — AI & settings area
   Claude copilot (setup hero, chat, proposals, charts, composer), the first-run setup wizard,
   "what's new", and the settings page cards (fx, Claude, sync, versions, app, notifications,
   categories, reset). Tokens only; logical properties only. Frame classes are not restyled.
   ============================================================ */

/* ---------- Copilot: connect Claude (no API key yet) ---------- */
.ai-hero {
  display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); gap: var(--sp-8);
  padding: var(--sp-8); overflow: hidden; isolation: isolate;
}
.ai-hero::before {
  content: ""; position: absolute; z-index: -1; inset-block-start: -40%; inset-inline-start: -12%;
  width: 70%; height: 120%; border-radius: 50%;
  background: radial-gradient(closest-side, var(--accent-soft), transparent);
  pointer-events: none;
}
.ai-hero::after {
  content: ""; position: absolute; z-index: -1; inset-block-end: -50%; inset-inline-end: -10%;
  width: 60%; height: 110%; border-radius: 50%;
  background: radial-gradient(closest-side, var(--accent-2-soft), transparent);
  pointer-events: none;
}
.ai-hero-copy { display: flex; flex-direction: column; gap: var(--sp-3); min-width: 0; }
.ai-hero-copy > .eyebrow {
  width: fit-content; padding: 4px 10px; border-radius: var(--r-pill);
  background: var(--accent-soft); color: var(--accent-text);
}
.ai-hero-copy > h2 {
  font-size: var(--fs-h1); line-height: 1.25; font-weight: var(--fw-black); letter-spacing: -0.015em;
  text-wrap: balance;
}
.ai-hero-copy > p { font-size: var(--fs-body); line-height: 1.75; color: var(--text-muted); text-wrap: pretty; }
.ai-key-form {
  display: flex; flex-direction: column; gap: var(--sp-4);
  margin-block-start: var(--sp-3); padding: var(--sp-5);
  border: 1px solid var(--border); border-radius: var(--r-lg);
  background: var(--surface); box-shadow: var(--shadow-1);
}
.ai-key-form .form-actions { margin-block-start: var(--sp-1); gap: var(--sp-4); }
.ai-hero-grid {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-3); align-content: center;
}
.ai-hero-grid > div {
  display: flex; flex-direction: column; gap: var(--sp-2); min-width: 0;
  padding: var(--sp-4); border: 1px solid var(--border); border-radius: var(--r-md);
  background: color-mix(in srgb, var(--surface) 82%, transparent);
}
.ai-hero-grid b { font-size: var(--fs-small); font-weight: var(--fw-bold); line-height: 1.4; }
.ai-hero-grid p { font-size: var(--fs-micro); line-height: 1.6; color: var(--text-muted); }
.ai-hero + .notice { margin-block-start: 0; }

/* ---------- Copilot: chat layout ---------- */
.ai-layout {
  display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: var(--gap-grid); align-items: start;
}
.ai-chat {
  display: flex; flex-direction: column; padding: 0; overflow: hidden;
  height: clamp(540px, calc(100dvh - var(--topbar-h) - 200px), 900px);
  background: var(--surface); -webkit-backdrop-filter: none; backdrop-filter: none;
}
.ai-chat-head {
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
  padding: var(--sp-4) var(--sp-5); border-block-end: 1px solid var(--border);
}
.ai-chat-head .button { min-height: 36px; padding-inline: var(--sp-3); font-size: var(--fs-small); }
.ai-identity { display: flex; align-items: center; gap: var(--sp-3); min-width: 0; }
.ai-identity > div { min-width: 0; }
.ai-identity b { display: block; font-size: var(--fs-h3); font-weight: var(--fw-bold); line-height: 1.3; }
.ai-identity small {
  display: block; font-size: var(--fs-micro); color: var(--text-muted);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.ai-avatar {
  display: grid; place-items: center; flex: none; width: 40px; height: 40px; border-radius: 13px;
  background: var(--brand-gradient); color: var(--on-hero);
  box-shadow: 0 6px 16px -6px color-mix(in srgb, var(--accent-2-vivid) 60%, transparent);
}
.ai-avatar.small { width: 30px; height: 30px; border-radius: 10px; margin-block-start: 2px; box-shadow: none; }

.ai-log {
  flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
  display: flex; flex-direction: column; gap: var(--sp-5);
  padding: var(--sp-6) var(--sp-5) var(--sp-4);
  scrollbar-gutter: stable;
}

/* Messages */
.ai-msg { display: flex; align-items: flex-start; gap: var(--sp-3); min-width: 0; }
.ai-msg.user { justify-content: flex-end; }
.ai-bubble {
  max-width: min(78%, 560px); padding: 10px 16px;
  border-radius: 20px; border-end-end-radius: 6px;
  background: var(--accent); color: var(--accent-contrast);
  font-size: var(--fs-body); line-height: 1.65; overflow-wrap: anywhere;
}
.ai-files { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-block-end: var(--sp-2); }
.ai-files:last-child { margin-block-end: 0; }
.ai-thumb {
  display: block; max-width: 180px; max-height: 140px; object-fit: cover;
  border-radius: var(--r-sm); border: 1px solid color-mix(in srgb, var(--accent-contrast) 25%, transparent);
}
.ai-file {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: var(--r-xs);
  background: color-mix(in srgb, var(--accent-contrast) 16%, transparent);
  font-size: var(--fs-micro); font-weight: var(--fw-bold);
}
.ai-answer {
  flex: 1; min-width: 0; display: flex; flex-direction: column; gap: var(--sp-3);
  font-size: var(--fs-body); line-height: 1.75; color: var(--text);
}
.ai-text { min-width: 0; overflow-wrap: anywhere; }
.ai-text p { margin-block-end: var(--sp-2); }
.ai-text > :last-child { margin-block-end: 0; }
.ai-text h4 { margin-block: var(--sp-4) var(--sp-1); font-size: var(--fs-h3); font-weight: var(--fw-bold); color: var(--text); }
.ai-text h4:first-child { margin-block-start: 0; }
.ai-text ul, .ai-text ol { margin-block: var(--sp-1) var(--sp-2); padding-inline-start: 22px; }
.ai-text li + li { margin-block-start: 3px; }
.ai-text li::marker { color: var(--accent-text); font-weight: var(--fw-bold); }
.ai-text b, .ai-text strong { font-weight: var(--fw-bold); color: var(--text); }
.ai-text code {
  padding: 1px 6px; border-radius: 6px; background: var(--surface-2);
  font-family: var(--font-mono); font-size: .88em;
}
.ai-text a { color: var(--accent-text); text-decoration: underline; text-underline-offset: 3px; }
.ai-table {
  margin-block: var(--sp-2) var(--sp-3);
  border: 1px solid var(--border); border-radius: var(--r-md); --table-head-bg: var(--surface-2);
}
.ai-table table { font-size: var(--fs-small); font-variant-numeric: tabular-nums; }
.ai-table th { background: var(--surface-2); }
.ai-table th:first-child, .ai-table td:first-child { padding-inline-start: var(--sp-4); }
.ai-table th:last-child, .ai-table td:last-child { padding-inline-end: var(--sp-4); }

/* Thinking + tool chips */
.ai-thinking {
  align-self: stretch; padding: var(--sp-2) var(--sp-3);
  border: 1px dashed var(--border-strong); border-radius: var(--r-md);
  font-size: var(--fs-small); line-height: 1.65; color: var(--text-muted);
}
.ai-thinking summary {
  display: flex; align-items: center; gap: 6px; min-height: 28px;
  list-style: none; cursor: pointer; font-weight: var(--fw-bold); color: var(--text-muted);
}
.ai-thinking summary::-webkit-details-marker { display: none; }
.ai-thinking summary::after {
  content: ""; width: 7px; height: 7px; margin-inline-start: 2px;
  border-inline-end: 1.5px solid currentColor; border-block-end: 1.5px solid currentColor;
  transform: rotate(45deg); transition: transform var(--dur-fast) var(--ease-out);
}
.ai-thinking[open] summary::after { transform: rotate(-135deg) translate(-2px, -2px); }
.ai-thinking summary svg { color: var(--accent-2); }
.ai-thinking summary:hover { color: var(--text); }
.ai-thinking[open] summary { margin-block-end: var(--sp-1); }
.ai-thinking > div { max-height: 220px; overflow-y: auto; padding-block-end: var(--sp-1); }
.ai-thinking p { margin-block-end: var(--sp-2); }
.ai-tool {
  align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
  min-height: 28px; padding: 3px 12px; border-radius: var(--r-pill);
  background: var(--surface-2); border: 1px solid var(--border);
  font-size: var(--fs-micro); font-weight: var(--fw-semibold); line-height: 1.4; color: var(--text-muted);
}
.ai-tool > svg { flex: none; }
.ai-tool > span { min-width: 0; }
.ai-tool.done > svg { color: var(--positive); }
.ai-tool.running > svg { color: var(--accent-text); animation: ai-spin 1.6s linear infinite; }
@keyframes ai-spin { to { transform: rotate(360deg); } }

/* Charts inside the chat */
.ai-chart {
  margin: 0; padding: var(--sp-4) var(--sp-4) var(--sp-3);
  border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface);
  box-shadow: var(--shadow-1); min-width: 0;
}
.ai-chart figcaption {
  display: flex; align-items: center; gap: var(--sp-2); margin-block-end: var(--sp-3);
  font-size: var(--fs-small); font-weight: var(--fw-bold); line-height: 1.4;
}
.ai-chart figcaption svg { flex: none; color: var(--accent-text); }
.ai-chart .donut-wrap { justify-content: center; }
.ai-chart-legend {
  display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4); margin-block-start: var(--sp-2);
  font-size: var(--fs-micro); color: var(--text-muted);
}
.ai-chart-legend .legend-name { display: inline-flex; align-items: center; gap: 6px; }
.ai-chart-legend .legend-name i { width: 10px; height: 10px; border-radius: 3px; flex: none; }

/* Proposals (Claude suggests, the user approves) */
.ai-proposal {
  display: flex; flex-direction: column; gap: var(--sp-3); min-width: 0;
  padding: var(--sp-4); border: 1px solid var(--border); border-radius: var(--r-lg);
  background: var(--surface-2);
}
.ai-proposal.pending {
  border-color: color-mix(in srgb, var(--warning-vivid) 45%, var(--border));
  background: linear-gradient(160deg, var(--warning-soft), var(--surface) 70%);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--warning-vivid) 10%, transparent), var(--shadow-1);
}
.ai-proposal.waiting {
  flex-direction: row; align-items: center; gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-4); font-size: var(--fs-small); color: var(--text-muted);
}
.ai-proposal.waiting > svg { color: var(--accent-2); flex: none; }
.ai-proposal-head { display: flex; align-items: center; gap: var(--sp-3); flex-wrap: wrap; min-width: 0; }
.ai-proposal-head > b { flex: 1 1 160px; min-width: 0; font-size: var(--fs-h3); font-weight: var(--fw-bold); line-height: 1.4; }
.ai-proposal-head > .badge { margin-inline-start: auto; }
.ai-proposal > p { font-size: var(--fs-small); line-height: 1.6; }
.ai-proposal-figure { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px var(--sp-3); }
.ai-proposal-figure > b {
  font-family: var(--font-num); font-size: var(--fs-num-xl); line-height: 1.1; font-weight: var(--fw-black);
  letter-spacing: var(--tracking-tight); font-variant-numeric: tabular-nums;
}
.ai-proposal-figure > span { font-size: var(--fs-small); color: var(--text-muted); }
.ai-proposal .table-wrap {
  border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface);
  --table-head-bg: var(--surface);
}
.ai-proposal-table td small { display: block; margin-block-start: 2px; font-size: var(--fs-micro); }
.ai-proposal-table td small.negative { color: var(--negative); }
.ai-proposal-table td:first-child:has(input) { width: 36px; padding-inline-end: 0; }
.ai-proposal-table td .category-pill + small { display: block; }
.ai-proposal-table th:first-child, .ai-proposal-table td:first-child { padding-inline-start: var(--sp-3); }
.ai-proposal-table th:last-child, .ai-proposal-table td:last-child { padding-inline-end: var(--sp-3); text-align: end; }
.ai-proposal-table td:last-child b[dir="ltr"] { margin-inline-start: auto; display: block; width: fit-content; }
.ai-proposal .goal-details > div { background: var(--surface); }
.ai-proposal > .actions { gap: var(--sp-2); }
.ai-proposal > .button { width: fit-content; }

/* Typing, errors */
.ai-typing { display: flex; align-items: center; gap: 5px; min-height: 28px; color: var(--text-muted); }
.ai-typing > span {
  width: 7px; height: 7px; border-radius: 50%; background: var(--accent-vivid); opacity: .35;
  animation: ai-dot 1.2s var(--ease-in-out) infinite;
}
.ai-typing > span:nth-child(2) { animation-delay: .15s; }
.ai-typing > span:nth-child(3) { animation-delay: .3s; }
.ai-typing > small { margin-inline-start: var(--sp-2); font-size: var(--fs-small); }
@keyframes ai-dot { 0%, 100% { opacity: .3; transform: none; } 40% { opacity: 1; transform: translateY(-3px); } }
.ai-error {
  display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-2) var(--sp-3);
  padding: var(--sp-3) var(--sp-4); border-radius: var(--r-md);
  border: 1px solid color-mix(in srgb, var(--negative) 25%, transparent);
  background: var(--negative-soft); color: var(--text);
  font-size: var(--fs-small); line-height: 1.55;
}
.ai-error > svg { flex: none; color: var(--negative); }
.ai-error > span { flex: 1 1 200px; min-width: 0; }
.ai-error.soft { border-color: var(--border); background: var(--surface-2); }
.ai-error.soft > svg { color: var(--info); }
.ai-error .button { min-height: 36px; padding-inline: var(--sp-3); font-size: var(--fs-small); margin-inline-start: auto; }

/* Empty conversation */
.ai-welcome {
  display: flex; flex-direction: column; align-items: center; gap: var(--sp-3);
  max-width: 620px; margin: auto; padding: var(--sp-6) 0; text-align: center;
}
.ai-orb {
  display: grid; place-items: center; width: 72px; height: 72px; margin-block-end: var(--sp-2);
  border-radius: 24px; background: var(--brand-gradient); color: var(--on-hero);
  box-shadow: 0 14px 32px -12px color-mix(in srgb, var(--accent-2-vivid) 70%, transparent),
              0 0 0 8px var(--accent-soft);
}
.ai-welcome > h2 { font-size: 24px; line-height: 1.3; font-weight: var(--fw-black); letter-spacing: -0.01em; text-wrap: balance; }
.ai-welcome > p { max-width: 52ch; font-size: var(--fs-body); line-height: 1.7; color: var(--text-muted); text-wrap: pretty; }
.ai-welcome .ai-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--sp-2); margin-block-start: var(--sp-3); }
.ai-welcome .ai-chip {
  display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 0 var(--sp-4);
  border: 1px solid var(--border); border-radius: var(--r-pill); background: var(--surface);
  font-size: var(--fs-small); font-weight: var(--fw-semibold); color: var(--text);
  transition: border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
}
.ai-welcome .ai-chip svg { flex: none; color: var(--accent-text); }
.ai-welcome .ai-chip:hover { border-color: var(--accent); background: var(--accent-soft); }
.ai-welcome .ai-chip.accent { border-color: color-mix(in srgb, var(--accent-2) 40%, transparent); background: var(--accent-2-soft); color: var(--accent-2); font-weight: var(--fw-bold); }
.ai-welcome .ai-chip.accent svg { color: var(--accent-2); }
.ai-welcome .ai-chip.accent:hover { border-color: var(--accent-2); }

/* Composer */
.ai-composer {
  padding: var(--sp-3) var(--sp-5) var(--sp-3);
  border-block-start: 1px solid var(--border); background: var(--surface);
}
.ai-attachments { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.ai-attachments:not(:empty) { margin-block-end: var(--sp-2); }
.ai-attachment {
  display: inline-flex; align-items: center; gap: var(--sp-2); max-width: 240px; min-height: 40px;
  padding-block: 3px; padding-inline: 4px 4px;
  border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--surface-2);
  font-size: var(--fs-micro); font-weight: var(--fw-semibold);
}
.ai-attachment > svg { flex: none; margin-inline-start: 6px; color: var(--accent-text); }
.ai-attachment > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ai-attachment > img { flex: none; width: 32px; height: 32px; object-fit: cover; border-radius: 7px; }
.ai-attachment > .icon-button { width: 30px; height: 30px; flex: none; color: var(--text-muted); }
.ai-attachment > .icon-button:hover { background: var(--negative-soft); color: var(--negative); }
.ai-input-row {
  display: flex; align-items: flex-end; gap: var(--sp-2);
  padding: 6px; padding-inline-start: var(--sp-2);
  border: 1px solid var(--border-strong); border-radius: 22px; background: var(--surface);
  transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
}
.ai-input-row:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.ai-input-row > textarea,
.ai-input-row > textarea:hover,
.ai-input-row > textarea:focus {
  flex: 1; min-width: 0; min-height: 40px; max-height: 180px; padding: 9px var(--sp-2);
  border: 0; border-radius: 0; background: transparent; box-shadow: none; outline: none;
  resize: none; font-size: var(--fs-body); line-height: 1.5; color: var(--text);
}
/* The empty box stays one line tall: autosize() measures scrollHeight, which counts a wrapped placeholder */
.ai-input-row > textarea::placeholder { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ai-input-row > textarea:placeholder-shown {
  height: 40px !important;
  -webkit-mask-image: linear-gradient(to right, transparent, var(--mask-solid) 40px);
  mask-image: linear-gradient(to right, transparent, var(--mask-solid) 40px);
}
.ai-actions { display: flex; align-items: center; gap: 2px; flex: none; }
.ai-actions .icon-button { width: 40px; height: 40px; color: var(--text-muted); }
.ai-actions .icon-button:hover { color: var(--text); }
.ai-mic.listening { background: var(--negative-soft); color: var(--negative); animation: ai-listen 1.4s var(--ease-in-out) infinite; }
@keyframes ai-listen { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--negative-vivid) 18%, transparent); } }
.ai-composer .ai-send {
  display: grid; place-items: center; flex: none; width: 40px; height: 40px; margin-inline-start: 2px;
  border-radius: var(--r-pill); background: var(--accent); color: var(--accent-contrast);
  transition: background var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
}
.ai-composer .ai-send:hover { background: var(--accent-hover); }
.ai-composer .ai-send:active { transform: scale(.94); }
.ai-composer .ai-send:not(.stop) svg { transform: scaleX(-1); }
.ai-composer .ai-send.stop { background: var(--negative-soft); color: var(--negative); }
.ai-composer .ai-send.stop:hover { background: color-mix(in srgb, var(--negative) 20%, transparent); }
.ai-hint { display: block; margin-block-start: var(--sp-2); padding-inline: var(--sp-2); font-size: var(--fs-micro); color: var(--text-subtle); }

/* Drag & drop */
.ai-drop-overlay {
  position: absolute; inset: 10px; z-index: 3; display: none;
  flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-3);
  border: 2px dashed var(--accent); border-radius: var(--r-lg);
  background: color-mix(in srgb, var(--surface) 92%, transparent); color: var(--accent-text);
  font-size: var(--fs-h3); pointer-events: none;
}
.ai-chat.dragging .ai-drop-overlay { display: flex; }

/* Side column */
.ai-side { display: flex; flex-direction: column; gap: var(--gap-grid); position: sticky; inset-block-start: calc(var(--topbar-h) + var(--sp-4)); min-width: 0; }
.ai-capabilities { display: flex; flex-direction: column; gap: var(--sp-3); margin-block-start: var(--sp-4); }
.ai-capabilities > div { display: flex; align-items: flex-start; gap: var(--sp-3); min-width: 0; }
.ai-capabilities .asset-icon { width: 36px; height: 36px; border-radius: 11px; }
.ai-capabilities > div > div { min-width: 0; padding-block-start: 1px; }
.ai-capabilities b { display: block; font-size: var(--fs-small); font-weight: var(--fw-bold); }
.ai-capabilities small { display: block; font-size: var(--fs-micro); line-height: 1.5; color: var(--text-muted); }
.ai-usage {
  display: flex; flex-direction: column; margin-block: var(--sp-3);
  border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface-2);
}
.ai-usage > div {
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
  min-height: 42px; padding: 0 var(--sp-3); font-size: var(--fs-small);
}
.ai-usage > div + div { border-block-start: 1px solid var(--border); }
.ai-usage span { color: var(--text-muted); }
.ai-usage b { font-weight: var(--fw-bold); font-variant-numeric: tabular-nums; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ai-side .card > p.small { line-height: 1.6; }

/* ---------- First-run setup wizard ---------- */
dialog.modal.setup-step-dialog { padding: var(--sp-6) var(--sp-8) var(--sp-8); }
dialog.modal.setup-step-dialog .modal-head { margin-block-end: var(--sp-2); }
dialog.modal.setup-dialog .modal-head h2 { font-size: var(--fs-small); font-weight: var(--fw-bold); color: var(--text-muted); letter-spacing: 0; }

/* Welcome (step 0) */
dialog.modal.setup-welcome-dialog {
  width: min(600px, calc(100vw - 32px)); padding: 0; overflow: hidden auto;
  background:
    radial-gradient(90% 60% at 50% -8%, color-mix(in srgb, var(--accent-vivid) 22%, transparent), transparent 70%),
    radial-gradient(55% 45% at 100% 0%, color-mix(in srgb, var(--accent-2-vivid) 16%, transparent), transparent 75%),
    radial-gradient(55% 45% at 0% 0%, color-mix(in srgb, var(--chart-2) 14%, transparent), transparent 75%),
    var(--elevated);
}
dialog.modal.setup-welcome-dialog .modal-head {
  position: absolute; inset-block-start: var(--sp-4); inset-inline: var(--sp-4); z-index: 1; margin: 0;
  justify-content: flex-end; pointer-events: none;
}
dialog.modal.setup-welcome-dialog .modal-head h2 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
dialog.modal.setup-welcome-dialog .modal-head .icon-button { pointer-events: auto; background: color-mix(in srgb, var(--surface) 70%, transparent); }
.setup-welcome {
  display: flex; flex-direction: column; align-items: center; gap: var(--sp-4);
  padding: var(--sp-12) var(--sp-10) var(--sp-8); text-align: center;
}
.setup-logo {
  display: grid; place-items: center; width: 96px; height: 96px; margin-block-end: var(--sp-2);
  border-radius: 30px; background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: 0 18px 40px -16px color-mix(in srgb, var(--accent-2-vivid) 65%, transparent), var(--shadow-1);
}
.setup-logo .brand-svg { display: block; width: 64px; height: 64px; filter: drop-shadow(0 6px 12px color-mix(in srgb, var(--accent-vivid) 30%, transparent)); }
.setup-welcome > h2 {
  font-size: 34px; line-height: 1.15; font-weight: var(--fw-black); letter-spacing: -0.02em; text-wrap: balance;
}
.setup-welcome > p:not(.muted) {
  max-width: 44ch; font-size: 16px; line-height: 1.7; color: var(--text-muted); text-wrap: pretty;
}
.setup-choices {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-3);
  width: 100%; max-width: 460px; margin-block-start: var(--sp-3);
}
.setup-choices > .button { min-height: 56px; width: 100%; font-size: 16px; padding-inline: var(--sp-4); }
.setup-choices > .button.primary { box-shadow: 0 10px 22px -12px color-mix(in srgb, var(--accent) 80%, transparent); }
.setup-choices > .button:not(.primary) { background: var(--surface); }
.setup-welcome > p.muted.small { font-size: var(--fs-micro); color: var(--text-subtle); }

/* Steps */
.setup-form { display: flex; flex-direction: column; gap: var(--sp-3); }
.setup-dots { display: flex; gap: 6px; margin-block-end: var(--sp-3); }
.setup-dots > i {
  flex: 1; height: 5px; border-radius: var(--r-pill); background: var(--track);
  transition: background var(--dur-base) var(--ease-out);
}
.setup-dots > i.on { background: var(--accent-vivid); }
.setup-form > h2 { font-size: 26px; line-height: 1.25; font-weight: var(--fw-black); letter-spacing: -0.015em; text-wrap: balance; }
.setup-form > h2 + p.muted { margin-block-start: calc(-1 * var(--sp-1)); font-size: var(--fs-body); line-height: 1.65; color: var(--text-muted); }
.setup-form > h2 + p.muted { margin-block-end: var(--sp-3); text-wrap: pretty; }
.setup-form > .field > span, .setup-amount > span:first-child {
  font-size: var(--fs-small); font-weight: var(--fw-bold); color: var(--text);
}
.setup-form > .field > input:not(#\_) { min-height: 56px; font-size: 18px; padding-inline: var(--sp-4); border-radius: var(--r-lg); }
.setup-form > .field > select { min-height: 52px; border-radius: var(--r-md); }
.setup-amount { display: flex; flex-direction: column; gap: var(--sp-2); }
.setup-amount + .setup-amount, .setup-amount + .field, .field + .setup-amount { margin-block-start: var(--sp-2); }
.setup-amount > small { font-size: var(--fs-micro); line-height: 1.5; color: var(--text-subtle); }
.setup-form .balance-input { min-height: 96px; }
.setup-form:has(.setup-amount ~ .setup-amount) .balance-input { min-height: 72px; }
.setup-form:has(.setup-amount ~ .setup-amount) .balance-input > input:not(#\_) { font-size: 34px; min-height: 48px; }
.setup-form:has(.setup-amount ~ .setup-amount) .balance-currency { font-size: 22px; }
.setup-form > .form-error:not(:empty) { margin-block: var(--sp-1) 0; }
/* components.css drops the outer box when the error is a .notice; keep only one bottom gap */
:is(.setup-form, #sync-form, #backup-form, #decrypt-form) > .form-error > .notice { margin: 0; }
.setup-actions { margin-block-start: var(--sp-4); }
.modal .setup-actions { margin-block-start: var(--sp-5); }
.setup-actions > .button { min-height: 48px; }
.setup-actions > .button[type="submit"] { min-width: 148px; font-size: 16px; }
.setup-actions > .button:not([type="submit"]) { padding-inline: var(--sp-5); }
.setup-actions > .button[data-action="setup-back"] { margin-inline-start: auto; }
.setup-actions > .button[data-action="setup-skip"] { background: transparent; border-color: transparent; color: var(--accent-text); }
.setup-actions > .button[data-action="setup-skip"]:hover { background: var(--accent-soft); }

/* ---------- What's new ---------- */
.whats-new { display: flex; flex-direction: column; gap: var(--sp-1); margin-block-start: var(--sp-3); }
.whats-new-item {
  display: flex; align-items: center; gap: var(--sp-3); width: 100%; min-height: 64px;
  padding: var(--sp-3); border-radius: var(--r-md); text-align: start; color: var(--text);
  border: 1px solid transparent;
}
button.whats-new-item { cursor: pointer; transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out); }
button.whats-new-item:hover { background: var(--hover); border-color: var(--border); }
button.whats-new-item:focus-visible { outline-offset: -2px; }
.whats-new-item > span:nth-child(2) { flex: 1; min-width: 0; }
.whats-new-item b { display: block; font-size: var(--fs-body); font-weight: var(--fw-bold); line-height: 1.4; }
.whats-new-item small { display: block; margin-block-start: 2px; font-size: var(--fs-small); line-height: 1.55; color: var(--text-muted); }
.whats-new-item > svg:last-child { flex: none; color: var(--text-subtle); }
button.whats-new-item:hover > svg:last-child { color: var(--accent-text); }
.whats-new-icon {
  display: grid; place-items: center; flex: none; width: 44px; height: 44px; border-radius: 14px;
  background: var(--accent-soft); color: var(--accent-text);
}
.whats-new-item:nth-child(6n+2) .whats-new-icon { background: var(--accent-2-soft); color: var(--accent-2); }
.whats-new-item:nth-child(6n+3) .whats-new-icon { background: var(--positive-soft); color: var(--positive); }
.whats-new-item:nth-child(6n+4) .whats-new-icon { background: var(--warning-soft); color: var(--warning); }
.whats-new-item:nth-child(6n+5) .whats-new-icon { background: var(--chart-6-soft); color: var(--accent-2); }
.whats-new-item:nth-child(6n+6) .whats-new-icon { background: var(--info-soft); color: var(--info); }
.whats-new-item:first-child .whats-new-icon { background: var(--brand-gradient); color: var(--on-hero); }
dialog.modal:has(.whats-new) .confirm-text { font-size: var(--fs-body); }

/* Category suggested automatically while typing a description (transaction form) */
.ai-suggested > select { border-color: var(--accent-2); box-shadow: 0 0 0 3px var(--accent-2-soft); }
.ai-suggested > span::after { content: " · הוצע אוטומטית"; color: var(--accent-2); font-weight: var(--fw-bold); }

/* ---------- Settings page ---------- */
/* Profile card: the two helper buttons sit together, the save action below them */
#settings-form > .form-grid ~ .button { margin-block-start: var(--sp-4); }
#settings-form > .form-actions { padding-block-start: var(--sp-4); margin-block-start: var(--sp-4); border-block-start: 1px solid var(--border); }

/* Backup */
.backup-stats { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-block: var(--sp-4) var(--sp-2); }
.backup-stats > span {
  display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 var(--sp-3);
  border-radius: var(--r-pill); background: var(--surface-2); border: 1px solid var(--border);
  font-size: var(--fs-small); font-weight: var(--fw-semibold); font-variant-numeric: tabular-nums; color: var(--text);
}
.backup-stats > span > svg { color: var(--accent-text); flex: none; }
.backup-stats + p.muted { font-size: var(--fs-small); margin-block-end: var(--sp-3); }
.backup-stats ~ .actions + input + p.small { margin-block: var(--sp-3) var(--sp-1); line-height: 1.6; }
.backup-stats ~ p.small + .button { margin-block-start: var(--sp-2); }

/* Dollar rate */
.fx-card .section-head + .fx-now { margin-block-start: var(--sp-4); }
.fx-now {
  display: flex; align-items: center; gap: var(--sp-4); flex-wrap: wrap;
  padding: var(--sp-4); border-radius: var(--r-lg);
  background: var(--surface-2); border: 1px solid var(--border);
}
.fx-symbol {
  display: grid; place-items: center; flex: none; width: 52px; height: 52px; border-radius: 16px;
  background: var(--positive-soft); color: var(--positive);
  font-family: var(--font-num); font-size: 24px; font-weight: var(--fw-black);
}
.fx-now > div { flex: 1 1 160px; min-width: 0; }
.fx-now b {
  display: block; width: fit-content; font-family: var(--font-num); font-size: var(--fs-num-xl); line-height: 1.1;
  font-weight: var(--fw-black); letter-spacing: var(--tracking-tight); font-variant-numeric: tabular-nums;
}
.fx-now small { display: block; margin-block-start: 4px; font-size: var(--fs-small); color: var(--text-muted); }
.fx-now > .button { flex: none; }
html.privacy .fx-now b { filter: blur(7px); transition: filter var(--dur-fast) var(--ease-out); }
html.privacy .fx-now b:hover { filter: none; }
.fx-card > .notify-row { margin-block-start: var(--sp-2); border-block-start: 0; }
.fx-manual { margin-block-start: var(--sp-2); padding-block-start: var(--sp-4); border-block-start: 1px solid var(--border); }
.fx-manual > .field { max-width: 320px; }
.fx-manual .form-actions { margin-block-start: var(--sp-3); }
.fx-card > .notice { margin-block-start: var(--sp-3); }
.fx-hint { color: var(--accent-text) !important; }

/* The dollar-rate and Claude cards share a row (.two-columns): equal heights, the rate tile takes up the slack
   and the Claude actions sit on the card's bottom edge */
.two-columns:has(> #fx-card) { align-items: stretch; }
#fx-card, .two-columns > .ai-settings-card { display: flex; flex-direction: column; }
@media (min-width: 901px) {
  /* Side by side the rate becomes a centred display tile that fills the spare height */
  .two-columns > #fx-card > .fx-now {
    flex: 1 0 auto; flex-direction: column; flex-wrap: nowrap; justify-content: center; gap: var(--sp-3);
    padding: var(--sp-5) var(--sp-4); text-align: center;
    background:
      radial-gradient(70% 60% at 50% 38%, color-mix(in srgb, var(--positive-vivid) 9%, transparent), transparent 75%),
      var(--surface-2);
  }
  .two-columns > #fx-card > .fx-now > div { flex: none; display: flex; flex-direction: column; align-items: center; }
  .two-columns > #fx-card .fx-now b { font-size: 40px; }
}
.two-columns > .ai-settings-card > form { display: flex; flex-direction: column; flex: 1; }
.two-columns > .ai-settings-card .form-grid { margin-block-end: var(--sp-5); }
.two-columns > .ai-settings-card .form-actions { margin-block-start: auto; }
.ai-settings-card .section-head p, #fx-card .section-head p { text-wrap: pretty; }

/* Claude settings */
.ai-settings-card .form-grid { margin-block-start: var(--sp-4); }
/* The key and the long model names get the full width; effort and usage share the last row */
.ai-settings-card .form-grid > .field:nth-child(-n+2) { grid-column: 1 / -1; }
.ai-usage-inline {
  display: flex; flex-direction: column; justify-content: center; gap: 2px;
  min-height: 44px; padding: var(--sp-2) var(--sp-3);
  border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--border);
}
.ai-usage-inline > b {
  width: fit-content; font-family: var(--font-num); font-size: var(--fs-num-md); font-weight: var(--fw-black);
  font-variant-numeric: tabular-nums;
}
.ai-usage-inline > small { font-size: var(--fs-micro); line-height: 1.5; color: var(--text-muted); }
.ai-settings-card .form-actions { padding-block-start: var(--sp-4); border-block-start: 1px solid var(--border); }
.ai-settings-card .form-actions > .button.danger { order: 1; margin-inline-start: auto; }

/* Sync */
.sync-pitch { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-3); margin-block: var(--sp-4); }
.sync-pitch > div {
  display: flex; flex-direction: column; gap: var(--sp-3); min-width: 0;
  padding: var(--sp-4); border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--border);
}
.sync-pitch p { font-size: var(--fs-small); line-height: 1.6; color: var(--text-muted); }
.sync-pitch p b { display: block; margin-block-end: 2px; font-size: var(--fs-body); color: var(--text); font-weight: var(--fw-bold); }
.sync-card .sync-pitch ~ .button + p.small { margin-block-start: var(--sp-3); line-height: 1.6; }
.sync-status { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-3); margin-block: var(--sp-4); }
.sync-status > div {
  display: flex; flex-direction: column; gap: 2px; min-width: 0;
  padding: var(--sp-3) var(--sp-4); border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--border);
}
.sync-status span { font-size: var(--fs-micro); color: var(--text-muted); }
.sync-status b { font-size: var(--fs-small); font-weight: var(--fw-bold); overflow-wrap: anywhere; }
.sync-card > .notice { margin-block-end: var(--sp-3); }
.sync-card .actions > .button.danger { order: 1; margin-inline-start: auto; }
.sync-card > .confirm-text { margin-block: var(--sp-3); }

.sync-steps {
  display: flex; flex-direction: column; gap: var(--sp-3); margin-block: var(--sp-2) var(--sp-5);
  padding: 0; list-style: none; counter-reset: sync-step;
}
.sync-steps > li {
  position: relative; counter-increment: sync-step; min-height: 30px;
  padding-inline-start: 42px; padding-block-start: 4px;
  font-size: var(--fs-small); line-height: 1.65; color: var(--text);
}
.sync-steps > li::before {
  content: counter(sync-step); position: absolute; inset-inline-start: 0; inset-block-start: 0;
  display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent-text);
  font-family: var(--font-num); font-size: var(--fs-small); font-weight: var(--fw-black);
}
.sync-steps > li:not(:last-child)::after {
  content: ""; position: absolute; inset-inline-start: 14.5px; inset-block: 34px -10px; width: 1px; background: var(--border);
}
.sync-steps a { color: var(--accent-text); font-weight: var(--fw-bold); text-decoration: underline; text-underline-offset: 3px; }
.sync-steps svg { vertical-align: -3px; color: var(--accent-text); }
#sync-form > .form-grid { margin-block-start: var(--sp-2); }

/* Versions */
.versions-card .section-head { align-items: flex-start; }
.versions-list { display: flex; flex-direction: column; margin-block: var(--sp-3); }
.version-row {
  display: flex; align-items: center; gap: var(--sp-3); min-height: 60px; padding-block: var(--sp-2);
  border-block-start: 1px solid var(--border);
}
.version-row:first-child { border-block-start: 0; }
.version-row .asset-icon { width: 36px; height: 36px; border-radius: 11px; }
.version-row > div { flex: 1; min-width: 0; }
.version-row b { display: block; font-size: var(--fs-small); font-weight: var(--fw-bold); font-variant-numeric: tabular-nums; }
.version-row small { display: block; margin-block-start: 1px; font-size: var(--fs-micro); line-height: 1.5; color: var(--text-muted); }
.version-row > .button { flex: none; min-height: 34px; padding-inline: var(--sp-4); font-size: var(--fs-small); }
.versions-list > p.small { padding-block: var(--sp-3); }
.versions-actions {
  align-items: center; gap: var(--sp-3); padding-block-start: var(--sp-4); border-block-start: 1px solid var(--border);
}
.versions-actions > span { flex: 1 1 260px; min-width: 0; line-height: 1.6; }
dialog.modal .versions-list { max-height: min(52dvh, 460px); overflow-y: auto; margin-block-end: 0; }

/* App + notifications */
.app-cards { align-items: stretch; }
.app-card > .confirm-text, .app-card > .notice, .app-card > .sync-steps, .app-card > .app-status { margin-block-start: var(--sp-4); }
.app-card > .sync-steps { margin-block-end: var(--sp-3); }
.app-card > .notice { margin-block-end: 0; }
.app-card > .button { margin-block-start: var(--sp-2); }
.app-status {
  display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-3) var(--sp-4);
  border-radius: var(--r-md); background: var(--positive-soft);
}
.app-status > svg { flex: none; color: var(--positive); }
.app-status b { display: block; font-size: var(--fs-small); font-weight: var(--fw-bold); }
.app-status small { display: block; font-size: var(--fs-micro); color: var(--text-muted); }
.app-perks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-2); margin-block-start: var(--sp-4); }
.app-perks > span {
  display: flex; align-items: center; gap: var(--sp-2); min-height: 44px; padding: 0 var(--sp-3);
  border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--border);
  font-size: var(--fs-small); font-weight: var(--fw-semibold); min-width: 0;
}
.app-perks > span > svg { flex: none; color: var(--accent-text); }
.notify-card .notify-list { margin-block-start: var(--sp-3); }
.notify-card > .notice { margin-block-start: var(--sp-3); }
.notify-card > .actions { align-items: center; gap: var(--sp-3); margin-block-start: var(--sp-4); padding-block-start: var(--sp-4); border-block-start: 1px solid var(--border); }
.notify-card > .actions > span { flex: 1 1 200px; min-width: 0; line-height: 1.6; }

/* Categories, export, reset */
