  position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 1px;
  pointer-events: none; padding: 18%;
}
.donut-center small { font-size: var(--fs-micro); color: var(--text-muted); font-weight: var(--fw-semibold); }
.donut-center b { font-family: var(--font-num); font-size: 19px; font-weight: var(--fw-black); letter-spacing: var(--tracking-tight); line-height: 1.2; white-space: nowrap; }
.donut-legend { display: flex; flex-direction: column; gap: var(--sp-2); flex: 1 1 200px; min-width: 0; max-width: 360px; }
.donut-legend > div {
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
  min-height: 28px; font-size: var(--fs-small);
}
.donut-legend > div + div { border-block-start: 1px dashed var(--border); padding-block-start: var(--sp-2); }
.legend-name { display: inline-flex; align-items: center; gap: var(--sp-2); min-width: 0; color: var(--text); }
.legend-name i { display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 3px; }
.legend-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.donut-legend b { font-family: var(--font-num); font-weight: var(--fw-bold); color: var(--text-muted); }

/* ---------- Score ring ---------- */
.score-ring { position: relative; flex: none; display: grid; place-items: center; }
.score-ring svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.score-ring > div { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; line-height: 1.1; }
.score-ring b { font-family: var(--font-num); font-size: 32px; font-weight: var(--fw-black); letter-spacing: var(--tracking-tight); }
.score-ring small { margin-block-start: 2px; font-size: var(--fs-micro); color: var(--text-muted); }

/* ---------- Fan chart ---------- */
.fan-chart .chart-goal { font-weight: var(--fw-bold); }

/* ---------- Entrance (navigation only) ---------- */
/* backwards, not both: a clip-path left on after the reveal would cut the axis labels that sit just outside the plot */
.page-content.enter .native-chart svg { animation: chart-reveal var(--dur-slow) var(--ease-out) backwards; }
.page-content.enter .donut svg, .page-content.enter .score-ring svg { animation: ring-in var(--dur-slow) var(--ease-out) both; }
@keyframes chart-reveal { from { opacity: 0; clip-path: inset(-20px -80px -20px 100%); } to { opacity: 1; clip-path: inset(-20px -80px -20px -80px); } }
@keyframes ring-in { from { opacity: 0; transform: rotate(-20deg) scale(.94); } to { opacity: 1; transform: none; } }

@media (max-width: 760px) {
  .donut-wrap { gap: var(--sp-4); }
  .donut-legend { flex-basis: 100%; max-width: none; }
  .chart-hover { inset-block-start: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .page-content.enter .native-chart svg, .page-content.enter .donut svg, .page-content.enter .score-ring svg { animation: none; }
  .chart-hover, .graph-point .point-dot { transition: none; }
}

/* Chart colours come from src/charts.js as inline token styles (palette, paletteSoft, tone). */
.native-chart path[fill="url(#chart-fill)"] { opacity: 1; }
#chart-fill stop[stop-opacity=".2"] { stop-opacity: .22; }

/* ============================================================
   Ofek 4.0 — home (dashboard): the customizable board, the balance hero,
   this-month summary, every home widget and the home editor.
   Rendered by src/home-ui.js, widget helpers in src/features.js and
   src/money-ui.js. Tokens only; logical properties only.
   ============================================================ */

/* ---------- Board ---------- */
.home-board { display: flex; flex-direction: column; gap: var(--gap-grid); min-width: 0; }
.home-row { display: grid; gap: var(--gap-grid); align-items: stretch; min-width: 0; }
.home-cell {
  container: home-cell / inline-size;
  min-width: 0; display: flex; flex-direction: column;
}
.home-cell > * { flex: 1 1 auto; }
.page-content.enter .home-cell {
  animation: home-rise var(--dur-slow) var(--ease-out) both;
  animation-delay: calc(min(var(--i, 0), 10) * 28ms);
}
.page-content.enter .home-board.editing .home-cell { animation: none; }
@keyframes home-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* Widget cards: a column with an even rhythm */
.home-cell > .home-widget, .home-cell > .safe-card, .home-cell > .upcoming-card, .home-cell > .split-mini-card,
.home-cell > .health-mini-card, .home-cell > .pace-card, .home-cell > .ai-ask-card {
  display: flex; flex-direction: column; gap: var(--sp-3);
}
.home-cell > .card > .button { align-self: flex-start; }
.home-cell > .card > .row-between:first-child { min-height: 32px; }
.home-cell > .card > .row-between:first-child .eyebrow { gap: var(--sp-2); font-size: 16px; line-height: 1.35; color: var(--text); letter-spacing: 0; }
.home-cell .section-head h2 { font-size: 16px; }
.home-cell > .card > .row-between:first-child .eyebrow svg { color: var(--text-subtle); }
.home-cell > .card > small.muted, .home-cell > .card > small.negative { font-size: var(--fs-micro); line-height: 1.5; }
.home-cell > .card > small.muted { color: var(--text-muted); }
.home-cell > .card > p.small { line-height: 1.6; }
.home-cell .section-head { margin-block-end: var(--sp-3); }
.home-cell .section-head:has(> .icon-button), .home-cell .section-head:has(> .text-button) { flex-wrap: nowrap; }
.home-cell .section-head:has(> .text-button) > div:first-child { flex-basis: auto; }
/* A one-line title with a 44px link/button: centre them on one axis */
.home-cell .section-head:not(:has(p)) { align-items: center; }

/* A widget that could not render */
.home-cell > .card:not([class*="-"]) > p.muted:only-child { margin: 0; }

/* ---------- Balance hero (the signature moment) ---------- */
.card.hero-card {
  position: relative; isolation: isolate; overflow: hidden;
  display: grid; align-content: start;
  grid-template-columns: minmax(0, 1fr);
  grid-template-areas: "top" "balance" "updated" "stats" "foot";
  padding: var(--sp-7);
  border: 0; border-radius: var(--r-xl);
  background: var(--hero-gradient);
  -webkit-backdrop-filter: none; backdrop-filter: none;
  color: var(--hero-text);
  box-shadow: var(--hero-shadow-theme);
}
.card.hero-card::before { /* soft top sheen */
  content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
  background: var(--hero-sheen);
}
.card.hero-card::after { /* two quiet orbit rings at the inline-end corner */
  content: ""; position: absolute; z-index: -1; pointer-events: none;
  inset-block-end: -190px; inset-inline-end: -120px; width: 440px; height: 440px; border-radius: 50%;
  border: 1px solid var(--hero-orb);
  box-shadow: 0 0 0 70px transparent, 0 0 0 71px var(--hero-orb);
}
.hero-top { grid-area: top; display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-4); min-width: 0; }
.hero-label {
  display: inline-flex; align-items: center; gap: var(--sp-2); min-width: 0; min-height: 40px;
  font-size: var(--fs-body); font-weight: var(--fw-semibold); color: var(--hero-text-muted);
}
.hero-label svg { flex: none; }
.hero-edit {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2); flex: none;
  min-height: var(--touch); padding: 0 var(--sp-5);
  border: 0; border-radius: var(--r-pill);
  background: var(--hero-btn-solid); color: var(--hero-btn-solid-text);
  font-size: var(--fs-small); font-weight: var(--fw-bold); white-space: nowrap;
  box-shadow: 0 8px 22px -10px color-mix(in srgb, var(--hero-btn-solid-text) 70%, transparent);
  transition: transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
}
.hero-edit:hover { transform: translateY(-1px); box-shadow: 0 12px 26px -10px color-mix(in srgb, var(--hero-btn-solid-text) 80%, transparent); }
.hero-edit:active { transform: scale(.97); }
.hero-card :focus-visible { outline-color: var(--on-hero); }
.hero-balance {
  grid-area: balance; justify-self: start; width: fit-content; max-width: 100%;
  margin-block: var(--sp-3) var(--sp-2);
  font-family: var(--font-num); font-size: var(--fs-display); line-height: var(--lh-display);
  font-weight: var(--fw-display); letter-spacing: -0.03em; color: var(--hero-text);
  overflow-wrap: anywhere;
}
.hero-balance.negative {
  padding: 2px var(--sp-3); border-radius: var(--r-md);
  background: color-mix(in srgb, var(--negative-vivid) 42%, transparent);
  box-shadow: inset 0 0 0 1px var(--hero-tile-border);
}
.hero-updated {
  grid-area: updated; display: inline-flex; align-items: center; gap: var(--sp-2); min-width: 0;
  font-size: var(--fs-small); color: var(--hero-text-muted);
}
.hero-balance .hero-cur {
  margin-inline-start: .1em; font-size: .52em; line-height: 1; vertical-align: baseline;
  font-weight: var(--fw-bold); letter-spacing: 0; opacity: .82;
}
.hero-stat .hero-cur { font-size: .72em; font-weight: var(--fw-bold); letter-spacing: 0; opacity: .82; }
/* Freshness of the typed-in balance: a live green dot only when it is recent */
.hero-updated::before {
  content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%;
  background: var(--hero-pulse); box-shadow: 0 0 0 4px var(--hero-pulse-ring);
}
.hero-updated.stale::before {
  background: var(--warning-vivid);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--warning-vivid) 28%, transparent);
}
.hero-updated.stale.never::before { display: none; }
.hero-stats {
  grid-area: stats; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-3);
  margin-block-start: var(--sp-6); min-width: 0;
}
.hero-stat {
  display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-width: 0;
  padding: var(--sp-3) var(--sp-4);
  border: 1px solid var(--hero-tile-border); border-radius: var(--r-md);
  background: var(--hero-tile); color: var(--hero-text); text-align: start;
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  transition: background var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
}
.hero-stat:hover { background: color-mix(in srgb, var(--hero-tile) 100%, var(--hero-btn)); transform: translateY(-1px); }
.hero-stat:active { transform: scale(.98); }
.hero-stat > span { font-size: var(--fs-small); font-weight: var(--fw-medium); color: var(--hero-text-muted); }
.hero-stat > b {
  width: fit-content; max-width: 100%;
  font-family: var(--font-num); font-size: 22px; line-height: 1.3; font-weight: var(--fw-black);
  letter-spacing: var(--tracking-tight); overflow-wrap: anywhere;
}
.hero-stat > small { font-size: var(--fs-micro); color: var(--hero-text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.hero-foot { grid-area: foot; display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-2); margin-block-start: var(--sp-4); min-width: 0; }
.hero-foot:empty { display: none; }

/* Dollar chip (hero foot and anywhere outside the top bar) */
.fx-chip {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
  min-height: 34px; padding-inline: var(--sp-2) var(--sp-3);
  border-radius: var(--r-pill); background: var(--accent-soft); color: var(--text);
  font-size: var(--fs-small); font-weight: var(--fw-semibold); white-space: nowrap;
}
.fx-chip > svg { color: var(--accent-text); }
.fx-chip b { font-weight: var(--fw-black); }
.fx-chip i {
  font-style: normal; font-size: 11px; font-weight: var(--fw-bold);
  padding: 1px 8px; border-radius: var(--r-pill); background: var(--surface); color: var(--accent-text);
}
.hero-card .fx-chip {
  background: var(--hero-btn); color: var(--hero-text);
  border: 1px solid var(--hero-tile-border);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.hero-card .fx-chip > svg { color: var(--hero-text); }
.hero-card .fx-chip i { background: var(--hero-tile); color: var(--hero-text-muted); }

/* No checking account yet */
.hero-empty { grid-column: 1 / -1; display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-2); max-width: 560px; }
.hero-empty h2 { margin-block-start: var(--sp-2); font-size: 26px; line-height: 1.25; font-weight: var(--fw-black); letter-spacing: var(--tracking-tight); color: var(--hero-text); }
.hero-empty p { font-size: var(--fs-body); color: var(--hero-text-muted); }
.hero-empty .button.primary {
  margin-block-start: var(--sp-3); min-height: var(--touch); padding-inline: var(--sp-5);
  background: var(--hero-btn-solid); color: var(--hero-btn-solid-text); border: 0;
}
.hero-empty .button.primary:hover { background: var(--hero-btn-solid); filter: brightness(.97); }

/* Wide hero (a full row on desktop): balance at the start, tiles at the end */
@container home-cell (min-width: 860px) {
  .card.hero-card {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr);
    grid-template-areas: "top top" "balance stats" "updated stats" "foot stats";
    grid-template-rows: auto auto auto 1fr;
    column-gap: var(--sp-8);
    padding: var(--sp-8);
  }
  .hero-balance { margin-block: var(--sp-4) var(--sp-3); }
  .hero-stats { align-self: end; margin-block-start: 0; }
  .hero-stat { padding: var(--sp-4) var(--sp-5); }
  .hero-stat > b { font-size: 26px; }
  .card.hero-card::after { inset-block: -250px auto; inset-inline-end: -170px; width: 520px; height: 520px; }
}

/* ---------- This month: a header row, then three metrics as one calm card ---------- */
.summary-grid {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); min-width: 0;
  background: var(--card-bg); -webkit-backdrop-filter: var(--card-blur); backdrop-filter: var(--card-blur);
  border: 1px solid var(--border); border-radius: var(--r-lg);
  box-shadow: var(--shadow-2), var(--inner-highlight); overflow: hidden;
}
.summary-head {
  grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
  gap: var(--sp-2) var(--sp-3); min-width: 0;
  padding: var(--sp-5) var(--sp-6) 0;
}
.summary-head > .eyebrow {
  display: inline-flex; align-items: center; gap: var(--sp-2); min-width: 0;
  font-size: 16px; line-height: 1.35; font-weight: var(--fw-bold); letter-spacing: 0; text-transform: none; color: var(--text);
}
.summary-head > .eyebrow svg { flex: none; color: var(--text-subtle); }
.summary-head > .badge { flex: none; font-variant-numeric: tabular-nums; }
.summary-grid:has(> .summary-head) { grid-template-rows: auto 1fr; }
.summary-grid > .card.metric {
  min-width: 0; justify-content: center;
  padding: var(--sp-4) var(--sp-6) var(--sp-5);
  border: 0; border-radius: 0; background: transparent; box-shadow: none;
  -webkit-backdrop-filter: none; backdrop-filter: none;
}
.summary-grid > .metric + .metric { border-inline-start: 1px solid var(--border); }
.summary-grid .metric-top > span:first-child { font-weight: var(--fw-semibold); }
.summary-grid .metric-value { margin-block-start: var(--sp-3); font-size: 30px; }
.summary-grid .metric-detail { font-size: var(--fs-micro); line-height: 1.5; }
.summary-grid .metric-detail .positive, .summary-grid .metric-detail .negative { font-weight: var(--fw-bold); }
@container home-cell (max-width: 640px) {
  .summary-head { padding: var(--sp-4) var(--sp-4) 0; }
  .summary-grid > .card.metric { padding: var(--sp-3) var(--sp-4) var(--sp-4); }
  .summary-grid .metric-value { font-size: 23px; }
}

/* ---------- Net worth card ---------- */
.net-card { display: flex; flex-direction: column; gap: var(--sp-2); overflow: hidden; }
.net-heading { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); font-size: var(--fs-small); font-weight: var(--fw-semibold); color: var(--text-muted); }
.net-mark { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: var(--accent-2-soft); color: var(--accent-2); flex: none; }
.net-value {
  width: fit-content; max-width: 100%; margin-block-start: var(--sp-1);
  font-family: var(--font-num); font-size: var(--fs-num-xl); line-height: 1.15; font-weight: var(--fw-black);
  letter-spacing: var(--tracking-tight); overflow-wrap: anywhere;
}
.net-change { min-height: 22px; font-size: var(--fs-small); }
.net-bottom {
  position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-3);
  margin-block-start: auto; padding-block-start: var(--sp-3); border-block-start: 1px solid var(--border);
}
.net-bottom > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.net-bottom span { font-size: var(--fs-micro); color: var(--text-muted); }
.net-bottom b { width: fit-content; font-size: var(--fs-num-sm); font-weight: var(--fw-bold); }
.net-decoration { display: none; }

/* ---------- Assets strip ---------- */
.asset-strip {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); min-width: 0;
  background: var(--card-bg); -webkit-backdrop-filter: var(--card-blur); backdrop-filter: var(--card-blur);
  border: 1px solid var(--border); border-radius: var(--r-lg);
  box-shadow: var(--shadow-2), var(--inner-highlight); overflow: hidden;
}
.asset-strip-item {
  display: flex; align-items: center; gap: var(--sp-3); min-width: 0;
  padding: var(--sp-4) var(--sp-5); border: 0; background: transparent; color: var(--text); text-align: start;
  transition: background var(--dur-fast) var(--ease-out);
}
.asset-strip-item + .asset-strip-item { border-inline-start: 1px solid var(--border); }
.asset-strip-item:hover { background: var(--hover); }
.asset-strip-item:focus-visible { outline-offset: -3px; border-radius: var(--r-lg); }
.asset-strip-item > div { display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0; }
.asset-strip-item span:not(.asset-icon) { font-size: var(--fs-small); color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.asset-strip-item b { width: fit-content; max-width: 100%; font-size: var(--fs-num-md); font-weight: var(--fw-black); letter-spacing: var(--tracking-tight); overflow-wrap: anywhere; }
.asset-strip-item > svg:last-child { color: var(--text-subtle); flex: none; }
@container home-cell (max-width: 820px) {
  .asset-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .asset-strip-item:nth-child(3) { border-inline-start: 0; }
  .asset-strip-item:nth-child(n+3) { border-block-start: 1px solid var(--border); }
}

/* ---------- Net worth over time ---------- */
.worth-chart { display: flex; flex-direction: column; }
.worth-chart .chart { flex: 1 1 auto; min-height: 180px; }
.chart-stat { display: flex; align-items: baseline; flex-wrap: wrap; gap: var(--sp-2) var(--sp-3); margin-block-end: var(--sp-3); }
.chart-stat > b { width: fit-content; font-family: var(--font-num); font-size: 28px; line-height: 1.15; font-weight: var(--fw-black); letter-spacing: var(--tracking-tight); }

/* ---------- Spending donut ---------- */
.expenses-chart { display: flex; flex-direction: column; }
.expenses-chart .section-head .icon-button { margin-block-start: -6px; color: var(--accent-text); }
.expenses-chart .donut-wrap { flex: 1 1 auto; align-content: center; }
/* Colours follow the rank (top 4 + "other"), so two categories never share a colour */
.expenses-chart .donut circle:nth-of-type(1) { stroke: var(--chart-1) !important; }
.expenses-chart .donut circle:nth-of-type(2) { stroke: var(--chart-2) !important; }
.expenses-chart .donut circle:nth-of-type(3) { stroke: var(--chart-6) !important; }
.expenses-chart .donut circle:nth-of-type(4) { stroke: var(--chart-3) !important; }
.expenses-chart .donut-legend > div:nth-child(1) i { background: var(--chart-1) !important; }
.expenses-chart .donut-legend > div:nth-child(2) i { background: var(--chart-2) !important; }
.expenses-chart .donut-legend > div:nth-child(3) i { background: var(--chart-6) !important; }
.expenses-chart .donut-legend > div:nth-child(4) i { background: var(--chart-3) !important; }
.expenses-chart .donut-legend b { color: var(--text); }
@container home-cell (max-width: 460px) {
  .expenses-chart .donut-legend { flex-basis: 100%; max-width: none; }
}

/* ---------- Insight banner ---------- */
.insight-banner {
  display: flex; align-items: center; gap: var(--sp-4); min-width: 0;
  padding: var(--sp-4) var(--sp-5);
  border: 1px solid color-mix(in srgb, var(--accent-2) 22%, var(--border));
  border-radius: var(--r-lg);
  background: linear-gradient(110deg, var(--accent-soft), var(--accent-2-soft));
  color: var(--text);
}
.insight-banner .insight-icon {
  display: grid; place-items: center; flex: none; width: 46px; height: 46px; border-radius: 14px;
  background: var(--brand-gradient); color: var(--on-hero); box-shadow: var(--shadow-1);
}
.insight-banner > div { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.insight-banner > div > b { font-size: var(--fs-h3); font-weight: var(--fw-bold); line-height: 1.4; }
.insight-banner > div > span { font-size: var(--fs-small); color: var(--text-muted); line-height: 1.5; }
.insight-banner > button {
  display: inline-flex; align-items: center; gap: 4px; flex: none;
  min-height: 40px; padding: 0 var(--sp-4);
  border: 1px solid var(--border); border-radius: var(--r-pill);
  background: var(--surface); color: var(--accent-text);
  font-size: var(--fs-small); font-weight: var(--fw-bold); white-space: nowrap; box-shadow: var(--shadow-1);
  transition: border-color var(--dur-fast) var(--ease-out);
}
.insight-banner > button:hover { border-color: var(--accent); }
@container home-cell (max-width: 560px) {
  .insight-banner { flex-wrap: wrap; align-items: flex-start; }
  .insight-banner > div { flex-basis: calc(100% - 62px); }
  .insight-banner > button { margin-inline-start: 62px; }
}

/* ---------- Health score ---------- */
.health-mini { display: flex; align-items: center; gap: var(--sp-4); flex: 1 1 auto; min-width: 0; }
.health-mini > div:last-child { display: flex; flex-direction: column; gap: var(--sp-1); min-width: 0; }
.health-mini > div:last-child > b { font-size: var(--fs-num-md); font-weight: var(--fw-black); }
.health-mini > div:last-child > small { font-size: var(--fs-small); color: var(--text-muted); line-height: 1.55; }
.health-mini .score-ring b { font-size: 28px; }
.health-mini .score-ring small { font-size: 11px; }

/* ---------- Pace (compact) ---------- */
.home-cell > .pace-card .pace-numbers { margin-block: var(--sp-1) var(--sp-1); }
.home-cell > .pace-card .pace-numbers b { font-size: 20px; }
.home-cell > .pace-card > p { margin-block-start: var(--sp-1); line-height: 1.6; }

/* ---------- Ask Claude ---------- */
.ai-ask-card .kbd-hint { flex: none; }
.ai-ask-card > p.muted { font-size: var(--fs-small); line-height: 1.6; }
.ai-ask-card .ai-quick { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
.ai-ask-card .ai-quick input { flex: 1; border-radius: var(--r-pill); padding-inline: var(--sp-4); font-size: var(--fs-small); }
.ai-ask-card .ai-send {
  display: grid; place-items: center; flex: none; width: var(--control-h); height: var(--control-h);
  border: 0; border-radius: 50%; background: var(--accent); color: var(--accent-contrast);
  transition: background var(--dur-fast) var(--ease-out);
}
.ai-ask-card .ai-send:hover { background: var(--accent-hover); }
.ai-ask-card .ai-send svg { transform: scaleX(-1); }
.ai-ask-card .ai-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.ai-ask-card .ai-chip {
  display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
  min-height: 34px; padding: 0 var(--sp-3);
  border: 1px solid var(--border); border-radius: var(--r-pill);
  background: var(--surface-2); color: var(--text);
  font-size: var(--fs-micro); font-weight: var(--fw-semibold);
  transition: border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
}
.ai-ask-card .ai-chip svg { color: var(--accent-text); flex: none; }
.ai-ask-card .ai-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ai-ask-card .ai-chip:hover { border-color: var(--accent); background: var(--accent-soft); }
.ai-ask-card {
  background: linear-gradient(160deg, color-mix(in srgb, var(--accent-soft) 70%, transparent), transparent 55%), var(--card-bg);
}

/* ---------- Safe to spend ---------- */
.safe-number {
  width: fit-content; max-width: 100%;
  font-family: var(--font-num); font-size: var(--fs-num-xl); line-height: 1.1; font-weight: var(--fw-black);
  letter-spacing: var(--tracking-tight); color: var(--positive);
}
.safe-card > small { margin-block-start: auto; }

/* ---------- Upcoming charges ---------- */
.mini-agenda { display: flex; flex-direction: column; }
.mini-agenda > div {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: var(--sp-3);
  min-height: 52px; padding-block: var(--sp-2);
  font-size: var(--fs-small);
}
.mini-agenda > div + div { border-block-start: 1px solid var(--border); }
.mini-date { /* "16 באוק׳" wraps into a stacked tile: day on top, month under it */
  display: block; inline-size: min-content; min-inline-size: 46px; padding: 5px 6px;
  border-radius: var(--r-sm); background: var(--surface-2); border: 1px solid var(--border);
  font-size: 11px; font-weight: var(--fw-bold); color: var(--text-muted); line-height: 1.25; text-align: center; white-space: normal;
}
.mini-date::first-line { font-family: var(--font-num); font-size: 17px; font-weight: var(--fw-black); color: var(--text); }
.mini-agenda > div > span:nth-child(2) { font-weight: var(--fw-semibold); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini-agenda b { font-size: var(--fs-num-sm); font-weight: var(--fw-bold); white-space: nowrap; }
.after-charges {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--sp-1) var(--sp-3);
  margin-block-start: auto; padding: var(--sp-3) var(--sp-4);
  border-radius: var(--r-md); background: var(--accent-soft);
  font-size: var(--fs-small); font-weight: var(--fw-semibold); color: var(--text);
}
.after-charges > b { font-size: var(--fs-num-md); font-weight: var(--fw-black); letter-spacing: var(--tracking-tight); }
.upcoming-card > p.muted { margin-block-start: var(--sp-1); }

/* ---------- Split & wishlist ---------- */
.split-mini { display: flex; flex-direction: column; }
.split-mini > div { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); min-height: 40px; font-size: var(--fs-small); }
.split-mini > div + div { border-block-start: 1px solid var(--border); }
.split-mini span { color: var(--text-muted); }
.split-mini b { font-size: var(--fs-num-sm); font-weight: var(--fw-bold); }
.ready-chip {
  align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
  min-height: 34px; padding: 0 var(--sp-3); margin-block-start: auto;
  border: 1px solid color-mix(in srgb, var(--warning) 30%, transparent); border-radius: var(--r-pill);
  background: var(--warning-soft); color: var(--warning);
  font-size: var(--fs-micro); font-weight: var(--fw-bold); text-align: start;
}
.ready-chip:hover { border-color: var(--warning); }

/* ---------- Generic widgets: investments, free money, budgets, cash flow ---------- */
.widget-number {
  width: fit-content; max-width: 100%;
  font-family: var(--font-num); font-size: 30px; line-height: 1.15; font-weight: var(--fw-black);
  letter-spacing: var(--tracking-tight); overflow-wrap: anywhere;
}
.widget-sub { display: flex; align-items: center; min-height: 22px; margin-block-start: calc(-1 * var(--sp-2)); font-size: var(--fs-small); }
.widget-alloc { display: flex; gap: 2px; height: 10px; border-radius: var(--r-pill); overflow: hidden; background: var(--track); }
.widget-alloc span { display: block; height: 100%; min-width: 3px; }
.widget-list { display: flex; flex-direction: column; }
.widget-list > div { display: flex; align-items: center; gap: var(--sp-2); min-height: 34px; font-size: var(--fs-small); }
.widget-list > div + div { border-block-start: 1px dashed var(--border); }
.widget-list i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.widget-list span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
.widget-list b { font-weight: var(--fw-bold); white-space: nowrap; }
.invest-widget > small.muted { margin-block-start: auto; }

.free-bar { height: 10px; border-radius: var(--r-pill); background: var(--positive-vivid); overflow: hidden; }
.free-bar span { display: block; height: 100%; border-radius: inherit; background: var(--accent-2-vivid); box-shadow: 2px 0 0 var(--card-bg); }
.free-bar span:dir(rtl) { box-shadow: -2px 0 0 var(--card-bg); }
.free-legend { display: flex; flex-wrap: wrap; gap: var(--sp-1) var(--sp-4); margin-block-start: calc(-1 * var(--sp-1)); font-size: var(--fs-micro); color: var(--text-muted); }
.free-legend > span { display: inline-flex; align-items: center; gap: 6px; }
.free-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; flex: none; }
.free-legend .k-goal { background: var(--accent-2-vivid); }
.free-legend .k-free { background: var(--positive-vivid); }
.free-accounts { margin-block-start: auto; padding-block-start: var(--sp-2); border-block-start: 1px solid var(--border); }
.free-accounts > div + div { border-block-start-style: dashed; }
.free-accounts small { flex: none; font-size: var(--fs-micro); }
.free-accounts small:empty { display: none; }

.widget-budgets { display: flex; flex-direction: column; gap: var(--sp-3); }
.widget-budgets > div { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.widget-budgets .row-between { gap: var(--sp-2); font-size: var(--fs-small); }
.widget-budgets .row-between > span { font-weight: var(--fw-semibold); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.widget-budgets .row-between > small { flex: none; font-size: var(--fs-micro); font-variant-numeric: tabular-nums; }
.widget-budgets .progress { height: 7px; }
.budgets-widget > small { margin-block-start: auto; }

.cashflow-numbers { align-items: stretch; gap: var(--sp-2); }
.cashflow-numbers > div {
  display: flex; flex-direction: column; gap: 1px; flex: 1 1 0; min-width: 0;
  padding: var(--sp-2) var(--sp-3); border-radius: var(--r-sm); background: var(--surface-2);
}
.cashflow-numbers span, .cashflow-numbers small { font-size: var(--fs-micro); color: var(--text-muted); }
.cashflow-numbers b { width: fit-content; max-width: 100%; font-size: var(--fs-num-sm); font-weight: var(--fw-black); overflow-wrap: anywhere; }
.cashflow-widget .chart { margin-block-start: auto; }
/* ~45 daily points: the line carries the shape, a point shows on hover/focus */
.cashflow-widget .graph-point .point-dot { opacity: 0; transition: opacity var(--dur-fast) var(--ease-out); }
.cashflow-widget .graph-point:hover .point-dot, .cashflow-widget .graph-point:focus-visible .point-dot { opacity: 1; }

/* ---------- Recent transactions ---------- */
.recent-card thead {
  position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap;
}
.recent-card td { padding-block: 10px; }
.recent-card tbody tr:first-child td { padding-block-start: 2px; }
.recent-card td:last-child { text-align: end; width: 1%; white-space: nowrap; }
.recent-card td:last-child b { font-size: var(--fs-num-sm); }
.recent-card .transaction-icon { width: 40px; height: 40px; border-radius: var(--r-md); }
.recent-card .transaction-name b { font-size: var(--fs-body); }
.recent-card .empty { padding-block: var(--sp-6); }
@container home-cell (max-width: 560px) {
  .recent-card th:nth-child(2), .recent-card td:nth-child(2) { display: none; }
  .recent-card td:first-child { width: 100%; max-width: 0; } /* the name column gives way, the amount never clips */
  .recent-card .transaction-name { min-width: 0; }
  .recent-card .transaction-name > div { min-width: 0; }
  .recent-card .transaction-name b, .recent-card .transaction-name small {
    display: block; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
}

/* ---------- Goals preview ---------- */
.goals-preview { display: flex; flex-direction: column; }
.goals-preview .section-head .icon-button { margin-block-start: -6px; color: var(--accent-text); background: var(--accent-soft); }
.goal-preview {
  display: flex; align-items: center; gap: var(--sp-3); width: 100%; min-width: 0;
  padding: var(--sp-3) var(--sp-2); margin-inline: calc(-1 * var(--sp-2)); width: calc(100% + 2 * var(--sp-2));
  border: 0; border-radius: var(--r-md); background: transparent; color: var(--text); text-align: start;
  transition: background var(--dur-fast) var(--ease-out);
}
.goal-preview + .goal-preview { box-shadow: 0 -1px 0 var(--border); border-start-start-radius: 0; border-start-end-radius: 0; }
.goal-preview:hover { background: var(--hover); }
.goal-preview > div { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
.goal-preview .row-between b { font-size: var(--fs-small); font-weight: var(--fw-bold); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.goal-preview .row-between .muted { flex: none; font-size: var(--fs-small); font-weight: var(--fw-black); color: var(--text); font-variant-numeric: tabular-nums; }
.goal-preview small { font-size: var(--fs-micro); color: var(--text-muted); font-variant-numeric: tabular-nums; }
.goal-preview .asset-icon { width: 40px; height: 40px; }
.goal-preview .asset-icon.gold { background: var(--accent-soft); color: var(--accent-text); }
.goal-preview .progress { height: 7px; }
.goal-more { display: flex; justify-content: flex-end; margin-block-start: auto; padding-block-start: var(--sp-2); }
.goals-preview .empty { padding-block: var(--sp-5); }

/* ---------- Investments empty / budgets empty ---------- */
.home-widget > p.muted.small { color: var(--text-muted); }

/* ---------- Home editor ---------- */
.home-editor-card { border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); box-shadow: var(--shadow-2), 0 0 0 4px var(--accent-soft); }
.home-editor-card .section-head { margin-block-end: var(--sp-4); }
.home-presets { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-2); margin-block-end: var(--sp-5); font-size: var(--fs-small); color: var(--text-muted); }
.home-presets > span { font-weight: var(--fw-semibold); margin-inline-end: var(--sp-1); }
.home-preset {
  min-height: 36px; padding: 0 var(--sp-4);
  border: 1px solid var(--border-strong); border-radius: var(--r-pill);
  background: var(--surface); color: var(--text);
  font-size: var(--fs-small); font-weight: var(--fw-semibold);
  transition: border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
}
.home-preset:hover { border-color: var(--accent); }
.home-preset.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); font-weight: var(--fw-bold); }
.home-editor-cols { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: var(--sp-6); align-items: start; }
.home-editor-cols h3 { margin-block-end: var(--sp-3); font-size: var(--fs-small); font-weight: var(--fw-bold); }
.home-editor-cols h3 .muted { font-weight: var(--fw-medium); }
.home-editor { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.home-editor-row {
  display: flex; align-items: center; gap: var(--sp-2); min-width: 0;
  min-height: 56px; padding: 6px var(--sp-2); padding-inline-start: var(--sp-1);
  border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface);
  cursor: grab;
  transition: border-color var(--dur-fast) var(--ease-out), opacity var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
}
.home-editor-row:hover { border-color: var(--border-strong); }
.home-editor-row:active { cursor: grabbing; }
.home-editor-row.dragging { opacity: .45; }
.home-editor-row.drop-before { box-shadow: 0 -3px 0 var(--accent); }
.home-editor-row.drop-after { box-shadow: 0 3px 0 var(--accent); }
.home-editor-row .grip { display: grid; place-items: center; width: 22px; color: var(--text-subtle); flex: none; }
.home-editor-index {
  display: grid; place-items: center; flex: none; width: 22px; height: 22px; border-radius: 50%;
  background: var(--surface-2); font-size: 11px; font-weight: var(--fw-bold); color: var(--text-muted); font-variant-numeric: tabular-nums;
}
.home-editor-row .asset-icon, .home-add .asset-icon { width: 34px; height: 34px; border-radius: 10px; }
.home-editor-row .asset-icon svg, .home-add .asset-icon svg { width: 16px; height: 16px; }
.home-editor-row > div:not(.home-editor-actions) { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.home-editor-row b, .home-add b { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: var(--fs-small); font-weight: var(--fw-bold); }
.home-editor-row small, .home-add small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--fs-micro); color: var(--text-muted); }
.home-editor-actions { display: flex; gap: 2px; flex: none; }
.home-editor-actions .icon-button { width: 34px; height: 34px; }
.home-editor-actions .icon-button:disabled { opacity: .3; cursor: default; }
.home-editor-actions .icon-button:last-child:hover { color: var(--negative); background: var(--negative-soft); }
.home-hidden { display: flex; flex-direction: column; gap: 6px; }
.home-add {
  display: flex; align-items: center; gap: var(--sp-3); width: 100%; min-width: 0;
  min-height: 56px; padding: 6px var(--sp-3);
  border: 1px dashed var(--border-strong); border-radius: var(--r-md);
  background: transparent; color: var(--text); text-align: start;
  transition: border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
}
.home-add > span:nth-child(2) { display: flex; flex-direction: column; flex: 1; min-width: 0; }
.home-add > svg { flex: none; width: 30px; height: 30px; padding: 7px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); }
.home-add:hover { border-color: var(--accent); background: var(--accent-soft); }
.home-add:hover > svg { background: var(--accent); color: var(--accent-contrast); }
.nav-new {
  display: inline-flex; align-items: center; flex: none;
  min-height: 18px; padding: 0 7px; border-radius: var(--r-pill);
  background: var(--accent-2-soft); color: var(--accent-2);
  font-size: 10.5px; font-weight: var(--fw-bold); line-height: 1.4;
}
.home-board.editing .home-cell { outline: 1px dashed color-mix(in srgb, var(--accent) 35%, transparent); outline-offset: 4px; border-radius: var(--r-lg); }

/* ---------- Tablet ---------- */
@media (max-width: 1100px) {
  .home-row[data-count="3"] { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  .home-row[data-count="3"] > .home-cell:last-child { grid-column: 1 / -1; }
  .home-row.stack-md { grid-template-columns: minmax(0, 1fr) !important; }
  .home-row.stack-md > .home-cell:last-child { grid-column: auto; }
  .home-row[data-count="2"]:not(.stack-md) { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  .home-editor-cols { grid-template-columns: minmax(0, 1fr); gap: var(--sp-5); }
}

/* ---------- Phone ---------- */
@media (max-width: 760px) {
  .home-row, .home-row[data-count="3"], .home-row.stack-md, .home-row[data-count="2"]:not(.stack-md) { grid-template-columns: minmax(0, 1fr) !important; }
  .home-row[data-count="3"] > .home-cell:last-child { grid-column: auto; }

  /* Hero: balance, then "updated" with the solid update pill beside it */
  .card.hero-card {
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "label label" "balance balance" "updated edit" "stats stats" "foot foot";
    padding: var(--sp-5); border-radius: 24px;
  }
  .hero-top { display: contents; }
  .hero-label { grid-area: label; min-height: 0; font-size: var(--fs-small); }
  .hero-balance { font-size: var(--fs-display-sm); margin-block: var(--sp-2) var(--sp-3); }
  .hero-updated { grid-area: updated; align-self: center; font-size: var(--fs-micro); }
  .hero-edit { grid-area: edit; align-self: center; padding-inline: var(--sp-4); }
  .hero-stats { margin-block-start: var(--sp-4); gap: var(--sp-2); }
  .hero-stat { padding: var(--sp-3); }
  .hero-stat > span { font-size: var(--fs-micro); }
  .hero-stat > b { font-size: 19px; }
  .hero-stat > small { font-size: 11px; }
  .hero-foot { margin-block-start: var(--sp-3); }
  .card.hero-card::after { width: 320px; height: 320px; inset-block-end: -170px; inset-inline-end: -150px; }
  .hero-empty h2 { font-size: 22px; }

  /* This month: 2 + 1, calm */
  .summary-grid, .summary-grid:has(> .summary-head) { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: none; border-radius: 18px; }
  .summary-grid > .card.metric { justify-content: flex-start; }
  .summary-head > .eyebrow { font-size: var(--fs-h3); }
  .summary-grid .metric-top { align-items: center; }
  .summary-grid .metric-top > span:first-child { font-size: var(--fs-micro); }
  .summary-grid .metric-icon { width: 28px; height: 28px; border-radius: 9px; }
  .summary-grid .metric-icon svg { width: 15px; height: 15px; }
  .summary-grid .metric-value { margin-block-start: var(--sp-2); font-size: 22px; }
  .summary-grid .metric-detail { font-size: 11.5px; line-height: 1.45; }
  .summary-grid > .metric:last-child {
    grid-column: 1 / -1; border-inline-start: 0; border-block-start: 1px solid var(--border);
    display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: var(--sp-3);
    background: color-mix(in srgb, var(--surface-2) 60%, transparent);
  }
  .summary-grid > .metric:last-child .metric-top { display: contents; }
  .summary-grid > .metric:last-child .metric-top > span:first-child { grid-column: 1; grid-row: 1; }
  .summary-grid > .metric:last-child .metric-icon { grid-column: 2; grid-row: 1 / span 3; width: 40px; height: 40px; border-radius: 12px; }
  .summary-grid > .metric:last-child .metric-icon svg { width: 18px; height: 18px; }
  .summary-grid > .metric:last-child .metric-value { grid-column: 1; margin-block-start: 2px; }
  .summary-grid > .metric:last-child .metric-detail { grid-column: 1; }

  .net-value { font-size: 30px; }
  .safe-number { font-size: 30px; }
  .widget-number { font-size: 27px; }
  .chart-stat > b { font-size: 24px; }
  .worth-chart .section-head > .segmented { flex-basis: 100%; }
  .worth-chart .section-head > .segmented > button { flex: 1 1 0; }

  .asset-strip-item { padding: var(--sp-3); gap: var(--sp-2); }
  .asset-strip-item .asset-icon { width: 34px; height: 34px; border-radius: 10px; }
  .asset-strip-item > svg:last-child { display: none; }
  .asset-strip-item b { font-size: var(--fs-num-sm); }
  .asset-strip-item span:not(.asset-icon) { font-size: var(--fs-micro); }

  .insight-banner { padding: var(--sp-4); }
  .insight-banner > button { min-height: var(--touch); }

  .mini-agenda > div { min-height: 56px; }
  .home-cell > .card > .row-between:first-child { margin-block: -6px; }
  .goal-preview { min-height: var(--touch); }
  .goal-more .text-button, .home-cell .row-between > .text-button { min-height: var(--touch); }
  .ai-ask-card .ai-send { width: var(--touch); height: var(--touch); }
  .ai-ask-card .ai-chip { min-height: 40px; }
  .ai-ask-card .kbd-hint { display: none; }
  .ready-chip { min-height: 40px; }

  /* Editor */
  .home-presets { gap: 6px; }
  .home-presets > span { flex-basis: 100%; }
  .home-preset { min-height: 40px; padding-inline: var(--sp-3); }
  .home-editor-row { cursor: default; padding-inline: var(--sp-2) 2px; gap: var(--sp-2); }
  .home-editor-row .grip { display: none; }
  .home-editor-index { display: none; }
  .home-editor-actions { gap: 0; }
  .home-editor-actions .icon-button { width: 40px; height: var(--touch); border-radius: var(--r-sm); }
  .home-add { min-height: 60px; }
  .home-board.editing .home-cell { outline-offset: 2px; }
}
@media (max-width: 360px) {
  .hero-balance { font-size: 40px; }
  .card.hero-card { grid-template-areas: "label label" "balance balance" "updated updated" "edit edit" "stats stats" "foot foot"; }
  .hero-edit { justify-self: start; margin-block-start: var(--sp-3); }
  .summary-grid .metric-value { font-size: 19px; }
  .hero-stat { padding: var(--sp-2) var(--sp-3); }
  .hero-stat > b { font-size: 17px; }
}

/* ---------- Privacy: blur the remaining big numbers ---------- */
html.privacy .hero-stat > b, html.privacy .after-charges > b, html.privacy .chart-stat > b { filter: blur(7px); transition: filter var(--dur-base) var(--ease-out); }
html.privacy .hero-stat:hover > b, html.privacy .after-charges:hover > b, html.privacy .chart-stat > b:hover { filter: none; }

/* ---------- Reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  .page-content.enter .home-cell { animation: none; }
  .hero-edit:hover, .hero-stat:hover { transform: none; }
}

/* ============================================================
   Ofek 4.0 — "הכסף שלי" area: accounts, transactions (list + calendar),
   budgets, bills & cash-flow forecast, smart capture, the quick-add sheet
   and the balance editor sheet.
   Builds on tokens/base/components/charts. Tokens only; logical properties only.
   ============================================================ */

/* Transaction lists are table.tx-table (.compact on home); the page head and filters
   are scoped with .page-content:has(#transaction-results) (the transactions page) */

/* ======================= Accounts ======================= */
.account-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: var(--gap-grid); align-items: stretch;
}
.account-card { display: flex; flex-direction: column; gap: var(--sp-1); }
.account-card > .row-between { margin-block-end: var(--sp-3); }
.account-card > .row-between .asset-icon { width: 44px; height: 44px; border-radius: 14px; }
.account-card > .row-between .asset-icon svg { width: 21px; height: 21px; }
.account-card h2 { font-size: var(--fs-h2); font-weight: var(--fw-bold); line-height: 1.3; overflow-wrap: anywhere; }
.account-card > p.muted { font-size: var(--fs-small); }
.account-card .large-number { margin-block: var(--sp-3) var(--sp-1); }
.account-card .progress { margin-block: var(--sp-3) var(--sp-2); }
.account-card .goal-details { margin-block-start: var(--sp-1); }
.account-card .goal-details > div { padding: var(--sp-2) var(--sp-3); }
.account-card .goal-details > div:last-child:nth-child(odd) { grid-column: 1 / -1; }
/* original / monthly / repaid are amounts rendered without dir="ltr": keep "1,250 ₪" like every other amount */
.account-card .goal-details > div:is(:nth-child(1), :nth-child(2), :nth-child(4)) > b {
  width: fit-content; max-width: 100%; direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums;
}
.account-updated {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: var(--fs-micro); color: var(--text-subtle);
}
.account-updated::before {
  content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%;
  background: var(--chart-muted); box-shadow: 0 0 0 3px var(--track);
}
/* Freshness of the typed-in balance: green within a week, amber when older, a hollow amber ring when never typed */
.account-updated.fresh { color: var(--text-muted); }
.account-updated.fresh::before { background: var(--positive-vivid); box-shadow: 0 0 0 3px var(--positive-soft); }
.account-updated.stale:not(.never) { color: var(--warning); }
.account-updated.stale::before { background: var(--warning-vivid); box-shadow: 0 0 0 3px var(--warning-soft); }
.account-updated.stale.never::before { background: transparent; box-shadow: inset 0 0 0 1.5px var(--warning-vivid); }
.account-actions {
  display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-2);
  margin-block-start: auto; padding-block-start: var(--sp-4);
}
.account-actions > .button { flex: 1 1 auto; }
.account-actions > .icon-button { border: 1px solid var(--border); }
.account-actions > .icon-button:hover { color: var(--negative); background: var(--negative-soft); border-color: transparent; }

/* ======================= Transactions ======================= */
/* Filters: search + two selects + filters button + list/calendar toggle */
.filters {
  display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-2);
  margin-block-end: var(--sp-3);
}
.filters > select { flex: 0 1 190px; width: auto; border-radius: var(--r-pill); }
.filters > .button { flex: none; }
.filters > .segmented { flex: none; }
.search-field { position: relative; flex: 1 1 260px; min-width: 0; }
.search-field > svg {
  position: absolute; inset-inline-start: 14px; inset-block-start: 50%; transform: translateY(-50%);
  color: var(--text-subtle); pointer-events: none;
}
.search-field > input:not(#\_) {
  padding-inline-start: 42px; border-radius: var(--r-pill); background-color: var(--surface-2);
  border-color: var(--border);
}
.search-field > input:not(#\_):focus { background-color: var(--surface); }
.search-field > input::-webkit-search-cancel-button { cursor: pointer; }

.filter-detail {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--sp-3);
  align-items: end; margin-block-end: var(--sp-4);
  padding: var(--sp-4); border-radius: var(--r-md);
  background: var(--surface-2); border: 1px solid var(--border);
}
.filter-detail > .button { justify-self: start; }

/* List / calendar journal toggle */
.page-content:has(#transaction-results) .filters .segmented > button { min-width: 64px; }

/* Transaction list (desktop / tablet table): table.tx-table; .compact is the home "recent" list */
.tx-table:not(.compact) td:nth-child(5),
.tx-table:not(.compact) th:nth-child(5) { text-align: end; }
.tx-table:not(.compact) td:nth-child(5) b { font-size: var(--fs-num-sm); }
.tx-table:not(.compact) td:nth-child(3) { color: var(--text-muted); }
.tx-table:not(.compact) td:nth-child(6) { width: 1%; }
.tx-table .transaction-name small:empty { display: none; }
.tx-table:not(.compact) .transaction-icon:not(.green) { color: var(--text-muted); }
/* Row actions: two quiet icon buttons (edit / delete) */
.tx-table .table-actions { gap: 2px; }
.tx-table .table-actions > .icon-button {
  width: 36px; height: 36px; min-height: 0; padding: 0; border-radius: var(--r-pill);
  color: var(--text-subtle); background: transparent;
}
.tx-table .table-actions > .icon-button svg { width: 17px; height: 17px; }
.tx-table .table-actions > .icon-button:hover { background: var(--hover); color: var(--text); }
.tx-table .table-actions > .icon-button:last-child:hover { background: var(--negative-soft); color: var(--negative); }
.tx-table .table-actions > .icon-button:focus-visible { opacity: 1; }
/* Desktop: the actions appear on row hover, and stay reachable from the keyboard */
@media (hover: hover) and (min-width: 761px) {
  .tx-table tbody tr .table-actions { opacity: 0; transition: opacity var(--dur-fast) var(--ease-out); }
  .tx-table tbody tr:hover .table-actions,
  .tx-table tbody tr:focus-within .table-actions { opacity: 1; }
}
#transaction-results .table-wrap { max-height: none; }

/* Monthly comparison card */
.comparison-row {
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
  min-height: 48px; padding-block: var(--sp-2);
  border-block-end: 1px dashed var(--border);
  font-size: var(--fs-small);
}
.comparison-row:last-child { border-block-end: 0; padding-block-end: 0; }
.comparison-row > span { color: var(--text-muted); min-width: 0; }
.comparison-row > b {
  font-family: var(--font-num); font-size: var(--fs-num-sm); font-weight: var(--fw-bold);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.comparison-row:last-child > b { color: var(--accent-text); }
.card:has(> .large-number) > .large-number + p { margin-block: var(--sp-1) var(--sp-2); font-size: var(--fs-small); }

/* Calendar journal */
.calendar {
  margin-block-end: var(--sp-4); padding: var(--sp-4);
  border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--surface-2);
}
.calendar > .section-head {
  position: relative; justify-content: center; align-items: center; flex-wrap: nowrap; gap: var(--sp-2);
  margin-block-end: var(--sp-3);
}
.calendar > .section-head > b { min-width: 140px; text-align: center; font-size: var(--fs-h3); font-weight: var(--fw-bold); }
.calendar > .section-head > .icon-button { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
.calendar > .section-head > .button { position: absolute; inset-inline-end: 0; min-height: 34px; font-size: var(--fs-micro); }
.calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.calendar-week {
  padding-block-end: 2px; text-align: center;
  font-size: var(--fs-micro); font-weight: var(--fw-bold); color: var(--text-subtle);
}
.calendar-grid > button {
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px;
  min-width: 0; min-height: 62px; padding: 6px 2px;
  border: 1px solid var(--border); border-radius: var(--r-sm);
  background: var(--surface); color: var(--text); overflow: hidden;
  transition: border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
}
.calendar-grid > button:hover { border-color: var(--border-strong); background: var(--hover); }
.calendar-grid > button > b { display: grid; place-items: center; min-height: 22px; font-size: var(--fs-small); font-weight: var(--fw-bold); font-variant-numeric: tabular-nums; }
.calendar-grid > button > small {
  max-width: 100%; padding: 1px 6px; border-radius: var(--r-pill);
  font-variant-numeric: tabular-nums;
  background: var(--accent-2-soft); color: var(--accent-2);
  font-size: 11px; font-weight: var(--fw-bold); line-height: 1.4;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.calendar-grid > button.today { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
.calendar-grid > button.today > b {
  display: grid; place-items: center; min-width: 24px; height: 22px; padding-inline: 4px; border-radius: var(--r-pill);
  background: var(--accent); color: var(--accent-contrast);
}
.calendar-grid > button.selected { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 1px var(--accent); }
.calendar-grid > button.selected:not(.today) > b { color: var(--accent-text); }

/* ======================= Budgets ======================= */
/* The bar runs the full card width; the edit button sits in the top corner */
.budget-overall { position: relative; display: block; }
.budget-overall > .button { position: absolute; inset-block-start: var(--sp-5); inset-inline-end: var(--sp-5); }
.budget-overall .eyebrow { display: flex; align-items: center; min-height: 40px; padding-inline-end: 150px; }
.budget-overall > div { display: flex; flex-direction: column; gap: var(--sp-3); min-width: 0; }
.budget-overall .progress { height: 10px; }
.budget-overall .row-between { font-size: var(--fs-small); }
.budget-overall .row-between > span:last-child { font-weight: var(--fw-bold); font-variant-numeric: tabular-nums; }
.budget-big { display: flex; align-items: baseline; flex-wrap: wrap; gap: var(--sp-1) var(--sp-3); }
.budget-big > b {
  width: fit-content; font-family: var(--font-num); font-size: var(--fs-num-xl); line-height: 1.1;
  font-weight: var(--fw-black); letter-spacing: var(--tracking-tight);
}
.budget-big > span { font-size: var(--fs-small); color: var(--text-muted); }

.page-content > .section-head:has(+ .budget-grid) { margin-block: var(--sp-2) calc(var(--sp-4) - var(--gap-grid)); align-items: center; }
.page-content > .section-head:has(+ .account-grid) { margin-block: var(--sp-2) calc(var(--sp-4) - var(--gap-grid)); align-items: center; }
.page-content > .section-head > h2 { font-size: var(--fs-h2); font-weight: var(--fw-bold); }

.budget-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--gap-grid);
}
/* Header row: icon · category name · edit/delete (the icon row is flattened into the card grid) */
.budget-card {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--sp-2) var(--sp-3);
  /* header · amount · bar · numbers · badge · spacer · history: the history tiles line up across a row */
  grid-template-rows: auto auto auto auto auto 1fr auto;
}
.budget-card > * { grid-column: 1 / -1; min-width: 0; }
.budget-card > .row-between:first-child { display: contents; }
.budget-card > .row-between:first-child > .asset-icon { grid-column: 1; grid-row: 1; width: 40px; height: 40px; }
.budget-card > .row-between:first-child > .table-actions { grid-column: 3; grid-row: 1; }
.budget-card > h3 { grid-column: 2; grid-row: 1; align-self: center; font-size: 16px; font-weight: var(--fw-bold); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.budget-card > .budget-amount { margin-block-start: var(--sp-2); }
.budget-amount { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px var(--sp-2); }
.budget-amount > b {
  width: fit-content; font-family: var(--font-num); font-size: var(--fs-num-lg); line-height: 1.15;
  font-weight: var(--fw-black); letter-spacing: var(--tracking-tight);
}
.budget-amount > span { font-size: var(--fs-small); color: var(--text-muted); }
.budget-card .progress { margin-block: var(--sp-1); }
.budget-card > .row-between:not(:first-child) { font-size: var(--fs-small); }
.budget-card > .row-between > b { font-variant-numeric: tabular-nums; }
.budget-card > .badge { justify-self: start; }
.budget-card:has(> .badge.gold) .progress > span { background: var(--warning-vivid); }
.budget-card .table-actions button { min-height: 30px; }
.budget-history {
  grid-row: 7;
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp-2);
  margin-block-start: var(--sp-2); padding-block-start: var(--sp-3); border-block-start: 1px solid var(--border);
}
.budget-history > div {
  display: flex; flex-direction: column; gap: 2px; min-width: 0;
  padding: var(--sp-2); border-radius: var(--r-sm); background: var(--surface-2);
}
.budget-history span { font-size: 11px; line-height: 1.3; color: var(--text-subtle); }
.budget-history b {
  align-self: flex-start; max-width: 100%; direction: ltr; unicode-bidi: isolate; /* amount without dir="ltr" */
  font-family: var(--font-num); font-size: var(--fs-small); font-weight: var(--fw-bold);
  font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
html.privacy .budget-amount > b, html.privacy .budget-history b { filter: blur(7px); }
html.privacy .budget-amount > b:hover, html.privacy .budget-history b:hover { filter: none; }

/* ======================= Bills & cash-flow ======================= */
.flow-toggles { display: flex; flex-wrap: wrap; gap: 0 var(--sp-5); margin-block: calc(-1 * var(--sp-2)) var(--sp-2); }
.flow-toggles .check-field { color: var(--text-muted); }
.flow-card .chart { margin-block-start: var(--sp-2); }
/* ~90+ daily points: show a point only on hover/focus, the line carries the shape */
.flow-card .graph-point .point-dot { opacity: 0; transition: opacity var(--dur-fast) var(--ease-out); }
.flow-card .graph-point:hover .point-dot, .flow-card .graph-point:focus-visible .point-dot { opacity: 1; }

.flow-calendar-card .section-head > .button { min-height: 36px; }
.flow-calendar { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: var(--sp-6); }
.flow-month { min-width: 0; }
.flow-month > b { display: block; margin-block-end: var(--sp-2); font-size: var(--fs-h3); font-weight: var(--fw-bold); }
.flow-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.flow-week {
  padding-block-end: 2px; text-align: center;
  font-size: 11px; font-weight: var(--fw-bold); color: var(--text-subtle);
}
.flow-day {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  min-width: 0; min-height: 54px; padding: 4px 1px;
  border: 1px solid transparent; border-radius: var(--r-sm);
  background: var(--surface-2); color: var(--text); overflow: hidden;
  transition: border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
}
button.flow-day:hover { border-color: var(--border-strong); }
.flow-day > i { font-style: normal; font-size: 11px; font-weight: var(--fw-semibold); color: var(--text-muted); line-height: 1.2; }
.flow-day > b { /* "27.5 א׳": a Hebrew unit suffix reads right-to-left, so the markup's dir="ltr" is reversed here */
  direction: rtl; unicode-bidi: isolate;
  max-width: 100%; font-family: var(--font-num); font-size: 11px; font-weight: var(--fw-bold); line-height: 1.25;
  white-space: nowrap; overflow: hidden; text-overflow: clip;
}
.flow-day.past { background: transparent; opacity: .45; }
.flow-day.ok { background: var(--positive-soft); }
.flow-day.ok > b { color: var(--positive); }
.flow-day.low { background: var(--warning-soft); }
.flow-day.low > b { color: var(--warning); }
.flow-day.neg { background: var(--negative-soft); }
.flow-day.neg > b { color: var(--negative); }
.flow-day.today { border-color: var(--accent); }
.flow-day.today > i { color: var(--accent-text); font-weight: var(--fw-black); }
.flow-day.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.flow-dots { display: flex; justify-content: center; gap: 2px; height: 5px; }
.flow-dots em, .flow-legend em { display: inline-block; width: 5px; height: 5px; border-radius: 50%; }
.flow-legend em { width: 8px; height: 8px; }
.k-income { background: var(--positive-vivid); }
.k-expense { background: var(--accent-2-vivid); }
.k-transfer { background: var(--chart-2); }
.flow-legend {
  display: flex; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4); margin-block-start: var(--sp-3);
  font-size: var(--fs-micro); color: var(--text-muted);
}
.flow-legend > span { display: inline-flex; align-items: center; gap: 6px; }
.flow-calendar-card > p.muted { margin-block-start: var(--sp-4); text-align: center; }
.flow-detail {
  display: flex; flex-direction: column; gap: var(--sp-2);
  margin-block-start: var(--sp-4); padding: var(--sp-3) var(--sp-4);
  border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--border)); border-radius: var(--r-md);
  background: var(--accent-soft); font-size: var(--fs-small);
}
.flow-detail > .row-between { padding-block-end: var(--sp-2); border-block-end: 1px solid var(--border); }
.flow-detail > .row-between b[dir="ltr"] { font-size: var(--fs-num-md); font-weight: var(--fw-black); }
.flow-event { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); }
.flow-event > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.flow-event > b { flex: none; font-weight: var(--fw-bold); }

.flow-table td small { display: block; }
.flow-table td[dir="ltr"] { text-align: end; } /* ltr end = right: digits line up */
.flow-table th:not(:first-child) { text-align: start; } /* rtl start = right: over the digits */
.flow-table td.muted { font-weight: var(--fw-medium); }
.flow-table td:first-child, .flow-table th:first-child {
  position: sticky; inset-inline-start: 0; z-index: 1; background: var(--card-bg);
}
.flow-table thead th:first-child { z-index: 2; }
[data-theme="dark"] .flow-table td:first-child, [data-theme="dark"] .flow-table th:first-child { background: var(--surface); }

.flow-months-card td b { font-weight: var(--fw-black); }
.agenda-card .empty { padding-block: var(--sp-6); }
.suggest-card { border-color: color-mix(in srgb, var(--accent-2) 28%, var(--border)); }
.suggest-card .section-head h2::before {
  content: ""; display: inline-block; width: 8px; height: 8px; margin-inline-end: var(--sp-2); vertical-align: middle;
  border-radius: 50%; background: var(--accent-2-vivid); box-shadow: 0 0 0 4px var(--accent-2-soft);
}

.bills-layout {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: var(--gap-grid); align-items: start;
}
.bills-layout > * { min-width: 0; }

/* Agenda (next 30 days) */
.agenda { display: flex; flex-direction: column; }
.agenda-day {
  display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: var(--sp-3);
  padding-block: var(--sp-3); border-block-end: 1px solid var(--border);
}
.agenda-day:first-child { padding-block-start: 0; }
.agenda-day:last-child { border-block-end: 0; padding-block-end: 0; }
.agenda-date {
  display: flex; flex-direction: column; align-items: center; justify-content: center; align-self: start;
  width: 48px; min-height: 52px; border-radius: var(--r-md); background: var(--surface-2); border: 1px solid var(--border);
}
.agenda-date b { font-family: var(--font-num); font-size: 19px; line-height: 1.1; font-weight: var(--fw-black); font-variant-numeric: tabular-nums; }
.agenda-date small { font-size: 11px; color: var(--text-subtle); font-weight: var(--fw-semibold); }
.agenda-day.today .agenda-date { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.agenda-day.today .agenda-date b, .agenda-day.today .agenda-date small { color: var(--accent-text); }
.agenda-day.overdue .agenda-date { background: var(--negative-soft); border-color: color-mix(in srgb, var(--negative) 30%, transparent); }
.agenda-day.overdue .agenda-date small, .agenda-day.overdue .agenda-date b { color: var(--negative); }
.agenda-items { display: flex; flex-direction: column; gap: var(--sp-3); min-width: 0; }
.agenda-item {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; align-items: center; gap: var(--sp-2) var(--sp-3);
  min-width: 0; min-height: 52px;
}
.agenda-item > .asset-icon { width: 36px; height: 36px; border-radius: 11px; }
.agenda-item > .asset-icon svg { width: 16px; height: 16px; }
.agenda-item > div { min-width: 0; }
.agenda-item > div > b { display: block; font-size: var(--fs-small); font-weight: var(--fw-semibold); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agenda-item > div > small { display: block; color: var(--text-subtle); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agenda-item > .pay-button {
  gap: 6px; border-color: var(--border-strong); background: var(--surface); color: var(--text-muted);
  transition: border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
}
.agenda-item > .pay-button::before { /* an empty tick box: "mark as paid" */
  content: ""; flex: none; width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid currentColor; opacity: .8;
}
.agenda-item > .pay-button:hover { border-color: var(--positive); background: var(--positive-soft); color: var(--positive); }
.agenda-item > b[dir="ltr"] { font-family: var(--font-num); font-size: var(--fs-num-sm); font-weight: var(--fw-bold); white-space: nowrap; }

/* Bills table */
/* No bills yet: the empty state carries the one call to action, so the head button steps aside */
.bills-card:has(.empty) > .section-head > .button.primary { display: none; }
.bills-table td small { display: block; margin-block-start: 1px; }
.bills-table td:nth-child(3), .bills-table th:nth-child(3) { text-align: end; }
.bills-table td:nth-child(2) { font-size: var(--fs-small); }
.row-actions { display: flex; align-items: center; justify-content: flex-end; gap: 2px; }
.row-actions .icon-button { width: 34px; height: 34px; }
.row-actions .icon-button:last-child:hover { color: var(--negative); background: var(--negative-soft); }

/* Detected recurring payments */
.suggestions { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: var(--sp-3); }
.suggestion {
  display: flex; align-items: center; gap: var(--sp-3); min-width: 0;
  padding: var(--sp-3); border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface-2);
}
.suggestion > div { flex: 1; min-width: 0; }
.suggestion b { display: block; font-size: var(--fs-small); font-weight: var(--fw-bold); }
.suggestion small { display: block; margin-block-start: 1px; color: var(--text-muted); line-height: 1.45; }
.suggestion > .button { flex: none; min-height: 36px; padding-inline: var(--sp-3); }

/* ======================= Smart capture ======================= */
.capture-intro { padding: var(--sp-3); }
.capture-drop {
  display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--sp-3);
  padding: var(--sp-10) var(--sp-6);
  border: 2px dashed var(--border-strong); border-radius: calc(var(--r-lg) - 4px);
  background: var(--surface-2);
  transition: border-color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
}
.capture-drop.dragging { border-color: var(--accent); background: var(--accent-soft); }
.capture-orb {
  display: grid; place-items: center; width: 68px; height: 68px; margin-block-end: var(--sp-1);
  border-radius: 22px; background: var(--brand-gradient); color: var(--on-hero);
  box-shadow: var(--hero-shadow);
}
.capture-drop > h2 { font-size: 20px; font-weight: var(--fw-black); letter-spacing: -0.01em; }
.capture-drop > p { max-width: 620px; font-size: var(--fs-small); color: var(--text-muted); }
.capture-drop > .actions { justify-content: center; margin-block-start: var(--sp-2); }
.capture-drop label.button { cursor: pointer; }
.capture-drop label.button:focus-within { outline: 2px solid var(--focus-color); outline-offset: 2px; }
.capture-paste {
  display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-3);
  width: 100%; max-width: 720px; margin-block-start: var(--sp-2); text-align: start;
}
.capture-paste .field { width: 100%; }
.capture-paste textarea { font-family: var(--font-mono); font-size: var(--fs-small); background-color: var(--surface); }

.capture-steps {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: var(--sp-3);
  margin: 0; padding: 0; list-style: none; counter-reset: cap-step;
}
.capture-steps > li {
  counter-increment: cap-step; position: relative;
  padding: var(--sp-4); padding-block-start: calc(var(--sp-4) + 34px);
  border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface-2);
  font-size: var(--fs-small); line-height: 1.6; color: var(--text-muted);
}
.capture-steps > li::before {
  content: counter(cap-step); position: absolute; inset-block-start: var(--sp-4); inset-inline-start: var(--sp-4);
  display: grid; place-items: center; width: 26px; height: 26px; border-radius: 9px;
  background: var(--accent-soft); color: var(--accent-text);
  font-family: var(--font-num); font-size: var(--fs-small); font-weight: var(--fw-black);
}
.capture-steps b { color: var(--text); font-weight: var(--fw-bold); }

.capture-busy { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--sp-3); }
.page-content > .ai-error:has(+ .capture-intro, + .capture-review) {
  display: flex; align-items: flex-start; gap: 10px;
  padding: var(--sp-3) var(--sp-4); border-radius: var(--r-md);
  background: var(--negative-soft); border: 1px solid color-mix(in srgb, var(--negative) 22%, transparent);
  color: var(--text); font-size: var(--fs-small);
}
.page-content > .ai-error:has(+ .capture-intro, + .capture-review) > svg { flex: none; color: var(--negative); }

.capture-toolbar {
  display: flex; align-items: flex-end; flex-wrap: wrap; gap: var(--sp-3) var(--sp-5);
  margin-block-end: var(--sp-4); padding-block-end: var(--sp-4); border-block-end: 1px solid var(--border);
}
.capture-toolbar > .field { flex: 0 1 240px; min-width: 200px; }
.capture-bulk { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-2); }
.capture-bulk > .button { min-height: 36px; padding-inline: var(--sp-3); font-size: var(--fs-micro); }
.capture-bulk > .check-field { margin-inline-start: var(--sp-1); color: var(--text-muted); }
.capture-sum {
  display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4); margin-inline-start: auto;
  padding: var(--sp-2) var(--sp-4); border-radius: var(--r-pill); background: var(--accent-soft);
  font-size: var(--fs-small); color: var(--text-muted);
}
.capture-sum b { color: var(--text); font-weight: var(--fw-black); font-variant-numeric: tabular-nums; }
.capture-sum b.positive { color: var(--positive); }

.capture-table td { padding-block: var(--sp-2); }
.capture-table input:not([type="checkbox"]):not(#\_), .capture-table select {
  min-height: 38px; font-size: var(--fs-small); border-radius: var(--r-sm);
}
.capture-table select { padding-inline-end: 30px; background-position: left 10px center, left 16.5px center; }
.capture-table input[type="text"]:not(#\_) { min-width: 200px; }
.capture-table input[type="date"]:not(#\_) { min-width: 140px; }
.capture-table input[type="number"]:not(#\_) { width: 112px; font-weight: var(--fw-bold); }
.capture-table td small { display: block; margin-block-start: 3px; }
.capture-table tr.off td:not(:first-child) { opacity: .45; }
.capture-table tr.off:hover td:not(:first-child) { opacity: .75; }
.import-notes { margin-block-start: var(--sp-4); font-size: var(--fs-small); }
.import-notes summary { color: var(--text-muted); font-weight: var(--fw-semibold); min-height: 32px; }
.import-notes p { margin-block-start: var(--sp-2); }
.capture-save { margin-block-start: var(--sp-5); }

/* ======================= Quick-add sheet ======================= */
/* The big amount inputs use input:not(#\_) to outrank the shared input rule (a long :not() chain). */
.quick-form { display: flex; flex-direction: column; gap: var(--sp-4); }
.quick-form > .form-error { margin-block-end: 0; }
.segmented.quick-type { display: flex; width: 100%; }
.segmented.quick-type > button { flex: 1 1 0; min-height: 42px; font-size: var(--fs-body); }
.segmented.quick-type > button.active[data-quick-type="expense"] { color: var(--negative); }
.segmented.quick-type > button.active[data-quick-type="income"] { color: var(--positive); }

.quick-amount {
  display: flex; align-items: center; justify-content: center; gap: var(--sp-2);
  min-height: 84px; padding: var(--sp-2) var(--sp-5);
  border: 1.5px solid var(--border-strong); border-radius: var(--r-lg);
  background: var(--surface); direction: ltr; cursor: text;
  transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
}
.quick-amount:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.quick-amount > input:not(#\_) {
  flex: 1 1 auto; width: 100%; min-width: 0; min-height: 60px; padding: 0;
  border: 0; border-radius: 0; background: transparent; box-shadow: none;
  font-family: var(--font-num); font-size: 44px; line-height: 1; font-weight: var(--fw-black);
  letter-spacing: var(--tracking-tight); font-variant-numeric: tabular-nums; text-align: center; color: var(--text);
}
.quick-amount > input:not(#\_):focus, .quick-amount > input:not(#\_):hover { border: 0; box-shadow: none; outline: none; }
.quick-amount > input::placeholder { color: var(--text-subtle); opacity: .55; }
@supports (field-sizing: content) {
  .quick-amount > input:not(#\_) { flex: 0 1 auto; width: auto; field-sizing: content; min-width: 1.2ch; max-width: 100%; }
}
.quick-sign, .quick-currency {
  flex: none; font-family: var(--font-num); font-size: 28px; line-height: 1; font-weight: var(--fw-bold); color: var(--text-subtle);
}
.quick-amount.expense .quick-sign { color: var(--negative); }
.quick-amount.income .quick-sign { color: var(--positive); }

.quick-effect {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--sp-1) var(--sp-3);
  margin-block-start: calc(-1 * var(--sp-2));
  padding: var(--sp-2) var(--sp-4); border-radius: var(--r-md); background: var(--surface-2);
  font-size: var(--fs-small); color: var(--text-muted);
}
.quick-effect[hidden], .quick-effect:empty { display: none; }
.quick-effect b { color: var(--text); font-weight: var(--fw-black); }
.quick-effect b.negative { color: var(--negative); }
.quick-fx {
  flex: none; padding: 2px 9px; border-radius: var(--r-pill); background: var(--accent-soft);
  color: var(--accent-text); font-size: var(--fs-micro); font-weight: var(--fw-bold);
}

.quick-cats { display: flex; flex-wrap: wrap; gap: var(--sp-2); }
.quick-cat {
  display: inline-flex; align-items: center; min-height: 40px; padding: 0 var(--sp-4);
  border: 1px solid var(--border); border-radius: var(--r-pill);
  background: var(--surface-2); color: var(--text);
  font-size: var(--fs-small); font-weight: var(--fw-semibold); white-space: nowrap;
  transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}
.quick-cat:hover { border-color: var(--border-strong); background: var(--surface-3); }
.quick-cat.active {
  border-color: var(--accent); background: var(--accent-soft); color: var(--accent-text); font-weight: var(--fw-bold);
  box-shadow: inset 0 0 0 1px var(--accent);
}
select.quick-more {
  width: auto; min-height: 40px; padding-inline: var(--sp-4) 32px;
  border: 1px dashed var(--border-strong); border-radius: var(--r-pill);
  background-color: transparent; color: var(--text-muted);
  font-size: var(--fs-small); font-weight: var(--fw-semibold);
  background-position: left 12px center, left 18.5px center;
}
.quick-fields { display: flex; flex-direction: column; gap: var(--sp-3); }
.quick-row { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: var(--sp-3); }
.quick-form .form-actions.quick-actions { margin-block-start: var(--sp-1); }
.quick-actions > .button.primary { flex: 2 1 auto; min-height: 52px; font-size: 16px; }
.quick-actions > .button:not(.primary) { flex: 1 1 auto; border-color: transparent; background: transparent; color: var(--accent-text); }
.quick-actions > .button:not(.primary):hover { background: var(--accent-soft); }
.quick-actions [data-quick-save] { font-variant-numeric: tabular-nums; }

/* ======================= Balance editor sheet ======================= */
.balance-form { display: flex; flex-direction: column; gap: var(--sp-4); }
.balance-form > .form-error { margin-block-end: 0; }
.balance-current {
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4); border: 1px solid var(--border); border-radius: var(--r-md);
  background: var(--surface-2);
}
.balance-current > span { font-size: var(--fs-small); color: var(--text-muted); font-weight: var(--fw-semibold); }
.balance-current > b {
  font-family: var(--font-num); font-size: var(--fs-num-md); font-weight: var(--fw-black); letter-spacing: var(--tracking-tight);
}
.balance-amount { display: flex; flex-direction: column; gap: var(--sp-2); }
.balance-label { font-size: var(--fs-small); font-weight: var(--fw-bold); color: var(--text); }
.balance-input {
  display: flex; align-items: center; justify-content: center; gap: var(--sp-2);
  min-height: 88px; padding: var(--sp-2) var(--sp-5);
  border: 1.5px solid var(--border-strong); border-radius: var(--r-lg);
  background: var(--surface); direction: ltr; cursor: text;
  transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
}
.balance-input:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.balance-input > input:not(#\_) {
  flex: 1 1 auto; width: 100%; min-width: 0; min-height: 60px; padding: 0;
  border: 0; border-radius: 0; background: transparent; box-shadow: none;
  font-family: var(--font-num); font-size: 44px; line-height: 1; font-weight: var(--fw-black);
  letter-spacing: var(--tracking-tight); font-variant-numeric: tabular-nums; text-align: center; color: var(--text);
}
