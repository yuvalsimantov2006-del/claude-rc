.category-list { display: flex; flex-wrap: wrap; gap: var(--sp-2); margin-block-start: var(--sp-4); }
.category-list > .category-pill { min-height: 30px; padding-inline: var(--sp-3); font-size: var(--fs-small); }
.reset-card { border-color: color-mix(in srgb, var(--negative) 22%, var(--border)); }
.reset-card .section-head h2 { color: var(--negative); }

/* Alerts center dialog */
dialog.modal:has(.alerts-list) .form-actions, dialog.modal:has(> .all-clear) .form-actions { margin-block-start: var(--sp-4); }
dialog.modal > .all-clear { padding: var(--sp-4); }

/* ---------- Tablet ---------- */
@media (max-width: 1100px) {
  .ai-hero { grid-template-columns: minmax(0, 1fr); gap: var(--sp-6); padding: var(--sp-6); }
  .ai-hero-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .ai-layout { grid-template-columns: minmax(0, 1fr); }
  .ai-side { position: static; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
  .ai-chat { height: clamp(520px, calc(100dvh - var(--topbar-h) - 180px), 860px); }
}

/* ---------- Phone ---------- */
@media (max-width: 760px) {
  .ai-hero { padding: var(--sp-5) var(--sp-4); gap: var(--sp-5); }
  .ai-hero-copy > h2 { font-size: 24px; }
  .ai-hero-copy > p { font-size: var(--fs-small); }
  .ai-key-form { padding: var(--sp-4); margin-inline: calc(-1 * var(--sp-1)); }
  .ai-key-form .form-actions { flex-direction: column; align-items: stretch; gap: var(--sp-2); }
  .ai-key-form .form-actions > .text-button { justify-content: center; }
  .ai-hero-grid { grid-template-columns: minmax(0, 1fr); gap: var(--sp-2); }
  .ai-hero-grid > div {
    display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: var(--sp-3); row-gap: 2px;
    padding: var(--sp-3);
  }
  .ai-hero-grid > div > .asset-icon { grid-row: span 2; }
  .ai-hero-grid > div > b { align-self: end; }

  .ai-chat {
    height: calc(100dvh - var(--topbar-h) - var(--bottomnav-h) - var(--safe-bottom, 0px) - 128px);
    min-height: 460px; border-radius: 18px;
  }
  .ai-chat-head { padding: var(--sp-3) var(--sp-4); }
  .ai-chat-head .button { min-height: 40px; }
  .ai-chat-head .button > span, .ai-chat-head .button { white-space: nowrap; }
  .ai-avatar { width: 36px; height: 36px; border-radius: 12px; }
  .ai-avatar.small { display: none; }
  .ai-log { padding: var(--sp-4) var(--sp-3) var(--sp-3); gap: var(--sp-4); scrollbar-gutter: auto; }
  .ai-bubble { max-width: 86%; padding: 9px 14px; font-size: var(--fs-small); }
  .ai-answer { font-size: var(--fs-small); line-height: 1.75; gap: var(--sp-3); }
  .ai-chart { padding: var(--sp-3); border-radius: var(--r-md); }
  .ai-proposal { padding: var(--sp-3); border-radius: var(--r-md); }
  .ai-proposal-figure > b { font-size: var(--fs-num-lg); }
  .ai-proposal > .actions > .button { flex: 1 1 auto; }
  .ai-proposal > .actions > .button.primary { flex: 2 1 auto; }
  .ai-welcome { padding: var(--sp-4) 0; gap: var(--sp-2); }
  .ai-orb { width: 60px; height: 60px; border-radius: 20px; }
  .ai-welcome > h2 { font-size: 20px; }
  .ai-welcome > p { font-size: var(--fs-small); }
  .ai-welcome .ai-chips { gap: 6px; margin-block-start: var(--sp-2); }
  .ai-welcome .ai-chip { position: relative; min-height: 38px; padding-inline: var(--sp-3); font-size: var(--fs-micro); }
  .ai-welcome .ai-chip::after { content: ""; position: absolute; inset: -3px -1px; }

  /* Transaction proposals: each row becomes a compact two-line item (description + amount, date + category),
     with the checkbox at the start while the proposal is still open */
  .ai-proposal-table.tx thead { display: none; }
  .ai-proposal-table.tx, .ai-proposal-table.tx tbody { display: block; white-space: normal; }
  .ai-proposal-table.tx tr {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "desc amt" "date cat";
    column-gap: var(--sp-3); row-gap: 2px; align-items: center;
    padding: var(--sp-3); border-block-end: 1px solid var(--border);
  }
  .ai-proposal-table.tx tr:has(> td > input) { grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "chk desc amt" "chk date cat"; }
  .ai-proposal-table.tx tr:last-child { border-block-end: 0; }
  .ai-proposal-table.tx td { display: block; padding: 0 !important; border: 0; background: none !important; min-width: 0; }
  .ai-proposal-table.tx td:nth-last-child(5) { grid-area: chk; width: auto; }
  .ai-proposal-table.tx td:nth-last-child(4) { grid-area: date; font-size: var(--fs-micro); }
  .ai-proposal-table.tx td:nth-last-child(3) { grid-area: desc; overflow-wrap: anywhere; }
  .ai-proposal-table.tx td:nth-last-child(3) small { display: inline; margin-inline-start: 6px; }
  .ai-proposal-table.tx td:nth-last-child(2) { grid-area: cat; justify-self: end; }
  .ai-proposal-table.tx td:nth-last-child(2) .category-pill { min-height: 22px; font-size: var(--fs-micro); }
  .ai-proposal-table.tx td:nth-last-child(2) small { display: none; }
  .ai-proposal-table.tx td:last-child { grid-area: amt; justify-self: end; }
  .ai-composer { padding: var(--sp-2) var(--sp-3) var(--sp-3); }
  .ai-input-row { gap: 2px; padding: 4px; padding-inline-start: var(--sp-2); }
  .ai-actions .icon-button { width: var(--touch); height: var(--touch); }
  .ai-composer .ai-send { width: var(--touch); height: var(--touch); }
  .ai-input-row > textarea, .ai-input-row > textarea:hover, .ai-input-row > textarea:focus { font-size: 16px; min-height: var(--touch); padding-block: 10px; }
  .ai-input-row > textarea:placeholder-shown { height: var(--touch) !important; }
  .ai-hint { display: none; }
  .ai-attachment { min-height: var(--touch); }
  .ai-attachment > .icon-button { width: 36px; height: 36px; }
  .ai-side { grid-template-columns: minmax(0, 1fr); }
  .ai-usage > div { min-height: var(--touch); }
  .ai-thinking summary { min-height: var(--touch); }

// Round axis values (1, 2, 2.5 or 5 × 10ⁿ) instead of arbitrary quarters of the data range.
// minStep keeps whole shekels on money axes (no "0.25 ₪" ticks when every value is zero).
function niceScale(lo,hi,floor=null,count=4,minStep=0){
  if(!(hi>lo))hi=lo+Math.max(1,minStep*count);
  const raw=(hi-lo)/count,mag=10**Math.floor(Math.log10(raw)),norm=raw/mag,step=Math.max(minStep,(norm<=1?1:norm<=2?2:norm<=2.5?2.5:norm<=5?5:10)*mag);

  for(let v=nlo;v<=nhi+step/1e6;v+=step)ticks.push(Math.round(v*1e6)/1e6);

}

// Line, bar and fan charts draw on a fixed 720-wide grid that stretches to the card (preserveAspectRatio=none),

// 1. counter-scales each text and dot horizontally around its own anchor, keeping its true shape;

// 3. insets the plot so no label sticks out of the chart box.

  if(end&&shown.at(-1)!==end){while(shown.length&&shown.at(-1).r.right+gap>end.r.left)shown.pop();shown.push(end);}

// Future deposits retain the original calendar day, clamped in shorter months.
function savingsDepositDate(from,offset){
  if(!validDate(from)||!Number.isInteger(offset)||offset<0)throw new Error('מועד ההפקדה אינו תקין.');
  const [year,month,day]=from.split('-').map(Number);
  const date=new Date(Date.UTC(year,month-1+offset,1));
  const lastDay=new Date(Date.UTC(date.getUTCFullYear(),date.getUTCMonth()+1,0)).getUTCDate();
  date.setUTCDate(Math.min(day,lastDay));
  return date.toISOString().slice(0,10);
}

function savingsDepositCount(from,to){
  if(!validDate(from)||!validDate(to))throw new Error('יש להזין תאריך תקין לחישוב החיסכון.');
  if(to<=from)return 0;
  const [year,month]=from.split('-').map(Number);
  const [endYear,endMonth]=to.split('-').map(Number);
  let count=(endYear-year)*12+endMonth-month;
  if(count>0&&savingsDepositDate(from,count)>to)count--;
  return Math.max(0,count);
}

function savingsProjection(goal,from=today()){
  const {saved,monthly,date}=goal;
  if(!Number.isFinite(saved)||saved<0||!Number.isFinite(monthly)||monthly<0)throw new Error('יש להזין סכום נוכחי והפקדה חודשית שאינם שליליים.');
  const hasTarget=goal.target!==null&&goal.target!==undefined&&goal.target!=='';
  if(hasTarget&&(!Number.isFinite(goal.target)||goal.target<=0))throw new Error('סכום יעד, אם הוזן, צריך להיות חיובי.');
  const months=savingsDepositCount(from,date);
  const contributions=monthly*months;
  const projected=saved+contributions;
  if(!Number.isFinite(projected))throw new Error('סכומי החיסכון גדולים מדי לחישוב.');
  const target=hasTarget?goal.target:projected;
  const remaining=hasTarget?Math.max(0,target-saved):contributions;
  const needed=hasTarget?(remaining===0?0:months>0?remaining/months:null):null;
  const installments=hasTarget&&remaining>0&&monthly>0?Math.ceil(remaining/monthly):0;
  let estimatedDate=null;
  if(hasTarget&&remaining===0)estimatedDate=from;
  else if(installments>0&&installments<=12000)estimatedDate=savingsDepositDate(from,installments);
  return {saved,monthly,date,hasTarget,target,months,contributions,projected,remaining,needed,progress:target>0?saved/target*100:0,estimatedDate,firstDepositDate:months?savingsDepositDate(from,1):null,past:date<from,due:date<=from};
}

const hasAllocation=goal=>goal.allocation!=null&&goal.allocation!==''&&Number.isFinite(Number(goal.allocation));
function accountBalanceILS(data,account){
  return Math.max(0,account.kind==='investment'?portfolioValue(data):toILS(account.balance,account.currency,data.fx));
}

// One account can fund several goals. A goal with an `allocation` gets that amount (scaled down
// pro rata if the balance dropped below the total); goals linked without an allocation share
// whatever is left. Every shekel belongs to at most one goal, so nothing is counted twice.
function accountAllocations(data,accountId){
  const account=data.accounts.find(a=>a.id===accountId);
  if(!account)return null;
  const balance=accountBalanceILS(data,account),goals=data.goals.filter(g=>g.accountId===accountId);
  const fixed=goals.filter(hasAllocation),rest=goals.filter(g=>!hasAllocation(g));
  const requested=fixed.reduce((s,g)=>s+Math.max(0,Number(g.allocation)),0),scale=requested>balance?balance/requested:1;
  const shares=new Map(fixed.map(g=>[g.id,Math.max(0,Number(g.allocation))*scale]));
  const remainder=Math.max(0,balance-requested*scale);
  for(const g of rest)shares.set(g.id,remainder/rest.length);
  const allocated=[...shares.values()].reduce((s,v)=>s+v,0);
  return {account,balance,requested,overAllocated:requested>balance+.005,shares,allocated,free:Math.max(0,balance-allocated)};

function effectiveGoalSavings(data,goal){
  if(!data.accounts.some(a=>a.id===goal.accountId))return goal.saved;
  const id=goal.id||'__draft',goals=[...data.goals.filter(g=>g.id!==id),{...goal,id}];
  return accountAllocations({...data,goals},goal.accountId).shares.get(id)||0;
}

// Unallocated money in bank, cash and savings accounts — available for anything.
function freeMoney(data){
  const accounts=data.accounts.filter(a=>['bank','cash','savings'].includes(a.kind)).map(a=>accountAllocations(data,a.id));
  return {total:accounts.reduce((s,x)=>s+x.free,0),allocated:accounts.reduce((s,x)=>s+x.allocated,0),accounts};
}

function savingsProjectionSeries(goal,from=today()){
  const result=savingsProjection(goal,from),points=[{date:from,value:goal.saved,contributions:0}];
  const count=Math.min(18,result.months);
  for(let i=1;i<=count;i++){
    const n=Math.ceil(result.months*i/count);
    points.push({date:savingsDepositDate(from,n),value:goal.saved+goal.monthly*n,contributions:goal.monthly*n});
  }
  if(result.date>from&&points.at(-1).date!==result.date)points.push({date:result.date,value:result.projected,contributions:result.contributions});
  return points;
}


// Local intelligence: everything here runs offline, on the device, with no AI calls.

const txILS=(d,t)=>toILS(t.amount,t.currency||'ILS',t.fx||d.fx);
const clamp=(n,lo=0,hi=100)=>Math.max(lo,Math.min(hi,n));
const daysInMonth=month=>new Date(Date.UTC(+month.slice(0,4),+month.slice(5,7),0)).getUTCDate();

function shiftDate(date,days){
  const d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+days);return d.toISOString().slice(0,10);
}

function recentMonths(month,count){return Array.from({length:count},(_,i)=>monthOffset(month,-i-1));}

// Average monthly figures over the previous months that actually have data.
function averageMonth(d,month,count=3){
  const rows=recentMonths(month,count).map(m=>monthlySummary(d,m)).filter(s=>s.income||s.expenses);
  if(!rows.length)return {income:0,expenses:0,saved:0,rate:null,months:0};
  const income=rows.reduce((s,r)=>s+r.income,0)/rows.length,expenses=rows.reduce((s,r)=>s+r.expenses,0)/rows.length;
  return {income,expenses,saved:income-expenses,rate:income>0?(income-expenses)/income:null,months:rows.length};
}

    {key:'emergency',label:'כרית ביטחון',weight:25,score:cover==null?0:clamp(cover/6*100),value:cover,
      tip:cover==null?'אין עדיין נתוני הוצאות לחישוב.':cover>=6?'יש לך כרית של חצי שנה ומעלה. מעבר לכך, כסף נזיל עשוי להישחק באינפלציה.':`כדאי להגיע ל־6 חודשי הוצאות בכסף נזיל. חסרים כ־${Math.max(0,Math.round(6*expenses-liquid)).toLocaleString('he-IL')} ₪.`},
    {key:'debt',label:'מינוף וחובות',weight:15,score:clamp(100-debtRatio*250),value:debtRatio,
      tip:debtRatio<.1?'רמת החוב נמוכה ביחס לנכסים.':'החובות מהווים חלק משמעותי מהנכסים. פירעון חוב בריבית גבוהה הוא תשואה בטוחה.'},
    {key:'budget',label:'עמידה בתקציב',weight:15,score:clamp(adherence*100),value:adherence,
      tip:adherence>=1?'כל התקציבים בשליטה החודש.':'יש תקציבים שחרגו החודש. בדוק את הקטגוריות המסומנות באדום.'},
    {key:'diversification',label:'פיזור השקעות',weight:15,score:maxShare==null?35:clamp((1-maxShare)/.7*100),value:maxShare,
      tip:maxShare==null?'עוד אין השקעות במעקב. השקעה מפוזרת לטווח ארוך בונה הון.':maxShare>.6?'נכס יחיד מהווה יותר מ־60% מהתיק. פיזור רחב יותר מקטין סיכון.':'התיק מפוזר בין כמה נכסים.'}
  ];
  const score=Math.round(factors.reduce((s,f)=>s+f.score*f.weight,0)/factors.reduce((s,f)=>s+f.weight,0));
  const grade=score>=85?'מצוין':score>=70?'טוב מאוד':score>=55?'טוב':score>=40?'בינוני':'דורש תשומת לב';
  return {score,grade,factors,liquid,cover,rate,debtRatio};
}

const normalizeText=s=>String(s||'').toLowerCase().replace(/[0-9.,:/\\#*"'״׳()\-]+/g,' ').replace(/\s+/g,' ').trim();

// Charges that repeat at a similar amount in at least three different months.
function detectRecurring(d,month,lookback=6){
  const months=new Set([month,...recentMonths(month,lookback-1)]),groups=new Map();
  for(const t of d.transactions){
    if(t.type!=='expense'||!months.has(t.date.slice(0,7)))continue;
    const key=(normalizeText(t.description)||'—')+'|'+t.category;
    if(!groups.has(key))groups.set(key,[]);
    groups.get(key).push(t);
  }
  const result=[];
  for(const list of groups.values()){
    const byMonth=new Map();
    for(const t of list)byMonth.set(t.date.slice(0,7),(byMonth.get(t.date.slice(0,7))||0)+txILS(d,t));
    if(byMonth.size<3||list.length>byMonth.size*2)continue;
    const amounts=[...byMonth.values()],average=amounts.reduce((s,n)=>s+n,0)/amounts.length;
    const spread=Math.max(...amounts.map(a=>Math.abs(a/average-1)));
    if(spread>.15)continue;
    const last=[...list].sort((a,b)=>b.date.localeCompare(a.date))[0];
    result.push({name:last.description||last.category,category:last.category,average,annual:average*12,months:byMonth.size,lastDate:last.date,nextDate:nextMonthlyDate(last.date),stable:spread<=.02,automatic:list.some(t=>t.recurring||t.recurringParent)});
  }
  return result.sort((a,b)=>b.average-a.average);
}

function nextMonthlyDate(date){
  const [y,m,day]=date.split('-').map(Number),next=new Date(Date.UTC(y,m,1)),last=new Date(Date.UTC(next.getUTCFullYear(),next.getUTCMonth()+1,0)).getUTCDate();
  next.setUTCDate(Math.min(day,last));return next.toISOString().slice(0,10);
}

// Unusual single expenses and categories that spike against their own history.
function detectAnomalies(d,month){
  const history=recentMonths(month,6),items=[];
  for(const t of d.transactions.filter(t=>t.type==='expense'&&t.date.startsWith(month))){
    const past=d.transactions.filter(x=>x.type==='expense'&&x.category===t.category&&history.includes(x.date.slice(0,7))).map(x=>txILS(d,x));
    if(past.length<4)continue;
    const mean=past.reduce((s,n)=>s+n,0)/past.length,sd=Math.sqrt(past.reduce((s,n)=>s+(n-mean)**2,0)/past.length),amount=txILS(d,t);
    if(amount>mean+2.5*sd&&amount>mean*1.5&&amount-mean>50)items.push({kind:'transaction',id:t.id,title:t.description||t.category,category:t.category,amount,typical:mean,ratio:amount/mean,date:t.date});
  }
  for(const category of d.categories){
    const current=categorySpend(d,category,month),past=history.slice(0,3).map(m=>categorySpend(d,category,m)).filter(n=>n>0);
    if(past.length<2)continue;
    const avg=past.reduce((s,n)=>s+n,0)/past.length;
    if(current>avg*1.4&&current-avg>150)items.push({kind:'category',title:category,category,amount:current,typical:avg,ratio:current/avg});
  }
  return items.sort((a,b)=>b.ratio-a.ratio);
}

// End-of-month projection: actual spend so far + what usually happens in the rest of the month.
function monthPace(d,month,now=today()){
  const days=daysInMonth(month),spent=monthlySummary(d,month).expenses,currentMonth=now.slice(0,7);
  if(month!==currentMonth)return {spent,projected:spent,elapsed:month<currentMonth?days:0,days,complete:month<currentMonth,budget:d.overallBudget,method:'actual'};
  const elapsed=Number(now.slice(8,10)),rest=[];
  for(const m of recentMonths(month,3)){
    const tx=d.transactions.filter(t=>t.type==='expense'&&t.date.startsWith(m));
    if(!tx.length)continue;
    const cutoff=Math.round(elapsed/days*daysInMonth(m));
    rest.push(tx.filter(t=>Number(t.date.slice(8,10))>cutoff).reduce((s,t)=>s+txILS(d,t),0));
  }
  const projected=rest.length?spent+rest.reduce((s,n)=>s+n,0)/rest.length:elapsed?spent/elapsed*days:spent;
  return {spent,projected,elapsed,days,complete:false,budget:d.overallBudget,method:rest.length?'history':'linear'};
}

// Deterministic PRNG so simulations are stable between renders.
function seededRandom(seed=42){
  let a=seed>>>0;
  return ()=>{a=a+0x6D2B79F5>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296;};
}

// Monte Carlo of a portfolio with monthly contributions. Values are in today's money (real terms).
function monteCarlo({start=0,monthly=0,years=20,annualReturn=.07,volatility=.15,inflation=.025,runs=1000,target=null,seed=7}={}){
  if(![start,monthly,years,annualReturn,volatility,inflation].every(Number.isFinite))throw new Error('יש להזין ערכים מספריים לסימולציה.');
  years=Math.max(1,Math.min(60,Math.round(years)));runs=Math.max(50,Math.min(5000,Math.round(runs)));
  const random=seededRandom(seed),months=years*12;
  const mu=Math.log(1+annualReturn)/12-volatility**2/24,sigma=volatility/Math.sqrt(12),deflate=Math.log(1+inflation)/12;
  const yearly=Array.from({length:years+1},()=>new Float64Array(runs));
  let hits=0;
  for(let r=0;r<runs;r++){
    let value=start;yearly[0][r]=start;let reached=target!=null&&start>=target;
    for(let m=1;m<=months;m++){
      const u1=random()||1e-12,u2=random(),z=Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2);
      value=value*Math.exp(mu+sigma*z-deflate)+monthly;
      if(m%12===0)yearly[m/12][r]=value;
    }
    if(target!=null&&(reached||value>=target))hits++;
  }
  const pick=(arr,p)=>{const s=[...arr].sort((a,b)=>a-b);return s[Math.min(s.length-1,Math.max(0,Math.floor(p*(s.length-1))))];};
  const points=yearly.map((arr,year)=>({year,p10:pick(arr,.1),p50:pick(arr,.5),p90:pick(arr,.9),contributed:start+monthly*12*year}));
  return {points,final:points.at(-1),probability:target==null?null:hits/runs,runs,years};
}

const fireNumber=(annualExpenses,withdrawalRate=.04)=>withdrawalRate>0?annualExpenses/withdrawalRate:null;

// Years until a target is reached with deterministic growth (real terms); null if never within 100 years.
function yearsToTarget(start,monthly,target,annualReturn=.07,inflation=.025){
  if(start>=target)return 0;
  const r=(1+annualReturn)/(1+inflation),monthlyRate=Math.pow(r,1/12)-1;let value=start;
  for(let m=1;m<=1200;m++){value=value*(1+monthlyRate)+monthly;if(value>=target)return m/12;}
  return null;
}

// Future value of cutting a category by a percentage and investing the difference.
function whatIfCut(d,category,percent,years=10,annualReturn=.06,month=today().slice(0,7)){
  const avg=recentMonths(month,3).reduce((s,m)=>s+categorySpend(d,category,m),0)/3,monthly=avg*percent/100,rate=Math.pow(1+annualReturn,1/12)-1,n=years*12;
  const future=rate?monthly*((1+rate)**n-1)/rate:monthly*n;
  return {category,average:avg,monthly,yearly:monthly*12,future,contributed:monthly*n,years};
}

const INCOME_WORDS=['משכורת','הכנסה','קיבלתי','החזר','בונוס','זיכוי','מענק','שכר','תלוש','החזר מס','פרילנס','מכרתי'];

function suggestCategory(d,text,type='expense'){
  const q=normalizeText(text);if(!q)return null;
  const words=q.split(' ').filter(w=>w.length>1),scores=new Map();
  const add=(cat,n)=>{if(d.categories.includes(cat))scores.set(cat,(scores.get(cat)||0)+n);};
  for(const t of d.transactions){
    if(t.type!==type)continue;
    const desc=normalizeText(t.description);if(!desc)continue;
    if(desc===q)add(t.category,6);
    else for(const w of words)if(desc.split(' ').includes(w))add(t.category,1.5);
  }
  for(const [cat,list] of Object.entries(KEYWORDS))for(const k of list)if(q.includes(k.toLowerCase()))add(cat,k.length>3?3:2);
  const best=[...scores.entries()].sort((a,b)=>b[1]-a[1])[0];
  return best?best[0]:null;
}

const HEB_NUMBERS={'אלף':1000,'אלפיים':2000,'מאה':100,'מאתיים':200,'חמישים':50,'עשרים':20,'שלושים':30,'ארבעים':40,'עשר':10};

// Parses free Hebrew text such as "קפה 18 אתמול במזומן" into a transaction draft.
function parseQuickEntry(text,d,now=today()){
  const raw=String(text||'').trim();if(!raw)return null;
  let rest=' '+raw.replace(/₪/g,' ₪ ').replace(/\$/g,' $ ')+' ';
  let amount=null,currency='ILS',date=now,dateFound=false;
  const dateLike=rest.match(/(?:^|\s)(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?=\s)|(?:^|\s)(\d{1,2})\.(\d{1,2})\.(\d{2,4})(?=\s)/);
  if(dateLike){
    const day=+(dateLike[1]||dateLike[4]),mon=+(dateLike[2]||dateLike[5]),explicit=dateLike[3]||dateLike[6];let year=explicit?+explicit:+now.slice(0,4);if(year<100)year+=2000;
    const candidate=`${year}-${String(mon).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    if(validDate(candidate)){date=!explicit&&candidate>now?`${year-1}${candidate.slice(4)}`:candidate;dateFound=true;rest=rest.replace(dateLike[0],' ');}
  }
  const num=rest.match(/(\d{1,3}(?:,\d{3})+|\d+)(?:\.(\d+))?\s*(k|K|אלף)?/);
  if(num){amount=Number(num[1].replace(/,/g,'')+(num[2]?'.'+num[2]:''))*(num[3]?1000:1);rest=rest.replace(num[0],' ');}
  else for(const [word,value] of Object.entries(HEB_NUMBERS))if(new RegExp(`(^|\\s)${word}(\\s|$)`).test(rest)){amount=value;rest=rest.replace(word,' ');break;}
  if(/\$|דולר|usd/i.test(rest)){currency='USD';rest=rest.replace(/\$|דולרים|דולר|usd/gi,' ');}
  rest=rest.replace(/₪|שקלים|שקל|ש"ח|ש״ח|ils/gi,' ');
  const rel=[[/(^|\s)היום(\s|$)/,0],[/(^|\s)אתמול(\s|$)/,-1],[/(^|\s)שלשום(\s|$)/,-2]];
  for(const [re,offset] of rel)if(re.test(rest)){date=shiftDate(now,offset);dateFound=true;rest=rest.replace(re,' ');break;}
  const ago=rest.match(/לפני\s+(\d+)\s+(ימים|יום|שבועות|שבוע)/);
  if(ago){date=shiftDate(now,-Number(ago[1])*(ago[2].startsWith('שבוע')?7:1));dateFound=true;rest=rest.replace(ago[0],' ');}
  const days=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  const dayMatch=rest.match(/(?:ביום|יום)\s+(ראשון|שני|שלישי|רביעי|חמישי|שישי|שבת)|(^|\s)ב?(שבת)(\s|$)/);
  if(dayMatch&&!dateFound){
    const target=days.indexOf(dayMatch[1]||dayMatch[3]),cur=new Date(now+'T12:00:00Z').getUTCDay();
    date=shiftDate(now,-(((cur-target)+7)%7||7));dateFound=true;rest=rest.replace(dayMatch[0],' ');
  }
  let account=null;
  const usable=d.accounts.filter(a=>!['investment','debt'].includes(a.kind));
  for(const a of [...usable].sort((x,y)=>y.name.length-x.name.length)){
    if(a.name&&rest.includes(a.name)){account=a;rest=rest.replace(new RegExp('ב?'+a.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')),' ');break;}
  }
  if(!account&&/(^|\s)ב?מזומן(\s|$)/.test(rest)){account=usable.find(a=>a.kind==='cash')||null;rest=rest.replace(/(^|\s)ב?מזומן(\s|$)/,' ');}
  if(!account&&/(^|\s)(ב?אשראי|בכרטיס)(\s|$)/.test(rest)){account=usable.find(a=>a.kind==='bank')||null;rest=rest.replace(/(^|\s)(ב?אשראי|בכרטיס)(\s|$)/,' ');}
  account ||=usable.find(a=>a.kind==='bank'&&a.currency===currency)||usable.find(a=>a.kind==='bank')||usable[0]||null;
  const lower=raw.toLowerCase(),type=INCOME_WORDS.some(w=>lower.includes(w))?'income':'expense';
  const description=rest.replace(/(^|\s)(על|עבור|שילמתי|הוצאתי|קניתי|ב|ל)(?=\s)/g,' ').replace(/\s+/g,' ').trim();
  const category=suggestCategory(d,description||raw,type)||(type==='income'?(d.categories.includes('משכורת')?'משכורת':d.categories[0]):d.categories.includes('קניות')?'קניות':d.categories[0]);
  return {type,amount,currency,date,category,accountId:account?.id||'',description,valid:amount>0&&!!account,dateFound};
}

// Minimal .xlsx reader: enough to read the first worksheet of bank, card and broker exports.
// An .xlsx file is a zip of XML parts; entries are stored or deflated (DecompressionStream).

let utf8Decoder=null;
const decodeUtf8=bytes=>(utf8Decoder ||=new TextDecoder()).decode(bytes);
const u16=(b,o)=>b[o]|b[o+1]<<8;
const u32=(b,o)=>(b[o]|b[o+1]<<8|b[o+2]<<16|b[o+3]<<24)>>>0;

function zipEntries(bytes){
  let eocd=-1;
  for(let i=bytes.length-22;i>=Math.max(0,bytes.length-65557);i--)if(u32(bytes,i)===0x06054b50){eocd=i;break;}
  if(eocd<0)throw new Error('הקובץ אינו קובץ Excel תקין (xlsx).');
  const count=u16(bytes,eocd+10),entries=new Map();
  let p=u32(bytes,eocd+16);
  for(let i=0;i<count;i++){
    if(u32(bytes,p)!==0x02014b50)throw new Error('מבנה קובץ ה־Excel פגום.');
    const method=u16(bytes,p+10),size=u32(bytes,p+20),nameLength=u16(bytes,p+28),extraLength=u16(bytes,p+30),commentLength=u16(bytes,p+32),offset=u32(bytes,p+42);
    entries.set(decodeUtf8(bytes.subarray(p+46,p+46+nameLength)),{method,size,offset});
    p+=46+nameLength+extraLength+commentLength;
  }
  return entries;
}
async function inflateRaw(data){
  const stream=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function readEntry(bytes,entry){
  const start=entry.offset+30+u16(bytes,entry.offset+26)+u16(bytes,entry.offset+28),data=bytes.subarray(start,start+entry.size);
  if(entry.method===0)return decodeUtf8(data);
  if(entry.method===8)return decodeUtf8(await inflateRaw(data));
  throw new Error('שיטת הדחיסה של הקובץ אינה נתמכת.');
}
const unescapeXml=s=>s.replace(/&(#x[0-9a-f]+|#\d+|amp|lt|gt|quot|apos);/gi,(_,c)=>c[0]==='#'?String.fromCodePoint(c[1].toLowerCase()==='x'?parseInt(c.slice(2),16):parseInt(c.slice(1),10)):{amp:'&',lt:'<',gt:'>',quot:'"',apos:"'"}[c.toLowerCase()]);
const textOf=xml=>[...xml.matchAll(/<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g)].map(m=>unescapeXml(m[1])).join('');
function columnIndex(ref){let n=0;for(const ch of ref.replace(/\d+/g,''))n=n*26+ch.charCodeAt(0)-64;return n-1;}

function isXlsx(bytes){return bytes.length>4&&u32(bytes,0)===0x04034b50;}

// Returns the first worksheet that has data, as an array of rows (arrays of strings/numbers).
async function readXlsx(buffer){
  const bytes=buffer instanceof Uint8Array?buffer:new Uint8Array(buffer);
  if(!isXlsx(bytes)){
    if(bytes.length>8&&u32(bytes,0)===0xe011cfd0)throw new Error('קבצי Excel ישנים (xls) אינם נתמכים. שמור את הקובץ כ־xlsx או CSV ונסה שוב.');
    throw new Error('הקובץ אינו קובץ Excel תקין (xlsx).');
  }
  const entries=zipEntries(bytes),read=name=>entries.has(name)?readEntry(bytes,entries.get(name)):Promise.resolve('');
  const shared=[...(await read('xl/sharedStrings.xml')).matchAll(/<si>([\s\S]*?)<\/si>/g)].map(m=>textOf(m[1]));
  const sheets=[...entries.keys()].filter(n=>/^xl\/worksheets\/sheet\d+\.xml$/.test(n)).sort((a,b)=>Number(a.match(/\d+/)[0])-Number(b.match(/\d+/)[0]));

    const xml=await read(name),rows=[];

      const row=[];
      for(const c of r[1].matchAll(/<c\s([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)){
        const attrs=c[1],body=c[2]||'',ref=attrs.match(/\br="([A-Z]+)\d+"/),type=(attrs.match(/\bt="(\w+)"/)||[])[1],raw=(body.match(/<v>([\s\S]*?)<\/v>/)||[])[1];
        let value='';

// Excel stores dates as days since 1899-12-30.
const excelDate=serial=>new Date(Date.UTC(1899,11,30)+Math.round(Number(serial)*86400000)).toISOString().slice(0,10);

// Numbers as they appear in exports: "1,234.56", "1.234,56", "12,5", "-120", "120-", "(120)", "₪ 89.90", "−3%".
function parseNumber(value){
  if(typeof value==='number')return Number.isFinite(value)?value:null;
  let s=String(value??'').trim();
  if(!s)return null;
  const compact=s.replace(/[\s‎‏₪$€£%]/g,''),negative=/^\(.*\)$/.test(compact)||/^[-−–]/.test(compact)||/[-−–]$/.test(compact);
  s=compact.replace(/[^\d.,]/g,'');
  if(!/\d/.test(s))return null;
  const comma=s.lastIndexOf(','),dot=s.lastIndexOf('.');
  if(comma>-1&&dot>-1)s=comma>dot?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');
  else if(comma>-1){const parts=s.split(',');s=parts.length===2&&parts[1].length!==3?parts.join('.'):s.replace(/,/g,'');}
  else if((s.match(/\./g)||[]).length>1)s=s.replace(/\./g,'');
  const n=Number(s);
  return Number.isFinite(n)?(negative?-n:n):null;
}

function splitDelimited(text,delimiter){
  const rows=[];let row=[],cell='',quote=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(c==='"'){if(quote&&text[i+1]==='"'){cell+='"';i++;}else quote=!quote;}
    else if(c===delimiter&&!quote){row.push(cell.trim());cell='';}
    else if(c==='\n'&&!quote){row.push(cell.trim());if(row.some(Boolean))rows.push(row);row=[];cell='';}
    else cell+=c;
  }
  row.push(cell.trim());if(row.some(Boolean))rows.push(row);
  return rows;
}
// Text copied from a web table or Excel (tabs), CSV/semicolon exports, or columns aligned with spaces.
function textToRows(text){
  const clean=String(text||'').replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n'),lines=clean.split('\n').filter(l=>l.trim());
  if(!lines.length)return [];
  const head=lines.slice(0,25),most=test=>head.filter(test).length>=Math.ceil(head.length*.8);
  const consistent=ch=>{const counts=head.map(l=>splitDelimited(l,ch)[0]?.length||1);return counts[0]>1&&most((l,i)=>counts[head.indexOf(l)]===counts[0]);};
  const thousandsOnly=head.every(l=>!l.replace(/\d,\d{3}(?!\d)/g,'').includes(','));
  if(head.some(l=>l.includes('\t')))return lines.map(l=>l.split('\t').map(c=>c.trim()));
  if(most(l=>/\S\s{2,}\S/.test(l.trim())))return lines.map(l=>l.trim().split(/\s{2,}|\s*\|\s*/).map(c=>c.trim()).filter(Boolean));
  if(consistent(';'))return splitDelimited(clean,';');
  if(!thousandsOnly&&consistent(','))return splitDelimited(clean,',');
  // Single spaces: the trailing numeric tokens are values, everything before them is the name.
  return lines.map(l=>{const tokens=l.trim().split(/\s+/);let i=tokens.length;while(i>1&&parseNumber(tokens[i-1])!=null)i--;return [tokens.slice(0,i).join(' '),...tokens.slice(i)];});
}

  if(/קריפטו|bitcoin|ביטקוין|ethereum|crypto/.test(text))return 'קריפטו';
  if(/אג"ח|אג״ח|אגח|bond|treasury|מק"מ|מק״מ|שקלית/.test(text))return 'אג״ח';
  if(['פנסיה','קרן השתלמות','קופת גמל להשקעה'].includes(a.type))return 'חיסכון ארוך טווח';
  if(a.type==='מזומן'||/פיקדון|כספית|money market/.test(text))return 'מזומן ופיקדונות';
  if(/זהב|gold|כסף טהור|silver|סחורות|commodit/.test(text))return 'סחורות וזהב';
  if(/נדל"ן|נדל״ן|reit|real estate/.test(text))return 'נדל״ן';
  if(/ת"א|ת״א|תל אביב|tase|ישראל|israel/.test(text))return 'מניות ישראל';

const group=(items,key)=>{const map=new Map();for(const x of items)map.set(x[key],(map.get(x[key])||0)+x.value);return map;};
function riskProfile(d){

const STRESS_SCENARIOS=[
  {id:'dip',name:'תיקון בשוק המניות',detail:'ירידה של 10% במניות',market:-.1},
  {id:'bear',name:'שוק דובי',detail:'ירידה של 25% במניות',market:-.25},

function stressTest(d,scenario){
  const profile=riskProfile(d),avg=averageMonth(d,new Date().toISOString().slice(0,7),3);let change=0;
  for(const h of profile.holdings){
    let move=scenario.crypto!=null?(h.sector==='קריפטו'?scenario.crypto:0):(scenario.market||0)*(SENSITIVITY[h.sector]??.8);
    move=Math.max(-.95,move);

  return {...scenario,change,share:profile.total?change/profile.total:0,netWorthAfter:net+change,months:avg.expenses>0?-change/avg.expenses:null};

// Volatility and drawdown measured from the monthly snapshots (flow-adjusted returns).
function historyRisk(d){
  const snaps=[...d.snapshots].sort((a,b)=>a.date.localeCompare(b.date)),returns=[];
  for(let i=1;i<snaps.length;i++){const r=dietz(snaps[i-1],snaps[i],d.activities).return;if(r!=null)returns.push(r);}
  if(returns.length<2)return null;
  const mean=returns.reduce((s,r)=>s+r,0)/returns.length,sd=Math.sqrt(returns.reduce((s,r)=>s+(r-mean)**2,0)/(returns.length-1));
  let index=1,peak=1,maxDrawdown=0;
  for(const r of returns){index*=1+r;peak=Math.max(peak,index);maxDrawdown=Math.min(maxDrawdown,index/peak-1);}
  return {months:returns.length,annualVolatility:sd*Math.sqrt(12),best:Math.max(...returns),worst:Math.min(...returns),maxDrawdown,positiveShare:returns.filter(r=>r>0).length/returns.length};
}

// ---------- Broker reports ----------
const HEADERS={
  symbol:/סימול|מס['׳]? ?נייר|מספר נייר|מספר ני"ע|מספר ני״ע|symbol|ticker|isin/i,
  name:/שם נייר|שם הנייר|שם ני"ע|שם ני״ע|^שם$|נייר ערך|name|description|instrument|תיאור/i,
  quantity:/כמות|יחידות|quantity|qty|shares|units|position|amount held/i,
  price:/שער|מחיר|last|price|close|rate|quote/i,
  value:/שווי|market value|value|שווי שוק|שווי נוכחי|סה"כ שווי|סה״כ שווי/i,
  currency:/מטבע|currency|ccy/i
};
const SKIP=/עלות|cost|רווח|הפסד|p&l|gain|תשואה|change|שינוי|%|weight|משקל/i;
function headerMap(row){
  const map={};
  row.forEach((cell,i)=>{
    const text=String(cell??'').trim();if(!text)return;
    for(const [key,re] of Object.entries(HEADERS)){
      if(map[key]!=null||!re.test(text))continue;
      if(key!=='currency'&&SKIP.test(text)&&!(key==='value'&&/שווי/.test(text)&&!/עלות/.test(text)))continue;
      if(key==='name'&&map.symbol===i)continue;
      map[key]=i;
      if(key==='price'&&/אג['׳]|אגורות|agorot/i.test(text))map.agorot=true;
      break;
    }
  });
  return map;
}
// Rows of a pasted or exported holdings table → [{symbol,name,quantity,price,value,currency}].
function parseHoldingsRows(rows){
  const clean=rows.map(r=>r.map(c=>typeof c==='string'?c.replace(/[‎‏]/g,'').trim():c)).filter(r=>r.some(c=>c!==''&&c!=null));
  let headerIndex=-1,map={};
  for(let i=0;i<Math.min(clean.length,15);i++){const m=headerMap(clean[i]);if(Object.keys(m).filter(k=>k!=='agorot').length>=2&&(m.quantity!=null||m.price!=null||m.value!=null)){headerIndex=i;map=m;break;}}
  const out=[];
  for(const row of clean.slice(headerIndex+1)){
    const label=String(row[map.name??-1]??'').trim(),symbol=String(row[map.symbol??-1]??'').trim();
    const texts=row.filter(c=>typeof c==='string'&&c&&parseNumber(c)==null);
    const name=label||texts.find(t=>t!==symbol)||'',sym=symbol||(texts.find(t=>/^[A-Z][A-Z0-9.\-]{0,9}$/.test(t))||'');
    if(/סה"כ|סה״כ|total|^סך/i.test(`${name} ${sym}`))continue;
    const pick=key=>map[key]!=null?parseNumber(row[map[key]]):null;
    let quantity=pick('quantity'),price=pick('price'),value=pick('value');
    if(headerIndex<0){const nums=row.map(parseNumber).filter((n,i)=>n!=null&&!(typeof row[i]==='string'&&/^[A-Z]/.test(row[i])));if(!nums.length)continue;[quantity,price,value]=nums.length>=3?nums.slice(-3):nums.length===2?[nums[0],nums[1],null]:[null,null,nums[0]];}
    if(quantity==null&&price==null&&value==null)continue;
    if(!name&&!sym)continue;
    out.push({symbol:sym,name:name||sym,quantity,price,value,currency:String(row[map.currency??-1]??'').trim(),noHeader:headerIndex<0,agorot:!!map.agorot});
  }
  return out;
}

const norm=s=>String(s||'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim();
function findAsset(d,row){
  const sym=String(row.symbol||'').toUpperCase().trim(),name=norm(row.name);
  return d.assets.find(a=>sym&&String(a.ticker||'').toUpperCase()===sym)
    ||d.assets.find(a=>a.ticker&&(String(row.name||'').toUpperCase().split(/[^A-Z0-9.]+/).includes(String(a.ticker).toUpperCase())))
    ||d.assets.find(a=>{const n=norm(a.name);return n&&name&&(n===name||n.includes(name)||name.includes(n));})
    ||d.assets.find(a=>{const words=norm(a.name).split(' ').filter(w=>w.length>2);return words.length&&words.filter(w=>name.includes(w)).length>=Math.min(2,words.length);});
}
// Matches report rows to existing holdings and proposes new prices or values for review.
function matchHoldings(d,rows){
  const matches=[],unmatched=[],used=new Set();
  for(const row of rows){
    const asset=findAsset(d,row);
    if(!asset||used.has(asset.id)){unmatched.push(row);continue;}
    used.add(asset.id);
    let {quantity,price,value}=row;const flags=[];
    if(row.noHeader&&quantity!=null&&price!=null&&asset.mode==='price'&&Math.abs(quantity-asset.quantity)>1e-6&&Math.abs(price-asset.quantity)<1e-6)[quantity,price]=[price,quantity];
    if(asset.mode==='price'){
      if(price==null&&value!=null)price=value/((quantity||asset.quantity)||NaN);
      // Tel Aviv prices are often quoted in agorot; foreign holdings in the same column are not.
      if(price!=null&&asset.currency==='ILS'){const ratio=asset.currentPrice>0?price/asset.currentPrice:null;if(row.agorot&&!(ratio!=null&&ratio<3)||ratio!=null&&ratio>60&&ratio<160){price/=100;flags.push('agorot');}}
      if(!(price>0)){unmatched.push(row);continue;}
      if(quantity!=null&&Math.abs(quantity-asset.quantity)>Math.max(1e-6,asset.quantity*1e-4))flags.push('quantity');
      const oldValue=asset.quantity*asset.currentPrice,newValue=asset.quantity*price;
      matches.push({asset,row,field:'currentPrice',old:asset.currentPrice,next:Math.round(price*1e6)/1e6,oldValue,newValue,change:asset.currentPrice?price/asset.currentPrice-1:null,flags,reportQuantity:quantity});
    }else{
      if(value==null&&price!=null&&quantity!=null)value=price*quantity;
      if(!(value>=0)||value==null){unmatched.push(row);continue;}
      matches.push({asset,row,field:'currentValue',old:asset.currentValue,next:Math.round(value*100)/100,oldValue:asset.currentValue,newValue:value,change:asset.currentValue?value/asset.currentValue-1:null,flags,reportQuantity:quantity});
    }
    if(matches.at(-1).change!=null&&Math.abs(matches.at(-1).change)>.35)matches.at(-1).flags.push('jump');
  }
  return {matches,unmatched,missing:d.assets.filter(a=>!used.has(a.id))};
}

const COLUMNS={

  originalAmount:/סכום (ה)?עסקה|סכום מקורי|original amount/i,
  amount:/סכום חיוב|סכום החיוב|חיוב בש["״]ח|סכום בש["״]ח|^סכום$|^₪ ?סכום|charged|amount/i,

function detectColumns(row){
  const map={};
  row.forEach((cell,i)=>{
    const text=String(cell??'').replace(/[‎‏]/g,'').trim();if(!text)return;
    for(const [key,re] of Object.entries(COLUMNS))if(map[key]==null&&re.test(text)){if(key==='date'&&map.chargeDate===i)continue;map[key]=i;break;}
  });
  return map;

// "05/10/2026", "5.10.26", "2026-10-05", Excel serial numbers. Day comes first (Israeli format).
function parseDate(value){
  if(typeof value==='number'&&value>20000&&value<80000)return excelDate(value);
  const s=String(value??'').trim();
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m){const iso=`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;return validDate(iso)?iso:null;}
  m=s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})/);
  if(m){let year=Number(m[3]);if(year<100)year+=2000;const iso=`${year}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;return validDate(iso)?iso:null;}
  return null;
}

// Rows (from xlsx or text) → {items, skipped, columns, kind}.
function parseStatementRows(rows,now=today()){
