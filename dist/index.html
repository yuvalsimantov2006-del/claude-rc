/* Shared visual refinement: quieter chrome, luminous surfaces, clearer numbers. */
:root {
  --gold: #dfc491;
  --purple: #bbace5;
  --green: #93ceb9;
  --muted: #a5a4b0;
  --line: rgba(255,255,255,.07);
  --surface: #1b1b22;
}
body { background: #101015; }
.app-shell {
  background: radial-gradient(ellipse at 79% 2%,rgba(165,135,90,.075),transparent 38%),
    radial-gradient(ellipse at 14% 34%,rgba(117,89,171,.065),transparent 43%),#101015;
}
.sidebar {
  background: linear-gradient(180deg,rgba(27,26,33,.97),rgba(19,19,26,.99));
  border-left-color: rgba(255,255,255,.06);
}
.brand-icon {
  border-radius: 14px;
  background: linear-gradient(135deg,rgba(220,187,126,.18),rgba(138,113,178,.1));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.1),0 10px 30px rgba(0,0,0,.15);
}
.nav-item { border-radius: 11px; color: #aaa8b7; }
.nav-item.active {
  background: linear-gradient(100deg,rgba(202,174,121,.035),rgba(211,183,128,.12));
  border-color: rgba(220,191,138,.14);
  color: #ecd4a7;
}
.sidebar-update {
  background: radial-gradient(ellipse at 100% 0,rgba(155,124,199,.14),transparent 85%),rgba(36,31,46,.7);
  border-color: rgba(183,159,225,.16);
  border-radius: 16px;
}
.topbar { background: rgba(18,18,25,.7); border-bottom-color: rgba(255,255,255,.065); }
.topbar-actions .icon-button:hover { background: rgba(255,255,255,.05); }
main { padding-top: 35px; }
.page-heading { margin-bottom: 27px; }
.page-heading h1 { font-size: 1.95rem; font-weight: 600; letter-spacing: -.02em; }
.page-heading p { font-size: .875rem; color: #9d9ba9; margin-top: 8px; }
.greeting { margin-bottom: 9px; color: #cab58f; }
.card {
  background: linear-gradient(145deg,rgba(37,36,46,.82),rgba(25,25,33,.93));
  border: 1px solid rgba(255,255,255,.065);
  border-radius: 18px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.025),0 12px 36px rgba(0,0,0,.12);
  backdrop-filter: blur(14px);
}
.card:has(.table-wrap) { background: linear-gradient(145deg,rgba(31,31,40,.95),rgba(24,24,31,.97)); }
.button {
  border-radius: 10px;
  min-height: 43px;
  background: rgba(255,255,255,.025);
  border-color: rgba(255,255,255,.1);
  padding-inline: 17px;
  font-size: .875rem;
}
.button.primary {
  background: linear-gradient(115deg,#e8cea0,#d4b77f);
  border-color: rgba(239,211,166,.55);
  color: #302619;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.22),0 5px 20px rgba(180,137,65,.1);
}
.button.primary:hover { background: linear-gradient(115deg,#f0d9b0,#e0c38f); box-shadow: 0 6px 26px rgba(180,137,65,.17); }
.icon-button { border-radius: 9px; }
.metric { border-radius: 17px; }
.metric-value,.net-value,.large-number,.saving-forecast strong,.goal-live-number { font-variant-numeric: tabular-nums; }
.metric-icon { width: 35px; height: 35px; border: 1px solid rgba(255,255,255,.025); }
.metric-top { color: #bab8c5; }
.metric-detail { color: #a1a0ae; }
.net-card {
  background: radial-gradient(ellipse at 2% 0%,rgba(140,106,175,.2),transparent 66%),
    radial-gradient(ellipse at 100% 100%,rgba(196,159,96,.105),transparent 72%),#24212a;
  border-color: rgba(221,192,142,.18);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.035),0 15px 40px rgba(0,0,0,.17);
}
.net-value { color: #f4ece0; font-weight: 500; }
.net-bottom { border-top-color: rgba(224,202,162,.09); }
.asset-strip { border-radius: 15px; background: rgba(28,27,36,.7); border-color: rgba(255,255,255,.065); }
.asset-strip-item { padding-block: 20px; }
.asset-strip-item:hover { background: rgba(206,187,154,.04); }
.asset-icon,.transaction-icon,.ticker-icon { border-radius: 11px; }
.insight-banner { border-radius: 15px; border-color: rgba(170,143,213,.18); background: linear-gradient(100deg,rgba(151,115,211,.06),rgba(176,156,220,.105)); }
.section-head h2 { font-size: 1.06rem; font-weight: 600; }
.section-head p { color: #9c98a9; font-size: .8125rem; }
.month-picker { border-radius: 10px; background: rgba(34,33,42,.75); border-color: rgba(255,255,255,.085); }
.segmented { border-radius: 10px; padding: 5px; background: rgba(15,15,22,.55); }
.segmented button { border-radius: 7px; }
.segmented button.active { background: #34303b; color: #ebdac0; }
input,select,textarea {
  min-height: 45px;
  border-radius: 10px;
  border-color: rgba(255,255,255,.11);
  background: rgba(15,15,23,.72);
  font-size: .9375rem;
}
input:hover,select:hover,textarea:hover { border-color: rgba(227,207,169,.24); }
input[readonly] { background: rgba(154,137,179,.07); border-color: rgba(174,149,211,.12); color: #c4b5df; }
.field { gap: 9px; }
.field>span { color: #d0cbd9; font-size: .875rem; }
.field>small { color: #aaa1b8; font-size: .8125rem; }
.search-field { border-radius: 10px; background: rgba(15,15,23,.65); }
.modal {
  background: radial-gradient(ellipse at 100% 0,rgba(122,90,163,.085),transparent 60%),#202029;
  border-color: rgba(215,203,234,.13);
  border-radius: 21px;
  padding: 30px;
  box-shadow: 0 25px 100px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.045);
}
.modal.wide { width: 700px; }
.modal-head { margin-bottom: 27px; }
.modal-head h2 { font-size: 1.3rem; }
.modal::backdrop { background: rgba(5,5,11,.7); backdrop-filter: blur(9px); }
.form-grid { gap: 21px 22px; }
.form-actions { padding-top: 22px; margin-top: 25px; }
.notice { border-radius: 12px; }
.badge { font-size: .75rem; border-radius: 7px; }
.badge.purple { border-color: rgba(187,172,229,.15); }
.demo-banner { border-radius: 9px; margin-bottom: 24px; border-color: rgba(215,189,131,.13); }
.table-wrap th { color: #a7a2b4; font-size: .8125rem; }
.table-wrap td { padding-block: 18px; }
.transaction-name small,.asset-name small { color: #9991a7; }
.category-pill { border-radius: 6px; background: rgba(159,144,185,.06); }
.app-footer { color: #89818f; }

/* Savings: the forecast is the primary result, followed by its real inputs. */
.savings-overview {
  position: relative;
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  align-items: center;
  gap: 26px 42px;
  padding: 31px 32px 22px;
  background: radial-gradient(ellipse at 0% 0%,rgba(165,127,201,.2),transparent 63%),
    linear-gradient(122deg,rgba(52,43,64,.82),rgba(34,30,40,.95));
  border: 1px solid rgba(199,175,234,.16);
  border-radius: 20px;
  box-shadow: inset 0 1px 0 rgba(232,218,251,.045),0 16px 45px rgba(0,0,0,.12);
  overflow: hidden;
}
.savings-overview .eyebrow { color: #c9b0e6; font-size: .8125rem; }
.savings-overview h2 { margin-top: 12px; font-size: 1.6rem; font-weight: 500; line-height: 1.5; }
.savings-overview p { max-width: 420px; color: #b0a5c0; margin-top: 9px; font-size: .9375rem; }
.savings-overview>.savings-overview-number { display: flex; flex-direction: column; gap: 9px; align-items: flex-start; padding-right: 33px; border-right: 1px solid rgba(214,194,239,.1); }
.savings-overview-number>span { color: #c4b8d3; font-size: .875rem; }
.savings-overview-number>b { font-size: 2.7rem; letter-spacing: -.025em; font-weight: 500; font-variant-numeric: tabular-nums; }
.savings-overview-number>small { color: #9d8caa; font-size: .75rem; }
.savings-overview>.savings-overview-bottom {
  grid-column: 1/-1;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  flex-wrap: wrap;
  gap: 15px 28px;
  padding: 18px 0 0;
  border-top: 1px solid rgba(215,194,241,.085);
}
.savings-overview-bottom>span { display: flex; align-items: center; gap: 9px; color: #b6a7c6; font-size: .8125rem; }
.savings-overview-bottom svg { color: #bba0d8; }
.savings-section-head { margin: 9px 0 -2px; }
.savings-section-head h2 { font-size: 1.125rem; }
.savings-section-head p { font-size: .875rem; margin-top: 6px; }
.savings-grid { grid-template-columns: repeat(3,minmax(0,1fr)); gap: 23px; }
.saving-card {
  padding: 24px;
  background: radial-gradient(ellipse at 100% 0,rgba(173,143,218,.045),transparent 70%),
    linear-gradient(150deg,rgba(35,32,45,.96),rgba(25,25,34,.95));
  border-color: rgba(198,177,224,.11);
  border-radius: 19px;
  transition: border-color .2s,box-shadow .2s;
}
.saving-card:hover { border-color: rgba(202,177,236,.22); box-shadow: 0 16px 37px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.03); }
.saving-card-top { display: flex; align-items: center; gap: 12px; }
.saving-card-top .goal-icon { width: 44px; height: 44px; border-radius: 12px; border: 1px solid rgba(215,189,131,.095); }
.saving-card-top .goal-icon.purple { border-color: rgba(176,156,220,.12); }
.saving-card-title { flex: 1; min-width: 0; }
.saving-card-title>h2 { font-size: 1.06rem; line-height: 1.5; margin: 0; overflow-wrap: anywhere; }
.saving-card-title>span { display: block; color: #95899f; font-size: .75rem; margin-top: 3px; }
.saving-card-actions { display: flex; gap: 3px; }
.saving-card-actions .icon-button { width: 28px; height: 31px; border-color: transparent; }
.saving-card-actions .icon-button svg { width: 15px; height: 15px; }
.saving-mode-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 24px; }
.saving-mode-row>span:last-child { display: inline-flex; gap: 6px; align-items: center; color: #a99bb8; font-size: .8125rem; }
.saving-forecast { margin: 27px 0 23px; }
.saving-forecast>span { color: #aaa0b6; font-size: .875rem; display: block; }
.saving-forecast>strong { display: block; margin-top: 9px; color: #f0e6fa; font-size: 2.15rem; letter-spacing: -.025em; font-weight: 500; text-align: right; overflow-wrap: anywhere; }
.saving-parts { display: grid; grid-template-columns: 1fr 1fr; gap: 17px; }
.saving-parts>div { display: flex; flex-direction: column; gap: 8px; }
.saving-parts>div>span { color: #a397af; font-size: .8125rem; display: flex; gap: 7px; align-items: center; }
.saving-parts>div>b { color: #d6cddd; font-size: 1rem; font-weight: 500; text-align: right; }
.purple-dot { width: 7px; height: 7px; background: var(--purple); display: inline-block; border-radius: 50%; }
.savings-composition { display: flex; gap: 4px; height: 6px; border-radius: 10px; overflow: hidden; background: rgba(255,255,255,.045); margin-top: 17px; }
.savings-composition>span:first-child { background: linear-gradient(90deg,#b99c65,#dcc48f); border-radius: 10px; }
.savings-composition>span:last-child { background: linear-gradient(90deg,#8c76af,#bfa6e1); border-radius: 10px; }
.saving-target { padding: 18px 0; margin-top: 17px; border-bottom: 1px solid rgba(202,181,231,.08); }
.saving-target .row-between { font-size: .8125rem; color: #b3a6be; }
.saving-target .row-between b { font-weight: 500; }
.saving-target>small { color: #94859f; font-size: .75rem; }
.saving-card .goal-details { border-top: 0; margin-top: 10px; padding-top: 15px; gap: 11px; }
.saving-card .goal-details>div { font-size: .8125rem; }
.saving-card .goal-details span { color: #9c91a7; }
.saving-card .goal-details b { color: #c7bbd2; max-width: 65%; min-width: 0; overflow-wrap: anywhere; }
.saving-card-status { margin-top: 23px; min-height: 27px; }
.saving-assumption { font-size: .75rem; color: #91839d; line-height: 1.9; margin-top: 17px; }
.savings-note { display: flex; align-items: flex-start; gap: 10px; color: #9d8cac; font-size: .8125rem; line-height: 1.9; padding: 0 5px; }
.savings-note>svg { flex-shrink: 0; margin-top: 5px; }
.saving-accounts>div { padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,.045); }
.saving-accounts>div:last-child { border-bottom: 0; }
.saving-accounts>div>div { min-width: 0; overflow-wrap: anywhere; }
.saving-accounts>div>.asset-icon,.saving-accounts>div>.icon-button { flex-shrink: 0; }
.saving-accounts b { font-size: .9375rem; }
.saving-accounts small { font-size: .8125rem; }

/* Live result in the savings form. */
.goal-live-forecast {
  padding: 22px 23px;
  border: 1px solid rgba(185,155,225,.18);
  border-radius: 15px;
  background: radial-gradient(ellipse at 100% 0,rgba(156,115,206,.12),transparent 80%),rgba(148,107,197,.045);
  margin-top: 1px;
}
.goal-live-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.goal-live-heading>span:first-child { display: flex; align-items: center; gap: 8px; color: #c8b1e5; font-size: .875rem; }
.goal-live-heading svg { flex-shrink: 0; }
.goal-live-number { font-size: 2.3rem; text-align: right; color: #f0e4ff; font-weight: 500; margin-top: 18px; letter-spacing: -.02em; overflow-wrap: anywhere; }
.goal-live-equation { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; margin-top: 11px; color: #beaccf; font-size: .8125rem; }
.goal-live-forecast>p { color: #9e8dae; font-size: .8125rem; margin-top: 13px; line-height: 1.8; }
.goal-live-target { display: flex; justify-content: space-between; gap: 15px; flex-wrap: wrap; margin-top: 18px; padding-top: 15px; border-top: 1px solid rgba(188,162,222,.105); color: #bdb08c; font-size: .8125rem; }

/* Claude copilot, future lab, command palette, smart widgets and privacy mode. */
.sidebar { overflow-y: auto; scrollbar-width: none; }
.sidebar::-webkit-scrollbar { display: none; }
kbd, .kbd-hint {
  font: 600 .66rem/1 inherit; font-family: inherit; color: #b9b6c6; background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.1); border-bottom-width: 2px; border-radius: 6px; padding: 3px 6px; direction: ltr;
}
.palette-trigger {
  display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 0 12px 0 8px; border-radius: 11px;
  border: 1px solid rgba(255,255,255,.08); background: rgba(255,255,255,.03); color: #a9a7b6; font-size: .8rem;
}

/* ---------- Copilot ---------- */
.ai-layout { display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 22px; align-items: start; }
.ai-chat { position: relative; display: flex; flex-direction: column; padding: 0; height: calc(100dvh - 235px); min-height: 520px; overflow: hidden; }
.ai-chat-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 22px; border-bottom: 1px solid var(--line); }
.ai-chat-head .button { width: auto; min-height: 36px; font-size: .78rem; }
.ai-identity { display: flex; align-items: center; gap: 12px; }
.ai-identity b { display: block; font-size: .95rem; }
.ai-identity small { color: var(--muted); }
.ai-avatar {
  width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; flex-shrink: 0; color: #2a2419;

.ai-log { flex: 1; overflow-y: auto; padding: 24px 22px 12px; display: flex; flex-direction: column; gap: 18px; }

.ai-bubble {
  max-width: min(78%,620px); background: linear-gradient(135deg,rgba(223,196,145,.16),rgba(187,172,229,.12));
  border: 1px solid rgba(223,196,145,.18); padding: 11px 16px; border-radius: 16px 16px 16px 4px; font-size: .92rem;
}
.ai-files { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.ai-thumb { max-width: 180px; max-height: 140px; border-radius: 10px; border: 1px solid rgba(255,255,255,.1); object-fit: cover; }
.ai-file { display: inline-flex; align-items: center; gap: 6px; font-size: .75rem; padding: 4px 9px; border-radius: 8px; background: rgba(0,0,0,.2); }
.ai-answer { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; font-size: .93rem; line-height: 1.85; }

.ai-text b { color: #f3ead7; font-weight: 600; }

.ai-table table { font-size: .84rem; margin: 6px 0; }

.ai-tool { align-self: flex-start; display: inline-flex; align-items: center; gap: 7px; font-size: .74rem; color: #a7a3b6; padding: 5px 11px; border-radius: 99px; background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.06); }

.ai-welcome { margin: auto; text-align: center; max-width: 620px; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 0; }

  background: conic-gradient(from 210deg,#e8cf9a,#bbace5,#93ceb9,#e8cf9a); box-shadow: 0 18px 60px rgba(187,172,229,.25),0 0 0 8px rgba(223,196,145,.05);

.ai-attachments { display: flex; flex-wrap: wrap; gap: 8px; }

.ai-attachment span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ai-attachment img { width: 30px; height: 30px; object-fit: cover; border-radius: 6px; }
.ai-input-row { display: flex; align-items: flex-end; gap: 10px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.035); border-radius: 16px; padding: 8px 10px 8px 8px; transition: border-color .2s; }
.ai-input-row:focus-within { border-color: rgba(223,196,145,.45); box-shadow: 0 0 0 4px rgba(223,196,145,.06); }
.ai-input-row textarea { min-height: 40px; flex: 1; resize: none; border: 0; background: transparent; color: inherit; padding: 8px 6px; min-height: 40px; max-height: 180px; line-height: 1.6; font-size: .93rem; }
.ai-input-row textarea:focus-visible { outline: none; }
.ai-actions { display: flex; align-items: center; gap: 4px; }
.ai-actions .icon-button { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; }

.ai-send { width: 40px; height: 40px; border-radius: 12px; border: 0; display: grid; place-items: center; color: #2a2419; background: linear-gradient(120deg,#e8cf9a,#cdb279); flex-shrink: 0; }

.ai-drop-overlay { position: absolute; inset: 10px; border-radius: 16px; border: 2px dashed rgba(223,196,145,.5); background: rgba(16,16,21,.88); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #ecd4a7; z-index: 3; pointer-events: none; }

.ai-hero { display: grid; grid-template-columns: 1.1fr 1fr; gap: 34px; padding: 34px; background: radial-gradient(ellipse at 100% 0,rgba(223,196,145,.12),transparent 55%),radial-gradient(ellipse at 0 100%,rgba(187,172,229,.12),transparent 50%),linear-gradient(145deg,rgba(37,36,46,.85),rgba(25,25,33,.95)); }

/* ---------- Future lab ---------- */
.lab-intro { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 28px 30px; border-radius: 20px; border: 1px solid rgba(187,172,229,.16); background: radial-gradient(ellipse at 0 0,rgba(187,172,229,.15),transparent 60%),radial-gradient(ellipse at 100% 100%,rgba(147,206,185,.08),transparent 55%),rgba(30,28,38,.7); }
.lab-intro h2 { font-size: 1.45rem; margin: 8px 0 6px; letter-spacing: -.02em; }
.lab-intro p { color: var(--muted); max-width: 680px; }
.lab-intro .button { width: auto; flex-shrink: 0; }
.lab-layout { display: grid; grid-template-columns: 320px minmax(0,1fr); gap: 22px; align-items: start; }
.lab-controls { display: flex; flex-direction: column; gap: 18px; }
.lab-controls-card .section-head .button { width: auto; min-height: 34px; }
.lab-slider { display: flex; flex-direction: column; gap: 9px; font-size: .84rem; }
.lab-slider > span { display: flex; justify-content: space-between; color: #c9c6d3; }
.lab-slider output { color: var(--gold); font-weight: 600; direction: ltr; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; min-height: 0; border-radius: 99px; background: rgba(255,255,255,.09); padding: 0; border: 0; margin: 6px 0; }
input[type=range]:focus-visible { outline-offset: 6px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: linear-gradient(120deg,#e8cf9a,#cdb279); border: 3px solid #1d1c24; box-shadow: 0 0 0 1px rgba(223,196,145,.5); cursor: pointer; }
input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: #dfc491; border: 3px solid #1d1c24; cursor: pointer; }
.lab-results { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.lab-chart .chart-footer { display: flex; gap: 18px; flex-wrap: wrap; }
.fire { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
.fire b { font-size: .95rem; }
.fire + .progress + .actions { margin-top: 16px; } .fire ~ .actions .button { width: auto; }
.whatif-result { display: flex; flex-direction: column; gap: 10px; margin: 18px 0 8px; padding: 16px; border-radius: 14px; background: rgba(255,255,255,.025); border: 1px solid rgba(255,255,255,.06); }
.whatif-result b { font-size: 1rem; } .whatif-result b.gold { font-size: 1.3rem; }

/* ---------- Command palette ---------- */
.modal.palette-modal { width: 640px; padding: 0; margin-top: 12vh; overflow: hidden; }
.palette-modal .modal-head { display: none; }
.palette-modal::backdrop { backdrop-filter: blur(6px); background: rgba(8,8,12,.55); }
.palette-input { display: flex; align-items: center; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); color: var(--gold); }
.palette-input input { min-height: 0; flex: 1; background: transparent; border: 0; color: #f1eee8; font-size: 1.05rem; padding: 6px 0; min-width: 0; }
.palette-input input:focus-visible { outline: none; }
.palette-results { max-height: 380px; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.palette-item { display: flex; align-items: center; gap: 13px; text-align: right; padding: 11px 13px; border-radius: 11px; border: 1px solid transparent; background: none; color: #c9c6d3; width: 100%; }
.palette-item svg:first-child { color: #8c8a99; flex-shrink: 0; }
.palette-item > span { flex: 1; min-width: 0; }
.palette-item b { display: block; font-weight: 500; font-size: .9rem; color: #ebe8f1; }
.palette-item small { display: block; color: var(--muted); font-size: .74rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palette-item.accent svg:first-child { color: var(--gold); }
.palette-item.active { background: rgba(223,196,145,.09); border-color: rgba(223,196,145,.22); }
.palette-item.active > svg:last-child { color: var(--gold); }
.palette-empty { padding: 18px; text-align: center; }
.palette-foot { display: flex; gap: 16px; flex-wrap: wrap; padding: 11px 20px; border-top: 1px solid var(--line); color: #7f7d8b; font-size: .72rem; }
.palette-foot span { display: inline-flex; align-items: center; gap: 5px; }
.palette-foot span:last-child { margin-inline-start: auto; }

/* ---------- Privacy mode ---------- */
.privacy main [dir=ltr]:not(.chart):not(.donut):not(input), .privacy .donut-center b, .privacy .chart svg text, .privacy .large-number, .privacy .metric-value, .privacy .net-value, .privacy .score-ring + b {
  filter: blur(7px); transition: filter .2s;
}
.privacy main [dir=ltr]:hover, .privacy .large-number:hover, .privacy .metric-value:hover, .privacy .net-value:hover { filter: none; }

// Future deposits retain the original calendar day, clamped in shorter months.
function savingsDepositDate(from,offset){
  if(!validDate(from)||!Number.isInteger(offset)||offset<0)throw new Error('מועד ההפקדה אינו תקין.');
  const [year,month,day]=from.split('-').map(Number);
  const date=new Date(Date.UTC(year,month-1+offset,1));
  const lastDay=new Date(Date.UTC(date.getUTCFullYear(),date.getUTCMonth()+1,0)).getUTCDate();
  date.setUTCDate(Math.min(day,lastDay));
  return date.toISOString().slice(0,10);
}

function savingsDepositCount(from,to){
  if(!validDate(from)||!validDate(to))throw new Error('יש להזין תאריך תקין לחישוב החיסכון.');
  if(to<=from)return 0;
  const [year,month]=from.split('-').map(Number);
  const [endYear,endMonth]=to.split('-').map(Number);
  let count=(endYear-year)*12+endMonth-month;
  if(count>0&&savingsDepositDate(from,count)>to)count--;
  return Math.max(0,count);
}

function savingsProjection(goal,from=today()){
  const {saved,monthly,date}=goal;
  if(!Number.isFinite(saved)||saved<0||!Number.isFinite(monthly)||monthly<0)throw new Error('יש להזין סכום נוכחי והפקדה חודשית שאינם שליליים.');
  const hasTarget=goal.target!==null&&goal.target!==undefined&&goal.target!=='';
  if(hasTarget&&(!Number.isFinite(goal.target)||goal.target<=0))throw new Error('סכום יעד, אם הוזן, צריך להיות חיובי.');
  const months=savingsDepositCount(from,date);
  const contributions=monthly*months;
  const projected=saved+contributions;
  if(!Number.isFinite(projected))throw new Error('סכומי החיסכון גדולים מדי לחישוב.');
  const target=hasTarget?goal.target:projected;
  const remaining=hasTarget?Math.max(0,target-saved):contributions;
  const needed=hasTarget?(remaining===0?0:months>0?remaining/months:null):null;
  const installments=hasTarget&&remaining>0&&monthly>0?Math.ceil(remaining/monthly):0;
  let estimatedDate=null;
  if(hasTarget&&remaining===0)estimatedDate=from;
  else if(installments>0&&installments<=12000)estimatedDate=savingsDepositDate(from,installments);
  return {saved,monthly,date,hasTarget,target,months,contributions,projected,remaining,needed,progress:target>0?saved/target*100:0,estimatedDate,firstDepositDate:months?savingsDepositDate(from,1):null,past:date<from,due:date<=from};
}

function effectiveGoalSavings(data,goal){
  const account=data.accounts.find(a=>a.id===goal.accountId);
  if(!account)return goal.saved;
  return Math.max(0,account.kind==='investment'?portfolioValue(data):toILS(account.balance,account.currency,data.fx));
}

function savingsProjectionSeries(goal,from=today()){
  const result=savingsProjection(goal,from),points=[{date:from,value:goal.saved,contributions:0}];
  const count=Math.min(18,result.months);
  for(let i=1;i<=count;i++){
    const n=Math.ceil(result.months*i/count);
    points.push({date:savingsDepositDate(from,n),value:goal.saved+goal.monthly*n,contributions:goal.monthly*n});
  }
  if(result.date>from&&points.at(-1).date!==result.date)points.push({date:result.date,value:result.projected,contributions:result.contributions});
  return points;
}

const txILS=(d,t)=>toILS(t.amount,t.currency||'ILS',t.fx||d.fx);
const clamp=(n,lo=0,hi=100)=>Math.max(lo,Math.min(hi,n));
const daysInMonth=month=>new Date(Date.UTC(+month.slice(0,4),+month.slice(5,7),0)).getUTCDate();

function shiftDate(date,days){
  const d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+days);return d.toISOString().slice(0,10);
}

function recentMonths(month,count){return Array.from({length:count},(_,i)=>monthOffset(month,-i-1));}

// Average monthly figures over the previous months that actually have data.
function averageMonth(d,month,count=3){
  const rows=recentMonths(month,count).map(m=>monthlySummary(d,m)).filter(s=>s.income||s.expenses);
  if(!rows.length)return {income:0,expenses:0,saved:0,rate:null,months:0};
  const income=rows.reduce((s,r)=>s+r.income,0)/rows.length,expenses=rows.reduce((s,r)=>s+r.expenses,0)/rows.length;
  return {income,expenses,saved:income-expenses,rate:income>0?(income-expenses)/income:null,months:rows.length};
}

function healthScore(d,month){
  const b=balances(d),current=monthlySummary(d,month),avg=averageMonth(d,month,3);
  const income=avg.months?avg.income:current.income,expenses=avg.months?avg.expenses:current.expenses;
  const rate=income>0?(income-expenses)/income:null;
  const liquid=b.cash+b.savings,cover=expenses>0?liquid/expenses:null;
  const debtRatio=b.total>0?b.debt/b.total:b.debt>0?1:0;
  const budgets=d.budgets.map(x=>categorySpend(d,x.category,month)<=x.limit);
  const overall=current.expenses<=d.overallBudget;
  const adherence=(budgets.filter(Boolean).length+(overall?1:0))/(budgets.length+1);
  const values=d.assets.map(a=>toILS(assetValue(a),a.currency,d.fx)).filter(v=>v>0),invested=values.reduce((s,v)=>s+v,0);
  const maxShare=invested>0?Math.max(...values)/invested:null;
  const factors=[
    {key:'savings',label:'שיעור חיסכון',weight:30,score:rate==null?0:clamp(rate/.3*100),value:rate,
      tip:rate==null?'הוסף הכנסות והוצאות כדי למדוד את שיעור החיסכון.':rate>=.2?'שיעור חיסכון מצוין. שקול להפנות את העודף להשקעה לטווח ארוך.':'יעד טוב הוא לחסוך לפחות 20% מההכנסה. התחל מקטגוריה אחת לצמצום.'},
    {key:'emergency',label:'כרית ביטחון',weight:25,score:cover==null?0:clamp(cover/6*100),value:cover,
      tip:cover==null?'אין עדיין נתוני הוצאות לחישוב.':cover>=6?'יש לך כרית של חצי שנה ומעלה. מעבר לכך, כסף נזיל עשוי להישחק באינפלציה.':`כדאי להגיע ל־6 חודשי הוצאות בכסף נזיל. חסרים כ־${Math.max(0,Math.round(6*expenses-liquid)).toLocaleString('he-IL')} ₪.`},
    {key:'debt',label:'מינוף וחובות',weight:15,score:clamp(100-debtRatio*250),value:debtRatio,
      tip:debtRatio<.1?'רמת החוב נמוכה ביחס לנכסים.':'החובות מהווים חלק משמעותי מהנכסים. פירעון חוב בריבית גבוהה הוא תשואה בטוחה.'},
    {key:'budget',label:'עמידה בתקציב',weight:15,score:clamp(adherence*100),value:adherence,
      tip:adherence>=1?'כל התקציבים בשליטה החודש.':'יש תקציבים שחרגו החודש. בדוק את הקטגוריות המסומנות באדום.'},
    {key:'diversification',label:'פיזור השקעות',weight:15,score:maxShare==null?35:clamp((1-maxShare)/.7*100),value:maxShare,
      tip:maxShare==null?'עוד אין השקעות במעקב. השקעה מפוזרת לטווח ארוך בונה הון.':maxShare>.6?'נכס יחיד מהווה יותר מ־60% מהתיק. פיזור רחב יותר מקטין סיכון.':'התיק מפוזר בין כמה נכסים.'}
  ];
  const score=Math.round(factors.reduce((s,f)=>s+f.score*f.weight,0)/factors.reduce((s,f)=>s+f.weight,0));
  const grade=score>=85?'מצוין':score>=70?'טוב מאוד':score>=55?'טוב':score>=40?'בינוני':'דורש תשומת לב';
  return {score,grade,factors,liquid,cover,rate,debtRatio};
}

const normalizeText=s=>String(s||'').toLowerCase().replace(/[0-9.,:/\\#*"'״׳()\-]+/g,' ').replace(/\s+/g,' ').trim();

// Charges that repeat at a similar amount in at least three different months.
function detectRecurring(d,month,lookback=6){
  const months=new Set([month,...recentMonths(month,lookback-1)]),groups=new Map();
  for(const t of d.transactions){
    if(t.type!=='expense'||!months.has(t.date.slice(0,7)))continue;
    const key=(normalizeText(t.description)||'—')+'|'+t.category;
    if(!groups.has(key))groups.set(key,[]);
    groups.get(key).push(t);
  }
  const result=[];
  for(const list of groups.values()){
    const byMonth=new Map();
    for(const t of list)byMonth.set(t.date.slice(0,7),(byMonth.get(t.date.slice(0,7))||0)+txILS(d,t));
    if(byMonth.size<3||list.length>byMonth.size*2)continue;
    const amounts=[...byMonth.values()],average=amounts.reduce((s,n)=>s+n,0)/amounts.length;
    const spread=Math.max(...amounts.map(a=>Math.abs(a/average-1)));
    if(spread>.15)continue;
    const last=[...list].sort((a,b)=>b.date.localeCompare(a.date))[0];
    result.push({name:last.description||last.category,category:last.category,average,annual:average*12,months:byMonth.size,lastDate:last.date,nextDate:nextMonthlyDate(last.date),stable:spread<=.02,automatic:list.some(t=>t.recurring||t.recurringParent)});
  }
  return result.sort((a,b)=>b.average-a.average);
}

function nextMonthlyDate(date){
  const [y,m,day]=date.split('-').map(Number),next=new Date(Date.UTC(y,m,1)),last=new Date(Date.UTC(next.getUTCFullYear(),next.getUTCMonth()+1,0)).getUTCDate();
  next.setUTCDate(Math.min(day,last));return next.toISOString().slice(0,10);
}

// Unusual single expenses and categories that spike against their own history.
function detectAnomalies(d,month){
  const history=recentMonths(month,6),items=[];
  for(const t of d.transactions.filter(t=>t.type==='expense'&&t.date.startsWith(month))){
    const past=d.transactions.filter(x=>x.type==='expense'&&x.category===t.category&&history.includes(x.date.slice(0,7))).map(x=>txILS(d,x));
    if(past.length<4)continue;
    const mean=past.reduce((s,n)=>s+n,0)/past.length,sd=Math.sqrt(past.reduce((s,n)=>s+(n-mean)**2,0)/past.length),amount=txILS(d,t);
    if(amount>mean+2.5*sd&&amount>mean*1.5&&amount-mean>50)items.push({kind:'transaction',id:t.id,title:t.description||t.category,category:t.category,amount,typical:mean,ratio:amount/mean,date:t.date});
  }
  for(const category of d.categories){
    const current=categorySpend(d,category,month),past=history.slice(0,3).map(m=>categorySpend(d,category,m)).filter(n=>n>0);
    if(past.length<2)continue;
    const avg=past.reduce((s,n)=>s+n,0)/past.length;
    if(current>avg*1.4&&current-avg>150)items.push({kind:'category',title:category,category,amount:current,typical:avg,ratio:current/avg});
  }
  return items.sort((a,b)=>b.ratio-a.ratio);
}

// End-of-month projection: actual spend so far + what usually happens in the rest of the month.
function monthPace(d,month,now=today()){
  const days=daysInMonth(month),spent=monthlySummary(d,month).expenses,currentMonth=now.slice(0,7);
  if(month!==currentMonth)return {spent,projected:spent,elapsed:month<currentMonth?days:0,days,complete:month<currentMonth,budget:d.overallBudget,method:'actual'};
  const elapsed=Number(now.slice(8,10)),rest=[];
  for(const m of recentMonths(month,3)){
    const tx=d.transactions.filter(t=>t.type==='expense'&&t.date.startsWith(m));
    if(!tx.length)continue;
    const cutoff=Math.round(elapsed/days*daysInMonth(m));
    rest.push(tx.filter(t=>Number(t.date.slice(8,10))>cutoff).reduce((s,t)=>s+txILS(d,t),0));
  }
  const projected=rest.length?spent+rest.reduce((s,n)=>s+n,0)/rest.length:elapsed?spent/elapsed*days:spent;
  return {spent,projected,elapsed,days,complete:false,budget:d.overallBudget,method:rest.length?'history':'linear'};
}

// Deterministic PRNG so simulations are stable between renders.
function seededRandom(seed=42){
  let a=seed>>>0;
  return ()=>{a=a+0x6D2B79F5>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return ((t^t>>>14)>>>0)/4294967296;};
}

// Monte Carlo of a portfolio with monthly contributions. Values are in today's money (real terms).
function monteCarlo({start=0,monthly=0,years=20,annualReturn=.07,volatility=.15,inflation=.025,runs=1000,target=null,seed=7}={}){
  if(![start,monthly,years,annualReturn,volatility,inflation].every(Number.isFinite))throw new Error('יש להזין ערכים מספריים לסימולציה.');
  years=Math.max(1,Math.min(60,Math.round(years)));runs=Math.max(50,Math.min(5000,Math.round(runs)));
  const random=seededRandom(seed),months=years*12;
  const mu=Math.log(1+annualReturn)/12-volatility**2/24,sigma=volatility/Math.sqrt(12),deflate=Math.log(1+inflation)/12;
  const yearly=Array.from({length:years+1},()=>new Float64Array(runs));
  let hits=0;
  for(let r=0;r<runs;r++){
    let value=start;yearly[0][r]=start;let reached=target!=null&&start>=target;
    for(let m=1;m<=months;m++){
      const u1=random()||1e-12,u2=random(),z=Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2);
      value=value*Math.exp(mu+sigma*z-deflate)+monthly;
      if(m%12===0)yearly[m/12][r]=value;
    }
    if(target!=null&&(reached||value>=target))hits++;
  }
  const pick=(arr,p)=>{const s=[...arr].sort((a,b)=>a-b);return s[Math.min(s.length-1,Math.max(0,Math.floor(p*(s.length-1))))];};
  const points=yearly.map((arr,year)=>({year,p10:pick(arr,.1),p50:pick(arr,.5),p90:pick(arr,.9),contributed:start+monthly*12*year}));
  return {points,final:points.at(-1),probability:target==null?null:hits/runs,runs,years};
}

const fireNumber=(annualExpenses,withdrawalRate=.04)=>withdrawalRate>0?annualExpenses/withdrawalRate:null;

// Years until a target is reached with deterministic growth (real terms); null if never within 100 years.
function yearsToTarget(start,monthly,target,annualReturn=.07,inflation=.025){
  if(start>=target)return 0;
  const r=(1+annualReturn)/(1+inflation),monthlyRate=Math.pow(r,1/12)-1;let value=start;
  for(let m=1;m<=1200;m++){value=value*(1+monthlyRate)+monthly;if(value>=target)return m/12;}
  return null;
}

// Future value of cutting a category by a percentage and investing the difference.
function whatIfCut(d,category,percent,years=10,annualReturn=.06,month=today().slice(0,7)){
  const avg=recentMonths(month,3).reduce((s,m)=>s+categorySpend(d,category,m),0)/3,monthly=avg*percent/100,rate=Math.pow(1+annualReturn,1/12)-1,n=years*12;
  const future=rate?monthly*((1+rate)**n-1)/rate:monthly*n;
  return {category,average:avg,monthly,yearly:monthly*12,future,contributed:monthly*n,years};
}

const INCOME_WORDS=['משכורת','הכנסה','קיבלתי','החזר','בונוס','זיכוי','מענק','שכר','תלוש','החזר מס','פרילנס','מכרתי'];

function suggestCategory(d,text,type='expense'){
  const q=normalizeText(text);if(!q)return null;
  const words=q.split(' ').filter(w=>w.length>1),scores=new Map();
  const add=(cat,n)=>{if(d.categories.includes(cat))scores.set(cat,(scores.get(cat)||0)+n);};
  for(const t of d.transactions){
    if(t.type!==type)continue;
    const desc=normalizeText(t.description);if(!desc)continue;
    if(desc===q)add(t.category,6);
    else for(const w of words)if(desc.split(' ').includes(w))add(t.category,1.5);
  }
  for(const [cat,list] of Object.entries(KEYWORDS))for(const k of list)if(q.includes(k.toLowerCase()))add(cat,k.length>3?3:2);
  const best=[...scores.entries()].sort((a,b)=>b[1]-a[1])[0];
  return best?best[0]:null;
}

const HEB_NUMBERS={'אלף':1000,'אלפיים':2000,'מאה':100,'מאתיים':200,'חמישים':50,'עשרים':20,'שלושים':30,'ארבעים':40,'עשר':10};

// Parses free Hebrew text such as "קפה 18 אתמול במזומן" into a transaction draft.
function parseQuickEntry(text,d,now=today()){
  const raw=String(text||'').trim();if(!raw)return null;
  let rest=' '+raw.replace(/₪/g,' ₪ ').replace(/\$/g,' $ ')+' ';
  let amount=null,currency='ILS',date=now,dateFound=false;
  const dateLike=rest.match(/(?:^|\s)(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?=\s)|(?:^|\s)(\d{1,2})\.(\d{1,2})\.(\d{2,4})(?=\s)/);
  if(dateLike){
    const day=+(dateLike[1]||dateLike[4]),mon=+(dateLike[2]||dateLike[5]),explicit=dateLike[3]||dateLike[6];let year=explicit?+explicit:+now.slice(0,4);if(year<100)year+=2000;
    const candidate=`${year}-${String(mon).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    if(validDate(candidate)){date=!explicit&&candidate>now?`${year-1}${candidate.slice(4)}`:candidate;dateFound=true;rest=rest.replace(dateLike[0],' ');}
  }
  const num=rest.match(/(\d{1,3}(?:,\d{3})+|\d+)(?:\.(\d+))?\s*(k|K|אלף)?/);
  if(num){amount=Number(num[1].replace(/,/g,'')+(num[2]?'.'+num[2]:''))*(num[3]?1000:1);rest=rest.replace(num[0],' ');}
  else for(const [word,value] of Object.entries(HEB_NUMBERS))if(new RegExp(`(^|\\s)${word}(\\s|$)`).test(rest)){amount=value;rest=rest.replace(word,' ');break;}
  if(/\$|דולר|usd/i.test(rest)){currency='USD';rest=rest.replace(/\$|דולרים|דולר|usd/gi,' ');}
  rest=rest.replace(/₪|שקלים|שקל|ש"ח|ש״ח|ils/gi,' ');
  const rel=[[/(^|\s)היום(\s|$)/,0],[/(^|\s)אתמול(\s|$)/,-1],[/(^|\s)שלשום(\s|$)/,-2]];
  for(const [re,offset] of rel)if(re.test(rest)){date=shiftDate(now,offset);dateFound=true;rest=rest.replace(re,' ');break;}
  const ago=rest.match(/לפני\s+(\d+)\s+(ימים|יום|שבועות|שבוע)/);
  if(ago){date=shiftDate(now,-Number(ago[1])*(ago[2].startsWith('שבוע')?7:1));dateFound=true;rest=rest.replace(ago[0],' ');}
  const days=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  const dayMatch=rest.match(/(?:ביום|יום)\s+(ראשון|שני|שלישי|רביעי|חמישי|שישי|שבת)|(^|\s)ב?(שבת)(\s|$)/);
  if(dayMatch&&!dateFound){
    const target=days.indexOf(dayMatch[1]||dayMatch[3]),cur=new Date(now+'T12:00:00Z').getUTCDay();
    date=shiftDate(now,-(((cur-target)+7)%7||7));dateFound=true;rest=rest.replace(dayMatch[0],' ');
  }
  let account=null;
  const usable=d.accounts.filter(a=>!['investment','debt'].includes(a.kind));
  for(const a of [...usable].sort((x,y)=>y.name.length-x.name.length)){
    if(a.name&&rest.includes(a.name)){account=a;rest=rest.replace(new RegExp('ב?'+a.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')),' ');break;}
  }
  if(!account&&/(^|\s)ב?מזומן(\s|$)/.test(rest)){account=usable.find(a=>a.kind==='cash')||null;rest=rest.replace(/(^|\s)ב?מזומן(\s|$)/,' ');}
  if(!account&&/(^|\s)(ב?אשראי|בכרטיס)(\s|$)/.test(rest)){account=usable.find(a=>a.kind==='bank')||null;rest=rest.replace(/(^|\s)(ב?אשראי|בכרטיס)(\s|$)/,' ');}
  account ||=usable.find(a=>a.kind==='bank'&&a.currency===currency)||usable.find(a=>a.kind==='bank')||usable[0]||null;
  const lower=raw.toLowerCase(),type=INCOME_WORDS.some(w=>lower.includes(w))?'income':'expense';
  const description=rest.replace(/(^|\s)(על|עבור|שילמתי|הוצאתי|קניתי|ב|ל)(?=\s)/g,' ').replace(/\s+/g,' ').trim();
  const category=suggestCategory(d,description||raw,type)||(type==='income'?(d.categories.includes('משכורת')?'משכורת':d.categories[0]):d.categories.includes('קניות')?'קניות':d.categories[0]);
  return {type,amount,currency,date,category,accountId:account?.id||'',description,valid:amount>0&&!!account,dateFound};
}

}

  saveAiSettings({usage:{input:u.input+input,output:u.output+output,cost:u.cost+(input*price.input+output*price.output)/1e6}});

const AI_SYSTEM=`You are "אופק AI" — the personal financial copilot built into Ofek (אופק), a Hebrew, right-to-left personal finance app. The user's data lives only on their device; you see it through the context block in their messages and through your tools.

How to work:
- Always answer in natural, warm, concise Hebrew. Currency is the Israeli shekel (₪) unless an amount is in dollars.
- Ground every number in the user's real data. Call the read tools whenever the context block is not enough — never invent transactions, balances or returns.
- Be specific and actionable: name categories, amounts and dates; compare to the user's own history; end with one or two concrete next steps when it helps.
- You can draw charts inside the chat with render_chart. Use one when a trend, comparison or breakdown is clearer visually (keep labels short, Hebrew, at most 12 points).
- To change data you must use a propose_* tool. The user sees a confirmation card and decides; never claim something was saved until the tool result says it was approved.
- When the user attaches a receipt, invoice, bank or credit-card statement (image, PDF or CSV): read it carefully, extract every transaction (date, amount, merchant/description, a category from the user's category list) and call propose_transactions once with all of them. Skip lines that are totals, balances or duplicates of transactions already in the data. If the year is missing, infer it from context and never use a future date.
- You are not a licensed investment advisor. For investment questions, explain principles, risks and the user's own numbers; avoid recommending a specific security, and mention this briefly only when relevant.
- Formatting: short paragraphs, **bold** for key figures, "-" bullets, numbered steps, "###" small headings and simple Markdown tables. No HTML.`;

// ---------- Financial context (attached to the user's turns, never to the system prompt) ----------
const round=n=>Math.round(n);
function financialContext(d,month=today().slice(0,7),now=today()){
  const b=balances(d),h=healthScore(d,month),avg=averageMonth(d,month,3);
  const lines=[
    `today: ${now}${d.profile?` · name: ${d.profile}`:''}${d.demo?' · NOTE: this is demo data':''}`,
    `usd_ils_rate: ${d.fx} (manual, updated ${d.fxDate})`,
    `net_worth: ${round(b.net)} ₪ = cash ${round(b.cash)} + savings ${round(b.savings)} + investments ${round(b.investments)} − debt ${round(b.debt)}`,
    `health_score: ${h.score}/100 (${h.factors.map(f=>`${f.key} ${Math.round(f.score)}`).join(', ')})`,
    `monthly_spending_target: ${round(d.overallBudget)} ₪`,
    'last_6_months (income / expenses / saved, ₪): '+monthlySeries(d,month,6).map(s=>`${s.month}: ${round(s.income)} / ${round(s.expenses)} / ${round(s.saved)}`).join(' | '),
    avg.months?`average_of_previous_${avg.months}_months: income ${round(avg.income)}, expenses ${round(avg.expenses)}`:'',
    'accounts: '+d.accounts.map(a=>`${a.name} [id ${a.id}, ${a.kind}, ${a.currency}] ${round(a.kind==='investment'?portfolioValue(d):a.balance)}${a.kind==='debt'?` (payment ${a.payment}/mo, ${a.interest}% interest)`:''}`).join('; '),
    'budgets_this_month: '+(d.budgets.map(x=>`${x.category} ${round(categorySpend(d,x.category,month))}/${round(x.limit)}`).join('; ')||'none'),
    'goals: '+(d.goals.map(g=>`${g.name} saved ${round(g.saved)}${g.target?` of ${round(g.target)}`:''}, ${round(g.monthly)}/mo until ${g.date}`).join('; ')||'none'),
    'investments: '+(d.assets.map(a=>`${a.ticker||a.name} ${round(toILS(assetValue(a),a.currency,d.fx))} ₪`).join('; ')||'none'),
    `categories: ${d.categories.join(', ')}`,
    `transactions_on_record: ${d.transactions.length} (${d.transactions.length?d.transactions.map(t=>t.date).sort()[0]:'—'} → ${d.transactions.length?d.transactions.map(t=>t.date).sort().at(-1):'—'})`,
    `selected_month_in_app: ${month}`
  ];
  return '<financial_context>\n'+lines.filter(Boolean).join('\n')+'\n</financial_context>';
}

// ---------- Tools ----------
const S=(properties,required=[])=>({type:'object',properties,required,additionalProperties:false});
const str=description=>({type:'string',description}),num=description=>({type:'number',description});
const txItem=S({type:{type:'string',enum:['expense','income']},amount:num('Positive amount'),currency:{type:'string',enum:['ILS','USD']},date:str('YYYY-MM-DD, not in the future'),category:str('One of the user categories when possible'),description:str('Merchant or short Hebrew description'),account:str('Account id or name; optional')},['type','amount','date','category','description']);
const AI_TOOLS=[
  {name:'get_financial_overview',description:'Current balances, health score with factor tips, this month vs. typical month, budgets status, recurring charges and unusual spending. Read-only.',input_schema:S({month:str('YYYY-MM; defaults to the month selected in the app')})},
  {name:'query_transactions',description:'Search transactions with filters. Returns matching rows (newest first) and totals in ₪. Read-only.',input_schema:S({from:str('YYYY-MM-DD'),to:str('YYYY-MM-DD'),type:{type:'string',enum:['expense','income']},category:str('Exact category name'),search:str('Text to find in description, category or tags'),min_amount:num('Minimum amount'),max_amount:num('Maximum amount'),limit:{type:'integer',description:'Max rows to return, default 40, max 200'}})},
  {name:'spending_breakdown',description:'Aggregate income or expenses between two dates, grouped by category, month or account. Read-only.',input_schema:S({from:str('YYYY-MM-DD'),to:str('YYYY-MM-DD'),group_by:{type:'string',enum:['category','month','account']},type:{type:'string',enum:['expense','income']}},['from','to','group_by'])},
  {name:'get_investments',description:'Investment holdings with value, lifetime profit and return, plus portfolio performance from monthly snapshots (Modified Dietz, XIRR). Read-only.',input_schema:S({})},
  {name:'simulate_future',description:'Monte Carlo simulation (1000 runs, in today\'s money) of investable wealth with monthly contributions. Returns P10/P50/P90 per year and probability of reaching a target.',input_schema:S({years:{type:'integer',description:'1-60'},start:num('Starting amount in ₪; default = savings + investments'),monthly_contribution:num('₪ per month; default = average monthly savings'),annual_return:num('Expected nominal annual return, e.g. 0.07'),volatility:num('Annual volatility, e.g. 0.15'),inflation:num('Annual inflation, e.g. 0.025'),target:num('Optional target in today\'s ₪')},['years'])},
  {name:'render_chart',description:'Draw a chart inside the chat for the user. Use for trends (line), comparisons (bar) and shares (donut).',input_schema:S({chart_type:{type:'string',enum:['bar','line','donut']},title:str('Short Hebrew title'),labels:{type:'array',items:{type:'string'},description:'X-axis labels or slice names (max 12)'},series:{type:'array',description:'One or more series; donut uses the first',items:S({name:str('Series name'),values:{type:'array',items:{type:'number'}}},['name','values'])},unit:{type:'string',enum:['ILS','percent','number'],description:'ILS (default) for shekel amounts; percent means values are percentages such as 12.5 for 12.5%'}},['chart_type','title','labels','series'])},
  {name:'propose_transactions',description:'Propose adding one or more transactions (e.g. extracted from a receipt or statement, or dictated by the user). The user reviews and approves or declines; the result says what happened.',input_schema:S({transactions:{type:'array',items:txItem},note:str('Optional short note shown above the list, e.g. the document source')},['transactions'])},
  {name:'propose_budget',description:'Propose creating or updating a monthly budget for a category. Requires user approval.',input_schema:S({category:str('Category name'),monthly_limit:num('₪ per month'),reason:str('One short sentence why')},['category','monthly_limit'])},
  {name:'propose_goal',description:'Propose a new savings plan. Requires user approval.',input_schema:S({name:str('Hebrew name'),type:{type:'string',enum:['קרן חירום','רכב','חופשה','דירה','לימודים','מטרה אישית']},target:num('Optional target ₪'),saved:num('Already saved ₪, default 0'),monthly:num('Planned monthly deposit ₪'),date:str('Target date YYYY-MM-DD')},['name','monthly','date'])}
].map(t=>({...t,eager_input_streaming:true}));

const sumILS=(d,list)=>list.reduce((s,t)=>s+toILS(t.amount,t.currency||'ILS',t.fx||d.fx),0);
const accountName=(d,id)=>d.accounts.find(a=>a.id===id)?.name||'—';
function resolveAccount(d,ref){
  const usable=d.accounts.filter(a=>!['investment','debt'].includes(a.kind));
  if(ref){const r=String(ref).trim();const hit=usable.find(a=>a.id===r||a.name===r)||usable.find(a=>a.name.includes(r)||r.includes(a.name));if(hit)return hit;if(/מזומן|cash/i.test(r))return usable.find(a=>a.kind==='cash')||null;}
  return usable.find(a=>a.kind==='bank')||usable[0]||null;
}

// Validates a proposed transaction and returns a normalized draft or an error string.
function normalizeProposedTransaction(d,raw,now=today()){
  const amount=Number(raw?.amount),date=String(raw?.date||''),type=raw?.type==='income'?'income':raw?.type==='expense'?'expense':null;
  if(!type)return {error:'type must be expense or income'};
  if(!(amount>0)||!Number.isFinite(amount))return {error:'amount must be positive'};
  if(!validDate(date))return {error:`invalid date "${date}"`};
  if(date>now)return {error:`date ${date} is in the future`};
  const account=resolveAccount(d,raw.account);
  if(!account)return {error:'no bank, cash or savings account exists'};
  const category=String(raw.category||'').trim()||'קניות';
  return {draft:{type,amount,currency:raw.currency==='USD'?'USD':account.currency,date,category,description:String(raw.description||'').trim().slice(0,120),accountId:account.id,subcategory:'',tags:['AI'],recurring:false}};
}

async function executeAiTool(name,input,ctx){
  const d=ctx.data,month=ctx.month||today().slice(0,7),now=ctx.now||today();input=input||{};
  if(name==='get_financial_overview'){
    const m=/^\d{4}-\d{2}$/.test(input.month||'')?input.month:month,h=healthScore(d,m),pace=monthPace(d,m,now);
    return {month:m,balances:balances(d),this_month:monthlySummary(d,m),typical_month:averageMonth(d,m,3),pace_projection:pace,health:{score:h.score,grade:h.grade,factors:h.factors.map(f=>({factor:f.label,score:Math.round(f.score),tip:f.tip}))},budgets:d.budgets.map(x=>({category:x.category,limit:x.limit,spent:categorySpend(d,x.category,m)})),recurring_charges:detectRecurring(d,m).slice(0,12).map(r=>({name:r.name,category:r.category,monthly:round(r.average),yearly:round(r.annual),next:r.nextDate})),unusual:detectAnomalies(d,m).slice(0,8)};
  }
  if(name==='query_transactions'){
    const q=String(input.search||'').trim(),limit=Math.max(1,Math.min(200,Number(input.limit)||40));
    const list=d.transactions.filter(t=>(!input.from||t.date>=input.from)&&(!input.to||t.date<=input.to)&&(!input.type||t.type===input.type)&&(!input.category||t.category===input.category)&&(!q||[t.description,t.category,t.subcategory,...(t.tags||[])].join(' ').includes(q))&&(input.min_amount==null||t.amount>=input.min_amount)&&(input.max_amount==null||t.amount<=input.max_amount)).sort((a,b)=>b.date.localeCompare(a.date));
    return {count:list.length,total_income:round(sumILS(d,list.filter(t=>t.type==='income'))),total_expense:round(sumILS(d,list.filter(t=>t.type==='expense'))),shown:Math.min(limit,list.length),transactions:list.slice(0,limit).map(t=>({date:t.date,type:t.type,amount:t.amount,currency:t.currency||'ILS',category:t.category,description:t.description,account:accountName(d,t.accountId)}))};
  }
  if(name==='spending_breakdown'){
    if(!validDate(input.from)||!validDate(input.to))throw new Error('from and to must be YYYY-MM-DD');
    const type=input.type||'expense',list=d.transactions.filter(t=>t.type===type&&t.date>=input.from&&t.date<=input.to),groups=new Map();
    for(const t of list){const key=input.group_by==='month'?t.date.slice(0,7):input.group_by==='account'?accountName(d,t.accountId):t.category;groups.set(key,(groups.get(key)||0)+toILS(t.amount,t.currency||'ILS',t.fx||d.fx));}
    const rows=[...groups.entries()].map(([key,total])=>({key,total:round(total)}));
    rows.sort(input.group_by==='month'?(a,b)=>a.key.localeCompare(b.key):(a,b)=>b.total-a.total);
    return {type,from:input.from,to:input.to,total:round(sumILS(d,list)),rows};
  }
  if(name==='get_investments'){
    const snaps=[...d.snapshots].sort((a,b)=>a.date.localeCompare(b.date)),p=snaps.length>1?performance(d,snaps[0].date,snaps.at(-1).date):null;
    return {portfolio_value_ils:round(portfolioValue(d)),cash_in_portfolio:d.wallets,holdings:d.assets.map(a=>{const pr=assetProfit(d,a);return {name:a.name,ticker:a.ticker,type:a.type,currency:a.currency,value_ils:round(toILS(assetValue(a),a.currency,d.fx)),profit:round(pr.profit),return:pr.return};}),performance_since_first_snapshot:p?{from:p.start?.date,to:p.end?.date,time_weighted_return:p.return,xirr_annual:p.annual,profit:p.profit,benchmarks_percent:p.benchmarks}:'need at least two monthly snapshots',snapshots:snaps.slice(-12).map(s=>({date:s.date,value:round(s.value),net_worth:round(s.netWorth)}))};
  }
  if(name==='simulate_future'){
    const b=balances(d),avg=averageMonth(d,month,3);
    const r=monteCarlo({years:Number(input.years)||20,start:Number.isFinite(input.start)?input.start:b.savings+b.investments,monthly:Number.isFinite(input.monthly_contribution)?input.monthly_contribution:Math.max(0,avg.saved),annualReturn:Number.isFinite(input.annual_return)?input.annual_return:.07,volatility:Number.isFinite(input.volatility)?input.volatility:.15,inflation:Number.isFinite(input.inflation)?input.inflation:.025,target:Number.isFinite(input.target)?input.target:null});
    return {note:'values in today\'s ₪ (after inflation)',probability_of_target:r.probability,years:r.points.map(p=>({year:p.year,p10:round(p.p10),median:round(p.p50),p90:round(p.p90),contributed:round(p.contributed)}))};
  }
  if(name==='render_chart'){
    const labels=Array.isArray(input.labels)?input.labels:[],series=Array.isArray(input.series)?input.series:[];
    if(!labels.length||!series.length||series.some(s=>!Array.isArray(s.values)))throw new Error('labels and series[].values are required');
    return {rendered:true,shown_to_user:true};
  }
  if(name==='propose_transactions'){
    const items=(Array.isArray(input.transactions)?input.transactions:[]).map(t=>normalizeProposedTransaction(d,t,now));
    const valid=items.filter(x=>x.draft).map(x=>x.draft),errors=items.map((x,i)=>x.error?`#${i+1}: ${x.error}`:null).filter(Boolean);
    if(!valid.length)throw new Error('No valid transactions. '+errors.join('; '));
    const outcome=await ctx.approve({id:ctx.toolUseId,kind:'transactions',items:valid,note:input.note||'',errors});
    return outcome.approved?{approved:true,saved:outcome.saved??valid.length,skipped_invalid:errors}:{approved:false,message:'The user declined. Nothing was saved.'};
  }
  if(name==='propose_budget'){
    const limit=Number(input.monthly_limit),category=String(input.category||'').trim();
    if(!category||!(limit>0))throw new Error('category and a positive monthly_limit are required');
    const outcome=await ctx.approve({id:ctx.toolUseId,kind:'budget',category,limit:Math.round(limit),reason:input.reason||'',existing:d.budgets.find(b=>b.category===category)?.limit??null});
    return outcome.approved?{approved:true}:{approved:false,message:'The user declined.'};
  }
  if(name==='propose_goal'){
    const monthly=Number(input.monthly),target=input.target==null?null:Number(input.target),saved=Number(input.saved)||0;
    if(!input.name||!(monthly>=0)||!validDate(input.date)||input.date<=now)throw new Error('name, monthly >= 0 and a future date are required');
    if(target!=null&&!(target>0))throw new Error('target must be positive when given');
    const outcome=await ctx.approve({id:ctx.toolUseId,kind:'goal',goal:{name:String(input.name),type:input.type||'מטרה אישית',target,saved,monthly,date:input.date,accountId:''}});
    return outcome.approved?{approved:true}:{approved:false,message:'The user declined.'};
  }
  throw new Error('Unknown tool '+name);
}

// ---------- Streaming client ----------
class AiError extends Error{constructor(message,status){super(message);this.status=status;}}

function friendlyError(status,body){
  const raw=body?.error?.message||'';
  if(status===401)return 'מפתח ה־API אינו תקין. אפשר לעדכן אותו בהגדרות ה־AI.';
  if(status===403)return 'למפתח אין הרשאה לפעולה הזו. '+raw;
  if(status===404)return 'המודל שנבחר אינו זמין לחשבון שלך. נסה מודל אחר בהגדרות.';
  if(status===413)return 'הבקשה גדולה מדי. נסה קובץ קטן יותר.';
  if(status===429)return 'הגעת למגבלת הקצב או התקציב של ה־API. נסה שוב בעוד רגע.';
  if(status===529||status===503)return 'השירות של Claude עמוס כרגע. נסה שוב בעוד רגע.';
  if(status>=500)return 'שגיאה זמנית בשירות של Claude. נסה שוב.';
  return raw||'הבקשה ל־Claude נכשלה ('+status+').';
}

async function* sseEvents(body){
  const reader=body.getReader(),decoder=new TextDecoder();let buffer='';
  for(;;){
    const {value,done}=await reader.read();
    buffer+=decoder.decode(value||new Uint8Array(),{stream:!done});
    let index;
    while((index=buffer.search(/\r?\n\r?\n/))>=0){
      const chunk=buffer.slice(0,index);buffer=buffer.slice(index).replace(/^\r?\n\r?\n/,'');
      let event='message',data='';
      for(const line of chunk.split(/\r?\n/)){if(line.startsWith('event:'))event=line.slice(6).trim();else if(line.startsWith('data:'))data+=line.slice(5).trim();}
      if(data)yield {event,data:JSON.parse(data)};
    }
    if(done)return;
  }
}

function buildRequest(settings,{system,messages,tools,maxTokens=32000}){
  // Top-level automatic prompt caching: the static system prompt, tools and history prefix are reused across turns.
  const body={model:settings.model,max_tokens:maxTokens,stream:true,cache_control:{type:'ephemeral'},system,messages};
  if(tools?.length)body.tools=tools;
  const headers={'content-type':'application/json','x-api-key':settings.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'};
  if(supportsAdaptive(settings.model)){
    body.thinking={type:'adaptive',display:'summarized'};
    body.output_config={effort:settings.effort||'medium'};
    // Route safety-classifier declines to Anthropic's recommended fallback model server-side.
    body.fallbacks='default';
    headers['anthropic-beta']='server-side-fallback-2026-07-01';
  }
  return {url:settings.baseUrl.replace(/\/$/,'')+'/v1/messages',headers,body};
}

// Streams one assistant message and rebuilds its content blocks exactly as sent.
async function streamMessage(settings,request,{onEvent=()=>{},signal,fetchImpl=globalThis.fetch}={}){
  const {url,headers,body}=buildRequest(settings,request);
  let response;
  try{response=await fetchImpl(url,{method:'POST',headers,body:JSON.stringify(body),signal});}
  catch(err){if(err?.name==='AbortError')throw err;throw new AiError('אין חיבור לשירות של Claude. בדוק את החיבור לאינטרנט.',0);}
  if(!response.ok){let parsed=null;try{parsed=await response.json();}catch{}throw new AiError(friendlyError(response.status,parsed),response.status);}
  const message={content:[],stop_reason:null,usage:{}},json=new Map();
  for await (const {event,data} of sseEvents(response.body)){
    if(event==='error'||data.type==='error')throw new AiError(friendlyError(data.error?.type==='overloaded_error'?529:500,data),500);
    if(data.type==='message_start'){message.id=data.message.id;message.model=data.message.model;message.usage={...data.message.usage};}
    else if(data.type==='content_block_start'){
      const block=structuredClone(data.content_block);
      if(block.type==='tool_use'){block.input={};json.set(data.index,'');}
      message.content[data.index]=block;onEvent({type:'block_start',block,index:data.index});
    }
    else if(data.type==='content_block_delta'){
      const block=message.content[data.index],delta=data.delta;
      if(delta.type==='text_delta'){block.text=(block.text||'')+delta.text;onEvent({type:'text',text:delta.text,index:data.index});}
      else if(delta.type==='thinking_delta'){block.thinking=(block.thinking||'')+delta.thinking;onEvent({type:'thinking',text:delta.thinking});}
      else if(delta.type==='signature_delta')block.signature=(block.signature||'')+delta.signature;
      else if(delta.type==='input_json_delta'){json.set(data.index,json.get(data.index)+delta.partial_json);onEvent({type:'tool_input',index:data.index,name:block.name});}
      else if(delta.type==='citations_delta'){block.citations=[...(block.citations||[]),delta.citation];}
    }
    else if(data.type==='content_block_stop'){
      const block=message.content[data.index];
      if(block?.type==='tool_use'){
        const raw=json.get(data.index)||'';
        try{block.input=raw?JSON.parse(raw):{};}catch{block.input={};block.invalidInput=true;}
      }
      onEvent({type:'block_stop',block,index:data.index});
    }
    else if(data.type==='message_delta'){message.stop_reason=data.delta?.stop_reason??message.stop_reason;message.stop_details=data.delta?.stop_details;Object.assign(message.usage,data.usage||{});}
  }
  message.content=message.content.filter(Boolean);
  return message;
}

// Strips client-only markers so blocks go back to the API byte-for-byte as received.
const cleanBlock=b=>{if(b.type!=='tool_use'||!('invalidInput' in b))return b;const {invalidInput,...rest}=b;return rest;};

// Agent loop: stream, run requested tools, send all results back in one user message, repeat.
async function runAgent({settings,messages,system=AI_SYSTEM,tools=AI_TOOLS,ctx,onEvent=()=>{},signal,maxTurns=14,fetchImpl}){
  for(let turn=0;turn<maxTurns;turn++){
    const message=await streamMessage(settings,{system,messages,tools},{onEvent,signal,fetchImpl});
    addUsage(message.usage,settings.model);
    if(message.stop_reason==='refusal')throw new AiError('Claude לא יכול לעזור בבקשה הזו. אפשר לנסח אותה אחרת.',200);
    const toolUses=message.content.filter(b=>b.type==='tool_use');
    if(message.stop_reason==='max_tokens'&&toolUses.length)throw new AiError('התשובה נקטעה לפני שהסתיימה. נסה בקשה ממוקדת יותר.',200);
    messages.push({role:'assistant',content:message.content.map(cleanBlock)});
    onEvent({type:'assistant_message',message});
    if(message.stop_reason==='pause_turn')continue;
    if(message.stop_reason!=='tool_use'||!toolUses.length)return {message,messages,stop:message.stop_reason};
    const results=await Promise.all(toolUses.map(async block=>{
      if(block.invalidInput)return {type:'tool_result',tool_use_id:block.id,is_error:true,content:'INVALID_JSON: the tool input could not be parsed. Please call the tool again with valid JSON.'};
      onEvent({type:'tool_run',block});
      try{
        const result=await executeAiTool(block.name,block.input,{...ctx,toolUseId:block.id});
        onEvent({type:'tool_done',block,result});
        return {type:'tool_result',tool_use_id:block.id,content:JSON.stringify(result)};
      }catch(err){
        if(err?.name==='AbortError')throw err;
        onEvent({type:'tool_done',block,error:err.message});
        return {type:'tool_result',tool_use_id:block.id,is_error:true,content:String(err.message||err)};
      }
    }));
    messages.push({role:'user',content:results});
  }
  throw new AiError('Claude ביצע יותר מדי צעדים בתשובה אחת. נסה לפצל את הבקשה.',200);
}

const ATTACHMENT_LIMIT=8*1024*1024;
function attachmentBlock(file){
  if(file.kind==='image')return {type:'image',source:{type:'base64',media_type:file.mediaType,data:file.data}};
  if(file.kind==='pdf')return {type:'document',source:{type:'base64',media_type:'application/pdf',data:file.data},title:file.name};
  return {type:'document',source:{type:'text',media_type:'text/plain',data:file.text},title:file.name};
}

// Persisted copy: attachment payloads become placeholders and thinking blocks are dropped,
// so a restored conversation never replays a thinking block whose prefix changed.
function storableConversation(messages){
  return messages.map(m=>{
    if(typeof m.content==='string')return m;
    const content=m.content.filter(b=>!(m.role==='assistant'&&(b.type==='thinking'||b.type==='redacted_thinking'))).map(b=>b.type==='image'||b.type==='document'?{type:'text',text:`[קובץ מצורף${b.title?': '+b.title:''} — התוכן אינו נשמר במכשיר]`}:b);
    return {...m,content:content.length?content:[{type:'text',text:'…'}]};
  });
}

// ---------- Safe Markdown subset for assistant replies ----------
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*?)\*(?!\*)/g,'$1<i>$2</i>').replace(/`([^`]+)`/g,'<code>$1</code>');
function markdownLite(text){
  const lines=String(text||'').replace(/\r/g,'').split('\n'),out=[];let list=null,para=[];
  const flush=()=>{if(para.length){out.push(`<p>${para.map(inline).join('<br>')}</p>`);para=[];}if(list){out.push(`</${list}>`);list=null;}};
  for(let i=0;i<lines.length;i++){
    const line=lines[i],trim=line.trim();
    if(!trim){flush();continue;}
    if(/^\|.*\|$/.test(trim)&&/^\|?\s*:?-{2,}/.test((lines[i+1]||'').trim())){
      flush();const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const header=cells(trim);i++;const rows=[];
      while(i+1<lines.length&&/^\|.*\|$/.test(lines[i+1].trim())){rows.push(cells(lines[++i]));}
      out.push(`<div class="table-wrap ai-table"><table><thead><tr>${header.map(c=>`<th>${inline(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`);continue;
    }
    const h=trim.match(/^(#{1,4})\s+(.*)$/);
    if(h){flush();out.push(`<h4>${inline(h[2])}</h4>`);continue;}
    const bullet=trim.match(/^[-*•]\s+(.*)$/),ordered=trim.match(/^\d+[.)]\s+(.*)$/);
    if(bullet||ordered){
      if(para.length){out.push(`<p>${para.map(inline).join('<br>')}</p>`);para=[];}
      const tag=bullet?'ul':'ol';if(list!==tag){if(list)out.push(`</${list}>`);out.push(`<${tag}>`);list=tag;}
      out.push(`<li>${inline((bullet||ordered)[1])}</li>`);continue;
    }
    if(list){out.push(`</${list}>`);list=null;}
    para.push(trim);
  }
  flush();
  return out.join('');
}

    messages.splice(base);
    copilot.error=err?.name==='AbortError'?{text:'התשובה נעצרה. השאלה לא נשלחה להמשך.',prompt:text,files,soft:true}:{text:err?.message||'משהו השתבש. נסה שוב.',prompt:text,files};
  }finally{
    for(const p of copilot.pending.values())p.resolve({approved:false});
    copilot.pending.clear();
    Object.assign(copilot,{busy:false,live:null,abort:null,status:''});
    saveConversation();refreshCopilot(true);
    if(ui.page!=='copilot'&&!copilot.error)toast('Claude סיים לענות — התשובה מחכה לך במסך אופק AI');
  }
}
function resolveProposal(id,approved){
  const p=copilot.pending.get(id);if(!p)return;
  if(approved){
    const rows=[...document.querySelectorAll(`[data-ai-row="${CSS.escape(id)}"]`)],selected=rows.length?rows.filter(r=>r.checked).map(r=>+r.value):null;
    const saved=applyProposal(p.request,selected);
    copilot.pending.delete(id);p.resolve({approved:true,saved});
  }else{copilot.pending.delete(id);p.resolve({approved:false});}
  refreshCopilot();
}
function applyProposal(req,selected){
  const next=structuredClone(data);
  if(req.kind==='transactions'){
    const items=req.items.filter((_,i)=>!selected||selected.includes(i));
    if(!items.length)throw Error('לא נבחרו תנועות לשמירה. אפשר לסמן שורות או ללחוץ ״לא תודה״.');
    for(const t of items){if(!next.categories.includes(t.category))next.categories.push(t.category);const tx={...t,id:uid(),fx:next.fx};applyTransaction(next,tx);next.transactions.push(tx);}
    commit(next,`${items.length} תנועות נוספו בעזרת Claude`);return items.length;
  }
  if(req.kind==='budget'){
    if(!next.categories.includes(req.category))next.categories.push(req.category);
    const existing=next.budgets.find(b=>b.category===req.category);
    if(existing)existing.limit=req.limit;else next.budgets.push({id:uid(),category:req.category,limit:req.limit});
    commit(next,`התקציב ל${req.category} נשמר`);return 1;
  }
  next.goals.push({id:uid(),...req.goal});commit(next,`תוכנית החיסכון ״${req.goal.name}״ נוספה`);return 1;
}

const fileToBase64=blob=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=()=>reject(Error('קריאת הקובץ נכשלה.'));r.readAsDataURL(blob);});
async function imagePayload(file){
  const supported=['image/jpeg','image/png','image/webp','image/gif'];
  try{
    const bitmap=await createImageBitmap(file),scale=Math.min(1,1568/Math.max(bitmap.width,bitmap.height));
    if(scale<1||!supported.includes(file.type)){
      const canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);
      canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);
      const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.88));
      return {mediaType:'image/jpeg',data:await fileToBase64(blob)};
    }
  }catch{if(!supported.includes(file.type))throw Error('לא ניתן לקרוא את התמונה. נסה JPG או PNG.');}
  return {mediaType:file.type,data:await fileToBase64(file)};
}
async function readAttachment(file){
  const name=file.name||'קובץ',type=file.type||'';
  if(file.size>ATTACHMENT_LIMIT)throw Error(`הקובץ ${name} גדול מ־8MB.`);
  if(type.startsWith('image/'))return {kind:'image',name,...await imagePayload(file)};
  if(type==='application/pdf'||/\.pdf$/i.test(name))return {kind:'pdf',name,data:await fileToBase64(file)};
  if(type.startsWith('text/')||/\.(csv|tsv|txt|json)$/i.test(name)){const text=await file.text();if(text.length>400000)throw Error(`הקובץ ${name} ארוך מדי. אפשר לפצל אותו לכמה קבצים.`);return {kind:'text',name,text};}
  throw Error(`סוג הקובץ ${name} אינו נתמך. אפשר לצרף תמונה, PDF, CSV או טקסט.`);
}
async function addAttachments(list){
  const files=[...list];
  if(copilot.attachments.length+files.length>5)toast('אפשר לצרף עד 5 קבצים להודעה.',true);
  for(const file of files.slice(0,5-copilot.attachments.length)){try{copilot.attachments.push(await readAttachment(file));}catch(err){toast(err.message,true);}}
  const el=document.querySelector('#ai-attachments');if(el)el.innerHTML=attachmentsHTML();
  document.querySelector('#ai-input')?.focus();
}
let voice=null;
function toggleVoice(targetId,button){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast('הדפדפן הזה אינו תומך בהקלטה קולית.',true);return;}
  if(voice){voice.stop();return;}
  const el=document.getElementById(targetId);if(!el)return;
  const base=el.value?el.value.trim()+' ':'';
  voice=new SR();voice.lang='he-IL';voice.interimResults=true;voice.continuous=false;
  voice.onresult=ev=>{el.value=base+[...ev.results].map(r=>r[0].transcript).join('');el.dispatchEvent(new Event('input',{bubbles:true}));};
  voice.onerror=ev=>{if(!['aborted','no-speech'].includes(ev.error))toast('ההקלטה נכשלה. בדוק הרשאת מיקרופון.',true);};
  voice.onend=()=>{voice=null;document.querySelectorAll('.listening').forEach(b=>b.classList.remove('listening'));};
  voice.start();button?.classList.add('listening');
}

async function writeLetter(){
  if(letterState.busy)return;
  const month=ui.month;Object.assign(letterState,{month,text:'',busy:true,error:null,abort:new AbortController()});render();
  const update=()=>{const el=document.querySelector('#ai-letter');if(el&&ui.month===month)el.innerHTML=letterBody();};
  const messages=[{role:'user',content:[{type:'text',text:financialContext(data,month)},{type:'text',text:`כתוב לי "מכתב חודשי" אישי על ${monthLabel(month)} (${month}). קודם בדוק בעזרת הכלים: השוואה לחודשים קודמים, תקציבים, חיובים חוזרים, חריגות, התקדמות ביעדים ובהשקעות. מבנה: שורת פתיחה חמה ואישית, ### מה הלך טוב, ### למה כדאי לשים לב, ### שלושה צעדים לחודש הבא (ממוספרים, עם סכומים). עד 260 מילים, בלי גרפים ובלי הקדמות על הבדיקות שעשית.`}]}];
  try{
    const r=await runAgent({settings:aiSettings(),messages,tools:AI_TOOLS.filter(t=>!t.name.startsWith('propose_')&&t.name!=='render_chart'),signal:letterState.abort.signal,ctx:{get data(){return data;},month,approve:async()=>({approved:false})},onEvent:ev=>{if(ev.type==='block_start'&&ev.block.type==='text'&&letterState.text)letterState.text+='\n\n';if(ev.type==='text'){letterState.text+=ev.text;update();}if(ev.type==='assistant_message'&&ev.message.stop_reason==='tool_use'){letterState.text='';update();}}});
    const text=r.message.content.filter(b=>b.type==='text').map(b=>b.text).join('\n\n').trim();
    if(!text)throw Error('Claude לא החזיר מכתב. נסה שוב.');
    const all=storedLetters();all[month]={text,date:new Date().toISOString()};try{localStorage.setItem(AI_LETTERS_KEY,JSON.stringify(all));}catch{}
  }catch(err){letterState.error=err?.name==='AbortError'?'הכתיבה נעצרה.':err.message;}
  finally{letterState.busy=false;letterState.abort=null;render();}
}

function labState(){
  if(!ui.lab){
    const b=balances(data),avg=averageMonth(data,ui.month,3),cur=monthlySummary(data,ui.month),expenses=avg.expenses||cur.expenses;
    const top=data.categories.map(c=>[c,whatIfCut(data,c,100,1,0,ui.month).average]).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).find(([c])=>!['חשבונות','משכורת'].includes(c));
    ui.lab={start:Math.round(b.savings+b.investments),monthly:Math.max(0,Math.round(avg.months?avg.saved:cur.saved)),years:20,ret:7,vol:15,inf:2.5,target:Math.round(fireNumber(expenses*12)||1000000),cutCategory:top?.[0]||data.categories[0]||'',cutPct:25,cutYears:10};
  }

}
const labFields=[['start','סכום התחלתי (₪)',0,null,1000],['monthly','הפקדה חודשית (₪)',0,null,100],['target','יעד (₪, בכסף של היום)',0,null,10000]];

function quickSave(draft){
  const next=structuredClone(data),t={id:uid(),type:draft.type,amount:draft.amount,currency:draft.currency,date:draft.date,category:draft.category,subcategory:'',accountId:draft.accountId,description:draft.description,tags:[],recurring:false,fx:next.fx};
  applyTransaction(next,t);next.transactions.push(t);closeDialog();

function paletteItems(q){
  const query=q.trim(),items=[];
  if(query){
    const draft=parseQuickEntry(query,data);
    if(draft?.valid){
      const account=data.accounts.find(a=>a.id===draft.accountId)?.name||'';
      items.push({icon:'Zap',title:`${draft.type==='income'?'הכנסה':'הוצאה'} של ${money(draft.amount,draft.currency,draft.amount%1?2:0)} · ${draft.category}`,sub:`${draft.description||'ללא תיאור'} · ${account} · ${dateLabel(draft.date)} — Enter לשמירה`,run:()=>quickSave(draft),accent:true});
      items.push({icon:'Edit3',title:'עריכה לפני שמירה',sub:'טופס התנועה ייפתח עם הפרטים שזוהו',run:()=>{closeDialog();openEntity('transaction',null,{type:draft.type,amount:draft.amount,date:draft.date,category:draft.category,accountId:draft.accountId,description:draft.description});}});
    }
    if(aiReady()&&query.length>2)items.push({icon:'Sparkles',title:`שאל את Claude: ״${query}״`,sub:'תשובה מבוססת על הנתונים שלך',run:()=>{closeDialog();sendCopilot(query);},accent:!draft?.valid});
  }
  const actions=[
    {icon:'Plus',title:'תנועה חדשה',run:()=>{closeDialog();openEntity('transaction');}},
    {icon:'ScanLine',title:'סריקת קבלה או דף חשבון',sub:aiReady()?'Claude יחלץ את התנועות':'דורש חיבור Claude',run:()=>{closeDialog();navigate('copilot');if(aiReady())setTimeout(()=>document.querySelector('#ai-file')?.click(),60);}},
    {icon:'Mail',title:'המכתב החודשי מ־Claude',run:()=>{closeDialog();navigate('insights');}},
    {icon:document.documentElement.classList.contains('privacy')?'Eye':'EyeOff',title:document.documentElement.classList.contains('privacy')?'הצגת סכומים':'מצב פרטיות — הסתרת סכומים',run:()=>{closeDialog();togglePrivacy();}},
    {icon:'CalendarDays',title:'עדכון השקעות חודשי',run:()=>{closeDialog();navigate('monthly');}},
    {icon:'Download',title:'הורדת גיבוי מלא',run:()=>{closeDialog();exportData('backup');}}
  ];
  const nav=[...routes,['settings','הגדרות וגיבוי','Settings']].map(([id,label,ic])=>({icon:ic,title:label,sub:'מעבר למסך',run:()=>{closeDialog();navigate(id);}}));
  const match=item=>!query||item.title.includes(query)||query.split(' ').every(w=>item.title.includes(w));
  const rest=[...actions,...nav].filter(match);
  return [...items,...(query&&items.length?rest.slice(0,4):rest)].slice(0,10);
}
function refreshPalette(){
  const el=document.querySelector('#palette-results');if(!el)return;
  paletteState.items=paletteItems(paletteState.query);
  paletteState.index=Math.min(paletteState.index,Math.max(0,paletteState.items.length-1));
  el.innerHTML=paletteState.items.length?paletteState.items.map((it,i)=>`<button type="button" class="palette-item ${i===paletteState.index?'active':''} ${it.accent?'accent':''}" role="option" aria-selected="${i===paletteState.index}" data-action="palette-run:${i}">${icon(it.icon,18)}<span><b>${e(it.title)}</b>${it.sub?`<small>${e(it.sub)}</small>`:''}</span>${i===paletteState.index?icon('CornerDownLeft',15):''}</button>`).join(''):`<p class="muted palette-empty">לא נמצאה פעולה. נסה לכתוב סכום ותיאור, למשל ״דלק 300״.</p>`;
  el.querySelector('.active')?.scrollIntoView({block:'nearest'});
}
