/* Shared visual refinement: quieter chrome, luminous surfaces, clearer numbers. */
:root {
  --gold: #dfc491;
  --purple: #bbace5;
  --green: #93ceb9;
  --muted: #a5a4b0;
  --line: rgba(255,255,255,.07);
  --surface: #1b1b22;
}
body { background: #101015; }
.app-shell {
  background: radial-gradient(ellipse at 79% 2%,rgba(165,135,90,.075),transparent 38%),
    radial-gradient(ellipse at 14% 34%,rgba(117,89,171,.065),transparent 43%),#101015;
}
.sidebar {
  background: linear-gradient(180deg,rgba(27,26,33,.97),rgba(19,19,26,.99));
  border-left-color: rgba(255,255,255,.06);
}
.brand-icon {
  border-radius: 14px;
  background: linear-gradient(135deg,rgba(220,187,126,.18),rgba(138,113,178,.1));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.1),0 10px 30px rgba(0,0,0,.15);
}
.nav-item { border-radius: 11px; color: #aaa8b7; }
.nav-item.active {
  background: linear-gradient(100deg,rgba(202,174,121,.035),rgba(211,183,128,.12));
  border-color: rgba(220,191,138,.14);
  color: #ecd4a7;
}
.sidebar-update {
  background: radial-gradient(ellipse at 100% 0,rgba(155,124,199,.14),transparent 85%),rgba(36,31,46,.7);
  border-color: rgba(183,159,225,.16);
  border-radius: 16px;
}
.topbar { background: rgba(18,18,25,.7); border-bottom-color: rgba(255,255,255,.065); }
.topbar-actions .icon-button:hover { background: rgba(255,255,255,.05); }
main { padding-top: 35px; }
.page-heading { margin-bottom: 27px; }
.page-heading h1 { font-size: 1.95rem; font-weight: 600; letter-spacing: -.02em; }
.page-heading p { font-size: .875rem; color: #9d9ba9; margin-top: 8px; }
.greeting { margin-bottom: 9px; color: #cab58f; }
.card {
  background: linear-gradient(145deg,rgba(37,36,46,.82),rgba(25,25,33,.93));
  border: 1px solid rgba(255,255,255,.065);
  border-radius: 18px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.025),0 12px 36px rgba(0,0,0,.12);
  backdrop-filter: blur(14px);
}
.card:has(.table-wrap) { background: linear-gradient(145deg,rgba(31,31,40,.95),rgba(24,24,31,.97)); }
.button {
  border-radius: 10px;
  min-height: 43px;
  background: rgba(255,255,255,.025);
  border-color: rgba(255,255,255,.1);
  padding-inline: 17px;
  font-size: .875rem;
}
.button.primary {
  background: linear-gradient(115deg,#e8cea0,#d4b77f);
  border-color: rgba(239,211,166,.55);
  color: #302619;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.22),0 5px 20px rgba(180,137,65,.1);
}
.button.primary:hover { background: linear-gradient(115deg,#f0d9b0,#e0c38f); box-shadow: 0 6px 26px rgba(180,137,65,.17); }
.icon-button { border-radius: 9px; }
.metric { border-radius: 17px; }
.metric-value,.net-value,.large-number,.saving-forecast strong,.goal-live-number { font-variant-numeric: tabular-nums; }
.metric-icon { width: 35px; height: 35px; border: 1px solid rgba(255,255,255,.025); }
.metric-top { color: #bab8c5; }
.metric-detail { color: #a1a0ae; }
.net-card {
  background: radial-gradient(ellipse at 2% 0%,rgba(140,106,175,.2),transparent 66%),
    radial-gradient(ellipse at 100% 100%,rgba(196,159,96,.105),transparent 72%),#24212a;
  border-color: rgba(221,192,142,.18);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.035),0 15px 40px rgba(0,0,0,.17);
}
.net-value { color: #f4ece0; font-weight: 500; }
.net-bottom { border-top-color: rgba(224,202,162,.09); }
.asset-strip { border-radius: 15px; background: rgba(28,27,36,.7); border-color: rgba(255,255,255,.065); }
.asset-strip-item { padding-block: 20px; }
.asset-strip-item:hover { background: rgba(206,187,154,.04); }
.asset-icon,.transaction-icon,.ticker-icon { border-radius: 11px; }
.insight-banner { border-radius: 15px; border-color: rgba(170,143,213,.18); background: linear-gradient(100deg,rgba(151,115,211,.06),rgba(176,156,220,.105)); }
.section-head h2 { font-size: 1.06rem; font-weight: 600; }
.section-head p { color: #9c98a9; font-size: .8125rem; }
.month-picker { border-radius: 10px; background: rgba(34,33,42,.75); border-color: rgba(255,255,255,.085); }
.segmented { border-radius: 10px; padding: 5px; background: rgba(15,15,22,.55); }
.segmented button { border-radius: 7px; }
.segmented button.active { background: #34303b; color: #ebdac0; }
input,select,textarea {
  min-height: 45px;
  border-radius: 10px;
  border-color: rgba(255,255,255,.11);
  background: rgba(15,15,23,.72);
  font-size: .9375rem;
}
input:hover,select:hover,textarea:hover { border-color: rgba(227,207,169,.24); }
input[readonly] { background: rgba(154,137,179,.07); border-color: rgba(174,149,211,.12); color: #c4b5df; }
.field { gap: 9px; }
.field>span { color: #d0cbd9; font-size: .875rem; }
.field>small { color: #aaa1b8; font-size: .8125rem; }
.search-field { border-radius: 10px; background: rgba(15,15,23,.65); }
.modal {
  background: radial-gradient(ellipse at 100% 0,rgba(122,90,163,.085),transparent 60%),#202029;
  border-color: rgba(215,203,234,.13);
  border-radius: 21px;
  padding: 30px;
  box-shadow: 0 25px 100px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.045);
}
.modal.wide { width: 700px; }
.modal-head { margin-bottom: 27px; }
.modal-head h2 { font-size: 1.3rem; }
.modal::backdrop { background: rgba(5,5,11,.7); backdrop-filter: blur(9px); }
.form-grid { gap: 21px 22px; }
.form-actions { padding-top: 22px; margin-top: 25px; }
.notice { border-radius: 12px; }
.badge { font-size: .75rem; border-radius: 7px; }
.badge.purple { border-color: rgba(187,172,229,.15); }
.demo-banner { border-radius: 9px; margin-bottom: 24px; border-color: rgba(215,189,131,.13); }
.table-wrap th { color: #a7a2b4; font-size: .8125rem; }
.table-wrap td { padding-block: 18px; }
.transaction-name small,.asset-name small { color: #9991a7; }
.category-pill { border-radius: 6px; background: rgba(159,144,185,.06); }
.app-footer { color: #89818f; }

/* Savings: the forecast is the primary result, followed by its real inputs. */
.savings-overview {
  position: relative;
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  align-items: center;
  gap: 26px 42px;
  padding: 31px 32px 22px;
  background: radial-gradient(ellipse at 0% 0%,rgba(165,127,201,.2),transparent 63%),
    linear-gradient(122deg,rgba(52,43,64,.82),rgba(34,30,40,.95));
  border: 1px solid rgba(199,175,234,.16);
  border-radius: 20px;
  box-shadow: inset 0 1px 0 rgba(232,218,251,.045),0 16px 45px rgba(0,0,0,.12);
  overflow: hidden;
}
.savings-overview .eyebrow { color: #c9b0e6; font-size: .8125rem; }
.savings-overview h2 { margin-top: 12px; font-size: 1.6rem; font-weight: 500; line-height: 1.5; }
.savings-overview p { max-width: 420px; color: #b0a5c0; margin-top: 9px; font-size: .9375rem; }
.savings-overview>.savings-overview-number { display: flex; flex-direction: column; gap: 9px; align-items: flex-start; padding-right: 33px; border-right: 1px solid rgba(214,194,239,.1); }
.savings-overview-number>span { color: #c4b8d3; font-size: .875rem; }
.savings-overview-number>b { font-size: 2.7rem; letter-spacing: -.025em; font-weight: 500; font-variant-numeric: tabular-nums; }
.savings-overview-number>small { color: #9d8caa; font-size: .75rem; }
.savings-overview>.savings-overview-bottom {
  grid-column: 1/-1;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  flex-wrap: wrap;
  gap: 15px 28px;
  padding: 18px 0 0;
  border-top: 1px solid rgba(215,194,241,.085);
}
.savings-overview-bottom>span { display: flex; align-items: center; gap: 9px; color: #b6a7c6; font-size: .8125rem; }
.savings-overview-bottom svg { color: #bba0d8; }
.savings-section-head { margin: 9px 0 -2px; }
.savings-section-head h2 { font-size: 1.125rem; }
.savings-section-head p { font-size: .875rem; margin-top: 6px; }
.savings-grid { grid-template-columns: repeat(3,minmax(0,1fr)); gap: 23px; }
.saving-card {
  padding: 24px;
  background: radial-gradient(ellipse at 100% 0,rgba(173,143,218,.045),transparent 70%),
    linear-gradient(150deg,rgba(35,32,45,.96),rgba(25,25,34,.95));
  border-color: rgba(198,177,224,.11);
  border-radius: 19px;
  transition: border-color .2s,box-shadow .2s;
}
.saving-card:hover { border-color: rgba(202,177,236,.22); box-shadow: 0 16px 37px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.03); }
.saving-card-top { display: flex; align-items: center; gap: 12px; }
.saving-card-top .goal-icon { width: 44px; height: 44px; border-radius: 12px; border: 1px solid rgba(215,189,131,.095); }
.saving-card-top .goal-icon.purple { border-color: rgba(176,156,220,.12); }
.saving-card-title { flex: 1; min-width: 0; }
.saving-card-title>h2 { font-size: 1.06rem; line-height: 1.5; margin: 0; overflow-wrap: anywhere; }
.saving-card-title>span { display: block; color: #95899f; font-size: .75rem; margin-top: 3px; }
.saving-card-actions { display: flex; gap: 3px; }
.saving-card-actions .icon-button { width: 28px; height: 31px; border-color: transparent; }
.saving-card-actions .icon-button svg { width: 15px; height: 15px; }
.saving-mode-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 24px; }
.saving-mode-row>span:last-child { display: inline-flex; gap: 6px; align-items: center; color: #a99bb8; font-size: .8125rem; }
.saving-forecast { margin: 27px 0 23px; }
.saving-forecast>span { color: #aaa0b6; font-size: .875rem; display: block; }
.saving-forecast>strong { display: block; margin-top: 9px; color: #f0e6fa; font-size: 2.15rem; letter-spacing: -.025em; font-weight: 500; text-align: right; overflow-wrap: anywhere; }
.saving-parts { display: grid; grid-template-columns: 1fr 1fr; gap: 17px; }
.saving-parts>div { display: flex; flex-direction: column; gap: 8px; }
.saving-parts>div>span { color: #a397af; font-size: .8125rem; display: flex; gap: 7px; align-items: center; }
.saving-parts>div>b { color: #d6cddd; font-size: 1rem; font-weight: 500; text-align: right; }
.purple-dot { width: 7px; height: 7px; background: var(--purple); display: inline-block; border-radius: 50%; }
.savings-composition { display: flex; gap: 4px; height: 6px; border-radius: 10px; overflow: hidden; background: rgba(255,255,255,.045); margin-top: 17px; }
.savings-composition>span:first-child { background: linear-gradient(90deg,#b99c65,#dcc48f); border-radius: 10px; }
.savings-composition>span:last-child { background: linear-gradient(90deg,#8c76af,#bfa6e1); border-radius: 10px; }
.saving-target { padding: 18px 0; margin-top: 17px; border-bottom: 1px solid rgba(202,181,231,.08); }
.saving-target .row-between { font-size: .8125rem; color: #b3a6be; }
.saving-target .row-between b { font-weight: 500; }
.saving-target>small { color: #94859f; font-size: .75rem; }
.saving-card .goal-details { border-top: 0; margin-top: 10px; padding-top: 15px; gap: 11px; }
.saving-card .goal-details>div { font-size: .8125rem; }
.saving-card .goal-details span { color: #9c91a7; }
.saving-card .goal-details b { color: #c7bbd2; max-width: 65%; min-width: 0; overflow-wrap: anywhere; }
.saving-card-status { margin-top: 23px; min-height: 27px; }
.saving-assumption { font-size: .75rem; color: #91839d; line-height: 1.9; margin-top: 17px; }
.savings-note { display: flex; align-items: flex-start; gap: 10px; color: #9d8cac; font-size: .8125rem; line-height: 1.9; padding: 0 5px; }
.savings-note>svg { flex-shrink: 0; margin-top: 5px; }
.saving-accounts>div { padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,.045); }
.saving-accounts>div:last-child { border-bottom: 0; }
.saving-accounts>div>div { min-width: 0; overflow-wrap: anywhere; }
.saving-accounts>div>.asset-icon,.saving-accounts>div>.icon-button { flex-shrink: 0; }
.saving-accounts b { font-size: .9375rem; }
.saving-accounts small { font-size: .8125rem; }

/* Live result in the savings form. */
.goal-live-forecast {
  padding: 22px 23px;
  border: 1px solid rgba(185,155,225,.18);
  border-radius: 15px;
  background: radial-gradient(ellipse at 100% 0,rgba(156,115,206,.12),transparent 80%),rgba(148,107,197,.045);
  margin-top: 1px;
}
.goal-live-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.goal-live-heading>span:first-child { display: flex; align-items: center; gap: 8px; color: #c8b1e5; font-size: .875rem; }
.goal-live-heading svg { flex-shrink: 0; }
.goal-live-number { font-size: 2.3rem; text-align: right; color: #f0e4ff; font-weight: 500; margin-top: 18px; letter-spacing: -.02em; overflow-wrap: anywhere; }
.goal-live-equation { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; margin-top: 11px; color: #beaccf; font-size: .8125rem; }

function graph(data,series=[{key:'net',name:'שווי נקי',color:palette[0]}],{height=230,percent=false,area=false}={}){if(!data.length)return empty('ההיסטוריה שלך תתחיל כאן','שמור תמונות מצב כדי לראות את ההתקדמות לאורך זמן.');const W=720,H=height,left=65,right=15,top=22,bottom=35,values=data.flatMap(d=>series.map(s=>d[s.key]).filter(v=>v!=null&&Number.isFinite(v))),min=Math.min(...values),max=Math.max(...values),pad=Math.max((max-min)*.16,max*.02,1),lo=min-pad,hi=max+pad,px=i=>left+(W-left-right)*i/Math.max(1,data.length-1),py=v=>top+(H-top-bottom)*(hi-v)/(hi-lo);const format=v=>percent?`${Math.round(v)}%`:Math.abs(v)>=1000?`${Math.round(v/1000)} אלף`:Math.round(v);const grid=Array.from({length:5},(_,i)=>{const v=lo+(hi-lo)*i/4,y=py(v);return `<line x1="${left}" x2="${W-right}" y1="${y}" y2="${y}" stroke="#ffffff0b"/><text x="${left-12}" y="${y+4}" fill="#909096" text-anchor="end" font-size="12">${format(v)}</text>`;}).join('');const labels=data.map((d,i)=>i%Math.max(1,Math.ceil(data.length/6))===0||i===data.length-1?`<text x="${px(i)}" y="${H-5}" text-anchor="middle" fill="#909096" font-size="12">${e(d.label||d.date)}</text>`:'').join('');const paths=series.map((s,j)=>{const pts=data.map((d,i)=>d[s.key]==null?null:[px(i),py(d[s.key])]);let line='',started=false;for(const p of pts){if(!p){started=false;continue;}line+=(started?' L ':' M ')+p.join(' ');started=true;}const valid=pts.filter(Boolean);const fill=area&&valid.length?`<path d="${line} L ${valid.at(-1)[0]} ${H-bottom} L ${valid[0][0]} ${H-bottom} Z" fill="url(#chart-fill)"/>`:'';return fill+`<path d="${line}" fill="none" stroke="${s.color}" stroke-width="${j?1.6:2.6}" ${j?'stroke-dasharray="5 5"':''} vector-effect="non-scaling-stroke"/>`;}).join('');const points=data.map((d,i)=>{const title=(d.label||dateLabel(d.date))+' · '+series.filter(s=>d[s.key]!=null).map(s=>s.name+': '+(percent?pct(d[s.key]/100):money(d[s.key]))).join(' · ');const value=d[series[0].key];return value==null?'':`<g class="graph-point" tabin function donut(data,total,label='סה״כ',size=168){const sum=data.reduce((s,d)=>s+d.value,0);let offset=0;const rings=data.map((d,i)=>{const value=sum?d.value/sum*100:0,result=`<circle cx="60" cy="60" r="50" pathLength="100" stroke="${d.color||palette[i%palette.length]}" stroke-width="8" stroke-dasharray="${Math.max(0,value-1.6)} ${100-Math.max(0,value-1.6)}" stroke-dashoffset="${-offset}" fill="none" stroke-linecap="round"><title>${e(d.name)}: ${money(d.value)}</title></circle>`;offset+=value;return result;}).join('');return `<div class="donut-wrap"><div class="donut" style="width:${size}px;height:${size}px" dir="ltr"><svg viewBox="0 0 120 120" role="img" aria-label="חלוקה לפי נכס או קטגוריה"><g transform="rotate(-90 60 60)">${rings}</g></svg><div class="donut-center"><small>${e(label)}</small><b>${money(total)}</b></div></div><div class="donut-legend">${data.slice(0,6).map((d,i)=>`<div><span class="legend-name"><i style="background:${d.color||palette[i%palette.length]}"></i>${e(d.name)}</span><b dir="ltr">${pct(total?d.value/total:0)}</b></div>`).join('')}</div></div>`;}

  const date=new Date(Date.UTC(year,month-1+offset,1));
  const lastDay=new Date(Date.UTC(date.getUTCFullYear(),date.getUTCMonth()+1,0)).getUTCDate();
  date.setUTCDate(Math.min(day,lastDay));
  return date.toISOString().slice(0,10);
}

function savingsDepositCount(from,to){
  if(!validDate(from)||!validDate(to))throw new Error('יש להזין תאריך תקין לחישוב החיסכון.');
  if(to<=from)return 0;
  const [year,month]=from.split('-').map(Number);
  const [endYear,endMonth]=to.split('-').map(Number);
  let count=(endYear-year)*12+endMonth-month;
  if(count>0&&savingsDepositDate(from,count)>to)count--;
  return Math.max(0,count);
}

function savingsProjection(goal,from=today()){
  const {saved,monthly,date}=goal;
  if(!Number.isFinite(saved)||saved<0||!Number.isFinite(monthly)||monthly<0)throw new Error('יש להזין סכום נוכחי והפקדה חודשית שאינם שליליים.');
  const hasTarget=goal.target!==null&&goal.target!==undefined&&goal.target!=='';
  if(hasTarget&&(!Number.isFinite(goal.target)||goal.target<=0))throw new Error('סכום יעד, אם הוזן, צריך להיות חיובי.');
  const months=savingsDepositCount(from,date);
  const contributions=monthly*months;
  const projected=saved+contributions;
  if(!Number.isFinite(projected))throw new Error('סכומי החיסכון גדולים מדי לחישוב.');
  const target=hasTarget?goal.target:projected;
  const remaining=hasTarget?Math.max(0,target-saved):contributions;
  const needed=hasTarget?(remaining===0?0:months>0?remaining/months:null):null;
  const installments=hasTarget&&remaining>0&&monthly>0?Math.ceil(remaining/monthly):0;
  let estimatedDate=null;
  if(hasTarget&&remaining===0)estimatedDate=from;
  else if(installments>0&&installments<=12000)estimatedDate=savingsDepositDate(from,installments);
  return {saved,monthly,date,hasTarget,target,months,contributions,projected,remaining,needed,progress:target>0?saved/target*100:0,estimatedDate,firstDepositDate:months?savingsDepositDate(from,1):null,past:date<from,due:date<=from};
}

function effectiveGoalSavings(data,goal){
  const account=data.accounts.find(a=>a.id===goal.accountId);
  if(!account)return goal.saved;
  return Math.max(0,account.kind==='investment'?portfolioValue(data):toILS(account.balance,account.currency,data.fx));
}

function savingsProjectionSeries(goal,from=today()){
  const result=savingsProjection(goal,from),points=[{date:from,value:goal.saved,contributions:0}];
  const count=Math.min(18,result.months);
  for(let i=1;i<=count;i++){
    const n=Math.ceil(result.months*i/count);
    points.push({date:savingsDepositDate(from,n),value:goal.saved+goal.monthly*n,contributions:goal.monthly*n});
  }
  if(result.date>from&&points.at(-1).date!==result.date)points.push({date:result.date,value:result.projected,contributions:result.contributions});
  return points;
}

function savingsStatus(g,v){
  if(v.hasTarget&&v.progress>=100)return badge('היעד הושג','green');
  if(v.due)return badge(v.past?'התאריך חלף':'התאריך הגיע','neutral');
  if(!v.months)return badge('אין הפקדות נוספות עד התאריך','neutral');
  if(!g.monthly)return badge('התחזית מבוססת על היתרה הקיימת','neutral');
  if(!v.hasTarget)return badge(`${v.months} הפקדות חודשיות בדרך`,'purple');
  return v.projected>=g.target?badge('בקצב הנכון להגיע ליעד','green'):badge('עוד '+money(Math.max(0,v.needed-g.monthly))+' בחודש יקרבו אותך ליעד','gold');
}

function debtMonths(a){if(!a.balance)return 'ההלוואה נסגרה';if(!(a.payment>0))return 'יש להגדיר תשלום חודשי';const r=(a.interest||0)/1200;if(r&&a.payment<=a.balance*r)return 'התשלום אינו מכסה את הריבית';return Math.ceil(r?-Math.log(1-a.balance*r/a.payment)/Math.log(1+r):a.balance/a.payment)+' חודשים (בריבית קבועה)';}

function insightItems(){const d=data,s=monthlySummary(d,ui.month),last=monthlySummary(d,monthOffset(ui.month,-1)),b=balances(d),items=[];if(s.income)items.push([`חסכת ${pct(s.rate)} מההכנסה שלך`,`${money(s.saved)} נשארו מתוך הכנסה של ${money(s.income)} ב${monthLabel(ui.month)}.`,s.saved>=0?'green':'red','PiggyBank']);for(const cat of ['מסעדות','בילויים','קניות בסופר']){const current=categorySpend(d,cat,ui.month),previous=categorySpend(d,cat,monthOffset(ui.month,-1));if(previous&&current)items.push([`ההוצאות על ${cat} ${current>=previous?'עלו':'ירדו'} ב־${pct(Math.abs(current/previous-1))}`,`החודש ${money(current)}, לעומת ${money(previous)} בחודש הקודם.`,current>previous?'gold':'green','ShoppingBag']);}for(const budget of d.budgets){const amount=categorySpend(d,budget.category,ui.month),r=amount/budget.limit;if(r>=.8)items.push([r>1?`חרגת מתקציב ${budget.category}`:`קרובים לתקרת התקציב של ${budget.category}`,`ניצלת ${pct(r)} מהתקציב. ${r>1?'חריגה של '+money(amount-budget.limit):money(budget.limit-amount)+' נשארו החודש'}.`,r>1?'red':'gold','Receipt']);}const snaps=sortedSnapshots(),p=dietz(snaps.at(-2),snaps.at(-1),d.activities);if(p.return!=null)items.push([`התיק שלך ${p.return>=0?'עלה':'ירד'} ב־${pct(Math.abs(p.return))}`,`רווח / הפסד של ${money(p.profit)} בעדכון האחרון, לאחר נטרול הפקדות ומשיכות.`,p.return>=0?'green':'red','TrendingUp']);if(s.expenses&&b.savings)items.push([`החסכונות מכסים ${(b.savings/s.expenses).toLocaleString('he-IL',{maximumFractionDigits:1})} חודשי הוצאות`,'ההערכה מבוססת על יתרות החיסכון ועל הוצאות החודש הנבחר.','purple','ShieldCheck']);if(last.expenses&&s.expenses)items.push([`ההוצאות הכוללות ${s.expenses>last.expenses?'עלו':'ירדו'} ב־${pct(Math.abs(s.expenses/last.expenses-1))}`,`${money(s.expenses)} החודש לעומת ${money(last.expenses)} בחודש הקודם.`,s.expenses>last.expenses?'gold':'green','Activity']);return items;}
function insightsView(){const items=insightItems();return `<div class="insights-intro"><span class="insight-icon">${icon('Sparkles',30)}</span><div><h2>המספרים מספרים סיפור.</h2><p>תובנות שמבוססות על הנתונים שלך ב${monthLabel(ui.month)}.</p></div></div><div class="insight-grid">${items.map(([title,text,color,ic])=>card(`<span class="asset-icon ${color}">${icon(ic,23)}</span><h2>${e(title)}</h2><p>${e(text)}</p>`,'insight-card')).join('')}</div>${items.length?'':card(empty('התובנות יצמחו עם הנתונים שלך','הוסף תנועות ושמור תמונות מצב כדי לזהות מגמות.'))}`;}
function initMonthly(){if(ui.monthly)return;const last=sortedSnapshots().at(-1),first=today().slice(0,7)+'-01';ui.monthly={date:today(),fx:data.fx,sp500:'',ta125:'',values:Object.fromEntries(data.assets.map(a=>[a.id,a.mode==='price'?a.currentPrice:a.currentValue])),flows:[]};}
function monthlyDraft(){initMonthly();const m=ui.monthly,copy=structuredClone(data),last=sortedSnapshots().at(-1);copy.fx=+m.fx;copy.fxDate=m.date;if(copy.assets.some(a=>a.date>m.date))throw Error('יש נכסים שעודכנו אחרי תאריך תמונת המצב. בחר תאריך עדכון שמכסה את כל היתרות הנוכחיות.');if(copy.activities.some(a=>(!last||a.date>last.date)&&a.date>m.date))throw Error('יש פעולות שכבר נרשמו אחרי תאריך העדכון. בחר תאריך שמכסה את כל הפעולות שנרשמו.');if(!(copy.fx>0))throw Error('יש להזין שער דולר חיובי.');for(const f of [...m.flows].sort((a,b)=>a.date.localeCompare(b.date))){if(!validDate(f.date)||f.date>m.date||last&&f.date<=last.date)throw Error('תאריך הפעולה צריך להיות אחרי תמונת המצב הקודמת ולפני או ביום העדכון.');applyActivity(copy,{...f,amount:+f.amount,quantity:+f.quantity,fx:+f.fx||+m.fx});}copy.assets=copy.assets.map(a=>{const val=+m.values[a.id];if(m.values[a.id]===''||!Number.isFinite(val)||val<0)throw Error('יש להזין מחיר או שווי תקין לכל נכס.');return {...a,[a.mode==='price'?'currentPrice':'currentValue']:val,date:m.date};});return copy;}

function monthlyView(){initMonthly();const m=ui.monthly,last=sortedSnapshots().at(-1);if(ui.monthlyDone){const r=ui.monthlyDone;return card(`<span class="success-orb">${icon('Check',35)}</span>${badge('העדכון נשמר')}<h2>עוד חודש בדרך שלך.</h2><p>תמונת המצב של ${dateLabel(r.snapshot.date)} נוספה להיסטוריית התיק.</p><div class="success-metrics"><div><span>שווי התיק</span><b dir="ltr">${money(r.snapshot.value)}</b></div><div><span>רווח בתקופה</span><b class="${r.profit>=0?'positive':'negative'}" dir="ltr">${r.profit==null?'תמונת מצב ראשונה':money(r.profit)}</b></div><div><span>תשואה מותאמת תזרים</span><b dir="ltr">${pct(r.return)}</b></div></div>${notice(returnHelp)}${btn('לניתוח הביצועים שלך','navigate:performance','','primary')}`,'monthly-success');}return `<div class="update-intro"><span class="update-number">01—03</span><h2>כמה דקות היום. יותר בהירות מחר.</h2><p>עדכן שווי, הוסף פעולות ושמור תמונת מצב. ההיסטוריה שלך נשארת איתך.</p></div><form id="monthly-form">${card(head('01 · מועד העדכון ושער המטבע',last?'תמונת המצב האחרונה: '+dateLabel(last.date):'העדכון הראשון שלך ישמש נקודת התחלה לחישוב תשואות.')+`<div class="form-grid">${field('תאריך תמונת המצב',input('date',m.date,'date',`required max="${today()}" ${last?'min="'+new Date(new Date(last.date).valueOf()+86400000).toISOString().slice(0,10)+'"':''}`))}${field('שער דולר / שקל',input('fx',m.fx,'number','required min="0.001" step="any"'),'שער ידני לתאריך העדכון. שערים היסטוריים אינם משתנים.')}</div>`)}${card(head('02 · שווי הנכסים שלך','הזן מחיר ליחידה או שווי כולל לפי אופן הניהול של כל נכס.')+`<div class="update-assets">${data.assets.map((a,i)=>`<div class="update-asset"><div class="asset-name"><span class="ticker-icon" style="color:${palette[i%palette.length]}">${e(a.ticker?.slice(0,3)||a.name.slice(0,2))}</span><div><b>${e(a.name)}</b><small>${a.mode==='price'?a.quantity+' יחידות · ':''}${a.currency==='USD'?'דולר אמריקאי':'שקל ישראלי'}</small></div></div>${field(a.mode==='price'?'מחיר נוכחי ליחידה':'שווי נוכחי כול es(f.type)?field(f.type==='deposit'?'חשבון מקור':'חשבון יעד',select(`flow_${i}_accountId`,[['','מחוץ לחשבונות שבמעקב'],...data.accounts.filter(a=>!['investment','debt'].includes(a.kind)).map(a=>[a.id,a.name])],f.accountId)):''}${ib('Trash2','הסרת פעולה','monthly-remove-flow:'+i)}</div>`).join('')}</div>`:'<div class="no-flows">'+icon('Check')+'<span>לא היו פעולות? אפשר להמשיך ישר לשמירה.</span></div>')+`<details class="benchmark-details"><summary>עדכון מדדי השוואה · ידני ואופציונלי</summary><p>ערכי מדדי מחיר לתאריך תמונת המצב. מדדי מחיר אינם כוללים דיבידנדים. S&P 500 מומר לשקלים לפי שערי שתי תמונות המצב. ללא ערכים בשני קצות התקופה לא תוצג השוואה.</p><div class="form-grid">${field('S&P 500 · נקודות',input('sp500',m.sp500,'number','step="any" min="0.01"'))}${field('ת״א 125 · נקודות',input('ta125',m.ta125,'number','step="any" min="0.01"'))}</div></details>`)}<div class="update-save"><div id="monthly-estimate">${monthlyEstimate()}</div>${submit('שמירת תמונת מצב חודשית')}</div>${notice(returnHelp)}</form>`;}
function saveMonthly(){captureMonthly();const m=ui.monthly,last=sortedSnapshots().at(-1);if(!validDate(m.date)||m.date>today())throw Error('יש להזין תאריך תקין שאינו בעתיד.');if(last&&m.date<=last.date)throw Error('תאריך העדכון חייב להיות מאוחר מתמונת המצב האחרונה. ההיסטוריה אינה נדרסת.');const copy=monthlyDraft(),benchmarks={};for(const k of ['sp500','ta125']){if(m[k]!==''&&!(+m[k]>0))throw Error('ערך המדד צריך להיות חיובי.');benchmarks[k]=m[k]===''?null:+m[k];}const snap=snapshot(copy,m.date,benchmarks);copy.snapshots.push(snap);const result=dietz(last,snap,copy.activities);commit(copy,'תמונת המצב נשמרה בהצלחה');ui.monthlyDone={snapshot:snap,...result};render();}

function showDialog(title,body,wide=false){document.querySelector('dialog')?.remove();const el=document.createElement('dialog');el.className='modal'+(wide?' wide':'');el.setAttribute('aria-label',title);el.innerHTML=`<div class="modal-head"><h2>${e(title)}</h2>${ib('X','סגירה','dialog-close')}</div>${body}`;document.body.append(el);el.showModal();el.addEventListener('click',event=>{if(event.target===el)closeDialog();});el.addEventListener('cancel',event=>{event.preventDefault();closeDialog();});return el;}

function captureEntity(){if(!dialogState)return;const form=document.querySelector('#entity-form');if(!form)return;for(const [key,value] of new FormData(form))dialogState.v[key]=value;if(dialogState.kind==='transaction')dialogState.v.recurring=form.querySelector('[name=recurring]').checked;}
function saveEntity(){captureEntity();const {kind,entity}=dialogState,v={...dialogState.v,id:entity?.id||uid()},next=structuredClone(data),keys={transaction:'transactions',budget:'budgets',goal:'goals',account:'accounts',asset:'assets'};if(kind==='transaction'){v.amount=+v.amount;v.fx=+v.fx||next.fx;v.currency=next.accounts.find(a=>a.id===v.accountId)?.currency||'ILS';v.tags=String(v.tags||'').split(',').map(s=>s.trim()).filter(Boolean);if(!(v.amount>0))throw Error('יש להזין סכום חיובי.');if(entity)applyTransaction(next,entity,-1);applyTransaction(next,v);}
if(kind==='budget'){v.limit=+v.limit;if(!(v.limit>0))throw Error('יש להזין תקציב חיובי.');if(next.budgets.some(b=>b.category===v.category&&b.id!==v.id))throw Error('כבר קיים תקציב לקטגוריה הזו. אפשר לערוך אותו.');}
if(kind==='goal'){const rawTarget=String(v.target??'').trim();v.target=rawTarget===''?null:Number(rawTarget);for(const k of ['saved','monthly'])v[k]=+v[k];savingsProjection({...v,saved:effectiveGoalSavings(next,v)});}
if(kind==='account'){for(const k of ['balance','original','payment','interest'])v[k]=+v[k]||0;if(v.kind==='debt'&&v.original<v.balance)throw Error('הסכום המקורי צריך להיות לפחות יתרת החוב.');if(entity&&entity.kind!==v.kind&&next.transactions.some(t=>t.accountId===v.id))throw Error('לחשבון יש תנועות, ולכן אין לשנות את סוג החשבון.');if(v.kind==='investment'&&next.accounts.some(a=>a.kind==='investment'&&a.id!==v.id))throw Error('התיק הכולל כבר מיוצג בחשבון השקעות. אפשר לנהל בתוכו כמה נכסים.');}
if(kind==='asset'){for(const k of ['quantity','averagePrice','invested','currentPrice','currentValue'])v[k]=+v[k]||0;if(!v.invested)v.invested=v.quantity*v.averagePrice;if(v.mode==='price'&&v.quantity>0)v.averagePrice=v.invested/v.quantity;if(v.mode==='price'&&(!v.currentPrice||v.quantity<0))throw Error('יש להזין מחיר חיובי וכמות שאינה שלילית.');const val=assetValue(v),last=sortedSnapshots().at(-1);if(entity&&last&&(v.quantity!==entity.quantity||v.currency!==entity.currency))throw Error('לאחר תחילת המעקב, שינוי כמות יש לרשום כקנייה או מכירה. מטבע של נכס קיים אינו ניתן לשינוי.');if(!entity&&val>0){if(last&&v.date<=last.date)throw Error('נכס חדש צריך להירשם אחרי תאריך תמונת המצב האחרונה.');next.activities.push({id:uid(),type:'opening',date:v.date,amount:val,currency:v.currency,fx:next.fx,assetId:v.id,notes:'יתרה התחלתית של נכס קיים'});}if(ui.monthly)ui.monthly.values[v.id]=v.mode==='price'?v.currentPrice:v.currentValue;}

if(kind==='category'){v.name=v.name.trim();if(!v.name||next.categories.includes(v.name))throw Error('יש להזין שם קטגוריה חדש.');next.categories.push(v.name);}else if(keys[kind]){const arr=next[keys[kind]],index=arr.findIndex(x=>x.id===v.id);if(index>=0)arr[index]=v;else arr.push(v);}commit(next);closeDialog();}
function removeEntity(kind,id){const keys={transaction:'transactions',budget:'budgets',goal:'goals',account:'accounts',asset:'assets'},entity=data[keys[kind]].find(a=>a.id===id);if(!entity)return;if(kind==='account'&&data.transactions.some(t=>t.accountId===id)){toast('החשבון מקושר לתנועות. אפשר לערוך אותו, אך מחיקה תפגע בהיסטוריה.',true);return;}confirm('למחוק את הפריט?',kind==='asset'?'הנכס יוסר מהתיק הנוכחי ושוויו יירשם כמשיכה היום. תמונות המצב ההיסטוריות יישמרו.':kind==='transaction'?'התנועה תימחק ויתרת החשבון תתעדכן. תנועות חודשיות שכבר נרשמו יישמרו.':'הפריט יימחק מהנתונים השמורים. מומלץ להוריד גיבוי קודם.',()=>{const next=structuredClone(data);if(kind==='transaction')applyTransaction(next,entity,-1);if(kind==='asset'&&assetValue(entity)>0){const last=sortedSnapshots().at(-1);if(last&&today()<=last.date)throw Error('אפשר להסיר את הנכס רק לאחר תאריך העדכון האחרון.');next.activities.push({id:uid(),type:'withdrawal',date:today(),amount:assetValue(entity),currency:entity.currency,fx:next.fx,notes:'הסרת נכס: '+entity.name});}if(kind==='account')next.goals=next.goals.map(g=>g.accountId===id?{...g,accountId:'',saved:effectiveGoalSavings(data,entity.kind==='investment'?{...g,accountId:entity.id}:g)}:g);next[keys[kind]]=next[keys[kind]].filter(a=>a.id!==id);commit(next,'הפריט נמחק');},true);}
function download(filename,value,type='application/json'){const blob=new Blob([value],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);}
function exportData(format){const list=format.endsWith('filtered')?filteredTransactions():data.transactions;if(format==='backup'){const copy={...data,lastBackup:new Date().toISOString()};download('ofek-backup-'+today()+'.json',JSON.stringify(copy,null,2));commit(copy,'הגיבוי הורד בהצלחה');return;}if(format.startsWith('json')){download('ofek-transactions-'+today()+'.json',JSON.stringify({format:'ofek-transactions',version:1,transactions:list.map(t=>({...t,accountName:data.accounts.find(a=>a.id===t.accountId)?.name}))},null,2));toast('התנועות יוצאו ל־JSON');return;}const headers=['מזהה','תאריך','סוג','סכום','מטבע','קטגוריה','תת קטגוריה','חשבון','תיאור','תגיות','חוזרת','שער דולר','מזהה תנועה חוזרת'],rows=list.map(t=>[t.id,t.date,t.type==='income'?'הכנסה':'הוצאה',t.amount,t.currency||'ILS',t.category,t.subcategory,data.accounts.find(a=>a.id===t.accountId)?.name,t.description,t.tags?.join(','),t.recurring?'כן':'לא',t.fx||data.fx,t.recurringParent||'']);download('ofek-transactions-'+today()+'.csv','\uFEFF'+[headers,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('התנועות יוצאו ל־CSV');}
async function importFile(file){try{if(!file)return;if(file.size>10*1024*1024)throw Error('גודל הקובץ המרבי הוא 10MB.');const text=await file.text();let value;if(file.name.toLowerCase().endsWith('.csv')){const rows=parseCSV(text.replace(/^\uFEFF/,'')),headers=rows.shift();if(!['תאריך','סוג','סכום','חשבון','קטגוריה'].every(k=>headers.includes(k)))throw Error('כותרות CSV אינן תואמות. השתמש בפורמט של קובץ התנועות המיוצא מאופק.');const get=(r,k)=>r[headers.indexOf(k)]||'';value={format:'ofek-transactions',transactions:rows.map(r=>({id:get(r,'מזהה')||uid(),date:get(r,'תאריך'),type:get(r,'סוג')==='הכנסה'?'income':get(r,'סוג')==='הוצאה'?'expense':'invalid',amount:+get(r,'סכום'),currency:get(r,'מטבע')||'ILS',category:get(r,'קטגוריה'),subcategory:get(r,'תת קטגוריה'),accountName:get(r,'חשבון'),description:get(r,'תיאור'),tags:get(r,'תגיות').split(',').filter(Boolean),recurring:get(r,'חוזרת')==='כן',recurringParent:get(r,'מזהה תנועה חוזרת')||undefined,fx:+get(r,'שער דולר')||data.fx}))};}else value=JSON.parse(text);if(value.format==='ofek-transactions'){if(!Array.isArray(value.transactions))throw Error('רשימת התנועות אינה תקינה.');const next=structuredClone(data);let count=0;for(const row of value.transactions){if(next.transactions.some(t=>t.id===row.id))continue;const account=next.accounts.find(a=>a.id===row.accountId||a.name===row.accountName);if(!account)throw Error('לא נמצא חשבון לתנועה '+(row.description||row.category)+'. יש ליצור חשבון בשם '+(row.accountName||row.accountId));const t={...row,id:row.id||uid(),accountId:account.id,fx:row.fx||data.fx};if(!validDate(t.date)||t.date>today()||!(t.amount>0)||!['income','expense'].includes(t.type)||!['ILS','USD'].includes(t.currency)||!(t.fx>0))throw Error('אחת התנועות מכילה נתונים לא תקינים. לא נשמרו שינויים.');if(!next.categories.includes(t.category))next.categories.push(t.category);applyTransaction(next,t);next.transactions.push(t);count++;}validateData(next);confirm('ייבוא תנועות',`נמצאו ${count} תנועות חדשות. התנועות יתווספו והיתרות יתעדכנו. תנועות עם מזהה קיים יידלגו.`,()=>commit(next,`${count} תנועות יובאו בהצלחה`));}else{validateData(value);confirm('שחזור הגיבוי',`הגיבוי כולל ${value.transactions.length} תנועות, ${value.assets.length} נכסים ו־${value.snapshots.length} תמונות מצב. הוא יחליף את הנתונים הנוכחיים. מומלץ להוריד גיבוי קודם.`,()=>{commit(value,'הגיבוי שוחזר בהצלחה',true);ui.monthly=null;ui.monthlyDone=null;});}}catch(err){toast(err.message||'לא הצלחנו לקרוא את הקובץ',true);}}
function clearDemo(){confirm('להסיר את נתוני ההדגמה?','כל הנתונים הנוכחיים, כולל שינויים שנעשו בהדגמה, יימחקו. אפשר להוריד גיבוי לפני ההסרה. האפליקציה תתחיל נקייה כדי להזין את הנתונים שלך.',()=>{commit(emptyData(),'נתוני ההדגמה הוסרו — אפשר להתחיל');ui.month=today().slice(0,7);ui.monthly=null;ui.monthlyDone=null;navigate('dashboard');},true);}
function refreshTransactionResults(){const list=filteredTransactions(),sum=type=>list.filter(t=>t.type===type).reduce((s,t)=>s+toILS(t.amount,t.currency||'ILS',t.fx||data.fx),0);document.querySelector('#transaction-results').innerHTML=transactionsTable(list);document.querySelector('#transaction-metrics').innerHTML=metric('הכנסות בסינון',money(sum('income')),'','ArrowDownLeft','green')+metric('הוצאות בסינון',money(sum('expense')),'','ArrowUpLeft','purple')+metric('יתרה בסינון',money(sum('income')-sum('expense')),`${list.length} תנועות`);}
document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button)return;const [action,a,b]=button.dataset.action.split(':');try{if(action==='navigate')navigate(a);else if(action==='open')openEntity(a);else if(action==='edit'){const keys={transaction:'transactions',budget:'budgets',goal:'goals',account:'accounts',asset:'assets'};openEntity(a,data[keys[a]].find(v=>v.id===b));}else if(action==='remove')removeEntity(a,b);else if(action==='dialog-close')closeDialog();else if(action==='confirm'){const fn=confirmAction;fn?.();closeDialog();}else if(action==='nav-open'){document.querySelector('.sidebar').classList.add('open');document.querySelector('.sidebar').removeAttribute('inert');document.querySelector('.nav-scrim').hidden=false;button.setAttribute('aria-expanded','true');}else if(action==='nav-close'){document.querySelector('.sidebar').classList.remove('open');if(window.innerWidth<=760)document.querySelector('.sidebar').setAttribute('inert','');document.querySelector('.nav-scrim').hidden=true;}else if(action==='toast-close')document.querySelector('.toast')?.remove();else if(action==='clear-demo')clearDemo();else if(action==='return-help')showDialog('איך מחושבת התשואה?',`<p class="confirm-text">${e(returnHelp)}</p><p class="confirm-text" style="margin-top:18px">XIRR הוא חישוב תשואה שנתית משוקללת תזרימים לפי סכום ותאריך. המעקב מתחיל מתמונת המצב הראשונה, ואינו מנסה לשחזר תשואה מלפני תחילת התיעוד.</p>`);else if(action==='export')exportData(a);else if(action==='import-file')document.querySelector('#import-file').click();else if(action==='toggle-filters'){ui.advanced=!ui.advanced;render();}else if(action==='dash-period'){ui.dashboardPeriod=a;render();}else if(action==='period'){ui.period=a;render();}else if(action==='tx-view'){ui.view=a;ui.filters.day='';if(a==='calendar'){ui.filters.from='';ui.filters.to='';}render();}else if(action==='clear-filters'){for(const k in ui.filters)ui.filters[k]='';render();}else if(action==='calendar-prev'||action==='calendar-next'){ui.calendarMonth=monthOffset(ui.calendarMonth,action==='calendar-prev'?-1:1);ui.filters.day='';render();}else if(action==='calendar-day'){ui.filters.day=ui.filters.day===a?'':a;render();}else if(action==='calendar-clear'){ui.filters.day='';render();}else if(action==='year-transactions'){ui.filters.from=ui.month.slice(0,4)+'-01-01';ui.filters.to=ui.month.slice(0,4)+'-12-31';ui.filters.day='';ui.view='list';render();}else if(action==='entity-type'){captureEntity();dialogState.v.type=a;entityDialog();}else if(action==='edit-benchmarks')openBenchmarks();else if(action==='edit-target')showDialog('יעד הוצאות חודשי',`<form id="target-form">${field('יעד חודשי (₪)',input('target',data.overallBudget,'number','required min="1"'))}<div class="form-actions">${submit()}${btn('ביטול','dialog-close')}</div></form>`);else if(action==='monthly-add-flow'){captureMonthly();ui.monthly.flows.push({id:uid(),type:'deposit',amount:'',currency:'ILS',fx:ui.monthly.fx,assetId:'',accountId:'',quantity:'',date:ui.monthly.date,notes:''});render();}else if(action==='monthly-remove-flow'){captureMonthly();ui.monthly.flows.splice(+a,1);render();}else if(action==='restore-recovery'){const previous=repository.recovery();if(!previous)throw Error('לא נמצאה שמירה קודמת.');validateData(previous);confirm('שחזור השמירה הקודמת','הנתונים הנוכחיים יוחלפו בשמירה הקודמת של הדפדפן.',()=>commit(previous,'השמירה הקודמת שוחזרה',true));}else if(action==='raw-recovery')download('ofek-recovery-raw.json',localStorage.getItem(STORAGE_KEY+'-unreadable')||localStorage.getItem(STORAGE_KEY)||'{}');else if(action==='reset-all')confirm('למחוק את כל הנתונים?','כל החשבונות, התנועות, ההשקעות ותמונות המצב יימחקו. מומלץ להוריד גיבוי מלא קודם.',()=>{commit(emptyData(),'כל הנתונים הוסרו',true);ui.monthly=null;ui.monthlyDone=null;},true);else if(action==='load-demo')confirm('טעינת נתוני הדגמה','נתוני ההדגמה יחליפו את הנתונים הנוכחיים. מומלץ להוריד גיבוי קודם.',()=>{commit(demoData(),'נתוני ההדגמה נטענו',true);ui.month='2026-09';ui.monthly=null;render();});}catch(err){toast(err.message,true);}});
document.addEventListener('input',event=>{const el=event.target;el.setCustomValidity?.('');if(el.closest('#entity-form')&&dialogState?.kind==='goal')updateGoalPreview();if(el.dataset.filter){ui.filters[el.dataset.filter]=el.value;refreshTransactionResults();}if(el.closest('#monthly-form')){captureMonthly();const preview=document.querySelector('#monthly-estimate');if(preview)preview.innerHTML=monthlyEstimate();}});
document.addEventListener('change',event=>{const el=event.target;try{if(el.dataset.goalAccount!=null&&dialogState?.kind==='goal'){captureEntity();const saved=document.querySelector('#entity-form [name=saved]');const linked=data.accounts.some(a=>a.id===el.value);if(linked){dialogState.v.saved=effectiveGoalSavings(data,dialogState.v);saved.value=dialogState.v.saved;}saved.readOnly=linked;updateGoalPreview();}if(el.id==='import-file'){importFile(el.files[0]);el.value='';return;}if(el.dataset.benchmarkSnapshot!=null){const s=data.snapshots.find(s=>s.id===el.value);if(s){document.querySelector('dialog [name=sp500]').value=s.benchmarks?.sp500??'';document.querySelector('dialog [name=ta125]').value=s.benchmarks?.ta125??'';}}if(el.dataset.change){const [action,key]=el.dataset.change.split(':');if(action==='month'){ui.month=el.value;ui.calendarMonth=el.value;ui.filters.from=el.value+'-01';ui.filters.to=el.value+'-31';ui.filters.day='';}else if(action==='chart-metric')ui.chartMetric=el.value;else if(action==='benchmark')ui[key]=el.checked;else if(action==='performance-from')ui.from=el.value;else if(action==='performance-to')ui.to=el.value;render();}if(el.dataset.entityDynamic){captureEntity();if(el.name==='assetId'){const a=data.assets.find(a=>a.id===el.value);if(a)dialogState.v.currency=a.currency;}entityDialog();}if(el.closest('#monthly-form')&&/^flow_\d+_(type|currency|assetId)$/.test(el.name)){captureMonthly();const [,index,key]=el.name.match(/^flow_(\d+)_(.+)$/);if(key==='assetId'){const a=data.assets.find(a=>a.id===el.value);if(a)ui.monthly.flows[+index].currency=a.currency;}render();}}catch(err){toast(err.message,true);}});
document.addEventListener('submit',event=>{event.preventDefault();try{if(event.target.id==='entity-form')saveEntity();else if(event.target.id==='monthly-form')saveMonthly();else if(event.target.id==='settings-form'){const f=new FormData(event.target);commit({...data,profile:f.get('profile'),fx:+f.get('fx'),fxDate:today()},'ההגדרות נשמרו');}else if(event.target.id==='benchmarks-form'){const f=new FormData(event.target),next=structuredClone(data),s=next.snapshots.find(s=>s.id===f.get('snapshot'));if(!s)throw Error('יש לבחור תמונת מצב.');s.benchmarks={sp500:f.get('sp500')===''?null:+f.get('sp500'),ta125:f.get('ta125')===''?null:+f.get('ta125')};s.benchmarkUpdated=today();commit(next,'מדדי ההשוואה עודכנו');closeDialog();}else if(event.target.id==='target-form'){const f=new FormData(event.target);commit({...data,overallBudget:+f.get('target')},'היעד החודשי נשמר');closeDialog();}}catch(err){const box=document.querySelector('#entity-error');if(box)box.innerHTML=notice(err.message,'error');else toast(err.message,true);}});
document.addEventListener('invalid',event=>event.target.setCustomValidity(event.target.validity.valueMissing?'יש למלא שדה זה.':'יש להזין ערך תקין בטווח המותר.'),true);
function chartTip(event){const point=event.target.closest?.('.graph-point'),chart=point?.closest('.chart');if(!chart)return;const tooltip=chart.querySelector('.chart-hover');tooltip.textContent=point.dataset.tip;tooltip.classList.add('visible');}
document.addEventListener('pointerover',chartTip);document.addEventListener('focusin',chartTip);document.addEventListener('pointerout',event=>{if(event.target.closest?.('.graph-point'))event.target.closest('.chart')?.querySelector('.chart-hover')?.classList.remove('visible');});document.addEventListener('focusout',event=>{if(event.target.closest?.('.graph-point'))event.target.closest('.chart')?.querySelector('.chart-hover')?.classList.remove('visible');});
window.addEventListener('hashchange',()=>{const page=location.hash.slice(1);if(pageMeta[page]&&ui.page!==page)navigate(page);});window.addEventListener('storage',event=>{if(event.key===STORAGE_KEY&&event.newValue){try{data=validateData(JSON.parse(event.newValue));render();toast('הנתונים עודכנו מלשונית אחרת');}catch{toast('לא ניתן לקרוא נתונים מלשונית אחרת',true);}}});
render();
if(document.modelContext?.registerTool){const life=new AbortController();for(const tool of [{name:'read_financial_summary',title:'קריאת סקירה פיננסית',description:'Read current financial totals in ILS without changing local data.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:input=>{if(input&&Object.keys(input).length)throw Error('אין פרמטרים לפעולה זו.');return balances(data);}},{name:'start_monthly_investment_update',title:'פתיחת עדכון השקעות חודשי',description:'Open the monthly update form. Does not save a snapshot.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:false},execute:input=>{if(input&&Object.keys(input).length)throw Error('אין פרמטרים לפעולה זו.');navigate('monthly');return {opened:true,saved:false};}}])try{Promise.resolve(document.modelContext.registerTool(tool,{signal:life.signal})).catch(()=>{});}catch{}window.addEventListener('pagehide',()=>life.abort());}

window.addEventListener('resize',()=>{const sidebar=document.querySelector('.sidebar');if(!sidebar)return;if(window.innerWidth<=760&&!sidebar.classList.contains('open'))sidebar.setAttribute('inert','');else sidebar.removeAttribute('inert');});

})();</script></body></html>
