/* ============================================================
   Ofek 4.0 — design tokens ("Midnight").
   The ONLY file with raw colour values. Every other stylesheet uses var(--…).
   Light theme on :root / [data-theme=light], dark theme on [data-theme=dark].
   Fonts (family "Ofek") are embedded by the build; no @font-face here.
   ============================================================ */

/* ---------- Theme-independent ---------- */
:root {
  /* Typography */
  --font-sans: Ofek, "Noto Sans Hebrew", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-num: Ofek, "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --num-features: "tnum" 1, "lnum" 1;

  --fs-display: 64px;     --lh-display: 1;      --fw-display: 800;   /* hero balance, desktop */
  --fs-display-sm: 46px;                                            /* hero balance, phone   */
  --fs-h1: 28px;          --lh-h1: 1.2;         --fw-h1: 800;
  --fs-h2: 18px;          --lh-h2: 1.3;         --fw-h2: 700;
  --fs-h3: 15px;          --lh-h3: 1.35;        --fw-h3: 700;
  --fs-body: 15px;        --lh-body: 1.5;
  --fs-small: 13px;       --lh-small: 1.45;
  --fs-micro: 12px;       --lh-micro: 1.35;
  --fs-num-xl: 34px;      /* amount inputs, big figures */
  --fs-num-lg: 24px;      /* stat / metric values       */
  --fs-num-md: 17px;      /* tile values                */
  --fs-num-sm: 15px;      /* list amounts               */
  /* Ofek (Hebrew) has two files: regular covers 400–600, bold 700–900. Semibold is 500 so Latin
     fallback text ("Claude", tickers) renders medium, not a heavier weight than the Hebrew beside it. */
  --fw-regular: 400; --fw-medium: 500; --fw-semibold: 500; --fw-bold: 700; --fw-black: 800;
  --tracking-tight: -0.02em;

  /* Spacing (4px base) */
  --sp-0: 0; --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px;
  --sp-6: 24px; --sp-7: 28px; --sp-8: 32px; --sp-10: 40px; --sp-12: 48px; --sp-16: 64px;
  --gutter: 32px;          /* page side padding (16px on phone) */
  --gap-grid: 20px;        /* gap between cards               */

  /* Radii */
  --r-xs: 8px; --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-pill: 999px;

  /* Sizes */
  --touch: 44px;
  --control-h: 44px;       /* inputs / buttons */
  --sidebar-w: 248px;
  --topbar-h: 64px;
  --bottomnav-h: 68px;     /* without the safe-area inset */
  --content-max: 1320px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);

  /* Motion */
  --dur-fast: 120ms; --dur-base: 200ms; --dur-slow: 320ms; --dur-sheet: 360ms;
  --ease-out: cubic-bezier(.2, .8, .2, 1);
  --ease-in-out: cubic-bezier(.65, 0, .35, 1);
  --ease-spring: cubic-bezier(.34, 1.56, .64, 1);

  /* Hero (identical in both themes: the brand moment) */
  --hero-gradient:
    radial-gradient(120% 140% at 0% 0%, rgba(64, 232, 255, .34) 0%, rgba(64, 232, 255, 0) 42%),
    radial-gradient(90% 120% at 100% 100%, rgba(124, 92, 255, .55) 0%, rgba(124, 92, 255, 0) 55%),
    linear-gradient(118deg, #0A7F91 0%, #1D66CF 40%, #3F3FD8 72%, #4630C2 100%);
  --hero-text: #FFFFFF;
  --hero-text-muted: rgba(235, 240, 255, .88);
  --hero-tile: rgba(8, 12, 48, .28);
  --hero-tile-border: rgba(255, 255, 255, .18);
  --hero-btn: rgba(255, 255, 255, .16);
  --hero-btn-hover: rgba(255, 255, 255, .26);
  --hero-line: rgba(255, 255, 255, .55);
  --hero-btn-solid: #FFFFFF;
  --hero-btn-solid-text: #3135B8;
  --hero-sheen: linear-gradient(180deg, rgba(255, 255, 255, .10), rgba(255, 255, 255, 0) 40%);
  --hero-orb: rgba(255, 255, 255, .16);
  --hero-pulse: #6BFFC8;
  --hero-pulse-ring: rgba(107, 255, 200, .22);
  --hero-area: rgba(255, 255, 255, .10);
  --hero-shadow: 0 24px 60px -22px rgba(67, 68, 224, .55), 0 8px 20px -10px rgba(11, 133, 151, .35);
  --brand-gradient: linear-gradient(135deg, #22D3EE 0%, #2B6FE0 55%, #4F46E5 100%);
  --mask-solid: #000;      /* opaque stop for mask-image fades */
  --on-hero: #FFFFFF;
}

/* ---------- LIGHT (default) ---------- */
:root,
[data-theme="light"] {
  color-scheme: light;
  --bg: #EDF0F6;
  --bg-decor:
    radial-gradient(900px 520px at 0% -10%, rgba(79, 70, 229, .07), transparent 60%),
    radial-gradient(800px 520px at 100% 110%, rgba(8, 145, 178, .07), transparent 60%);
  --surface: #FFFFFF;
  --surface-2: #F4F6FB;
  --surface-3: #E9EDF5;
  --elevated: #FFFFFF;
  --card-bg: #FFFFFF;
  --card-blur: none;
  --border: #E1E6F0;
  --border-strong: #CDD4E3;
  --hover: rgba(16, 24, 64, .045);
  --pressed: rgba(16, 24, 64, .08);
  --scrim: rgba(10, 16, 40, .42);

  --text: #0B1230;
  --text-muted: #525D7E;          /* 6.4:1 on white   */
  --text-subtle: #5F6989;         /* 4.9:1 on surface-2 */
  --text-inverse: #FFFFFF;

  --accent: #08779C;              /* petrol: 5.1:1 with white text */
  --accent-hover: #066685;
  --accent-contrast: #FFFFFF;
  --accent-soft: #E1F4FA;
  --accent-text: #076F92;
  --accent-vivid: #0A94BD;        /* bars, dots, chart marks */
  --accent-2: #4F46E5;            /* indigo/violet secondary ("purple" in markup) */
  --accent-2-soft: #ECEBFD;
  --accent-2-vivid: #6366F1;

  --positive: #0B7550;   --positive-soft: #E2F5EC;   --positive-vivid: #12A26E;
  --negative: #BB2843;   --negative-soft: #FCE8EC;   --negative-vivid: #E2445F;
  --warning:  #A35F00;   --warning-soft: #FFF2DC;    --warning-vivid: #E8960C;
  --info:     #1D5FD1;   --info-soft: #E6EFFD;       --info-vivid: #3B82F6;

  --chart-1: #4F46E5;  /* indigo  */
  --chart-2: #0EA5E9;  /* sky — clearly lighter/bluer than the petrol accent */
  --chart-3: #0E9F6E;  /* emerald */
  --chart-4: #A855F7;  /* purple  */
  --chart-5: #E08A00;  /* amber   */
  --chart-6: #E64A97;  /* pink    */
  --chart-1-soft: #ECEBFD;
  --chart-2-soft: #E2F4FD;
  --chart-3-soft: #E2F5EC;
  --chart-4-soft: #F4EAFE;
  --chart-5-soft: #FFF2DC;
  --chart-6-soft: #FDE8F2;
  --chart-grid: #E6EAF2;
  --chart-zero: #CDD4E3;
  --chart-axis: #6B7594;
  --chart-muted: #A3ACC2;
  --chart-area-top: rgba(79, 70, 229, .16);

  --track: #E6EAF2;
  --focus-ring: 0 0 0 2px #FFFFFF, 0 0 0 4px #08779C;
  --focus-color: #08779C;

  --shadow-1: 0 1px 2px rgba(16, 24, 64, .05), 0 1px 1px rgba(16, 24, 64, .03);
  --shadow-2: 0 1px 2px rgba(16, 24, 64, .04), 0 8px 24px -12px rgba(16, 24, 64, .12);
  --shadow-3: 0 24px 64px -16px rgba(16, 24, 64, .28), 0 4px 12px rgba(16, 24, 64, .06);
  --inner-highlight: inset 0 0 0 0 transparent;
  --nav-bg: rgba(255, 255, 255, .92);
  --nav-solid: #FFFFFF;    /* opaque phone bottom nav + the ring around its + button */
  --nav-active-bg: #E1F4FA;
  --topbar-bg: rgba(237, 240, 246, .82);
  --toast-bg: #0B1230;
  --toast-text: #F3F6FF;
  --toast-muted: #A3AED3;
  --toast-accent: #5FEAF8;
  --toast-ok: #3FE0A0;
  --toast-err: #FF8099;
  --toast-border: transparent;
  --hero-shadow-theme: var(--hero-shadow);
  --seg-active: #FFFFFF;
  --knob: #FFFFFF;
  --on-vivid: #FFFFFF;     /* text on *-vivid fills (counts, dots) */
  --danger-fill: #BB2843;  /* solid destructive buttons (dialogs); white text 5.9:1 */
  --danger-fill-hover: #A21F38;
  --on-danger: #FFFFFF;
}

/* ---------- DARK ---------- */
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #070B1A;
  --bg-decor:
    radial-gradient(1000px 600px at 0% -10%, rgba(79, 70, 229, .22), transparent 60%),
    radial-gradient(900px 600px at 110% 110%, rgba(14, 165, 183, .15), transparent 60%);
  --surface: #0E1530;
  --surface-2: #141D3D;
  --surface-3: #1B2650;
  --elevated: #131C3D;
  --card-bg: rgba(19, 28, 60, .72);
  --card-blur: blur(18px) saturate(140%);
  --border: rgba(146, 166, 255, .12);
  --border-strong: rgba(146, 166, 255, .24);
  --hover: rgba(146, 166, 255, .07);
  --pressed: rgba(146, 166, 255, .12);
  --scrim: rgba(2, 4, 14, .66);

  --text: #F3F6FF;
  --text-muted: #A3AED3;          /* 7.9:1 on surface */
  --text-subtle: #8A96BF;         /* 5.7:1 on surface */
  --text-inverse: #070B1A;

  --accent: #3BE3F5;
  --accent-hover: #7BEEFA;
  --accent-contrast: #032029;
  --accent-soft: rgba(59, 227, 245, .13);
  --accent-text: #5FEAF8;
  --accent-vivid: #3BE3F5;
  --accent-2: #A9A4FF;
  --accent-2-soft: rgba(139, 132, 255, .16);
  --accent-2-vivid: #8B84FF;

  --positive: #3FE0A0;   --positive-soft: rgba(63, 224, 160, .13);   --positive-vivid: #34D399;
  --negative: #FF8099;   --negative-soft: rgba(255, 128, 153, .13);  --negative-vivid: #FB6F8A;
  --warning:  #FFC766;   --warning-soft: rgba(255, 199, 102, .13);   --warning-vivid: #FBBF24;
  --info:     #8DBEFF;   --info-soft: rgba(96, 165, 250, .15);       --info-vivid: #60A5FA;

  --chart-1: #818CF8;
  --chart-2: #38BDF8;
  --chart-3: #34D399;
  --chart-4: #C084FC;
  --chart-5: #FBBF24;
  --chart-6: #F472B6;
  --chart-1-soft: rgba(129, 140, 248, .16);
  --chart-2-soft: rgba(56, 189, 248, .15);
  --chart-3-soft: rgba(52, 211, 153, .14);
  --chart-4-soft: rgba(192, 132, 252, .15);
  --chart-5-soft: rgba(251, 191, 36, .14);
  --chart-6-soft: rgba(244, 114, 182, .15);
  --chart-grid: rgba(146, 166, 255, .10);
  --chart-zero: rgba(146, 166, 255, .26);
  --chart-axis: #8A96BF;
  --chart-muted: #56628C;
  --chart-area-top: rgba(129, 140, 248, .26);

  --track: rgba(146, 166, 255, .14);
  --focus-ring: 0 0 0 2px #070B1A, 0 0 0 4px #3BE3F5;
  --focus-color: #3BE3F5;

  --shadow-1: 0 1px 2px rgba(0, 0, 0, .35);
  --shadow-2: 0 12px 32px -14px rgba(0, 0, 0, .7);
  --shadow-3: 0 30px 80px -20px rgba(0, 0, 0, .85), 0 0 0 1px rgba(146, 166, 255, .14);
  --inner-highlight: inset 0 1px 0 rgba(255, 255, 255, .05);
  --nav-bg: rgba(10, 15, 34, .9);
  --nav-solid: #0A0F22;
  --nav-active-bg: rgba(59, 227, 245, .12);
  --topbar-bg: rgba(7, 11, 26, .72);
  --toast-bg: #1B2650;
  --toast-text: #F3F6FF;
  --toast-muted: #A3AED3;
  --toast-accent: #5FEAF8;
  --toast-ok: #3FE0A0;
  --toast-err: #FF8099;
  --toast-border: rgba(146, 166, 255, .26);
  /* The hero gets a coloured glow in dark so it lifts off the navy canvas */
  --seg-active: #27346B;
  --knob: #EEF1FF;
  --on-vivid: #070B1A;
  --danger-fill: #D12F52;  /* white text 5:1 — decisive, not candy pink */
  --danger-fill-hover: #B9264A;
  --on-danger: #FFFFFF;
  --hero-shadow-theme: 0 28px 70px -24px rgba(91, 80, 255, .7), 0 0 0 1px rgba(146, 166, 255, .18), 0 10px 40px -12px rgba(14, 165, 183, .45);
}

/* ---------- Phone: no backdrop blur on cards (performance) ---------- */
@media (max-width: 760px) {
  :root, [data-theme="light"], [data-theme="dark"] {
    --card-blur: none;
    --gutter: 16px;
    --gap-grid: 14px;
    --fs-h1: 24px;
    --topbar-h: 56px;
  }
  [data-theme="dark"] { --card-bg: #111A38; }
}
@media (min-width: 761px) and (max-width: 1100px) {
  :root { --gutter: 24px; --gap-grid: 16px; --sidebar-w: 216px; }
}

/* ---------- Reduced motion: every duration is zero ---------- */
@media (prefers-reduced-motion: reduce) {
  :root {
    --dur-fast: 0ms; --dur-base: 0ms; --dur-slow: 0ms; --dur-sheet: 0ms;
  }
}

/* ============================================================
   Ofek 4.0 — base: reset, typography, page canvas and the app frame
   (sidebar, top bar, sub-tabs, page heading, bottom nav, "more" sheet),
   utilities, privacy mode and the responsive frame.
   Tokens only; logical properties only.
   ============================================================ */

/* ---------- Reset ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-padding-top: calc(var(--topbar-h) + var(--sp-4)); }
html, body { margin: 0; }
body {
  min-height: 100vh;
  min-height: 100dvh;
  font-family: var(--font-sans);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  font-weight: var(--fw-regular);
  color: var(--text);
  background-color: var(--bg);
  background-image: var(--bg-decor);
  background-attachment: fixed;
  background-repeat: no-repeat;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
h1, h2, h3, h4, p, figure, blockquote, dl, dd { margin: 0; }
h1, h2, h3, h4 { font-weight: var(--fw-bold); line-height: var(--lh-h2); text-wrap: balance; }
h1 { font-size: var(--fs-h1); line-height: var(--lh-h1); font-weight: var(--fw-h1); letter-spacing: var(--tracking-tight); }
h2 { font-size: var(--fs-h2); }
h3 { font-size: var(--fs-h3); }
p { line-height: 1.6; }
small { font-size: var(--fs-micro); line-height: var(--lh-micro); }
b, strong { font-weight: var(--fw-bold); }
a { color: var(--accent-text); text-decoration-thickness: 1px; text-underline-offset: 3px; }
img, svg, video, canvas { max-width: 100%; }
svg { flex-shrink: 0; vertical-align: middle; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
/* No native button chrome: :where() keeps specificity at zero, so every class rule still wins */
:where(button) { background: none; border: 0; padding: 0; border-radius: 0; }
button:disabled { cursor: not-allowed; }
summary { cursor: pointer; }
hr { border: 0; border-block-start: 1px solid var(--border); margin-block: var(--sp-4); }
::selection { background: var(--accent-soft); color: var(--text); }

/* Amounts: every amount is rendered inside an element with dir="ltr" */
[dir="ltr"] { font-variant-numeric: tabular-nums lining-nums; font-feature-settings: var(--num-features); }
input[dir="ltr"], textarea[dir="ltr"] { text-align: end; }

/* Focus: one ring everywhere (outline follows the border radius; works on SVG too) */
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--focus-color); outline-offset: 2px; }

/* Thin, quiet scrollbars */
* { scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }

/* ---------- Utilities ---------- */
.muted { color: var(--text-muted); }
.small { font-size: var(--fs-small); line-height: var(--lh-small); }
.positive { color: var(--positive); }
.negative { color: var(--negative); }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); min-width: 0; }
.actions { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-2); }
.two-columns { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap-grid); align-items: start; }
.two-columns > * { min-width: 0; }
.three-metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--gap-grid); }
.three-metrics > * { min-width: 0; }
.visually-hidden {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0;
}
.eyebrow {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: var(--fs-micro); line-height: var(--lh-micro); font-weight: var(--fw-bold);
  color: var(--text-subtle); letter-spacing: .01em;
}
.eyebrow svg { color: var(--accent-text); }
.all-clear {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-4); border-radius: var(--r-md);
  background: var(--positive-soft); color: var(--text);
}
.all-clear > svg { color: var(--positive); flex: none; }
.all-clear b { display: block; font-size: var(--fs-small); font-weight: var(--fw-bold); }
.all-clear small { display: block; color: var(--text-muted); font-size: var(--fs-micro); margin-block-start: 2px; }

/* ---------- App frame ---------- */
.app-shell { min-height: 100vh; min-height: 100dvh; }

.skip-link {
  position: fixed; inset-block-start: -80px; inset-inline-start: var(--sp-4); z-index: 1000;
  padding: var(--sp-3) var(--sp-4); border-radius: var(--r-sm);
  background: var(--accent); color: var(--accent-contrast); font-weight: var(--fw-bold); text-decoration: none;
  box-shadow: var(--shadow-3); transition: inset-block-start var(--dur-fast) var(--ease-out);
}
.skip-link:focus, .skip-link:focus-visible { inset-block-start: var(--sp-3); }

/* Sidebar (desktop and tablet) */
.sidebar {
  position: fixed; inset-block: 0; inset-inline-start: 0; z-index: 30;
  width: var(--sidebar-w);
  display: flex; flex-direction: column; gap: var(--sp-1);
  padding: var(--sp-5) var(--sp-4) var(--sp-4);
  background: var(--nav-bg);
  -webkit-backdrop-filter: blur(20px) saturate(140%);
  backdrop-filter: blur(20px) saturate(140%);
  border-inline-end: 1px solid var(--border);
  overflow-y: auto; overscroll-behavior: contain;
}
.brand { display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-1) var(--sp-2) var(--sp-6); flex: none; }
.brand-svg { display: block; border-radius: 10px; box-shadow: var(--hero-shadow); }
.brand b { display: block; font-size: 22px; line-height: 1.1; font-weight: var(--fw-black); letter-spacing: var(--tracking-tight); }
.brand small { display: block; margin-block-start: 3px; font-size: var(--fs-micro); color: var(--text-subtle); }

.hub-nav { display: flex; flex-direction: column; gap: var(--sp-1); flex: none; }
.hub-item {
  position: relative; display: flex; align-items: center; gap: var(--sp-3);
  width: 100%; min-height: 46px; padding: 0 var(--sp-3);
  border: 0; border-radius: var(--r-md); background: transparent;
  color: var(--text-muted); font-size: var(--fs-body); font-weight: var(--fw-semibold); text-align: start;
  transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}
.hub-item svg { color: var(--text-subtle); transition: color var(--dur-fast) var(--ease-out); }
.hub-item span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hub-item:hover { background: var(--hover); color: var(--text); }
.hub-item:hover svg { color: var(--text); }
.hub-item.active { background: var(--nav-active-bg); color: var(--text); font-weight: var(--fw-bold); }
.hub-item.active svg { color: var(--accent-text); }
.hub-item.active::before {
  content: ""; position: absolute; inset-inline-start: calc(-1 * var(--sp-4)); inset-block: 11px; width: 4px;
  border-start-end-radius: 4px; border-end-end-radius: 4px; background: var(--accent);
}

.sidebar-ai {
  margin-block-start: auto; flex: none;
  display: flex; align-items: center; gap: var(--sp-3);
  width: 100%; padding: var(--sp-3); text-align: start;
  border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--border));
  border-radius: var(--r-lg);
  background: linear-gradient(135deg, var(--accent-soft), var(--accent-2-soft));
  color: var(--text);
  transition: border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
}
.sidebar-ai > svg {
  width: 38px; height: 38px; padding: 10px; border-radius: 12px; flex: none;
  background: var(--brand-gradient); color: var(--on-hero); box-shadow: var(--shadow-1);
}
.sidebar-ai b { display: block; font-size: var(--fs-small); font-weight: var(--fw-bold); }
.sidebar-ai small { display: block; margin-block-start: 1px; font-size: var(--fs-micro); color: var(--text-muted); line-height: 1.4; }
.sidebar-ai:hover { border-color: var(--accent); }

.sidebar-bottom { display: flex; flex-direction: column; gap: var(--sp-1); margin-block-start: var(--sp-3); flex: none; }
.local-status {
  display: flex; align-items: center; gap: 6px; min-height: 28px;
  padding: 0 var(--sp-3); font-size: var(--fs-micro); color: var(--text-subtle);
}
.local-status svg { color: var(--positive); }
.local-status span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.profile {
  display: flex; align-items: center; gap: var(--sp-3);
  width: 100%; padding: var(--sp-2) var(--sp-3); margin-block-start: var(--sp-1);
  border: 1px solid var(--border); border-radius: var(--r-md);
  background: var(--surface-2); color: var(--text); text-align: start;
  transition: border-color var(--dur-fast) var(--ease-out);
}
.profile:hover { border-color: var(--border-strong); }
.profile > div { flex: 1; min-width: 0; }
.profile b { display: block; font-size: var(--fs-small); font-weight: var(--fw-bold); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.profile small { display: block; font-size: var(--fs-micro); color: var(--text-muted); }
.avatar, .top-avatar {
  display: inline-grid; place-items: center; flex: none;
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--brand-gradient); color: var(--on-hero);
  font-size: 15px; font-weight: var(--fw-black); line-height: 1;
}

/* Command palette (dialog body; features.js) */
.palette { display: flex; flex-direction: column; gap: var(--sp-3); }
.palette-input {
  display: flex; align-items: center; gap: var(--sp-2);
  min-height: 52px; padding-inline: var(--sp-3) 4px;
  border: 1px solid var(--border-strong); border-radius: var(--r-md); background: var(--surface);
  transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
}
.palette-input:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.palette-input > svg { flex: none; color: var(--text-subtle); }
.palette-input input { /* !important: the global input rule's :not() chain is (0,6,1) */
  flex: 1; min-width: 0; min-height: 48px !important; padding: 0 !important;
  border: 0 !important; box-shadow: none !important; background: transparent !important; font-size: 16px;
}
.palette-input .icon-button { flex: none; }
.palette-results { display: flex; flex-direction: column; gap: 2px; max-height: min(52vh, 420px); overflow: auto; overscroll-behavior: contain; }
.palette-results:empty { display: none; }
.palette-item {
  display: flex; align-items: center; gap: var(--sp-3); width: 100%;
  min-height: var(--touch); padding: var(--sp-2) var(--sp-3);
  border: 0; border-radius: var(--r-md); background: none;
  color: var(--text); text-align: start;
  transition: background var(--dur-fast) var(--ease-out);
}
.palette-item > svg { flex: none; color: var(--text-subtle); }
.palette-item > span { flex: 1; min-width: 0; }
.palette-item b { display: block; font-size: var(--fs-small); font-weight: var(--fw-bold); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palette-item small { display: block; margin-block-start: 1px; font-size: var(--fs-micro); color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.palette-item:hover { background: var(--hover); }
.palette-item.active { background: var(--accent-soft); }
.palette-item.active > svg { color: var(--accent-text); }
.palette-item.accent > svg:first-child { color: var(--accent-2); }
.palette-item:focus-visible { outline-offset: -2px; }
.palette-empty { padding: var(--sp-4) var(--sp-2); font-size: var(--fs-small); line-height: 1.6; }
.palette-foot {
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px var(--sp-4);
  padding-block-start: var(--sp-3); border-block-start: 1px solid var(--border);
  font-size: var(--fs-micro); color: var(--text-subtle);
}
.palette-foot > span { display: inline-flex; align-items: center; gap: 4px; }
.palette-foot > span:last-child { flex-basis: 100%; color: var(--text-muted); }
.palette-foot > span:last-child > svg { color: var(--accent-2); }
.palette-foot kbd { margin-inline-end: 2px; }

/* Main column */
.main-shell { margin-inline-start: var(--sidebar-w); min-width: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }

/* Top bar */
.topbar {
  position: sticky; inset-block-start: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4);
  min-height: var(--topbar-h); padding-inline: var(--gutter);
  background: var(--topbar-bg);
  -webkit-backdrop-filter: blur(16px) saturate(140%);
  backdrop-filter: blur(16px) saturate(140%);
  border-block-end: 1px solid var(--border);
}
.topbar-start { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
.topbar .topbar-menu, .topbar-brand { display: none; }
.topbar-brand .brand-svg { box-shadow: none; border-radius: 8px; }
.breadcrumb { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: var(--fs-small); color: var(--text-muted); white-space: nowrap; }
.breadcrumb > span { overflow: hidden; text-overflow: ellipsis; }
.breadcrumb > svg { color: var(--text-subtle); }
.breadcrumb > b { color: var(--text); font-size: var(--fs-body); font-weight: var(--fw-bold); overflow: hidden; text-overflow: ellipsis; }
.topbar-actions { display: flex; align-items: center; gap: var(--sp-2); flex: none; }
.topbar-actions .icon-button {
  width: 40px; height: 40px;
  border-color: var(--border); background: var(--card-bg); color: var(--text-muted);
}
.topbar-actions .icon-button:hover { color: var(--text); background: var(--surface-2); }
.topbar .fx-chip {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 36px; padding: 0 var(--sp-3) 0 var(--sp-2); padding-inline: var(--sp-2) var(--sp-3);
  border-radius: var(--r-pill); background: var(--accent-soft); color: var(--text);
  font-size: var(--fs-small); font-weight: var(--fw-semibold); white-space: nowrap;
  margin-inline-end: var(--sp-1);
}
.topbar .fx-chip > svg { color: var(--accent-text); }
.topbar .fx-chip b { font-weight: var(--fw-black); }
.topbar .fx-chip i {
  font-style: normal; font-size: 11px; font-weight: var(--fw-bold); color: var(--accent-text);
  padding: 1px 7px; border-radius: var(--r-pill); background: var(--surface); border: 1px solid var(--border);
}
.palette-trigger {
  display: inline-flex; align-items: center; gap: var(--sp-2);
  min-width: 250px; min-height: 40px; padding-inline: var(--sp-3) 6px;
  border: 1px solid var(--border); border-radius: var(--r-pill);
  background: var(--card-bg); color: var(--text-subtle); font-size: var(--fs-small);
  transition: border-color var(--dur-fast) var(--ease-out);
}
.palette-trigger > span { flex: 1; text-align: start; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.palette-trigger:hover { border-color: var(--border-strong); color: var(--text-muted); }
.alerts-button { position: relative; }
.alerts-dot {
  position: absolute; inset-block-start: -3px; inset-inline-end: -3px;
  min-width: 18px; height: 18px; padding: 0 5px; border-radius: var(--r-pill);
  background: var(--negative-vivid); color: var(--on-vivid);
  font-size: 11px; font-weight: var(--fw-black); line-height: 18px; text-align: center;
  font-variant-numeric: tabular-nums; box-shadow: 0 0 0 2px var(--bg);
}
.top-avatar { border: 0; padding: 0; width: 40px; height: 40px; margin-inline-start: var(--sp-1); }
.top-avatar:hover { filter: brightness(1.06); }

/* Content column */
main {
  flex: 1; width: 100%; max-width: calc(var(--content-max) + 2 * var(--gutter));
  margin-inline: auto; padding: var(--sp-6) var(--gutter) 0;
  display: flex; flex-direction: column; min-width: 0;
}

/* Sub-tabs inside a hub */
.subtabs {
  display: flex; gap: var(--sp-1); margin-block: calc(-1 * var(--sp-2)) var(--sp-5);
  border-block-end: 1px solid var(--border);
  overflow-x: auto; scrollbar-width: none; overscroll-behavior-x: contain;
}
.subtabs::-webkit-scrollbar { display: none; }
.subtab {
  position: relative; flex: none;
  display: inline-flex; align-items: center; gap: 7px;
  min-height: var(--touch); padding: 0 var(--sp-3);
  border: 0; background: none; color: var(--text-muted);
  font-size: var(--fs-small); font-weight: var(--fw-semibold); white-space: nowrap;
  transition: color var(--dur-fast) var(--ease-out);
}
.subtab svg { color: var(--text-subtle); }
.subtab:hover { color: var(--text); }
.subtab.active { color: var(--text); font-weight: var(--fw-bold); }
.subtab.active svg { color: var(--accent-text); }
.subtab.active::after {
  content: ""; position: absolute; inset-inline: var(--sp-2); inset-block-end: -1px; height: 3px;
  border-radius: 3px 3px 0 0; background: var(--accent);
}
.subtab:focus-visible { outline-offset: -3px; border-radius: var(--r-sm); }

/* Page heading */
.page-heading {
  display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap;
  gap: var(--sp-3) var(--sp-4); margin-block-end: var(--sp-5);
}
.page-heading > div:first-child { min-width: 0; }
.page-heading p { margin-block-start: var(--sp-1); font-size: var(--fs-small); color: var(--text-muted); }
.greeting { font-size: var(--fs-small); font-weight: var(--fw-semibold); color: var(--text-muted); margin-block-end: 2px; }
.home-heading h1 { font-size: calc(var(--fs-h1) + 2px); }
.heading-actions { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-2); }
.month-picker {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 40px; padding-inline: var(--sp-3) var(--sp-2);
  border: 1px solid var(--border); border-radius: var(--r-pill);
  background: var(--card-bg); color: var(--text-subtle); cursor: pointer;
}
.month-picker:hover { border-color: var(--border-strong); }
.month-picker:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.month-picker select {
  width: auto; min-height: 36px; padding-block: 0; padding-inline: 2px 24px;
  background-position: left 4px center, left 10.5px center;
  border: 0; background-color: transparent; box-shadow: none;
  color: var(--text); font-size: var(--fs-small); font-weight: var(--fw-semibold);
}
.month-picker select:focus, .month-picker select:focus-visible { box-shadow: none; outline: none; }

/* Demo banner */
.demo-banner {
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
  margin-block-end: var(--sp-5); padding: var(--sp-2) var(--sp-2) var(--sp-2) var(--sp-4);
  padding-inline: var(--sp-4) var(--sp-2);
  border: 1px solid color-mix(in srgb, var(--accent-2) 22%, var(--border));
  border-radius: var(--r-md); background: var(--accent-2-soft);
  font-size: var(--fs-small); color: var(--text);
}
.demo-banner > span { display: flex; align-items: center; gap: var(--sp-2); min-width: 0; }
.demo-banner > span > svg { color: var(--accent-2); }
.demo-banner button {
  display: inline-flex; align-items: center; gap: 4px; flex: none;
  min-height: 34px; padding: 0 var(--sp-3); border: 0; border-radius: var(--r-pill);
  background: var(--surface); color: var(--accent-2); font-size: var(--fs-small); font-weight: var(--fw-bold);
  white-space: nowrap; box-shadow: var(--shadow-1);
}
.demo-banner button:hover { background: var(--surface-2); }
main > .notice { margin-block-end: var(--sp-4); }

@property --subtabs-fade { syntax: "<length>"; inherits: false; initial-value: 36px; }
@keyframes subtabs-fade { 0%, 92% { --subtabs-fade: 36px; } 100% { --subtabs-fade: 0px; } }

/* Page content + entrance (navigation only) */
.page-content { display: flex; flex-direction: column; gap: var(--gap-grid); min-width: 0; }
.page-content.enter { animation: page-enter var(--dur-slow) var(--ease-out) both; }
@keyframes page-enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Footer */
.app-footer {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4);
  padding-block: var(--sp-8) var(--sp-6); font-size: var(--fs-micro); color: var(--text-subtle);
}
.app-footer > span { display: inline-flex; align-items: center; gap: 6px; }
.app-footer svg { color: var(--positive); }

/* Bottom nav (phone only) */
.bottom-nav { display: none; }

/* "More" sheet (all pages) */
.more-sheet { display: flex; flex-direction: column; gap: var(--sp-5); }
.more-group h3 { margin-block-end: var(--sp-2); font-size: var(--fs-micro); font-weight: var(--fw-bold); color: var(--text-subtle); }
.more-tiles { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--sp-2); }
.more-tile {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  min-height: 78px; padding: var(--sp-3) var(--sp-1);
  border: 1px solid var(--border); border-radius: var(--r-md);
  background: var(--surface-2); color: var(--text);
  font-size: var(--fs-micro); font-weight: var(--fw-semibold); line-height: 1.25; text-align: center;
  transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
}
.more-tile svg { color: var(--accent-text); }
.more-tile:hover { border-color: var(--border-strong); background: var(--surface-3); }
.more-tile:active { transform: scale(.97); }
/* A group with one tile (Claude): one full-width row instead of an orphan */
.more-tile:only-child { grid-column: 1 / -1; flex-direction: row; min-height: 56px; gap: var(--sp-2); font-size: var(--fs-small); }
.more-tile.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); font-weight: var(--fw-bold); }

/* ---------- Privacy mode: blur amounts, hover/focus reveals ---------- */
html.privacy main [dir="ltr"]:not(input):not(textarea):not(.chart):not(.donut):not(.chart *),
html.privacy .hero-balance, html.privacy .metric-value, html.privacy .widget-number, html.privacy .large-number,
html.privacy .donut-center b, html.privacy .chart svg text, html.privacy .net-value, html.privacy .budget-big b,
html.privacy .safe-number, html.privacy .score-ring + b, html.privacy .topbar .fx-chip b {
  filter: blur(7px); transition: filter var(--dur-base) var(--ease-out);
}
html.privacy main [dir="ltr"]:not(input):not(textarea):hover, html.privacy .hero-balance:hover,
html.privacy .metric-value:hover, html.privacy .widget-number:hover, html.privacy .large-number:hover,
html.privacy .donut-center b:hover, html.privacy .net-value:hover, html.privacy .budget-big b:hover,
html.privacy .safe-number:hover { filter: none; }

/* ---------- Tablet (761–1100) ---------- */
@media (max-width: 1100px) {
  .sidebar { padding-inline: var(--sp-3); }
  .hub-item.active::before { inset-inline-start: calc(-1 * var(--sp-3)); }
  .sidebar-ai small { display: none; }
  .palette-trigger { min-width: 0; }
  .palette-trigger > span { display: none; }
  .topbar .fx-chip i { display: none; }
  .two-columns .form-grid { grid-template-columns: minmax(0, 1fr); }
  .more-tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 900px) and (min-width: 761px) {
  .two-columns { grid-template-columns: minmax(0, 1fr); }
  .topbar .fx-chip > span { display: none; }
}

/* ---------- Phone (≤ 760) ---------- */
@media (max-width: 760px) {
  body { background-attachment: scroll; background-size: 100% 900px; }
  /* Hidden but still rendered: the brand SVG gradient (#ofek-brand) lives in the sidebar
     and the top-bar mark references it. */
  .sidebar { visibility: hidden; pointer-events: none; transform: translateX(110%); }
  .sidebar:dir(ltr) { transform: translateX(-110%); }
  .main-shell { margin-inline-start: 0; }

  .topbar { gap: var(--sp-2); padding-inline: var(--sp-3) var(--sp-3); }
  .topbar-start { gap: var(--sp-1); }
  .topbar .topbar-menu { display: inline-grid; border-color: transparent; background: transparent; width: var(--touch); height: var(--touch); color: var(--text); }
  .topbar-brand { display: inline-flex; margin-inline-end: var(--sp-1); }
  .breadcrumb > span, .breadcrumb > svg { display: none; }
  .breadcrumb > b { font-size: 17px; }
  .topbar-actions { gap: var(--sp-1); }
  .topbar .fx-chip,
  .topbar-actions > [data-action="theme-toggle"],
  .topbar-actions > [data-action="privacy"] { display: none; }
  .topbar-actions .icon-button, .palette-trigger { width: var(--touch); height: var(--touch); }
  .topbar-actions .icon-button { border-color: transparent; background: transparent; }
  .palette-trigger { min-width: 0; padding: 0; justify-content: center; border-color: transparent; background: transparent; color: var(--text); }
  .palette-trigger > span, .palette-trigger > kbd { display: none; }
  /* 36px disc inside a 44px target */
  .top-avatar { width: var(--touch); height: var(--touch); padding: 4px; margin-inline-start: 0; background-clip: content-box; }

  main { padding: var(--sp-4) var(--gutter) calc(var(--bottomnav-h) + var(--safe-bottom) + var(--sp-4)); }

  .subtabs {
    margin-inline: calc(-1 * var(--gutter)); margin-block: calc(-1 * var(--sp-2)) var(--sp-4);
    padding-inline: var(--gutter);
    /* Fade at the inline end (left in RTL) only while more tabs hide there */
    -webkit-mask-image: linear-gradient(to right, transparent 0, var(--mask-solid) var(--subtabs-fade, 36px));
    mask-image: linear-gradient(to right, transparent 0, var(--mask-solid) var(--subtabs-fade, 36px));
  }
  .subtabs:dir(ltr) {
    -webkit-mask-image: linear-gradient(to left, transparent 0, var(--mask-solid) var(--subtabs-fade, 36px));
    mask-image: linear-gradient(to left, transparent 0, var(--mask-solid) var(--subtabs-fade, 36px));
  }
  .subtabs.at-end { -webkit-mask-image: none; mask-image: none; }
  @supports (animation-timeline: scroll()) {
    /* No overflow → inactive timeline → no fade; scrolled to the end → fade gone */
    .subtabs { --subtabs-fade: 0px; animation: subtabs-fade linear both; animation-timeline: scroll(self inline); }
  }
  .subtab { padding: 0 var(--sp-3); }
  /* A late tab (4th+) may sit past the inline end: open the strip scrolled to it */
  .subtabs { scroll-padding-inline: var(--gutter); }
  .subtab.active:nth-child(n+4) { scroll-initial-target: nearest; scroll-snap-align: end; }

  .page-heading { align-items: flex-end; flex-wrap: nowrap; margin-block-end: var(--sp-4); }
  .page-heading p { font-size: var(--fs-micro); }
  .home-heading h1 { font-size: var(--fs-h1); }
  .heading-actions { flex-wrap: nowrap; flex: none; }
  .heading-actions .button.primary { display: none; }
  .heading-actions .button.home-customize { min-height: var(--touch); width: var(--touch); padding: 0; }
  .heading-actions .button.home-customize span { display: none; }
  .month-picker { min-height: var(--touch); padding-inline: var(--sp-2) 4px; }
  .month-picker select { min-height: 42px; }
  .month-picker > svg { display: none; }
  .month-picker select { font-size: var(--fs-micro); max-width: 132px; }

  .demo-banner { align-items: center; padding-inline: var(--sp-3) 6px; font-size: var(--fs-micro); line-height: 1.45; }
  .demo-banner > span > svg { display: none; }
  .demo-banner button { position: relative; min-height: 38px; font-size: var(--fs-micro); padding: 0 var(--sp-3); }
  .demo-banner button::after { content: ""; position: absolute; inset: -4px -2px; }
  .demo-banner button svg { display: none; }

  .two-columns { grid-template-columns: minmax(0, 1fr); }
  /* Three metrics: a calm 2+1, never a tall stack */
  .three-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-3); }
  .three-metrics > :last-child:nth-child(odd) { grid-column: 1 / -1; }
  .card .actions > .button, .card .form-actions > .button { flex: 1 1 auto; }
  /* A card header's button group: an even 2-up grid, the primary action first */
  .card .section-head > .actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); width: 100%; flex-basis: 100%; }
  .card .section-head > .actions > .button.primary { order: -1; }
  .card .section-head > .actions > :not(.button) { grid-column: 1 / -1; }

  .app-footer { flex-direction: column; align-items: flex-start; padding-block: var(--sp-6) 0; }

  .bottom-nav {
    position: fixed; inset-inline: 0; inset-block-end: 0; z-index: 25;
    display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: start;
    height: calc(var(--bottomnav-h) + var(--safe-bottom));
    padding: 6px var(--sp-1) var(--safe-bottom);
    background: var(--nav-solid);
    border-block-start: 1px solid var(--border);
  }
  .bottom-tab {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    min-width: 0; min-height: 54px; padding: 0 2px;
    border: 0; border-radius: var(--r-md); background: none;
    color: var(--text-subtle); font-size: 11.5px; font-weight: var(--fw-semibold); line-height: 1.2;
  }
  .bottom-tab span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bottom-tab svg { transition: transform var(--dur-fast) var(--ease-out); }
  .bottom-tab:active svg { transform: scale(.9); }
  .bottom-tab.active { color: var(--text); font-weight: var(--fw-bold); }
  .bottom-tab.active svg { color: var(--accent-text); }
  .bottom-add {
    justify-self: center; margin-block-start: -24px;
    width: 60px; height: 60px; border: 0; border-radius: 22px;
    display: grid; place-items: center;
    background: var(--hero-gradient); color: var(--on-hero);
    box-shadow: var(--hero-shadow), 0 0 0 5px var(--nav-solid);
    transition: transform var(--dur-fast) var(--ease-out);
  }
  .bottom-add svg { stroke-width: 2.4; }
  .bottom-add:active { transform: scale(.95); }

  .palette-foot > span:not(:last-child) { display: none; } /* key hints mean nothing on touch */
  .palette-foot { padding-block-start: var(--sp-2); }
  .more-sheet { gap: var(--sp-4); }
  .more-tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .more-tile { min-height: 72px; padding: var(--sp-2) 2px; font-size: 11.5px; border-radius: var(--r-md); }
}
@media (max-width: 360px) {
  .topbar-brand { display: none; }
  .bottom-tab { font-size: 10.5px; }
}

/* ---------- Installed app ---------- */
@media (display-mode: standalone) { body { overscroll-behavior-y: none; } }

/* ---------- Reduced motion ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0ms !important; animation-delay: 0ms !important; transition-duration: 0ms !important; scroll-behavior: auto !important; }
  .page-content.enter { animation: none; }
  .subtabs { animation-duration: auto !important; } /* scroll-linked, not motion */
}

/* ============================================================
   Ofek 4.0 — shared components (rendered by the JS helpers in app.js and
   used on every page): card, section head, buttons, badges, pills,
   segmented control, forms, switch, notices, empty state, progress,
   metric, tables, icon tiles, modal / sheet, toast, kbd.
   Tokens only; logical properties only.
   ============================================================ */

/* ---------- Card ---------- */
.card {
  position: relative; min-width: 0;
  padding: var(--sp-5);
  background: var(--card-bg);
  -webkit-backdrop-filter: var(--card-blur);
  backdrop-filter: var(--card-blur);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-2), var(--inner-highlight);
  color: var(--text);
}
/* Dense list/table screens: no blur behind wide cards */
.card:has(.table-wrap) { -webkit-backdrop-filter: none; backdrop-filter: none; }
[data-theme="dark"] .card:has(.table-wrap) { background: var(--surface); }

.section-head {
  display: flex; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; gap: var(--sp-3);
  margin-block-end: var(--sp-4); min-width: 0;
}
.section-head > div:first-child { min-width: 0; flex: 1 1 200px; }
.section-head h2 { font-size: 17px; line-height: 1.35; font-weight: var(--fw-bold); }
.section-head p { margin-block-start: 2px; font-size: var(--fs-small); line-height: var(--lh-small); color: var(--text-muted); }
.section-head > .button, .section-head > .text-button, .section-head > .icon-button, .section-head > .badge { flex: none; }
.section-head > .actions, .section-head > .segmented { flex: 0 1 auto; min-width: 0; }

/* ---------- Buttons ---------- */
.button {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
  min-height: 42px; padding: 0 var(--sp-4);
  border: 1px solid var(--border-strong); border-radius: var(--r-pill);
  background: var(--surface); color: var(--text);
  font-size: var(--fs-small); font-weight: var(--fw-bold); line-height: 1.2; white-space: nowrap;
  text-decoration: none; cursor: pointer;
  transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out),
    color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
}
.button svg { flex: none; }
.button:hover { background: var(--surface-2); border-color: var(--border-strong); }
.button:active { transform: scale(.98); }
.button:disabled, .button[aria-disabled="true"] { opacity: .5; pointer-events: none; }
.button.primary {
  background: var(--accent); color: var(--accent-contrast); border-color: transparent; box-shadow: var(--shadow-1);
}
.button.primary:hover { background: var(--accent-hover); }
.button.danger { background: var(--negative-soft); color: var(--negative); border-color: transparent; }
.button.danger:hover { background: color-mix(in srgb, var(--negative) 20%, transparent); }
.button.ghost { background: transparent; border-color: transparent; color: var(--accent-text); }
.button.ghost:hover { background: var(--accent-soft); }
.button.big { min-height: 52px; padding: 0 var(--sp-6); font-size: 16px; }
.button.small { min-height: 34px; padding: 0 var(--sp-3); font-size: var(--fs-micro); }
.button.full, .form-grid > .button.full { width: 100%; }

.icon-button {
  display: inline-grid; place-items: center; flex: none; position: relative;
  width: 40px; height: 40px; padding: 0;
  border: 1px solid transparent; border-radius: var(--r-pill);
  background: transparent; color: var(--text-muted);
  transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
}
.icon-button:hover { background: var(--hover); color: var(--text); }
.icon-button:active { transform: scale(.94); }
.icon-button:disabled { opacity: .45; }

.text-button {
  display: inline-flex; align-items: center; gap: 3px;
  min-height: 32px; padding: 0 2px; border: 0; background: none;
  color: var(--accent-text); font-size: var(--fs-small); font-weight: var(--fw-semibold);
  white-space: nowrap; text-decoration: none; cursor: pointer;
}
.text-button:hover { text-decoration: underline; text-underline-offset: 3px; }
.text-button svg { flex: none; }

.pay-button {
  display: inline-flex; align-items: center; min-height: 32px; padding: 0 var(--sp-3);
  border: 1px solid color-mix(in srgb, var(--positive) 35%, transparent); border-radius: var(--r-pill);
  background: var(--positive-soft); color: var(--positive);
  font-size: var(--fs-micro); font-weight: var(--fw-bold); white-space: nowrap;
}
.pay-button:hover { border-color: var(--positive); }

/* ---------- Badges & pills ---------- */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  min-height: 24px; padding: 2px 9px; border-radius: var(--r-pill);
  font-size: var(--fs-micro); font-weight: var(--fw-bold); line-height: 1.3; white-space: nowrap;
  background: var(--positive-soft); color: var(--positive);
}
.badge svg { width: 13px; height: 13px; }
.badge.green  { background: var(--positive-soft);  color: var(--positive); }
.badge.red    { background: var(--negative-soft);  color: var(--negative); }
.badge.gold   { background: var(--warning-soft);   color: var(--warning); }
.badge.purple { background: var(--accent-2-soft);  color: var(--accent-2); }
.badge.blue   { background: var(--info-soft);      color: var(--info); }
.badge.neutral{ background: var(--surface-3);      color: var(--text-muted); }

.category-pill {
  display: inline-flex; align-items: center; max-width: 100%;
  min-height: 24px; padding: 2px 10px; border-radius: var(--r-pill);
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text-muted);
  font-size: var(--fs-micro); font-weight: var(--fw-semibold); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}

/* change (+2.3% ▲) — the helper in app.js; areas may restyle inside their own cards */
.change { display: inline-flex; align-items: center; gap: 4px; font-size: var(--fs-small); font-weight: var(--fw-bold); white-space: nowrap; }
.change.positive { color: var(--positive); }
.change.negative { color: var(--negative); }
.change.negative > svg { transform: scaleY(-1); }
.change > span { color: var(--text-muted); font-weight: var(--fw-medium); }

/* ---------- Segmented control ---------- */
.segmented {
  display: inline-flex; align-items: stretch; gap: 3px; max-width: 100%;
  padding: 4px; border-radius: var(--r-pill);
  background: var(--surface-2); border: 1px solid var(--border);
  overflow-x: auto; scrollbar-width: none;
}
.segmented::-webkit-scrollbar { display: none; }
.segmented > button {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex: none;
  min-height: 34px; padding: 0 var(--sp-4);
  border: 0; border-radius: var(--r-pill); background: transparent;
  color: var(--text-muted); font-size: var(--fs-small); font-weight: var(--fw-semibold); white-space: nowrap;
  transition: background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}
.segmented > button:hover { color: var(--text); }
.segmented > button.active, .segmented > button[aria-pressed="true"], .segmented > button[aria-selected="true"] {
  background: var(--seg-active); color: var(--text); font-weight: var(--fw-bold); box-shadow: var(--shadow-1);
}
.segmented > button:focus-visible { outline-offset: -2px; }
.segmented.mini { padding: 3px; }
.segmented.mini > button { min-height: 28px; padding: 0 var(--sp-3); font-size: var(--fs-micro); }
.segmented.full { display: flex; width: 100%; }
.segmented.full > button { flex: 1 1 0; min-height: 40px; font-size: var(--fs-body); }

/* ---------- Forms ---------- */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: var(--fs-small); font-weight: var(--fw-semibold); color: var(--text-muted); }
.field > small { font-size: var(--fs-micro); line-height: 1.5; color: var(--text-subtle); }

input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="file"]):not([type="color"]):not([type="hidden"]),
select, textarea {
  width: 100%; min-width: 0; min-height: var(--control-h);
  padding: 0 var(--sp-3);
  border: 1px solid var(--border-strong); border-radius: var(--r-md);
  background-color: var(--surface); color: var(--text);
  font-size: var(--fs-body); line-height: 1.4;
  transition: border-color var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out);
}
textarea { min-height: 88px; padding-block: 10px; line-height: 1.55; resize: vertical; }
select {
  -webkit-appearance: none; appearance: none; cursor: pointer;
  padding-inline-end: 36px;
  background-image:
    linear-gradient(45deg, transparent 38%, var(--text-subtle) 38% 62%, transparent 62%),
    linear-gradient(135deg, transparent 38%, var(--text-subtle) 38% 62%, transparent 62%);
  background-size: 7px 7px, 7px 7px;
  background-repeat: no-repeat;
  background-position: left 14px center, left 20.5px center;
}
select:dir(ltr) { background-position: right 20.5px center, right 14px center; }
select[multiple] { background-image: none; padding-block: var(--sp-2); }
input::placeholder, textarea::placeholder { color: var(--text-subtle); opacity: 1; }
input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="file"]):hover, select:hover, textarea:hover { border-color: color-mix(in srgb, var(--text-subtle) 55%, var(--border-strong)); }
input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="file"]):focus,
select:focus, textarea:focus {
  border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); outline: none;
}
input:disabled, select:disabled, textarea:disabled, input[readonly]:not([type="checkbox"]) {
  background-color: var(--surface-2); color: var(--text-muted); cursor: not-allowed;
}
input[readonly]:not([type="checkbox"]) { cursor: default; }
input[type="date"], input[type="month"], input[type="time"] { font-variant-numeric: tabular-nums; text-align: end; }
input[type="date"]::-webkit-date-and-time-value, input[type="month"]::-webkit-date-and-time-value { text-align: end; }
input[type="date"]::-webkit-datetime-edit, input[type="month"]::-webkit-datetime-edit { display: inline-flex; justify-content: flex-end; flex: 1; }
input[type="date"]::-webkit-datetime-edit-fields-wrapper, input[type="month"]::-webkit-datetime-edit-fields-wrapper { display: inline-flex; }
input[type="date"]::-webkit-calendar-picker-indicator { opacity: .6; cursor: pointer; }
[data-theme="dark"] input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
input[type="number"] { font-variant-numeric: tabular-nums; }
input[type="file"] { font-size: var(--fs-small); color: var(--text-muted); max-width: 100%; }
input[type="file"]::file-selector-button {
  margin-inline-end: var(--sp-3); min-height: 36px; padding: 0 var(--sp-3);
  border: 1px solid var(--border-strong); border-radius: var(--r-pill);
  background: var(--surface); color: var(--text); font: inherit; font-weight: var(--fw-bold); cursor: pointer;
}
input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }
input[type="radio"] { width: 18px; height: 18px; margin: 0; flex: none; accent-color: var(--accent); cursor: pointer; }
input[type="checkbox"]:not(.switch) {
  -webkit-appearance: none; appearance: none; position: relative; flex: none;
  width: 20px; height: 20px; margin: 0; border-radius: 6px;
  border: 1.5px solid var(--border-strong); background: var(--surface); cursor: pointer;
  transition: background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);
}
input[type="checkbox"]:not(.switch):hover { border-color: var(--accent); }
input[type="checkbox"]:not(.switch):checked { background: var(--accent); border-color: var(--accent); }
input[type="checkbox"]:not(.switch):checked::after {
  content: ""; position: absolute; inset-block-start: 2px; inset-inline-start: 5.5px;
  width: 5px; height: 10px; border: solid var(--accent-contrast); border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}
input[type="checkbox"]:not(.switch):indeterminate { background: var(--accent); border-color: var(--accent); }
input[type="checkbox"]:not(.switch):indeterminate::after {
  content: ""; position: absolute; inset: 0; margin: auto; width: 10px; height: 2px; background: var(--accent-contrast); border-radius: 1px;
}
input[type="checkbox"]:not(.switch):disabled { opacity: .45; cursor: not-allowed; }
input:user-invalid, select:user-invalid, textarea:user-invalid { border-color: var(--negative); }
input:user-invalid:focus, select:user-invalid:focus, textarea:user-invalid:focus { box-shadow: 0 0 0 3px var(--negative-soft); }

/* Shared input wrappers (app.js): search box with a leading icon, amount with a currency suffix.
   !important on padding: the global input rule's :not() chain outranks a wrapper selector. */
.search-field { position: relative; display: flex; align-items: center; min-width: 0; }
.search-field > svg { position: absolute; inset-inline-start: var(--sp-3); color: var(--text-subtle); pointer-events: none; }
.search-field > input { padding-inline-start: 40px !important; }
.currency-input { position: relative; display: flex; align-items: center; min-width: 0; }
.currency-input > input { padding-inline-end: 40px !important; text-align: end; font-variant-numeric: tabular-nums; }
.currency-input > span {
  position: absolute; inset-inline-end: var(--sp-3);
  color: var(--text-subtle); font-weight: var(--fw-bold); pointer-events: none;
}

.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-4); align-items: start; }
.form-grid > .full, .form-grid > .notice, .form-grid > .segmented, .form-grid > .form-error,
.form-grid > .check-field:last-child:nth-child(odd) { grid-column: 1 / -1; }
.full { grid-column: 1 / -1; }
.form-actions { display: flex; align-items: center; flex-wrap: wrap; gap: var(--sp-2); margin-block-start: var(--sp-5); }
/* Bare buttons placed straight after a form grid (settings) */
.form-grid ~ .button, .form-grid ~ .text-button { margin-block-start: var(--sp-4); margin-inline-end: var(--sp-2); }
.check-field {
  display: inline-flex; align-items: center; gap: 10px; min-height: var(--touch);
  font-size: var(--fs-small); font-weight: var(--fw-medium); color: var(--text); cursor: pointer;
}

/* Switch: <input type="checkbox" class="switch"> */
input.switch {
  -webkit-appearance: none; appearance: none;
  position: relative; flex: none; width: 46px; height: 28px; margin: 0;
  border: 0; border-radius: var(--r-pill); background: var(--track);
  box-shadow: inset 0 0 0 1px var(--border); cursor: pointer;
  transition: background var(--dur-base) var(--ease-out);
}
input.switch::before {
  content: ""; position: absolute; inset-block-start: 3px; inset-inline-start: 3px;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--knob); box-shadow: 0 1px 3px color-mix(in srgb, var(--text) 30%, transparent);
  transition: inset-inline-start var(--dur-base) var(--ease-spring), background var(--dur-base) var(--ease-out);
}
input.switch:checked { background: var(--accent); box-shadow: none; }
input.switch:checked::before { inset-inline-start: 21px; background: var(--accent-contrast); }
input.switch:disabled { opacity: .45; cursor: not-allowed; }
input.switch:focus-visible { outline: 2px solid var(--focus-color); outline-offset: 2px; }

.form-error {
  margin-block-end: var(--sp-3); padding: var(--sp-3) var(--sp-4); border-radius: var(--r-md);
  background: var(--negative-soft); color: var(--negative);
  font-size: var(--fs-small); font-weight: var(--fw-semibold);
}
.form-error:empty { display: none; }
/* A form that reports its error as a .notice already draws a box: do not draw a second one around it. */
.form-error:has(> .notice) { padding: 0; background: none; border: 0; box-shadow: none; }
#entity-error:empty { display: none; }
#entity-error > .notice { margin-block-end: var(--sp-4); }

/* ---------- Settings rows (label + help + control) and alert rows ---------- */
.notify-list, .alerts-list { display: flex; flex-direction: column; }
.notify-row {
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4);
  min-height: 56px; padding-block: var(--sp-3);
  border-block-start: 1px solid var(--border); cursor: pointer;
}
.notify-list > .notify-row:first-child { border-block-start: 0; padding-block-start: 0; }
.notify-row > span { flex: 1; min-width: 0; }
.notify-row b { display: block; font-size: var(--fs-small); font-weight: var(--fw-bold); color: var(--text); }
.notify-row small { display: block; margin-block-start: 2px; font-size: var(--fs-micro); line-height: 1.5; color: var(--text-muted); }
.notify-row:has(input:disabled) { cursor: not-allowed; }
.alerts-list { gap: var(--sp-1); margin-block-end: var(--sp-2); }
.alert-row {
  display: flex; align-items: center; gap: var(--sp-3); width: 100%;
  padding: var(--sp-3); border: 0; border-radius: var(--r-md); background: none;
  color: var(--text); text-align: start;
  transition: background var(--dur-fast) var(--ease-out);
}
.alert-row:hover { background: var(--hover); }
.alert-row > div { flex: 1; min-width: 0; }
.alert-row b { display: block; font-size: var(--fs-small); font-weight: var(--fw-bold); }
.alert-row small { display: block; margin-block-start: 2px; font-size: var(--fs-micro); line-height: 1.5; color: var(--text-muted); }
.alert-row > svg:last-child { flex: none; color: var(--text-subtle); }
.alert-row:focus-visible { outline-offset: -2px; }

/* ---------- Notice ---------- */
.notice {
  display: flex; align-items: flex-start; gap: 10px;
  padding: var(--sp-3) var(--sp-4); border-radius: var(--r-md);
  background: var(--info-soft); color: var(--text);
  border: 1px solid color-mix(in srgb, var(--info) 18%, transparent);
  font-size: var(--fs-small); line-height: 1.55;
}
.notice > svg { flex: none; margin-block-start: 1px; color: var(--info); }
.notice > span { min-width: 0; }
.notice.info { background: var(--info-soft); }
.notice.error   { background: var(--negative-soft); border-color: color-mix(in srgb, var(--negative) 22%, transparent); }
.notice.error > svg { color: var(--negative); }
.notice.success { background: var(--positive-soft); border-color: color-mix(in srgb, var(--positive) 22%, transparent); }
.notice.success > svg { color: var(--positive); }
.notice.warning { background: var(--warning-soft); border-color: color-mix(in srgb, var(--warning) 22%, transparent); }
.notice.warning > svg { color: var(--warning); }
.modal .notice { margin-block-end: var(--sp-4); }
.form-grid > .notice { margin: 0; }

/* ---------- Empty state ---------- */
.empty {
  display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--sp-2);
  padding: var(--sp-8) var(--sp-4);
}
.empty-icon {
  display: grid; place-items: center; width: 56px; height: 56px; margin-block-end: var(--sp-2);
  border-radius: 18px; background: var(--accent-soft); color: var(--accent-text);
}
.empty h3 { font-size: 16px; font-weight: var(--fw-bold); }
.empty p { max-width: 360px; font-size: var(--fs-small); color: var(--text-muted); }
.empty p:empty { display: none; }
.empty > .button, .empty > .actions { margin-block-start: var(--sp-2); }

/* ---------- Progress ---------- */
.progress { position: relative; height: 8px; border-radius: var(--r-pill); background: var(--track); overflow: hidden; }
.progress > span {
  display: block; height: 100%; max-width: 100%; border-radius: inherit; background: var(--accent-vivid);
  transition: width var(--dur-slow) var(--ease-out);
}
.progress.purple > span { background: var(--accent-2-vivid); }
.progress.green  > span { background: var(--positive-vivid); }
.progress.red    > span { background: var(--negative-vivid); }
.progress.gold   > span { background: var(--warning-vivid); }
.page-content.enter .progress > span { animation: bar-grow var(--dur-slow) var(--ease-out) both; transform-origin: right center; }
.page-content.enter .progress > span:dir(ltr) { transform-origin: left center; }
@keyframes bar-grow { from { transform: scaleX(.2); opacity: .4; } to { transform: none; opacity: 1; } }

/* ---------- Metric card ---------- */
.metric { display: flex; flex-direction: column; gap: 2px; }
.metric-top { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); min-width: 0; }
.metric-top > span:first-child { font-size: var(--fs-small); font-weight: var(--fw-semibold); color: var(--text-muted); min-width: 0; }
.metric-icon, .asset-icon {
  display: grid; place-items: center; flex: none;
  width: 38px; height: 38px; border-radius: 12px;
  background: var(--accent-soft); color: var(--accent-text);
}
.metric-icon svg, .asset-icon svg { width: 18px; height: 18px; }
.metric-icon.green,  .asset-icon.green  { background: var(--positive-soft); color: var(--positive); }
.metric-icon.purple, .asset-icon.purple { background: var(--chart-1-soft);  color: var(--accent-2); }
.metric-icon.gold,   .asset-icon.gold   { background: var(--warning-soft);  color: var(--warning); }
.metric-icon.red,    .asset-icon.red    { background: var(--negative-soft); color: var(--negative); }
.metric-icon.blue,   .asset-icon.blue   { background: var(--info-soft);     color: var(--info); }
.metric-icon.neutral,.asset-icon.neutral{ background: var(--surface-2);     color: var(--text-muted); }
.metric-value {
  width: fit-content; max-width: 100%; margin-block-start: var(--sp-3);
  font-family: var(--font-num); font-size: 26px; line-height: 1.15; font-weight: var(--fw-black);
  letter-spacing: var(--tracking-tight); overflow-wrap: anywhere;
}
.metric-detail { margin-block-start: var(--sp-1); font-size: var(--fs-small); color: var(--text-muted); min-height: 1lh; }
.metric-detail:empty { display: none; }
.large-number {
  width: fit-content; max-width: 100%;
  font-family: var(--font-num); font-size: 32px; line-height: 1.15; font-weight: var(--fw-black);
  letter-spacing: var(--tracking-tight);
}

/* Pace card (spending pace; features.js) */
.pace-numbers { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--sp-3); margin-block: var(--sp-3) var(--sp-3); }
.pace-numbers > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pace-numbers span { font-size: var(--fs-micro); color: var(--text-muted); font-weight: var(--fw-semibold); }
.pace-numbers b { width: fit-content; font-size: 22px; font-weight: var(--fw-black); letter-spacing: var(--tracking-tight); }
.pace-card .progress + .pace-marker { position: relative; height: 0; }
.pace-marker::before {
  content: ""; position: absolute; inset-inline-start: var(--at, 0%); inset-block-start: -12px;
  width: 2px; height: 16px; border-radius: 2px; background: var(--text); transform: translateX(50%);
}
.pace-card > p { margin-block-start: var(--sp-3); }

/* Goal details (label + value grid) */
.goal-details { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--sp-2); }
.goal-details > div {
  display: flex; flex-direction: column; gap: 2px; min-width: 0;
  padding: var(--sp-2) var(--sp-3); border-radius: var(--r-sm); background: var(--surface-2);
}
.goal-details span { font-size: var(--fs-micro); color: var(--text-subtle); }
.goal-details b { font-size: var(--fs-small); font-weight: var(--fw-bold); overflow-wrap: anywhere; }

/* ---------- Tables ---------- */
.table-wrap { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: var(--fs-small); text-align: start; white-space: nowrap; }
th {
  padding: var(--sp-2) var(--sp-3); text-align: start; vertical-align: bottom;
  font-size: var(--fs-micro); font-weight: var(--fw-bold); color: var(--text-subtle);
  border-block-end: 1px solid var(--border);
  background: var(--table-head-bg, var(--card-bg));
}
[data-theme="dark"] .card:has(.table-wrap) { --table-head-bg: var(--surface); }
thead th { position: sticky; inset-block-start: 0; z-index: 1; }
td { padding: var(--sp-3); vertical-align: middle; border-block-end: 1px solid var(--border); }
tbody tr:last-child td { border-block-end: 0; }
tbody tr { transition: background var(--dur-fast) var(--ease-out); }
tbody tr:hover td { background: var(--hover); }
th:first-child, td:first-child { padding-inline-start: var(--sp-2); }
th:last-child, td:last-child { padding-inline-end: var(--sp-2); }
td [dir="ltr"], td b[dir="ltr"] { font-family: var(--font-num); font-weight: var(--fw-bold); font-variant-numeric: tabular-nums; }
td small { color: var(--text-subtle); }
.table-actions { display: flex; align-items: center; gap: 2px; justify-content: flex-end; }
.table-actions button {
  min-height: 32px; padding: 0 var(--sp-2); border: 0; border-radius: var(--r-xs);
  background: none; color: var(--text-muted); font-size: var(--fs-micro); font-weight: var(--fw-semibold);
}
.table-actions button:hover { background: var(--hover); color: var(--accent-text); }
.table-actions button:last-child:hover { color: var(--negative); background: var(--negative-soft); }

.transaction-name { display: flex; align-items: center; gap: var(--sp-3); min-width: 0; }
.transaction-name > div { min-width: 0; }
.transaction-name b { display: block; font-size: var(--fs-small); font-weight: var(--fw-semibold); overflow: hidden; text-overflow: ellipsis; max-width: 280px; }
.transaction-name small { display: block; margin-block-start: 1px; font-size: var(--fs-micro); color: var(--text-subtle); overflow: hidden; text-overflow: ellipsis; max-width: 280px; }
.transaction-icon {
  display: grid; place-items: center; flex: none; width: 36px; height: 36px; border-radius: 11px;
  background: var(--surface-2); color: var(--text-muted);
}
.transaction-icon.green { background: var(--positive-soft); color: var(--positive); }
.ticker-icon {
  display: grid; place-items: center; flex: none; width: 38px; height: 38px; border-radius: 12px;
  background: var(--chart-1-soft); color: var(--chart-1);
  font-family: var(--font-num); font-size: 11px; font-weight: var(--fw-black); letter-spacing: .02em; direction: ltr;
}

/* ---------- Modal / sheet ---------- */
dialog.modal {
  width: min(520px, calc(100vw - 32px)); max-width: calc(100vw - 32px);
  max-height: calc(100dvh - 48px); overflow: auto; overscroll-behavior: contain;
  margin: auto; padding: var(--sp-6);
  border: 1px solid var(--border); border-radius: var(--r-xl);
  background: var(--elevated); color: var(--text);
  box-shadow: var(--shadow-3);
}
dialog.modal.wide { width: min(720px, calc(100vw - 32px)); }
dialog.modal[open] { animation: modal-in var(--dur-base) var(--ease-out); }
dialog.modal::backdrop {
  background: var(--scrim);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
@keyframes modal-in { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
.modal-head {
  position: relative; display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3);
  margin-block-end: var(--sp-5);
}
.modal-head h2 { font-size: 20px; line-height: 1.3; font-weight: var(--fw-black); letter-spacing: -0.01em; min-width: 0; }
.modal-head .icon-button { background: var(--surface-2); color: var(--text); }
.modal-head .icon-button:hover { background: var(--surface-3); }
.modal-head .icon-button:focus-visible { outline-offset: -2px; }
.modal-head .icon-button:focus:not(:focus-visible) { outline: none; }
/* showDialog focuses the dialog itself (or an [autofocus] title), so no ring lands on "close" */
dialog.modal:focus, dialog.modal .modal-head h2:focus { outline: none; }
.modal .form-actions { margin-block-start: var(--sp-6); }
.modal .form-actions .button.danger { background: var(--danger-fill); color: var(--on-danger); }
.modal .form-actions .button.danger:hover { background: var(--danger-fill-hover); }
.confirm-text { margin-block-end: var(--sp-2); font-size: var(--fs-body); line-height: 1.6; color: var(--text-muted); }

/* ---------- Toast ---------- */
.toast {
  position: fixed; inset-inline: 0; inset-block-end: var(--sp-6); z-index: 1000;
  width: fit-content; max-width: min(560px, calc(100vw - 32px)); margin-inline: auto;
  display: flex; align-items: center; gap: var(--sp-3);
  min-height: 52px; padding-block: 6px; padding-inline: var(--sp-4) 6px;
  border-radius: var(--r-lg); background: var(--toast-bg); color: var(--toast-text);
  border: 1px solid var(--toast-border); box-shadow: var(--shadow-3);
  font-size: var(--fs-small); font-weight: var(--fw-semibold); line-height: 1.4;
  animation: toast-in var(--dur-slow) var(--ease-out);
}
.toast > svg:first-child { flex: none; color: var(--toast-ok); }
.toast.error > svg:first-child { color: var(--toast-err); }
.toast > span { flex: 1; min-width: 0; }
.toast .icon-button { width: 36px; height: 36px; color: var(--toast-muted); }
.toast .icon-button:hover { background: color-mix(in srgb, var(--toast-text) 12%, transparent); color: var(--toast-text); }
.toast-undo {
  flex: none; min-height: 36px; padding: 0 var(--sp-3); border: 0; border-radius: var(--r-pill);
  background: color-mix(in srgb, var(--toast-accent) 14%, transparent); color: var(--toast-accent);
  font-size: var(--fs-small); font-weight: var(--fw-bold);
}
.toast-undo:hover { background: color-mix(in srgb, var(--toast-accent) 24%, transparent); }
/* Desktop: centre on the content column, not the viewport */
@media (min-width: 761px) { .toast { inset-inline-start: var(--sidebar-w); } }
@keyframes sheet-up { from { transform: translateY(48px); opacity: .5; } to { transform: none; opacity: 1; } }
@keyframes toast-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

/* ---------- kbd ---------- */
kbd {
  display: inline-flex; align-items: center; min-height: 22px; padding: 0 6px;
  border: 1px solid var(--border-strong); border-block-end-width: 2px; border-radius: 6px;
  background: var(--surface-2); color: var(--text-muted);
  font-family: var(--font-num); font-size: 11px; font-weight: var(--fw-bold); line-height: 1; direction: ltr; white-space: nowrap;
}

/* ---------- Tablet ---------- */
@media (max-width: 1100px) {
  .metric-value { font-size: 23px; }
}

/* ---------- Phone ---------- */
@media (max-width: 760px) {
  .card { padding: var(--sp-4); border-radius: 18px; }
  .section-head { margin-block-end: var(--sp-3); }
  .section-head h2 { font-size: 16px; }
  .button { min-height: var(--touch); }
  .button.small { min-height: 40px; }
  .icon-button { width: var(--touch); height: var(--touch); }
  /* Visible pill 38px; the hit area reaches into the track padding → ≥ 44px */
  .segmented > button { position: relative; min-height: 38px; }
  .segmented > button::after { content: ""; position: absolute; inset: -4px -1px; }
  .segmented.mini > button { min-height: 38px; }
  .segmented.mini > button::after { inset: -3px -1px; }
  .text-button, .pay-button, .table-actions button { min-height: var(--touch); }
  .form-grid ~ .button { display: flex; width: 100%; margin-inline-end: 0; margin-block-start: var(--sp-2); }
  .form-grid + .button { margin-block-start: var(--sp-4); }
  input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="file"]):not([type="color"]):not([type="hidden"]),
  select, textarea { font-size: 16px; } /* no iOS zoom on focus */
  .form-grid { grid-template-columns: minmax(0, 1fr); gap: var(--sp-3); }
  .form-actions > .button { flex: 1 1 auto; }
  .form-actions > .button.primary, .form-actions > button[type="submit"] { flex: 2 1 auto; }

  /* Three metrics, 2+1: the two half-width cards stack icon over label over value;
     the full-width third keeps the label + value with the icon at the side */
  .three-metrics .metric-top { flex-direction: column-reverse; align-items: flex-start; gap: var(--sp-2); }
  .three-metrics .metric-icon { width: 32px; height: 32px; border-radius: 10px; }
  .three-metrics .metric-icon svg { width: 16px; height: 16px; }
  .three-metrics .metric-value { margin-block-start: var(--sp-1); font-size: 22px; }
  .three-metrics .metric-detail { font-size: var(--fs-micro); }
  .three-metrics > .metric:last-child:nth-child(odd) { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: var(--sp-3); }
  .three-metrics > .metric:last-child:nth-child(odd) .metric-top { display: contents; }
  .three-metrics > .metric:last-child:nth-child(odd) .metric-top > span:first-child { grid-column: 1; grid-row: 1; }
  .three-metrics > .metric:last-child:nth-child(odd) .metric-icon { grid-column: 2; grid-row: 1 / span 3; width: 40px; height: 40px; border-radius: 12px; }
  .three-metrics > .metric:last-child:nth-child(odd) .metric-value { grid-column: 1; margin-block-start: 2px; }
  .three-metrics > .metric:last-child:nth-child(odd) .metric-detail { grid-column: 1; }
  .metric-value { font-size: 22px; }
  .large-number { font-size: 28px; }

  .transaction-name b, .transaction-name small { max-width: 190px; }

  /* Every dialog becomes a bottom sheet on phone */
  dialog.modal, dialog.modal.wide, dialog.modal.sheet {
    width: 100%; max-width: 100%; max-height: 92dvh;
    margin: auto 0 0; padding: var(--sp-5) var(--sp-4) calc(var(--sp-4) + var(--safe-bottom));
    border-radius: var(--r-xl) var(--r-xl) 0 0; border-block-end: 0; border-inline: 0;
  }
  dialog.modal[open] { animation: sheet-up var(--dur-sheet) var(--ease-out); }
  dialog.modal .modal-head { margin-block-end: var(--sp-4); }
  dialog.modal .modal-head::before {
    content: ""; position: absolute; inset-block-start: calc(-1 * var(--sp-3) - 1px); inset-inline: 0; margin-inline: auto;
    width: 40px; height: 5px; border-radius: 3px; background: var(--border-strong);
  }
  dialog.modal .modal-head h2 { font-size: 19px; }

  /* Clears the + button, which rises 24px above the nav; edges line up with the page gutter */
  .toast {
    inset-block-end: calc(var(--bottomnav-h) + var(--safe-bottom) + 24px + var(--sp-3));
    width: calc(100vw - 2 * var(--gutter)); max-width: 560px;
  }
}
@media (max-width: 760px) and (prefers-reduced-motion: reduce) {
  dialog.modal[open] { animation: none; }
}
@media (prefers-reduced-motion: reduce) {
  dialog.modal[open], .toast, .page-content.enter .progress > span { animation: none; }
}

/* ============================================================
   Ofek 4.0 — charts: line/area graph, bar chart, donut, score ring,
   fan chart (all rendered by src/charts.js), tooltips and legends.
   charts.js writes fixed hex colours into SVG attributes and inline styles
   (its `palette` and a few semantic colours). The bridge at the end of this
   file maps each of those values onto theme tokens, so every chart follows
   light/dark automatically. Tokens only.
   ============================================================ */

/* ---------- Chart frame ---------- */
.chart { position: relative; width: 100%; min-width: 0; }
.native-chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.native-chart svg text {
  fill: var(--chart-axis); font-family: var(--font-num); font-weight: var(--fw-medium);
  font-variant-numeric: tabular-nums;
}
.native-chart path, .native-chart line, .native-chart circle, .native-chart rect { transition: opacity var(--dur-fast) var(--ease-out); }
.bar-chart rect { transition: opacity var(--dur-fast) var(--ease-out); }
.bar-chart .graph-point:hover rect, .bar-chart .graph-point:focus-visible rect { opacity: 1; filter: brightness(1.08); }

/* Points: larger hit area is the transparent circle; the visible dot grows on hover/focus */
.graph-point { cursor: pointer; outline: none; }
.graph-point .point-dot { fill: var(--surface); stroke-width: 2.4px; transition: r var(--dur-fast) var(--ease-out); }
.graph-point:hover .point-dot, .graph-point:focus-visible .point-dot { r: 6px; }
.graph-point:focus-visible .point-dot { stroke-width: 3px; }
.graph-point:focus-visible rect { stroke: var(--focus-color); stroke-width: 2px; }

/* Tooltip (text set by app.js on hover/focus) */
.chart-hover {
  position: absolute; inset-block-start: var(--sp-2); inset-inline: 0; margin-inline: auto; z-index: 2;
  width: max-content; max-width: min(92%, 440px);
  padding: 6px var(--sp-3); border-radius: var(--r-sm);
  background: var(--toast-bg); color: var(--toast-text); box-shadow: var(--shadow-2);
  font-size: var(--fs-micro); font-weight: var(--fw-semibold); line-height: 1.45; text-align: center;
  direction: rtl; unicode-bidi: plaintext; white-space: normal;
  opacity: 0; transform: translateY(-4px); pointer-events: none;
  transition: opacity var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
}
.chart-hover.visible { opacity: 1; transform: none; }
.chart-hover:empty { display: none; }

/* Footer under a chart: legend + note + action */
.chart-footer {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: var(--sp-2) var(--sp-4);
  margin-block-start: var(--sp-3); padding-block-start: var(--sp-3); border-block-start: 1px solid var(--border);
  font-size: var(--fs-micro); color: var(--text-muted);
}
.chart-footer > span { display: inline-flex; align-items: center; gap: 6px; }
.gold-dot, .purple-dot {
  display: inline-block; flex: none; width: 10px; height: 10px; border-radius: 3px; vertical-align: middle;
  background: var(--chart-1);
}
.purple-dot { background: var(--chart-2); }

/* ---------- Donut ---------- */
.donut-wrap { display: flex; align-items: center; flex-wrap: wrap; justify-content: center; gap: var(--sp-5) var(--sp-6); min-width: 0; }
.donut { position: relative; flex: none; max-width: 100%; }
.donut::before { /* track ring under the segments */
  content: ""; position: absolute; inset: 5%; border-radius: 50%;
  border: max(6px, 6.6cqi) solid var(--track); opacity: .7;
}
.donut { container-type: inline-size; }
.donut svg { position: relative; display: block; width: 100%; height: 100%; overflow: visible; }
.donut-center {
