async function writeLetter(){
  if(letterState.busy)return;
  const month=ui.month;Object.assign(letterState,{month,text:'',busy:true,error:null,abort:new AbortController()});render();
  const update=()=>{const el=document.querySelector('#ai-letter');if(el&&ui.month===month)el.innerHTML=letterBody();};
  const messages=[{role:'user',content:[{type:'text',text:financialContext(data,month)},{type:'text',text:`כתוב לי "מכתב חודשי" אישי על ${monthLabel(month)} (${month}). קודם בדוק בעזרת הכלים: השוואה לחודשים קודמים, תקציבים, חיובים חוזרים, חריגות, התקדמות ביעדים ובהשקעות. מבנה: שורת פתיחה חמה ואישית, ### מה הלך טוב, ### למה כדאי לשים לב, ### שלושה צעדים לחודש הבא (ממוספרים, עם סכומים). עד 260 מילים, בלי גרפים ובלי הקדמות על הבדיקות שעשית.`}]}];
  try{
    const r=await runAgent({settings:aiSettings(),messages,tools:AI_TOOLS.filter(t=>!t.name.startsWith('propose_')&&t.name!=='render_chart'),signal:letterState.abort.signal,ctx:{get data(){return data;},month,approve:async()=>({approved:false})},onEvent:ev=>{if(ev.type==='block_start'&&ev.block.type==='text'&&letterState.text)letterState.text+='\n\n';if(ev.type==='text'){letterState.text+=ev.text;update();}if(ev.type==='assistant_message'&&ev.message.stop_reason==='tool_use'){letterState.text='';update();}}});
    const text=r.message.content.filter(b=>b.type==='text').map(b=>b.text).join('\n\n').trim();
    if(!text)throw Error('Claude לא החזיר מכתב. נסה שוב.');
    const all=storedLetters();all[month]={text,date:new Date().toISOString()};try{localStorage.setItem(AI_LETTERS_KEY,JSON.stringify(all));}catch{}
  }catch(err){letterState.error=err?.name==='AbortError'?'הכתיבה נעצרה.':err.message;}
  finally{letterState.busy=false;letterState.abort=null;render();}
}

// ---------- Events ----------
document.addEventListener('click',event=>{
  const button=event.target.closest('[data-action]');if(!button)return;
  const [action,a]=button.dataset.action.split(':');
  try{
    if(action==='palette')openPalette();
    else if(action==='palette-run')paletteState.items[+a]?.run();
    else if(action==='privacy')togglePrivacy();
    else if(action==='ai-prompt'){if(aiPrompts[a])sendCopilot(aiPrompts[a],[]);}
    else if(action==='ai-send'){const box=document.querySelector('#ai-input');sendCopilot(box?.value||'');}
    else if(action==='ai-stop'){copilot.abort?.abort();for(const p of copilot.pending.values())p.resolve({approved:false});copilot.pending.clear();}
    else if(action==='ai-attach'){if(!aiReady()){navigate('copilot');return;}if(ui.page!=='copilot')navigate('copilot');setTimeout(()=>document.querySelector('#ai-file')?.click());}
    else if(action==='ai-unattach'){copilot.attachments.splice(+a,1);document.querySelector('#ai-attachments').innerHTML=attachmentsHTML();}
    else if(action==='ai-approve')resolveProposal(a,true);
    else if(action==='ai-decline')resolveProposal(a,false);
    else if(action==='ai-retry'){const err=copilot.error;copilot.error=null;sendCopilot(err?.prompt||'',err?.files||[]);}
    else if(action==='ai-clear'){if(copilot.busy)return;copilot.messages=[];copilot.error=null;copilot.lastContext='';saveConversation();render();}
    else if(action==='ai-clear-history')confirm('מחיקת היסטוריית השיחה','השיחה עם Claude תימחק מהמכשיר. הנתונים הפיננסיים לא יושפעו.',()=>{copilot.messages=[];copilot.lastContext='';try{localStorage.removeItem(AI_CHAT_KEY);localStorage.removeItem(AI_LETTERS_KEY);}catch{}toast('היסטוריית השיחה נמחקה');render();},true);
    else if(action==='ai-disconnect')confirm('ניתוק Claude','מפתח ה־API יימחק מהמכשיר. אפשר להתחבר שוב בכל עת.',()=>{saveAiSettings({apiKey:''});toast('Claude נותק');render();},true);
    else if(action==='ai-reset-usage'){saveAiSettings({usage:{input:0,output:0,cost:0}});render();}

function saveSplitExpense(form){
  const g=currentGroup();if(!g)throw Error('הקבוצה לא נמצאה.');
  const f=new FormData(form),id=form.dataset.id,amount=Math.round(Number(f.get('amount'))*100)/100,description=String(f.get('description')||'').trim(),date=String(f.get('date')||''),paidBy=String(f.get('paidBy')||'');
  if(!description)throw Error('יש לתאר את ההוצאה.');
  if(!(amount>0))throw Error('יש להזין סכום חיובי.');
  if(!validDate(date)||date>today())throw Error('יש לבחור תאריך שאינו בעתיד.');
  const chosen=g.members.filter(m=>f.get('p_'+m.id)==='on').map(m=>m.id);
  if(!chosen.length)throw Error('יש לבחור לפחות משתתף אחד.');
  const typed=chosen.map(mid=>String(f.get('s_'+mid)||'').trim());
  let expense={id:id||uid(),description,amount,paidBy,date};
  if(typed.some(Boolean)){
    if(typed.some(v=>v===''))throw Error('בחלוקה מדויקת יש למלא סכום לכל משתתף מסומן.');
    const shares=Object.fromEntries(chosen.map((mid,i)=>[mid,Math.round(Number(typed[i])*100)/100]));
    if(Object.values(shares).some(v=>!(v>=0)))throw Error('סכומי החלוקה צריכים להיות חיוביים.');
    const total=Object.values(shares).reduce((s,v)=>s+v,0);

    expense={...expense,split:'exact',shares};
  }else if(chosen.length<g.members.length)expense.participants=chosen;

    const group=next.groups.find(x=>x.id===g.id),i=group.expenses.findIndex(v=>v.id===expense.id);

    }
  },id?'ההוצאה עודכנה':record?'ההוצאה נוספה, והחלק שלך נרשם בתנועות':'ההוצאה נוספה לקבוצה');
  closeDialog();
}

  const better=av.totalInterest<=sn.totalInterest+.5?'avalanche':'snowball',free=m=>monthLabel(monthOffset(today().slice(0,7),m));

  const step=Math.max(1,Math.ceil(Math.max(av.series.length,sn.series.length)/60)),points=[];
  for(let m=0;m<Math.max(av.series.length,sn.series.length);m+=step)points.push({label:m?`חודש ${m}`:'היום',date:today(),av:av.series[m]?.balance??0,sn:sn.series[m]?.balance??0});
  return `${base.feasible&&+v.extra>0?card(`<div class="extra-impact"><span class="asset-icon green">${icon('Zap',20)}</span><div><b>${money(+v.extra)} נוספים בחודש: חופשי מחובות ${base.months-av.months} חודשים מוקדם יותר</b><small>וחיסכון של כ־${money(base.totalInterest-av.totalInterest)} בריבית לעומת תשלומי המינימום בלבד</small></div></div>`,'extra-card'):''}<div class="two-columns">${plan(av,'שיטת המפולת','קודם הריבית הגבוהה','avalanche')}${plan(sn,'שיטת כדור השלג','קודם החוב הקטן','snowball')}</div>${card(head('סך החובות לאורך הזמן',`תקציב חודשי לחובות: ${money(av.budget)}`)+graph(points,[{key:'av',name:'מפולת',color:palette[0]},{key:'sn',name:'כדור שלג',color:palette[1]}],{height:220,floor:0}))}`;
}

function allocSummary(balance,total){

function openAllocation(accountId){

  const rows=data.goals.map(g=>({g,value:g.accountId===accountId?Math.round((info.shares.get(g.id)||0)*100)/100:'',other:g.accountId&&g.accountId!==accountId?data.accounts.find(a=>a.id===g.accountId)?.name||'':''}));
  const total=rows.reduce((s,r)=>s+(Number(r.value)||0),0);
  showDialog(`חלוקת ״${info.account.name}״ בין היעדים`,`<form id="alloc-form" data-account="${e(accountId)}" data-balance="${info.balance}"><div class="form-error"></div><p class="confirm-text">יתרה של <b dir="ltr">${money(info.balance)}</b>. קבע כמה מתוכה שייך לכל יעד — מה שלא יוקצה יישאר כסף פנוי.</p><div class="alloc-inputs">${rows.map(({g,value,other})=>`<label class="alloc-input"><i style="background:${goalColor(g)}"></i><span><b>${e(g.name)}</b><small>${other?`כרגע מקושר ל״${e(other)}״ — הקצאה כאן תעביר אותו`:g.target?`סכום היעד: ${money(g.target)}`:'ללא סכום יעד'}</small></span><input type="number" min="0" step="any" name="g_${e(g.id)}" value="${e(value)}" placeholder="0" data-alloc aria-label="הקצאה ל${e(g.name)}"></label>`).join('')}</div><div id="alloc-summary" class="alloc-summary">${allocSummary(info.balance,total)}</div><div class="form-actions">${submit('שמירת החלוקה')}${btn('חלוקה אוטומטית','alloc-auto','Sparkles')}${btn('ביטול','dialog-close')}</div></form>`,true);
}
function refreshAllocSummary(form){
  const total=[...form.querySelectorAll('[data-alloc]')].reduce((s,el)=>s+(Number(el.value)||0),0),box=form.querySelector('#alloc-summary');
  if(box)box.innerHTML=allocSummary(Number(form.dataset.balance),total);
}
// Emergency fund first, then the nearest goals, each up to its target.
function autoAllocate(form){
  let left=Number(form.dataset.balance);
  const order=[...data.goals].sort((a,b)=>(b.type==='קרן חירום')-(a.type==='קרן חירום')||a.date.localeCompare(b.date));
  for(const g of order){
    const box=form.querySelector(`[name="g_${CSS.escape(g.id)}"]`);if(!box)continue;
    const want=Number(g.target)>0?Number(g.target):0,give=Math.max(0,Math.min(want,left));
    box.value=give?Math.round(give*100)/100:'';left-=give;
  }
  refreshAllocSummary(form);
}
function saveAllocation(form){
  const accountId=form.dataset.account,info=accountAllocations(data,accountId),values=new Map();
  for(const g of data.goals){const raw=String(new FormData(form).get('g_'+g.id)||'').trim();const v=raw===''?0:Number(raw);if(!(v>=0))throw Error(`הסכום ל״${g.name}״ אינו תקין.`);values.set(g.id,Math.round(v*100)/100);}
  const total=[...values.values()].reduce((s,v)=>s+v,0);
  if(total>info.balance+.005)throw Error(`הקצית ${money(total)}, אבל ביתרה יש ${money(info.balance)}. הקטן את אחד הסכומים.`);
  mutate(next=>{
    for(const g of next.goals){
      const v=values.get(g.id)||0;
      if(v>0){g.accountId=accountId;g.allocation=v;}
      else if(g.accountId===accountId){g.saved=Math.round((info.shares.get(g.id)||0)*100)/100;g.accountId='';g.allocation=null;}
    }
  },`החלוקה של ״${info.account.name}״ נשמרה`);
  closeDialog();
}
function goalAllocationHint(v){
  const others={...data,goals:data.goals.filter(g=>g.id!==v.id)},info=accountAllocations(others,v.accountId);
  return info?`יתרת החשבון ${money(info.balance)} · ${money(Math.max(0,info.balance-info.requested))} עדיין לא הוקצו ליעדים אחרים`:'';
}

document.addEventListener('click',event=>{
  const button=event.target.closest('[data-action]');if(!button)return;
  const [action,a]=button.dataset.action.split(':');
  try{
    if(action==='alloc')openAllocation(a);
    else if(action==='alloc-auto'){const form=document.querySelector('#alloc-form');if(form)autoAllocate(form);}
  }catch(err){toast(err.message,true);}

document.addEventListener('submit',event=>{

  try{saveAllocation(event.target);}catch(err){const box=event.target.querySelector('.form-error');if(box)box.innerHTML=notice(err.message,'error');else toast(err.message,true);}
});

async function decodeText(bytes){
  const utf8=new TextDecoder('utf-8').decode(bytes);
  if(!utf8.includes('�'))return utf8;
  try{return new TextDecoder('windows-1255').decode(bytes);}catch{return utf8;}
}
async function handleCaptureFile(file){
  const st=captureState();st.error=null;
  try{
    const name=file.name||'קובץ',type=file.type||'';
    if(type.startsWith('image/')||type==='application/pdf'||/\.(pdf|png|jpe?g|webp|heic|gif)$/i.test(name)){
      if(!aiReady())throw Error('כדי לקרוא צילום קבלה או PDF צריך לחבר את Claude במסך אופק AI. קובצי Excel ו־CSV נקראים גם בלי חיבור.');
      return await captureWithClaude(file);
    }
    if(file.size>5*1024*1024)throw Error('הקובץ גדול מדי (עד 5MB).');
    const bytes=new Uint8Array(await file.arrayBuffer());
    const rows=isXlsx(bytes)?await readXlsx(bytes):textToRows(await decodeText(bytes));
    const parsed=parseStatementRows(rows);
    loadCaptureItems(parsed.items,name,parsed.kind,parsed.skipped);
  }catch(err){st.busy=false;st.error=err.message;render();}

// Settings: device sync (end-to-end encrypted, via the user's GitHub), version history and
// encrypted backup files. Built on the UI helpers and state from app.js.

const SYNC_KEY='ofek-sync-v1';
const syncRuntime={busy:false,error:null,timer:null,lastVersionAt:null,versions:null,applying:false,again:false};
function syncState(){try{return JSON.parse(localStorage.getItem(SYNC_KEY)||'null');}catch{return null;}}
function saveSyncState(patch){const next={...(syncState()||{}),...patch};try{localStorage.setItem(SYNC_KEY,JSON.stringify(next));}catch{}return next;}
const deviceLabel=()=>/iPhone|iPad|Android|Mobile/i.test(navigator.userAgent||'')?'טלפון':'מחשב';
const timeLabel=iso=>iso?new Date(iso).toLocaleString('he-IL',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—';

// Saves a version and refreshes the list if it is on screen.
async function rememberVersion(d,reason){
  const version=await saveVersion(d,reason).catch(()=>null);
  if(version)syncRuntime.lastVersionAt=Date.now();
  syncRuntime.versions=null;
  if(document.querySelector('#versions-list'))loadVersions();
  return version;
}
// Called by commit() after every successful save.
function afterCommit(previous,next,replacement){
  const now=Date.now();
  if(previous&&(replacement||!syncRuntime.lastVersionAt||now-syncRuntime.lastVersionAt>6*3600e3)){
    syncRuntime.lastVersionAt=now;
    rememberVersion(previous,replacement?'לפני החלפת הנתונים':'שמירה אוטומטית');
  }
  if(syncRuntime.applying)return;
  const st=syncState();
  if(st?.gistId&&st.auto!==false){saveSyncState({localChangedAt:new Date().toISOString()});schedulePush();}
}
function schedulePush(delay=2500){clearTimeout(syncRuntime.timer);syncRuntime.timer=setTimeout(()=>syncNow('auto'),delay);}
function syncBadge(){
  const st=syncState();
  if(!st?.gistId)return `${icon('ShieldCheck',15)}<span>הנתונים נשמרים במכשיר שלך</span>`;
  const text=st.pendingChoice?'הסנכרון ממתין לבחירה':syncRuntime.error?'הסנכרון ממתין':syncRuntime.busy?'מסנכרן…':st.auto===false?'הסנכרון מושהה':`מסונכרן ומוצפן · ${timeLabel(st.lastSyncAt)}`;
  return `${icon(syncRuntime.error||st.pendingChoice?'TriangleAlert':'ShieldCheck',15)}<span>${text}</span>`;
}
function refreshSyncUI(){
  const badge=document.querySelector('.local-status');if(badge)badge.innerHTML=syncBadge();
  const box=document.querySelector('#sync-card');if(box)box.outerHTML=syncCard();
}

async function syncNow(mode='manual',force=null){
  const st=syncState();if(!st?.gistId||!st.keyJwk||(st.pendingChoice&&!force))return;
  if(syncRuntime.busy){syncRuntime.again=true;return;}
  syncRuntime.busy=true;syncRuntime.error=null;refreshSyncUI();
  try{
    const client=gistClient(st.token),key=await importKey(st.keyJwk),{payload}=await client.read(st.gistId),json=JSON.stringify(data);
    const decision=force||syncDecision({localFingerprint:fingerprint(json),lastFingerprint:st.lastFingerprint,remote:payload,lastRev:st.lastRev||0,lastNonce:st.lastNonce||null,localChangedAt:st.localChangedAt});
    // A conflict only matters when someone edited here; changes the app made by itself (recurring entries) just follow the cloud.
    const conflict=decision==='pull-conflict'&&!!st.localChangedAt;
    if(decision.startsWith('push')&&loadError)throw Error('הנתונים במכשיר הזה לא נקראו, ולכן לא הועלו לענן. אפשר לטעון את הגרסה מהענן או לשחזר גיבוי.');
    if(decision.startsWith('pull')){
      const remote=await decryptJSON(payload.encrypted,key);validateData(remote);
      await rememberVersion(data,conflict?'הגרסה המקומית לפני מיזוג':'לפני עדכון ממכשיר אחר');
      syncRuntime.applying=true;
      try{commit(remote,conflict?'היו שינויים בשני מכשירים: נטענה הגרסה החדשה יותר, והמקומית נשמרה בהיסטוריית הגרסאות':`הנתונים עודכנו ממכשיר אחר${payload.deviceName?` (${payload.deviceName})`:''}`,true);}
      finally{syncRuntime.applying=false;}
      saveSyncState({lastFingerprint:fingerprint(JSON.stringify(data)),lastRev:payload.rev||0,lastNonce:payload.nonce||null,remoteUpdatedAt:payload.updatedAt,lastSyncAt:new Date().toISOString(),localChangedAt:null,pendingChoice:null});
    }else if(decision.startsWith('push')){
      const updatedAt=new Date().toISOString(),rev=Math.max(st.lastRev||0,payload?.rev||0)+1,nonce=newNonce(),encrypted=await encryptJSON(data,key,fromBase64(st.salt),st.iterations);
      await client.write(st.gistId,{format:'ofek-sync',version:1,updatedAt,rev,nonce,device:st.device,deviceName:st.deviceName,encrypted});
      saveSyncState({lastFingerprint:fingerprint(json),lastRev:rev,lastNonce:nonce,remoteUpdatedAt:updatedAt,lastSyncAt:updatedAt,localChangedAt:null,pendingChoice:null});
      if(mode==='manual')toast(decision==='push-conflict'?'הגרסה במכשיר הזה חדשה יותר והועלתה. הגרסה הקודמת נשמרה בהיסטוריה בענן.':'הנתונים הועלו לענן, מוצפנים');
    }else{saveSyncState({lastSyncAt:new Date().toISOString()});if(mode==='manual')toast('הכול מסונכרן');}
  }catch(err){
    syncRuntime.error=err.message;
    if(err.status===401)saveSyncState({auto:false});
    if(mode==='manual')toast(err.message,true);
  }finally{
    syncRuntime.busy=false;refreshSyncUI();
    if(syncRuntime.again){syncRuntime.again=false;schedulePush(500);}
  }
}

async function connectSync(form){
  const f=new FormData(form),token=String(f.get('token')||'').trim(),pass=String(f.get('passphrase')||''),confirmPass=String(f.get('confirm')||''),deviceName=String(f.get('device')||'').trim()||deviceLabel();
  if(!/^(ghp_|github_pat_|gho_)/.test(token))throw Error('הטוקן צריך להתחיל ב־ghp_ או github_pat_.');
  if(pass.length<8)throw Error('סיסמת הסנכרון צריכה להיות באורך 8 תווים לפחות.');
  const button=form.querySelector('[type=submit]');if(button){button.disabled=true;button.querySelector('span').textContent='מתחבר…';}
  try{
    const client=gistClient(token),user=await client.user(),existing=await client.find(),device=Math.random().toString(36).slice(2,10);
    if(existing){
      const {payload}=await client.read(existing),salt=fromBase64(payload.encrypted.salt),key=await deriveKey(pass,salt,payload.encrypted.iterations);
      const remote=await decryptJSON(payload.encrypted,key);validateData(remote);
      const pendingChoice={from:payload.deviceName||'',updatedAt:payload.updatedAt,transactions:remote.transactions.length,goals:remote.goals.length,assets:remote.assets.length};
      saveSyncState({token,gistId:existing,salt:payload.encrypted.salt,iterations:payload.encrypted.iterations,keyJwk:await exportKey(key),login:user.login,device,deviceName,auto:true,lastFingerprint:null,lastRev:0,lastNonce:null,remoteUpdatedAt:null,lastSyncAt:null,localChangedAt:null,pendingChoice});
      closeDialog();render();openSyncChoice();
      return;
    }else{
      if(loadError)throw Error('הנתונים במכשיר הזה לא נקראו. שחזר אותם קודם, ואז הפעל סנכרון.');
      const salt=newSalt(),key=await deriveKey(pass,salt),json=JSON.stringify(data),encrypted=await encryptJSON(data,key,salt),updatedAt=new Date().toISOString(),nonce=newNonce();
      const id=await client.create({format:'ofek-sync',version:1,updatedAt,rev:1,nonce,device,deviceName,encrypted});
      saveSyncState({token,gistId:id,salt:toBase64(salt),iterations:KDF_ITERATIONS,keyJwk:await exportKey(key),login:user.login,device,deviceName,auto:true,lastFingerprint:fingerprint(json),lastRev:1,lastNonce:nonce,remoteUpdatedAt:updatedAt,lastSyncAt:updatedAt,localChangedAt:null,pendingChoice:null});
      closeDialog();toast('הסנכרון הופעל. במכשיר השני חבר את אותו חשבון GitHub עם אותה סיסמה.');
    }
    render();
  }finally{if(button){button.disabled=false;button.querySelector('span').textContent='חיבור והפעלת סנכרון';}}
}

document.addEventListener('click',event=>{
  const button=event.target.closest('[data-action]');if(!button)return;
  const [action,...rest]=button.dataset.action.split(':'),a=rest.join(':');
  try{
    if(action==='sync-setup')openSyncSetup();
    else if(action==='sync-now')syncNow('manual');
    else if(action==='sync-choose'&&['pull','push'].includes(a)){closeDialog();syncNow('manual',a);}
    else if(action==='sync-history')openCloudHistory();
    else if(action==='sync-auto'){const st=syncState();saveSyncState({auto:st?.auto===false});syncRuntime.error=null;render();if(st?.auto===false)syncNow('manual');}
    else if(action==='sync-disconnect')confirm('לנתק את המכשיר מהסנכרון?','הטוקן ומפתח ההצפנה יימחקו מהמכשיר הזה. הנתונים במכשיר ובענן נשארים כמו שהם.',()=>{localStorage.removeItem(SYNC_KEY);syncRuntime.error=null;toast('המכשיר נותק מהסנכרון');render();},true);
    else if(action==='version-now'){rememberVersion(data,'שמירה ידנית').then(v=>toast(v?'הגרסה נשמרה':'אין שינויים מאז הגרסה האחרונה'));}
    else if(action==='version-restore'){readVersion(a).then(value=>restoreData(value,`גרסה מ־${timeLabel(syncRuntime.versions?.find(v=>v.id===a)?.at)}`)).catch(err=>toast(err.message,true));}
    else if(action==='cloud-restore'){const st=syncState();gistClient(st.token).revision(st.gistId,a).then(async payload=>restoreData(await decryptJSON(payload.encrypted,await importKey(st.keyJwk)),`גרסה מהענן מ־${timeLabel(payload.updatedAt)}`)).catch(err=>toast(err.message,true));}
    else if(action==='backup-encrypted')openEncryptedBackup();
  }catch(err){toast(err.message,true);}
});
document.addEventListener('submit',async event=>{
  const form=event.target;
  if(!['sync-form','backup-form','decrypt-form'].includes(form.id))return;
  event.preventDefault();
  const fail=err=>{const box=form.querySelector('.form-error');if(box)box.innerHTML=notice(err.message,'error');else toast(err.message,true);};
  try{
    if(form.id==='sync-form'){const pass=new FormData(form).get('passphrase'),c=new FormData(form).get('confirm');if(c&&c!==pass)throw Error('הסיסמאות אינן תואמות.');await connectSync(form);}
    if(form.id==='backup-form'){
      const f=new FormData(form),pass=String(f.get('passphrase')||'');
      if(pass.length<8)throw Error('הסיסמה צריכה להיות באורך 8 תווים לפחות.');
      if(pass!==f.get('confirm'))throw Error('הסיסמאות אינן תואמות.');
      const payload=await encryptWithPassphrase(data,pass);
      download(`ofek-backup-${today()}.ofek`,JSON.stringify(payload));
      closeDialog();commit({...data,lastBackup:new Date().toISOString()},'הגיבוי המוצפן הורד');
    }
    if(form.id==='decrypt-form'){
      const value=await decryptJSON(syncRuntime.pendingImport,String(new FormData(form).get('passphrase')||''));
      syncRuntime.pendingImport=null;closeDialog();
      if(value?.format==='ofek-transactions')throw Error('קובץ תנועות מוצפן אינו נתמך. השתמש בגיבוי מלא.');
      restoreData(value,'הגיבוי המוצפן');
    }
  }catch(err){fail(err);}
});

// Start: a daily safety version, then keep devices in sync while the app is open.
if(typeof setTimeout==='function'&&typeof setInterval==='function'&&typeof document!=='undefined'&&document.addEventListener){
  setTimeout(()=>{
    listVersions().then(list=>{
      syncRuntime.versions=list;
      const last=list[0]?new Date(list[0].at).getTime():0;
      syncRuntime.lastVersionAt=last||null;
      if(Date.now()-last>24*3600e3)rememberVersion(data,'גיבוי יומי אוטומטי');
    }).catch(()=>{});
    if(syncState()?.gistId&&syncState().auto!==false)syncNow('auto');
  },1200);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&syncState()?.gistId&&syncState().auto!==false)syncNow('auto');});
  setInterval(()=>{if(document.visibilityState==='visible'&&syncState()?.gistId&&syncState().auto!==false&&!syncRuntime.busy)syncNow('auto');},90000);
}

const HOME_DEFAULT_HIDDEN=['cashflow'];
const HOME_PRESETS=[
  ['full','מלא',null],
  ['focus','ממוקד',['networth','month','safe','upcoming','budgets','free','goals']],
  ['investor','משקיע',['networth','investments','free','worth','goals','assets']],
  ['budget','תקציב חודשי',['month','pace','safe','budgets','upcoming','recent','spending','cashflow']]
];
const homeWidget=id=>HOME_WIDGETS.find(w=>w.id===id);

// The saved layout, completed with widgets it does not know (added in a later version → hidden).
function homeLayout(){
  const saved=data.prefs?.home,known=new Set(HOME_WIDGETS.map(w=>w.id));
  if(!saved)return {order:HOME_WIDGETS.map(w=>w.id),hidden:[...HOME_DEFAULT_HIDDEN],custom:false};
  const order=saved.order.filter(id=>known.has(id)),missing=HOME_WIDGETS.map(w=>w.id).filter(id=>!order.includes(id));
  return {order:[...order,...missing],hidden:[...saved.hidden.filter(id=>known.has(id)),...missing],custom:true};
}
const visibleWidgets=layout=>layout.order.filter(id=>!layout.hidden.includes(id));
function saveHomeLayout(visible,message=''){
  const all=HOME_WIDGETS.map(w=>w.id),hidden=all.filter(id=>!visible.includes(id));
  mutate(next=>{next.prefs={...(next.prefs||{}),home:{order:[...visible,...hidden],hidden}};},message);
}
function homeRows(ids){
  const rows=[];let row=[],sum=0;
  for(const id of ids){const w=homeWidget(id).w;if(row.length&&sum+w>12.45){rows.push(row);row=[];sum=0;}row.push(id);sum+=w;}
  if(row.length)rows.push(row);
  return rows;
}

  return {d,b,s,snaps,last,p,nw:prev&&last?(last.netWorth-prev.netWorth)/Math.abs(prev.netWorth||1):null};
}

function homeView(){
  const layout=homeLayout(),visible=visibleWidgets(layout),ctx=homeContext();let n=0;
  const rows=homeRows(visible).map(row=>`<div class="home-row${row.some(id=>homeWidget(id).stack)?' stack-md':''}" data-count="${row.length}" style="grid-template-columns:${row.map(id=>`minmax(0,${homeWidget(id).w}fr)`).join(' ')}">${row.map(id=>{let html;try{html=HOME_RENDER[id](ctx);}catch(err){html=card(`<p class="muted small">${e(homeWidget(id).label)}: לא הצלחנו להציג את הכרטיס.</p>`);}return `<div class="home-cell" data-widget="${id}" style="--i:${n++}">${html}</div>`;}).join('')}</div>`).join('');
  return (ui.homeEdit?homeEditor(layout):'')+(visible.length?`<div class="home-board${ui.homeEdit?' editing':''}">${rows}</div>`:card(empty('דף הבית ריק','בחר כרטיסים להצגה, או חזור לפריסה המלאה.',btn('פריסה מלאה','home-preset:full','LayoutGrid','primary'))));
}

// ---------- Editor ----------
function presetMatches(visible,ids){return ids?visible.join()===ids.join():visible.join()===HOME_WIDGETS.map(w=>w.id).filter(id=>!HOME_DEFAULT_HIDDEN.includes(id)).join();}
function homeEditor(layout){
  const visible=visibleWidgets(layout),hidden=HOME_WIDGETS.map(w=>w.id).filter(id=>!visible.includes(id));
  const row=(id,i)=>{const w=homeWidget(id),l=e(w.label);return `<li class="home-editor-row" draggable="true" data-home-id="${id}"><span class="grip" title="גרירה לשינוי הסדר">${icon('GripVertical',16)}</span><span class="home-editor-index">${i+1}</span><span class="asset-icon">${icon(w.icon,16)}</span><div><b>${l}${w.fresh?'<span class="nav-new">חדש</span>':''}</b><small>${e(w.hint)}</small></div><div class="home-editor-actions"><button type="button" class="icon-button" aria-label="הזזה למעלה: ${l}" title="למעלה" data-action="home-move:${id}:-1" ${i===0?'disabled':''}>${icon('ArrowUp',16)}</button><button type="button" class="icon-button" aria-label="הזזה למטה: ${l}" title="למטה" data-action="home-move:${id}:1" ${i===visible.length-1?'disabled':''}>${icon('ArrowDown',16)}</button><button type="button" class="icon-button" aria-label="הסתרה: ${l}" title="הסתרה" data-action="home-toggle:${id}">${icon('EyeOff',16)}</button></div></li>`;};
  return card(head('התאמת דף הבית','גרור כרטיס או השתמש בחצים כדי לשנות את הסדר. השינויים נשמרים מיד — וגם במכשירים המסונכרנים.',`<div class="actions">${btn('סיום','home-done','Check','primary')}</div>`)+`<div class="home-presets" role="group" aria-label="פריסות מוכנות"><span>פריסה מוכנה:</span>${HOME_PRESETS.map(([id,label,ids])=>`<button type="button" class="home-preset ${presetMatches(visible,ids)?'active':''}" data-action="home-preset:${id}">${label}</button>`).join('')}</div><div class="home-editor-cols"><div><h3>מוצגים בדף הבית <span class="muted">(${visible.length})</span></h3>${visible.length?`<ol class="home-editor">${visible.map(row).join('')}</ol>`:'<p class="muted small">אין כרטיסים מוצגים.</p>'}</div><div><h3>אפשר להוסיף</h3>${hidden.length?`<div class="home-hidden">${hidden.map(id=>{const w=homeWidget(id);return `<button type="button" class="home-add" data-action="home-toggle:${id}"><span class="asset-icon">${icon(w.icon,16)}</span><span><b>${e(w.label)}${w.fresh?'<span class="nav-new">חדש</span>':''}</b><small>${e(w.hint)}</small></span>${icon('Plus',16)}</button>`;}).join('')}</div>`:'<p class="muted small">כל הכרטיסים כבר מוצגים.</p>'}</div></div>`,'home-editor-card');
}
function moveWidget(id,target,after){
  const visible=visibleWidgets(homeLayout()).filter(x=>x!==id);
  let at=visible.indexOf(target);if(at<0)return;if(after)at++;
  visible.splice(at,0,id);saveHomeLayout(visible);
}

let homeDrag=null;
document.addEventListener('click',event=>{
  const button=event.target.closest('[data-action]');if(!button)return;
  const [action,a,b]=button.dataset.action.split(':');
  try{
    if(action==='home-edit'){ui.homeEdit=true;navigate('dashboard');}
    else if(action==='home-done'){ui.homeEdit=false;render();}
    else if(action==='home-toggle'&&homeWidget(a)){
      const visible=visibleWidgets(homeLayout()),on=visible.includes(a);
      saveHomeLayout(on?visible.filter(x=>x!==a):[...visible,a],on?'':`״${homeWidget(a).label}״ נוסף לסוף דף הבית`);
    }
    else if(action==='home-move'&&homeWidget(a)){
      const visible=visibleWidgets(homeLayout()),i=visible.indexOf(a),j=i+Number(b);
      if(i<0||j<0||j>=visible.length)return;
      [visible[i],visible[j]]=[visible[j],visible[i]];saveHomeLayout(visible);
      requestAnimationFrame(()=>document.querySelector(`.home-editor-row[data-home-id="${a}"] [data-action="home-move:${a}:${b}"]`)?.focus());
    }
    else if(action==='home-preset'){
      const preset=HOME_PRESETS.find(p=>p[0]===a);if(!preset)return;
      saveHomeLayout(preset[2]||HOME_WIDGETS.map(w=>w.id).filter(id=>!HOME_DEFAULT_HIDDEN.includes(id)),`נבחרה הפריסה ״${preset[1]}״`);
    }
  }catch(err){toast(err.message,true);}
});
document.addEventListener('dragstart',event=>{
  const row=event.target.closest?.('.home-editor-row');if(!row)return;
  homeDrag=row.dataset.homeId;row.classList.add('dragging');
  event.dataTransfer.effectAllowed='move';try{event.dataTransfer.setData('text/plain',homeDrag);}catch{}
});
document.addEventListener('dragover',event=>{
  const row=event.target.closest?.('.home-editor-row');if(!homeDrag||!row)return;
  event.preventDefault();
  const after=event.clientY>row.getBoundingClientRect().top+row.offsetHeight/2;

// The phone experience: a bottom tab bar for one-handed use, a quick-add sheet, installing to the

const readJSON=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key)||'null')??fallback;}catch{return fallback;}};

// ---------- Bottom navigation ----------

// ---------- Quick add ----------
function quickCategories(type){
  const since=shiftDate(today(),-120),count=new Map();
  for(const t of data.transactions)if(t.type===type&&t.date>=since&&data.categories.includes(t.category))count.set(t.category,(count.get(t.category)||0)+1);
  const list=[...count].sort((a,b)=>b[1]-a[1]).map(([c])=>c);
  const incomeLike=c=>/משכורת|הכנס|מענק|החזר|דיבידנד/.test(c);
  for(const c of data.categories)if(list.length<8&&!list.includes(c)&&(type==='income'?incomeLike(c):!incomeLike(c)))list.push(c);
  return list.slice(0,8);
}
function quickAccounts(){return data.accounts.filter(a=>!['investment','debt'].includes(a.kind));}

function quickValues(form){const f=new FormData(form);return {type:ui.quick?.type||'expense',category:ui.quick?.category||'',amount:String(f.get('amount')||'').trim(),description:String(f.get('description')||'').trim(),accountId:String(f.get('accountId')||''),date:String(f.get('date')||today())};}
function saveQuick(form){

  if(!(amount>0))throw Error('יש להזין סכום חיובי.');
  if(!v.category)throw Error('בחר קטגוריה.');

  if(!validDate(v.date)||v.date>today())throw Error('התאריך אינו תקין.');
  const t={id:uid(),type:v.type,amount:Math.round(amount*100)/100,currency:account.currency,fx:data.fx,date:v.date,category:v.category,subcategory:'',accountId:account.id,description:v.description.slice(0,120),tags:[],recurring:false};
  closeDialog();
  mutate(next=>{if(!next.categories.includes(t.category))next.categories.push(t.category);applyTransaction(next,t);next.transactions.push(t);},'');
  try{navigator.vibrate?.(12);}catch{}
  undoToast(`${t.type==='income'?'הכנסה':'הוצאה'} של ${money(t.amount,t.currency,Number.isInteger(t.amount)?0:2)} נרשמה · ${t.category}`,t.id);

function undoToast(message,id){
  toast(message);
  const el=document.querySelector('.toast');if(!el)return;
  const undo=document.createElement('button');undo.type='button';undo.className='toast-undo';undo.textContent='ביטול';
  undo.addEventListener('click',()=>{el.remove();mutate(next=>{const t=next.transactions.find(x=>x.id===id);if(!t)return;applyTransaction(next,t,-1);next.transactions=next.transactions.filter(x=>x.id!==id);},'התנועה בוטלה');});
  el.insertBefore(undo,el.querySelector('.icon-button'));
}

// ---------- Alerts (bell) and notifications ----------
const NOTIFY_KEY='ofek-notify-v1',SEEN_KEY='ofek-alerts-seen',SENT_KEY='ofek-alerts-sent';
const NOTIFY_TYPES=[['monthly','תזכורת לעדכון החודשי','כשעבר חודש מאז העדכון האחרון של התיק'],['bills','חיובים קרובים','יום לפני תשלום קבוע או הוראת קבע'],['anomalies','הוצאות חריגות','כשהוצאה או קטגוריה גבוהות בהרבה מהרגיל'],['budgets','חריגה מתקציב','כשקטגוריה עוברת את התקציב החודשי']];
const notifySettings=()=>({monthly:false,bills:false,anomalies:false,budgets:false,...readJSON(NOTIFY_KEY,{})});
function currentAlerts(){
  const now=today(),month=now.slice(0,7),list=[],last=sortedSnapshots().at(-1);
  if(data.assets.length&&(!last||(new Date(now)-new Date(last.date))/864e5>=30))list.push({id:`monthly-${month}`,type:'monthly',icon:'CalendarDays',color:'gold',title:'זמן לעדכון החודשי',body:last?`העדכון האחרון של התיק היה ב־${dateLabel(last.date)}.`:'עוד לא נשמר עדכון ראשון לתיק.',action:'navigate:monthly'});
  for(const x of scheduledItems(data,now,shiftDate(now,2)).filter(x=>!x.paid&&x.type!=='income'))list.push({id:`bill-${x.key}`,type:'bills',icon:'Receipt',color:'purple',title:`${x.date===now?'היום':x.date===shiftDate(now,1)?'מחר':'בעוד יומיים'}: ${x.name}`,body:`${money(x.amount)} ${x.autopay?'יירדו אוטומטית':'לתשלום'}`,action:'navigate:bills'});
  for(const a of detectAnomalies(data,month).slice(0,3))list.push({id:`anomaly-${a.kind}-${a.id||a.title}-${month}`,type:'anomalies',icon:'TriangleAlert',color:'red',title:a.kind==='category'?`ההוצאות על ${a.title} גבוהות מהרגיל`:`הוצאה חריגה: ${a.title}`,body:`${money(a.amount)} לעומת כ־${money(a.typical)} בדרך כלל`,action:'navigate:insights'});
  for(const b of data.budgets){const spent=categorySpend(data,b.category,month);if(b.limit>0&&spent>b.limit)list.push({id:`budget-${b.category}-${month}`,type:'budgets',icon:'SlidersHorizontal',color:'red',title:`חריגה מתקציב ${b.category}`,body:`${money(spent)} מתוך ${money(b.limit)} החודש`,action:'navigate:budgets'});}
  return list;
}
function unseenAlerts(){const seen=new Set(readJSON(SEEN_KEY,[]));return currentAlerts().filter(a=>!seen.has(a.id));}
function alertsButton(){
  const n=unseenAlerts().length;
  return `<button type="button" class="icon-button alerts-button" aria-label="${n?`התראות: ${n} חדשות`:'התראות'}" title="התראות" data-action="alerts">${icon('Bell',19)}${n?`<span class="alerts-dot">${n>9?'9+':n}</span>`:''}</button>`;
}
function openAlerts(){
  const list=currentAlerts();
  writeJSON(SEEN_KEY,[...new Set([...readJSON(SEEN_KEY,[]),...list.map(a=>a.id)])].slice(-300));
  showDialog('התראות',`${list.length?`<div class="alerts-list">${list.map(a=>`<button type="button" class="alert-row" data-action="${e(a.action)}"><span class="asset-icon ${a.color}">${icon(a.icon,17)}</span><div><b>${e(a.title)}</b><small>${e(a.body)}</small></div>${icon('ChevronLeft',15)}</button>`).join('')}</div>`:`<div class="all-clear">${icon('ShieldCheck',22)}<div><b>אין התראות כרגע</b><small>אין חריגות, אין חיובים ביומיים הקרובים והתיק מעודכן.</small></div></div>`}<div class="form-actions">${btn('התובנות שלך','navigate:insights','Sparkles')}${btn('הגדרת התראות','alerts-settings','BellRing')}</div>`);
  refreshBell();
}
function refreshBell(){
  const button=document.querySelector('.alerts-button');if(button)button.outerHTML=alertsButton();
  const n=unseenAlerts().length;
  try{if(hasNavigator&&navigator.setAppBadge)(n?navigator.setAppBadge(n):navigator.clearAppBadge())?.catch?.(()=>{});}catch{}
}
async function showSystemNotification(title,body,tag,url){
  const options={body,tag,dir:'rtl',lang:'he',icon:'icons/icon-192.png',badge:'icons/badge-96.png',data:{url}};
  try{const reg=await navigator.serviceWorker?.getRegistration?.();if(reg){await reg.showNotification(title,options);return true;}}catch{}
  try{new Notification(title,options);return true;}catch{return false;}
}
// Reminders the service worker already showed in the background (same ids), so nothing repeats.
function shownInBackground(){
  return new Promise(resolve=>{
    try{
      if(typeof indexedDB==='undefined')return resolve({});
      const request=indexedDB.open('ofek-notify',1);
      request.onupgradeneeded=()=>request.result.createObjectStore('kv');
      request.onsuccess=()=>{try{const q=request.result.transaction('kv').objectStore('kv').get('shown');q.onsuccess=()=>resolve(q.result||{});q.onerror=()=>resolve({});}catch{resolve({});}};
      request.onerror=()=>resolve({});
    }catch{resolve({});}
  });
}
async function checkAlerts(){
  refreshBell();
  const st=notifySettings();
  if(!Object.values(st).some(Boolean)||typeof Notification==='undefined'||Notification.permission!=='granted')return;
  const sent=readJSON(SENT_KEY,{}),background=await shownInBackground(),fresh=currentAlerts().filter(a=>st[a.type]&&!sent[a.id]&&!background[a.id]);
  for(const a of fresh.slice(0,3))if(await showSystemNotification(a.title,a.body,a.id,`./#${a.action.split(':')[1]||'dashboard'}`))sent[a.id]=today();
  const cutoff=shiftDate(today(),-90);for(const [id,date] of Object.entries(sent))if(date<cutoff)delete sent[id];
  writeJSON(SENT_KEY,sent);
  sendDigest(st,sent);
}
// Reminders for the coming weeks, handed to the service worker for periodic background checks
// (supported by installed apps in Chromium browsers).
async function sendDigest(st,sent){
  if(!servedOnline()||!hasNavigator||!navigator.serviceWorker)return;
  const now=today(),items=[];
  if(st.bills)for(const x of scheduledItems(data,shiftDate(now,1),shiftDate(now,21)).filter(x=>!x.paid&&x.type!=='income'))items.push({id:`bill-${x.key}`,at:`${shiftDate(x.date,-1)}T09:00`,title:`מחר: ${x.name}`,body:`${money(x.amount)} ${x.autopay?'יירדו אוטומטית':'לתשלום'}`,url:'./#bills'});
  const last=sortedSnapshots().at(-1);
  if(st.monthly&&data.assets.length&&last){const due=shiftDate(last.date,30);items.push({id:`monthly-${due.slice(0,7)}`,at:`${due}T10:00`,title:'זמן לעדכון החודשי',body:'כמה דקות, ותראה איך התיק התקדם.',url:'./#monthly'});}
  try{
    const reg=await navigator.serviceWorker.ready;
    reg.active?.postMessage({type:'ofek-digest',items:items.filter(x=>!sent[x.id])});
    if(reg.periodicSync&&items.length){const status=await navigator.permissions.query({name:'periodic-background-sync'});if(status.state==='granted')await reg.periodicSync.register('ofek-reminders',{minInterval:6*3600e3});}
  }catch{}
}
async function toggleNotify(type,on,box){
  if(on){
    if(typeof Notification==='undefined'){box.checked=false;toast('הדפדפן הזה לא תומך בהתראות.',true);return;}
    if(Notification.permission!=='granted'){
      const result=await Notification.requestPermission();
      if(result!=='granted'){box.checked=false;toast('ההתראות לא אושרו בדפדפן.',true);render();return;}
    }
  }
  writeJSON(NOTIFY_KEY,{...notifySettings(),[type]:on});
  toast(on?'ההתראה הופעלה במכשיר הזה':'ההתראה כובתה');
  if(on)checkAlerts();
}

// ---------- Events ----------
document.addEventListener('click',event=>{

      if(typeof Notification==='undefined'||Notification.permission!=='granted'){toast('קודם הפעל לפחות התראה אחת ואשר התראות בדפדפן.',true);return;}
      showSystemNotification('אופק · התראת ניסיון','ככה ייראו התזכורות וההתראות שבחרת.','ofek-test','./#dashboard').then(ok=>toast(ok?'נשלחה התראת ניסיון':'לא הצלחנו להציג התראה',!ok));
    }
  }catch(err){toast(err.message,true);}
});

// Short, purposeful motion and the "what's new" tour.
// Key numbers count to their value when a page opens, or from the old value when it changes
// (add an expense and the net worth visibly moves). Entrance animations run only on navigation,
// never on re-renders caused by clicks or typing.

const NUMBER_SELECTOR='.net-value, .metric-value, .widget-number, .safe-number, .chart-stat > b, .budget-big > b';
const shownNumbers=new Map();
const reducedMotion=()=>typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function animateNumbers(entering){
  if(typeof document.querySelectorAll!=='function'||typeof requestAnimationFrame!=='function')return;
  const seen=new Set();
  document.querySelectorAll(NUMBER_SELECTOR).forEach((el,i)=>{
    if(el.closest('dialog'))return;
    const text=el.textContent,m=text.match(/\d[\d,]*(?:\.\d+)?/);if(!m)return;
    const target=Number(m[0].replace(/,/g,''));if(!Number.isFinite(target))return;
    const key=`${ui.page}:${el.closest('[data-widget]')?.dataset.widget||i}:${el.className}`,previous=shownNumbers.get(key);
    seen.add(key);shownNumbers.set(key,target);
    if(reducedMotion()||previous===target||(previous==null&&!entering)||target===0)return;
    const from=previous??target*.82,decimals=m[0].includes('.')?m[0].split('.')[1].length:0;
    const format=new Intl.NumberFormat('en-US',{minimumFractionDigits:decimals,maximumFractionDigits:decimals});
    const before=text.slice(0,m.index),after=text.slice(m.index+m[0].length),duration=previous==null?720:520;let start=null;
    // The frame timestamp is used for timing (the app has its own `performance` function in scope).
    const step=now=>{
      if(!el.isConnected)return;
      if(start==null)start=now;
      const p=Math.min(1,(now-start)/duration),eased=1-Math.pow(1-p,3);
      el.textContent=before+format.format(from+(target-from)*eased)+after;
      if(p<1)requestAnimationFrame(step);else el.textContent=text;
    };
    el.textContent=before+format.format(from)+after;
    requestAnimationFrame(step);
  });
  for(const key of [...shownNumbers.keys()])if(key.startsWith(ui.page+':')&&!seen.has(key))shownNumbers.delete(key);
}
function motionAfterRender(){animateNumbers(ui.entering);}

function saveMonthly(){captureMonthly();const m=ui.monthly,last=sortedSnapshots().at(-1);if(!validDate(m.date)||m.date>today())throw Error('יש להזין תאריך תקין שאינו בעתיד.');if(last&&m.date<=last.date)throw Error('תאריך העדכון חייב להיות מאוחר מתמונת המצב האחרונה. ההיסטוריה אינה נדרסת.');const copy=monthlyDraft(),benchmarks={};for(const k of ['sp500','ta125']){if(m[k]!==''&&!(+m[k]>0))throw Error('ערך המדד צריך להיות חיובי.');benchmarks[k]=m[k]===''?null:+m[k];}const snap=snapshot(copy,m.date,benchmarks);copy.snapshots.push(snap);const result=dietz(last,snap,copy.activities);commit(copy,'תמונת המצב נשמרה בהצלחה');ui.monthlyDone={snapshot:snap,...result};render();}

function captureEntity(){if(!dialogState)return;const form=document.querySelector('#entity-form');if(!form)return;for(const [key,value] of new FormData(form))dialogState.v[key]=value;if(dialogState.kind==='transaction')dialogState.v.recurring=form.querySelector('[name=recurring]').checked;}
function saveEntity(){captureEntity();const {kind,entity}=dialogState,v={...dialogState.v,id:entity?.id||uid()},next=structuredClone(data),keys={transaction:'transactions',budget:'budgets',goal:'goals',account:'accounts',asset:'assets'};if(kind==='transaction'){v.amount=+v.amount;v.fx=+v.fx||next.fx;v.currency=next.accounts.find(a=>a.id===v.accountId)?.currency||'ILS';v.tags=String(v.tags||'').split(',').map(s=>s.trim()).filter(Boolean);if(!(v.amount>0))throw Error('יש להזין סכום חיובי.');if(entity)applyTransaction(next,entity,-1);applyTransaction(next,v);}

function removeEntity(kind,id){const keys={transaction:'transactions',budget:'budgets',goal:'goals',account:'accounts',asset:'assets'},entity=data[keys[kind]].find(a=>a.id===id);if(!entity)return;if(kind==='account'&&data.transactions.some(t=>t.accountId===id)){toast('החשבון מקושר לתנועות. אפשר לערוך אותו, אך מחיקה תפגע בהיסטוריה.',true);return;}confirm('למחוק את הפריט?',kind==='asset'?'הנכס יוסר מהתיק הנוכחי ושוויו יירשם כמשיכה היום. תמונות המצב ההיסטוריות יישמרו.':kind==='transaction'?'התנועה תימחק ויתרת החשבון תתעדכן. תנועות חודשיות שכבר נרשמו יישמרו.':'הפריט יימחק מהנתונים השמורים. מומלץ להוריד גיבוי קודם.',()=>{const next=structuredClone(data);if(kind==='transaction')applyTransaction(next,entity,-1);if(kind==='asset'&&assetValue(entity)>0){const last=sortedSnapshots().at(-1);if(last&&today()<=last.date)throw Error('אפשר להסיר את הנכס רק לאחר תאריך העדכון האחרון.');next.activities.push({id:uid(),type:'withdrawal',date:today(),amount:assetValue(entity),currency:entity.currency,fx:next.fx,notes:'הסרת נכס: '+entity.name});}if(kind==='account')next.goals=next.goals.map(g=>g.accountId===id?{...g,accountId:'',allocation:null,saved:effectiveGoalSavings(data,entity.kind==='investment'?{...g,accountId:entity.id}:g)}:g);next[keys[kind]]=next[keys[kind]].filter(a=>a.id!==id);commit(next,'הפריט נמחק');},true);}
function download(filename,value,type='application/json'){const blob=new Blob([value],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);}
function exportData(format){const list=format.endsWith('filtered')?filteredTransactions():data.transactions;if(format==='backup'){const copy={...data,lastBackup:new Date().toISOString()};download('ofek-backup-'+today()+'.json',JSON.stringify(copy,null,2));commit(copy,'הגיבוי הורד בהצלחה');return;}if(format.startsWith('json')){download('ofek-transactions-'+today()+'.json',JSON.stringify({format:'ofek-transactions',version:1,transactions:list.map(t=>({...t,accountName:data.accounts.find(a=>a.id===t.accountId)?.name}))},null,2));toast('התנועות יוצאו ל־JSON');return;}const headers=['מזהה','תאריך','סוג','סכום','מטבע','קטגוריה','תת קטגוריה','חשבון','תיאור','תגיות','חוזרת','שער דולר','מזהה תנועה חוזרת'],rows=list.map(t=>[t.id,t.date,t.type==='income'?'הכנסה':'הוצאה',t.amount,t.currency||'ILS',t.category,t.subcategory,data.accounts.find(a=>a.id===t.accountId)?.name,t.description,t.tags?.join(','),t.recurring?'כן':'לא',t.fx||data.fx,t.recurringParent||'']);download('ofek-transactions-'+today()+'.csv','\uFEFF'+[headers,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n'),'text/csv;charset=utf-8');toast('התנועות יוצאו ל־CSV');}
async function importFile(file){try{if(!file)return;if(file.size>10*1024*1024)throw Error('גודל הקובץ המרבי הוא 10MB.');const text=await file.text();let value;if(file.name.toLowerCase().endsWith('.csv')){const rows=parseCSV(text.replace(/^\uFEFF/,'')),headers=rows.shift();if(!['תאריך','סוג','סכום','חשבון','קטגוריה'].every(k=>headers.includes(k)))throw Error('כותרות CSV אינן תואמות. השתמש בפורמט של קובץ התנועות המיוצא מאופק.');const get=(r,k)=>r[headers.indexOf(k)]||'';value={format:'ofek-transactions',transactions:rows.map(r=>({id:get(r,'מזהה')||uid(),date:get(r,'תאריך'),type:get(r,'סוג')==='הכנסה'?'income':get(r,'סוג')==='הוצאה'?'expense':'invalid',amount:+get(r,'סכום'),currency:get(r,'מטבע')||'ILS',category:get(r,'קטגוריה'),subcategory:get(r,'תת קטגוריה'),accountName:get(r,'חשבון'),description:get(r,'תיאור'),tags:get(r,'תגיות').split(',').filter(Boolean),recurring:get(r,'חוזרת')==='כן',recurringParent:get(r,'מזהה תנועה חוזרת')||undefined,fx:+get(r,'שער דולר')||data.fx}))};}else value=JSON.parse(text);if(value?.format==="ofek-encrypted"){openDecryptImport(value);return;}if(value.format==='ofek-transactions'){if(!Array.isArray(value.transactions))throw Error('רשימת התנועות אינה תקינה.');const next=structuredClone(data);let count=0;for(const row of value.transactions){if(next.transactions.some(t=>t.id===row.id))continue;const account=next.accounts.find(a=>a.id===row.accountId||a.name===row.accountName);if(!account)throw Error('לא נמצא חשבון לתנועה '+(row.description||row.category)+'. יש ליצור חשבון בשם '+(row.accountName||row.accountId));const t={...row,id:row.id||uid(),accountId:account.id,fx:row.fx||data.fx};if(!validDate(t.date)||t.date>today()||!(t.amount>0)||!['income','expense'].includes(t.type)||!['ILS','USD'].includes(t.currency)||!(t.fx>0))throw Error('אחת התנועות מכילה נתונים לא תקינים. לא נשמרו שינויים.');if(!next.categories.includes(t.category))next.categories.push(t.category);applyTransaction(next,t);next.transactions.push(t);count++;}validateData(next);confirm('ייבוא תנועות',`נמצאו ${count} תנועות חדשות. התנועות יתווספו והיתרות יתעדכנו. תנועות עם מזהה קיים יידלגו.`,()=>commit(next,`${count} תנועות יובאו בהצלחה`));}else{validateData(value);confirm('שחזור הגיבוי',`הגיבוי כולל ${value.transactions.length} תנועות, ${value.assets.length} נכסים ו־${value.snapshots.length} תמונות מצב. הוא יחליף את הנתונים הנוכחיים. מומלץ להוריד גיבוי קודם.`,()=>{commit(value,'הגיבוי שוחזר בהצלחה',true);ui.monthly=null;ui.monthlyDone=null;});}}catch(err){toast(err.message||'לא הצלחנו לקרוא את הקובץ',true);}}
function clearDemo(){confirm('להסיר את נתוני ההדגמה?','כל הנתונים הנוכחיים, כולל שינויים שנעשו בהדגמה, יימחקו. אפשר להוריד גיבוי לפני ההסרה. האפליקציה תתחיל נקייה כדי להזין את הנתונים שלך.',()=>{commit({...emptyData(),...(data.prefs?{prefs:data.prefs}:{})},'נתוני ההדגמה הוסרו — אפשר להתחיל');ui.month=today().slice(0,7);ui.monthly=null;ui.monthlyDone=null;navigate('dashboard');},true);}
function refreshTransactionResults(){const list=filteredTransactions(),sum=type=>list.filter(t=>t.type===type).reduce((s,t)=>s+toILS(t.amount,t.currency||'ILS',t.fx||data.fx),0);document.querySelector('#transaction-results').innerHTML=transactionsTable(list);document.querySelector('#transaction-metrics').innerHTML=metric('הכנסות בסינון',money(sum('income')),'','ArrowDownLeft','green')+metric('הוצאות בסינון',money(sum('expense')),'','ArrowUpLeft','purple')+metric('יתרה בסינון',money(sum('income')-sum('expense')),`${list.length} תנועות`);}
document.addEventListener('click',event=>{const button=event.target.closest('[data-action]');if(!button)return;const [action,a,b]=button.dataset.action.split(':');try{if(action==='navigate')navigate(a);else if(action==='open')openEntity(a);else if(action==='edit'){const keys={transaction:'transactions',budget:'budgets',goal:'goals',account:'accounts',asset:'assets'};openEntity(a,data[keys[a]].find(v=>v.id===b));}else if(action==='remove')removeEntity(a,b);else if(action==='dialog-close')closeDialog();else if(action==='confirm'){const fn=confirmAction;fn?.();closeDialog();}else if(action==='nav-open'){document.querySelector('.sidebar').classList.add('open');document.querySelector('.sidebar').removeAttribute('inert');document.querySelector('.nav-scrim').hidden=false;button.setAttribute('aria-expanded','true');}else if(action==='nav-close'){document.querySelector('.sidebar').classList.remove('open');if(window.innerWidth<=760)document.querySelector('.sidebar').setAttribute('inert','');document.querySelector('.nav-scrim').hidden=true;}else if(action==='toast-close')document.querySelector('.toast')?.remove();else if(action==='clear-demo')clearDemo();else if(action==='return-help')showDialog('איך מחושבת התשואה?',`<p class="confirm-text">${e(returnHelp)}</p><p class="confirm-text" style="margin-top:18px">XIRR הוא חישוב תשואה שנתית משוקללת תזרימים לפי סכום ותאריך. המעקב מתחיל מתמונת המצב הראשונה, ואינו מנסה לשחזר תשואה מלפני תחילת התיעוד.</p>`);else if(action==='export')exportData(a);else if(action==='import-file')document.querySelector('#import-file').click();else if(action==='toggle-filters'){ui.advanced=!ui.advanced;render();}else if(action==='dash-period'){ui.dashboardPeriod=a;render();}else if(action==='period'){ui.period=a;render();}else if(action==='tx-view'){ui.view=a;ui.filters.day='';if(a==='calendar'){ui.filters.from='';ui.filters.to='';}render();}else if(action==='clear-filters'){for(const k in ui.filters)ui.filters[k]='';render();}else if(action==='calendar-prev'||action==='calendar-next'){ui.calendarMonth=monthOffset(ui.calendarMonth,action==='calendar-prev'?-1:1);ui.filters.day='';render();}else if(action==='calendar-day'){ui.filters.day=ui.filters.day===a?'':a;render();}else if(action==='calendar-clear'){ui.filters.day='';render();}else if(action==='year-transactions'){ui.filters.from=ui.month.slice(0,4)+'-01-01';ui.filters.to=ui.month.slice(0,4)+'-12-31';ui.filters.day='';ui.view='list';render();}else if(action==='entity-type'){captureEntity();dialogState.v.type=a;entityDialog();}else if(action==='edit-benchmarks')openBenchmarks();else if(action==='edit-target')showDialog('יעד הוצאות חודשי',`<form id="target-form">${field('יעד חודשי (₪)',input('target',data.overallBudget,'number','required min="1"'))}<div class="form-actions">${submit()}${btn('ביטול','dialog-close')}</div></form>`);else if(action==='monthly-add-flow'){captureMonthly();ui.monthly.flows.push({id:uid(),type:'deposit',amount:'',currency:'ILS',fx:ui.monthly.fx,assetId:'',accountId:'',quantity:'',date:ui.monthly.date,notes:''});render();}else if(action==='monthly-remove-flow'){captureMonthly();ui.monthly.flows.splice(+a,1);render();}else if(action==='restore-recovery'){const previous=repository.recovery();if(!previous)throw Error('לא נמצאה שמירה קודמת.');validateData(previous);confirm('שחזור השמירה הקודמת','הנתונים הנוכחיים יוחלפו בשמירה הקודמת של הדפדפן.',()=>commit(previous,'השמירה הקודמת שוחזרה',true));}else if(action==='raw-recovery')download('ofek-recovery-raw.json',localStorage.getItem(STORAGE_KEY+'-unreadable')||localStorage.getItem(STORAGE_KEY)||'{}');else if(action==='reset-all')confirm('למחוק את כל הנתונים?','כל החשבונות, התנועות, ההשקעות ותמונות המצב יימחקו. מומלץ להוריד גיבוי מלא קודם.',()=>{commit(emptyData(),'כל הנתונים הוסרו',true);ui.monthly=null;ui.monthlyDone=null;},true);else if(action==='load-demo')confirm('טעינת נתוני הדגמה','נתוני ההדגמה יחליפו את הנתונים הנוכחיים. מומלץ להוריד גיבוי קודם.',()=>{commit(demoData(),'נתוני ההדגמה נטענו',true);ui.month='2026-09';ui.monthly=null;render();});}catch(err){toast(err.message,true);}});
document.addEventListener('input',event=>{const el=event.target;el.setCustomValidity?.('');if(el.closest('#entity-form')&&dialogState?.kind==='goal')updateGoalPreview();if(el.dataset.filter){ui.filters[el.dataset.filter]=el.value;refreshTransactionResults();}if(el.closest('#monthly-form')){captureMonthly();const preview=document.querySelector('#monthly-estimate');if(preview)preview.innerHTML=monthlyEstimate();}});
document.addEventListener('change',event=>{const el=event.target;try{if(el.dataset.goalAccount!=null&&dialogState?.kind==='goal'){captureEntity();const saved=document.querySelector('#entity-form [name=saved]');const linked=data.accounts.some(a=>a.id===el.value);if(linked){dialogState.v.saved=effectiveGoalSavings(data,dialogState.v);saved.value=dialogState.v.saved;}saved.readOnly=linked;updateGoalPreview();}if(el.id==='import-file'){importFile(el.files[0]);el.value='';return;}if(el.dataset.benchmarkSnapshot!=null){const s=data.snapshots.find(s=>s.id===el.value);if(s){document.querySelector('dialog [name=sp500]').value=s.benchmarks?.sp500??'';document.querySelector('dialog [name=ta125]').value=s.benchmarks?.ta125??'';}}if(el.dataset.change){const [action,key]=el.dataset.change.split(':');if(action==='month'){ui.month=el.value;ui.calendarMonth=el.value;ui.filters.from=el.value+'-01';ui.filters.to=el.value+'-31';ui.filters.day='';}else if(action==='chart-metric')ui.chartMetric=el.value;else if(action==='benchmark')ui[key]=el.checked;else if(action==='performance-from')ui.from=el.value;else if(action==='performance-to')ui.to=el.value;render();}if(el.dataset.entityDynamic){captureEntity();if(el.name==='assetId'){const a=data.assets.find(a=>a.id===el.value);if(a)dialogState.v.currency=a.currency;}entityDialog();}if(el.closest('#monthly-form')&&/^flow_\d+_(type|currency|assetId)$/.test(el.name)){captureMonthly();const [,index,key]=el.name.match(/^flow_(\d+)_(.+)$/);if(key==='assetId'){const a=data.assets.find(a=>a.id===el.value);if(a)ui.monthly.flows[+index].currency=a.currency;}render();}}catch(err){toast(err.message,true);}});
document.addEventListener('submit',event=>{event.preventDefault();try{if(event.target.id==='entity-form')saveEntity();else if(event.target.id==='monthly-form')saveMonthly();else if(event.target.id==='settings-form'){const f=new FormData(event.target);commit({...data,profile:f.get('profile'),fx:+f.get('fx'),fxDate:today()},'ההגדרות נשמרו');}else if(event.target.id==='benchmarks-form'){const f=new FormData(event.target),next=structuredClone(data),s=next.snapshots.find(s=>s.id===f.get('snapshot'));if(!s)throw Error('יש לבחור תמונת מצב.');s.benchmarks={sp500:f.get('sp500')===''?null:+f.get('sp500'),ta125:f.get('ta125')===''?null:+f.get('ta125')};s.benchmarkUpdated=today();commit(next,'מדדי ההשוואה עודכנו');closeDialog();}else if(event.target.id==='target-form'){const f=new FormData(event.target);commit({...data,overallBudget:+f.get('target')},'היעד החודשי נשמר');closeDialog();}}catch(err){const box=document.querySelector('#entity-error');if(box)box.innerHTML=notice(err.message,'error');else toast(err.message,true);}});
document.addEventListener('invalid',event=>event.target.setCustomValidity(event.target.validity.valueMissing?'יש למלא שדה זה.':'יש להזין ערך תקין בטווח המותר.'),true);
function chartTip(event){const point=event.target.closest?.('.graph-point'),chart=point?.closest('.chart');if(!chart)return;const tooltip=chart.querySelector('.chart-hover');tooltip.textContent=point.dataset.tip;tooltip.classList.add('visible');}
document.addEventListener('pointerover',chartTip);document.addEventListener('focusin',chartTip);document.addEventListener('pointerout',event=>{if(event.target.closest?.('.graph-point'))event.target.closest('.chart')?.querySelector('.chart-hover')?.classList.remove('visible');});document.addEventListener('focusout',event=>{if(event.target.closest?.('.graph-point'))event.target.closest('.chart')?.querySelector('.chart-hover')?.classList.remove('visible');});
window.addEventListener('hashchange',()=>{const page=location.hash.slice(1);if(pageMeta[page]&&ui.page!==page)navigate(page);});window.addEventListener('storage',event=>{if(event.key===STORAGE_KEY&&event.newValue){try{data=validateData(JSON.parse(event.newValue));render();toast('הנתונים עודכנו מלשונית אחרת');}catch{toast('לא ניתן לקרוא נתונים מלשונית אחרת',true);}}});
render();
if(document.modelContext?.registerTool){const life=new AbortController();for(const tool of [{name:'read_financial_summary',title:'קריאת סקירה פיננסית',description:'Read current financial totals in ILS without changing local data.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:input=>{if(input&&Object.keys(input).length)throw Error('אין פרמטרים לפעולה זו.');return balances(data);}},{name:'start_monthly_investment_update',title:'פתיחת עדכון השקעות חודשי',description:'Open the monthly update form. Does not save a snapshot.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:false},execute:input=>{if(input&&Object.keys(input).length)throw Error('אין פרמטרים לפעולה זו.');navigate('monthly');return {opened:true,saved:false};}}])try{Promise.resolve(document.modelContext.registerTool(tool,{signal:life.signal})).catch(()=>{});}catch{}window.addEventListener('pagehide',()=>life.abort());}

window.addEventListener('resize',()=>{const sidebar=document.querySelector('.sidebar');if(!sidebar)return;if(window.innerWidth<=760&&!sidebar.classList.contains('open'))sidebar.setAttribute('inert','');else sidebar.removeAttribute('inert');});

})();</script></body></html>
